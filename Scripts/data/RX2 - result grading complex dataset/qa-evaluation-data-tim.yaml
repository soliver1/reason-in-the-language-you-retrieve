- question: Ein Mitglied der Al'Anfanischen Grandenfamilie Paligan wird auch Die 'Schwarze
    Witwe' genannt und berät ihren Enkel, welcher Anspruch auf den mittelreichischen
    Kaiserthron erhebt. Welchem der zwölf Götter scheint dieser besonders nahe zu
    stehen und wie äußert sich das?
  correct_answer: Selindian Hal, ein Enkel von Alara Paligan steht dem Totengott *Boron*
    besonders nahe. Dies äußert sich unter anderem dadurch, dass er 1028 bei einem
    Attentat starb, danach jedoch auf wundersame Weise wiederauferstand. Er zeigt
    weiterhin auch keinerlei Furcht im Umgang mit dem Tod und kann Kontakt mit Geistern
    aufnehmen.
  Answer A: "Die „Schwarze Witwe“ Alara Paligan folgt dem **al’Anfanischen Ritual
    des Boron-Glaubens**, welches sich deutlich vom klassischen Puniner Boron-Kult
    unterschieden. Während der Puniner Brauch eher bescheiden und spirituell orientiert
    ist, praktiziert Alara eine Form des Boron-Glaubens, die **extravagant, erotisch
    und mit Riten der Dunkelheit** verbunden ist. \n\nSie verehrt Boron als Gott der
    **Verführung, Erotik und Tod**, was sich in ihrer Lebensweise widerspiegelt –
    sie nutzt Luxus, erotische Spiele und mysteriöse Rituale, um Macht zu sichern.
    Dies spiegelt sich auch in ihrer Beratung ihres Enkels wider, der politische Ambitionen
    hegt. \n\nDie Verbindung zu Boron äußert sich in der Nutzung **symbolischer Objekte
    wie Schmuck, Masken und spezieller Kerzen**, sowie in **Praktiken wie Opfern,
    sexuellen Ritualen oder der Manipulation von Männern**. Dadurch wird Boron als
    Kraft des **Lebens, der Macht und der Dunkelheit** interpretiert, was sowohl Alaras
    Einfluss als auch den Anspruch ihres Enkels auf den Kaiserthron legitimiert. \n
    \nDies passt zu den Beschreibungen in den Quellen, wonach Alara den al’Anfanischen
    Boron-Kult in Punin fördert und diesen mit ihrer persönlichen Macht verknüpft."
  Rating A: 2
  Comment A: ''
  Answer B: "Die „Schwarze Witwe“ Alara Paligan steht dem Gott **Boron** besonder
    nahe. Dies zeigt sich u.a. durch ihre Rolle als Förderin des al’anfanschen Boron-Kults
    und ihrer Einführung eines eigenen, verführerischen Boron-Ritus. Ihr Einfluss
    auf den almadanischen Kaiserhof sowie ihre intrigiösen Machenschaften spiegeln
    boronspezifische Attribute wider — sowohl als Schutzgottheit als auch als symbolische
