    und *Phex* (letzterer ist schlecht erhalten).
  Answer A: "In der Stadt Charypso, welche als Erzfeind der Stadt Sylla gilt, sind
    folgende Tempel erwähnt:\n\n- **Efferd**\n- **Phex**\n\nZudem wird im Zusammenhang
    mit Charypso auch die **Erzdämonin Charyptoroth** erwähnt, obwohl es sich dabei
    nicht um einen traditionellen Tempel handelt, sondern um eine „Unheiligtum“ nahe
    der Stadt."
  Rating A: 5
  Comment A: ''
