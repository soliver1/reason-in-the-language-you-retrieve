- question: Welches Südaventurische Reich wird von einer Borongeweihten regiert? Welchen
    Titel trägt die dort herrschende Person?
  correct_answer: Das Káhet ni Kemi wird von der dem Gott Boron geweihten Königin
    Ela XV. regiert. Als Herrscherin trägt sie den Titel *Nisut (Königin)*.
  Answer A: "Das Südaventurische Reich, das von einer Borongeweihten regiert wird,
    ist **Al’Anfa**, eine der mächtigsten Städte des Südens. Die herrschende Person
    trägt den Titel **„Patriarch“**.  \n\nDer *Patriarch* von Al’Anfa ist nicht nur
    religiouses Oberhaupt der alanfanischen Boron-Kirche, sondern auch faktisch der
    souveräne Herrscher der Stadt. Er wird in den Texten als „Hersteller der göttlichen
    Ordnung“ und als Autorität beschrieben, die mit dem Rat der Zwölf (bestehend aus
    sechs Geweihten und sechs Bürgern) die Macht in Al’Anfa teilt. Der aktuelle Patriarch,
    **Amir Honak**, repräsentiert die theologische und politische Führung, während
    die Geweihten der Boron-Kirche in der Gesellschaft eine zentrale Rolle spielen.\
    \  \n\nDieses System ist in mehreren Abschnitten explizit beschrieben, z. B. im
    Kapitel **„# Al’Anfa – Stadt und Imperium“** und **„### Boron“**, wo die Theokratie
    Al’Anfas und die Macht der Borongeweihten verdeutlicht werden."
