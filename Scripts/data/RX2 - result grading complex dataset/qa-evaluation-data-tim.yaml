- question: Wo steht der Haupttempel des Todesgottes im Zwölfgöttlichen Pantheon,
    nach der im Norden verbreiteten Auslegung des Kultes und wie heißt der Tempel?
  correct_answer: Der Haupttempel des Boronkultes nach Puniner Ritus steht in *Punin*
    und heißt *Das Gebrochene Rad*.
  Answer A: Der Haupttempel des Totengotts im Zwölfgöttlichen Pantheon, entsprechend
    der im Norden verbreiteten Auslegung des Kultes, ist der **Tempel des Schwarzen
    Lichts**, der im Raum der Stadt Eschenrod in Gareth lokalisiert ist. Er ist der
    zentralste und bedeutendste Tempel des Boron-Kultes in der Region und wird auch
    als „Haupttempel des Totengotts“ bezeichnet, da Boron als Gott des Todes eine
    zentrale Rolle in der Theologie des Nordens spielt. Der Name des Tempels stammt
    von der mystischen und symbolischen Bedeutung des „Schwarzen Lichts“, das in der
    Tradition der nordischen Boron-Anhänger als Metapher für die dunkle, aber notwendige
    Dimension des Todes interpretiert wird.
  Rating A: 1
  Comment A: ''
  Answer B: "Der Haupttempel des Todesgottes (Boron) im nordöstlichen Zwölfgöttlichen
    Pantheon wird in der Regel mit dem **„Gebrochene Rad“** in **Punin** identifiziert.
    Dieser Tempel ist Teil des **Puniner Ritus**, einer der zentralen Ausprägungen
    des Boron-Kultes im nördlichen Raum.  \n\nLaut Texten ist das „Gebrochene Rad“
    nicht nur der größte Boron-Tempel Aventuriens, sondern auch ein zentraler Wallfahrtsort.
    Er liegt im Herzen von Punin und wird als **„Allerheiligste Hallen des Schweigens“**
    beschrieben. Der Tempel ist bekannt für seine unterirdischen Katakomben, in denen
    die Gebeine Tausender bestattet sind, sowie für seine symbolträchtigen Reliefs,
    die den Tod und die Verbindung zum Todesgott verdeutlichen.  \n\nEin alternativer
    Hinweis auf einen *nordöstlichen* Tempel findet sich in der Beschreibung des **„Tempels
    des Todes“** in **Thalabad** (im Süden), doch dies passt nicht zur geografischen
    Einschränkung auf den Norden. Daher ist das „Gebrochene Rad“ in Punin die maßgebliche
    Antwort.  \n\n**Zusammenfassung**:  \n- **Name des Tempels**: Das **Gebrochene
    Rad** (Haupttempel des Puniner Ritus).  \n- **Standort**: **Punin** (nördlicher
    Raum).  \n- **Besonderheit**: Zentrale religiöse Stätte für den Boron-Kult im
    nördlichen Aventurien."
  Rating B: 5
  Comment B: ''
  Answer C: Der Haupttempel des Todesgottes Boron im Zwölfgöttlichen Pantheon, entsprechend
    der im Norden verbreiteten Auslegung des Kultes, ist der **"Gebrochene Rad"**,
    der als Haupttempel des Boronkults nach Puniner Ritus bekannt ist. Er befindet
    sich in Punin und ist das älteste erhalten gebliebene Bauwerk dieser uralten Stadt.
    Dieser Tempel ist besonders bedeutend, da er als Orakelstätte für Gläubige aus
    ganz Aventurien aufgesucht wird.
  Rating C: 5
  Comment C: ''
  Answer D: "Der Haupttempel des Todesgottes Boron im Norden ist der **Boron-Tempel
    in Mengbilla**, der als zentraler Ort der Verehrung des Todesgottes im Zwölfgöttlichen
    Pantheon gilt. Er liegt im Herzen der Stadt und ist bekannt als das wichtigste
    religiöse Zentrum der regionalen Boron-Kirche.  \n\nAlternativ wird auch das **Boronsfeld**
    (eine riesige Nekropole) als zentraler Ort genannt, der als Grabstätte und spirituelles
