    ambivalente Einstellung gegenüber dunkelhäutigen Personen, insbesondere gegenüber
    den regionalen Ethnien wie den *Miniwatu* und *Utulus*. Al’Anfa, als koloniales
    Zentrum, zeichnet sich durch eine heterogene Bevölkerung aus, die aus verschiedenen
    Kulturen und Rassen besteht.  \n\n**Hintergründe**:  \n- **Historische Dominanz**:
    Die Stadt kontrolliert durch Sklavenhandel und militärische Präsenz regionale
    Bevölkerungsgruppen, darunter dunkelhäutige Waldmenschen und Utulus. Dies schafft
    eine Struktur, in der dunkelhäutige Populationen oft als untergeordnet wahrgenommen
    werden.  \n- **Soziale Hierarchie**: Die einfachen Bürger („Fanas“) stehen in
    der Regel unter den Granden und sind von wirtschaftlichen und sozialen Spannungen
    geprägt. Sie interagieren mit dunkelhäutigen Arbeitskräften (z. B. Sklaven oder
    Arbeiter) in einem System der Abhängigkeit und Ausbeutung.  \n- **Kultureller
    Kontrast**: Die Bewohner Al’Anfas, inspiriert von der aristokratischen und materialistischen
    Kultur der Granden, tendieren zu einer distanzierten oder exploitative Haltung
    gegenüber „ungleichrangigen“ Gruppen, insbesondere wenn diese als minderwertig
    oder fremd empfunden werden.  \n\n**Stimmung**:  \n- **Vorsicht und Skepsis**:
