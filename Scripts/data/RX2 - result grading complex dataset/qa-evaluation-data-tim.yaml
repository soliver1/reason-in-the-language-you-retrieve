  correct_answer: Der *Pentagontempel der Hesinde* in Gareth besitzt einen *fünfseitigen
    Grundriss* statt dem eines Hexagons.
  Answer A: 'Der Tempel der Sterne (Id: G08-276) in Gareth unterscheidet sich von
