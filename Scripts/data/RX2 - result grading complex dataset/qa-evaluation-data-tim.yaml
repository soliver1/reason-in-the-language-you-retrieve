    ist das **Kemi-Reich**. Die herrschende Person trägt den Titel **„Nisut“**, was
    der kemschen Entsprechung für „Königin“ entspricht. Dies ergibt sich aus der Beschreibung
    der Sozialstruktur des Kemi-Reichs, wo explizit von einer „borongeweihte Königin
