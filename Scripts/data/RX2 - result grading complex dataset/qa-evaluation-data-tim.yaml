    gehört, ist **Chorhop**. Die **Hammerfausts**, eine thorwalsche Familie, spielen
    dort eine bedeutende Rolle. Obwohl sie traditionell nordische Sitten pflegen,
    haben sie sich inzwischen als loyale Brabaker integriert und sind besonders aktiv
    in politischen Debatten rund um den Handel und militärische Aktivitäten.
