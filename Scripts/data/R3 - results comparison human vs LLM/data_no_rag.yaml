  system_answer: "\n\nBornländische Kaufleute in Al’Anfa fallen durch ihr robustes,
    zweckmäßiges Erscheinungsbild auf: Sie tragen oft wärmere, rustikale Kleidung
    aus Wolle oder Fell, was im mediterranen Klima Al’Anfas ungewöhnlich wirkt. Ihr
    Verhalten gilt als direkt und ehrlich, aber auch als etwas ungehobelt oder starr
    – im Gegensatz zur geschliffenen, diplomatischen Handelskultur der Al’Anfaner.
    Sie werden geschätzt für Zuverlässigkeit (z. B. bei Rohstofflieferungen wie Pelzen),
    aber als weniger versiert in komplexen Verhandlungen angesehen. Kulturelle Unterschiede
    führen manchmal zu Vorurteilen, etwa der Glaube, sie seien „zu einfach gestrickt“
    für die subtilen Spielarten des Al’Anfanischen Handels."
