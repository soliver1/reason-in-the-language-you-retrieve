- question: Welche Anordnung wurde um 650 BF für meridianische Kauffahrer erlassen,
    um sie vor Thorwal-Piraten zu schützen, und welche finanzielle Belastung ging
    damit einher?
  correct_answer: Um 650 BF wurde ein vizeköniglicher Erlass erlassen, der alle meridianischen
    Kauffahrer dazu verpflichtete, unter dem Schutz Meridianas in Konvois zu fahren.
    Im Gegenzug dafür mussten sie hohe Zölle an den Vizekönig entrichten.
