    context: Die Stadt wuchs schnell, und es entstand aus Tulamidinnen und Waldmenschen
      ein neues Volk, das von Fischfang, Feldbau und Handel mit dem Diamantenen Sultanat
      lebte. Die Stadt wurde immer wieder einmal von den großen Mächten besetzt.
  - question: Welche Herrscher hinterließen deutliche Spuren in Sylla?
