  G1-338:
  - question: Welche Besonderheit kennzeichnet die Wirtschaft Mirhams und welche Auswirkungen
      hat dies?
    answer: Die Wirtschaft der Stadt ist fast nur auf die Versorgung des königlichen
      Haushaltes ausgerichtet, was zu einem Ungleichgewicht zwischen den Bedürfnissen
      der Palastbediensteten und der Bevölkerung führt.
    context: 'Die Wirtschaft der Stadt ist sehr einseitig und fast nur auf die Versorgung
      des königlichen Haushaltes ausgerichtet: Auf die gut zweihundert Angehörigen
      der Adelsfamilien kommen fast sechshundert Leibdiener, Köche, Kurtisanen, Reitknechte
      und andere Palastbedienstete sowie Sklaven für die harten Arbeiten – auch wenn
      der Dienst im Palast ein Zuckerschlecken ist gegen die Fronarbeit, die auf den
      Feldern außerhalb verrichtet wird.'
  - question: Inwiefern ist der Handel Mirhams durch den Vertrag mit Al’Anfa eingeschränkt?
    answer: Der Handel Mirhams ist stark eingeschränkt durch einen 'Exklusivvertrag'
      mit Al’Anfa, der diesem das Vorkaufsrecht für viele Produkte Mirhams gewährt.
      Dies bedeutet, dass Mirham nur von Al’Anfas Kaufleuten Waren beziehen darf und
      die Preise von Al’Anfa vorgegeben werden.
    context: Der Handel Mirhams ist stark eingeschränkt, da ein ‘Exklusivvertrag’
      mit Al’Anfa besteht, der für praktisch alle Produkte Mirhams, wie Gewürze, Rauschkräuter,
      Opale, Gold, Edelhölzer und Sklaven, das Vorkaufsrecht vorsieht (und das selbstverständlich
      zu festgelegten Preisen, die die Schwarze Perle bevorteilen). Eine gut ausgebaute
      Handelsstraße erlaubt den problemlosen Warentransport von Mirham nach Al’Anfa.
      Vor allem aber wird, so heißt es, “zur Sicherung der Versorgung” bestimmt, dass
      Mirham nur von Al’Anfas Kaufleuten Waren beziehen darf. Selbst Lebensmittel
      (Delikatessen für die Höflinge, Reis und Gedörrtes für die Diener) müssen von
      der ungnädigen Herrin im Süden erworben werden und werden gegen die Güter Mirhams
      verrechnet.
  - question: Welche Art von Handel findet neben dem offiziellen Handel statt und
      welche Gefahren bringt diese Tätigkeit mit sich?
    answer: Schmuggler versuchen, das Verbot zu unterlaufen und Nordlandwaren nach
      Mirham zu bringen. Das birgt zwar große Gewinne, aber auch ein hohes Risiko.
    context: 'Daher versuchen häufig Schmuggler, das Verbot zu unterlaufen und Nordlandwaren
      nach Mirham zu bringen, ein Handel, der großen Gewinn verspricht, aber auch
      mit enormem Risiko verbunden ist: Mirham ist über den Chamir mit einem Meeresarm
      des Perlenmeers verbunden, der von den Festungen Pinnacht und Imrah überragt
      wird. Diese beiden alanfanischen Garnisonen sind stark befestigt und wachen
      darüber, wer in die Bucht ein- und ausfährt.'
  - question: Welche Rolle spielen die Festungen Pinnacht und Imrah im Handel von
      Mirham?
    answer: Die beiden alanfanischen Garnisonen Pinnacht und Imrah überwachen den
      Zugang zur Bucht, die Mirham mit dem Meer verbindet. Sie kontrollieren jedes
      Schiff und stellen sicher, dass die Waren verzollt werden.
    context: Mirham ist über den Chamir mit einem Meeresarm des Perlenmeers verbunden,
      der von den Festungen Pinnacht und Imrah überragt wird. Diese beiden alanfanischen
      Garnisonen sind stark befestigt und wachen darüber, wer in die Bucht ein- und
