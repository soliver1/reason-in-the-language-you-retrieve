      der offen von einem Umsturz mittels seiner magischen Macht träumte.
  G1-340:
  - question: Warum gilt Mirham als gefährlicher Ort für Fremde?
    answer: Die Stadt Mirham ist für Fremde, da sie nur mit Einladung betreten werden
      kann, ein gefährlicher Ort.
    context: Die Palaststadt Mirham ist in gewisser Hinsicht ein ebenso gefährliches
      Pflaster wie Al’Anfa, denn hier können fremde Abenteurer kaum ungehindert durch
      die Straßen streifen. Wer hierher kommt, ist als Gast geladen, und nur Leute
      zweifelhaften Rufs steigen in der Herberge am Stadtrand ab.
  - question: Welche Möglichkeiten gibt es laut dem Text, Mirham sicher zu betreten?
    answer: 'Der Text nennt drei Möglichkeiten:  Eine Einladung von der Magierakademie
      oder einem Würdenträger des alanfanischen Reiches, als talentierter Unterhalter
      oder Hochstapler, oder durch Schmuggel vorbei an den Bastionen.'
    context: Nutzen Sie Mirham daher als exotischen Ort, den man nur betritt, wenn
      gute Gründe vorliegen – wie etwa eine Einladung der Magierakademie oder der
      ‘Besuch’ bei einem Würdenträger des alanfanischen Reiches. Ein talentierter
      Unterhalter oder ein wirklich begabter Hochstapler kann in diesem Umfeld rasch
      aufsteigen – und ebenso rasch wieder untergehen. Doch auch der Schmuggel vorbei
      an den Bastionen kann sehr reizvoll sein und den Helden Schätze, Abenteuer und
      vor allem Kontakte mitten im Reich der Schwarzen Perle verschaffen.
  - question: Was wird über die Lage von Mirham im Vergleich zur alten tulamidischen
      Stadt ausgesagt?
    answer: Es ist möglich, dass die heutige Stadt an einer anderen Stelle gebaut
      wurde als die alte tulamidische Stadt.  Vielleicht liegt diese fünf Meilen entfernt
      im Dschungel.
    context: ' Schließlich bleibt noch die Suche nach den Ruinen des alt-tulamidischen
      Mirham. Denn es ist keineswegs sicher, dass die Palaststadt an der gleichen
      Stelle gegründet wurde. Vielleicht liegt fünf Meilen entfernt im Dschungel eine
      uralte Ruinenstadt voller Schätze und Gefahren.'
  G1-341:
  - question: Wie hoch ist die Bevölkerungszahl von Chorhop inklusive der Bewohner
      außerhalb der Stadtmauern und wie setzt sich diese zusammen?
    answer: Chorhop hat etwa 1500 Einwohner, davon sind 20% Novadis. Dazu kommen noch
      ca. 200 ständige Besucher und außerhalb der Stadtmauern leben weitere 800 Freie
      und 500 Feldsklaven.
    context: 'Chorhop für den eiligen Leser Einwohner: 1.500 (20 % Novadis), dazu
      etwa 200 ständige Besucher (Glücksspieler, Händler etc.), außerhalb der Stadtmauern
      etwa 800 Freie und 500 Feldsklaven'
  - question: Welche drei Spielhallen sind in Chorhop besonders erwähnenswert?
    answer: 'Die wichtigsten Spielhallen in Chorhop sind das Haus der Spiele, das
      Casa Bellarte und die Sechs Kelche. '
    context: 'Wichtige Spielhallen: Haus der Spiele (Besitzer Adnan Zeforika, Sitz
      des Würfelmeisters, im Keller: die Chorhoper Schatzkammer, nahe des Phex-Tempels),
      Casa Bellarte (Treffpunkt für Verschwörer, Gäste tragen Fuchsmasken, nahe des
      Phex-Tempels), Sechs Kelche (Besitzer Ropjew, ehemaliger Gardist aus Notmark,
      Spielspelunke für Arme, nahe des Palastes der Zeforikas)'
  - question: Welche drei Dinge machen Chorhop kulturell besonders?
    answer: Chorhop ist bekannt für seine Bildhauerei, die Chorhoper Tinte und die
      Zuckerbäckerei.
    context: 'Kulturelle Eigenheiten: starkes Gefälle zwischen Reich und Arm, kein
      Gilden- und Zunftwesen, Sklavenhaltung, berühmt für Bildhauerei, Chorhoper Tinte
      und Zuckerbäckerei, Handel mit dem Waldmenschenstamm der Yakosh-Dey, viele vergnügungssüchtige
      Gäste aus Mittelaventurien'
  G1-342:
  - question: Wo liegt die Stadt Chorhop?
    answer: An der Mündung des Südask am Askanischen Meer.
    context: 'Beiderseits der Mündung des Südask am Askanischen Meer liegt Chorhop
      (sprich: Koorhop oder Korrhopp).'
  - question: Wer hat die wahre Macht in Chorhop?
    answer: Adnan Zeforika, Werftbesitzer und Vorsteher des Phex-Tempels.
    context: 'Über die Chorhoper (Südaventurier und Tulamiden sowie ihre vergnügungssüchtigen
      Gäste und hart arbeitenden Sklaven gleichermaßen) herrscht das Oberhaupt einer
      der zehn reichsten Familien Aventuriens: Werftbesitzer und Vorsteher des Phex-Tempels
      Adnan Zeforika; der Kalif von Unau ist nur nominelles Oberhaupt; das Amt des
      örtlichen Vogtvikars, des Phex-Hochgeweihten, ist der Schlüssel zur wahren Macht
      in Chorhop.'
  - question: Welche Sippe ist die zweitmächtigste in Chorhop?
    answer: Die Arupanaq, die einen beträchtlichen Anteil Waldmenschenblut in den
      Adern haben.
    context: 'Zweitmächtigste Sippe der Stadt sind (mit großem Abstand zu den Zeforikas)
      die Arupanaq, die einen beträchtlichen Anteil Waldmenschenblut in den Adern
      haben. '
  - question: Was tun die YakoshDey mit den Kriegsgefangenen anderer Stämme?
    answer: Sie verkaufen Sklaven (Kriegsgefangene anderer Stämme) an Chorhops Krämer.
    context: Ihre Expeditionen führen sie bis ins Regengebirge, wo sie gute Kontakte
      zu den Prunk liebenden Kriegshäuptlingen der YakoshDey haben, die ihnen Sklaven
      (Kriegsgefangene anderer Stämme) verkaufen. Dank dieser Verbindungen können
      Chorhops Krämer die einzige Passstraße über das Regengebirge nutzen, die durch
      das Gebiet der YakoshDey und Anoiha führt und auf der SüdElemitischen Halbinsel
      auf die Straße von Port Corrad nach Mirham trifft.
  - question: Welche Arten von Häusern gibt es in Chorhop?
    answer: Die Reichen bevorzugen weiß gekalkte Villen, während der Wohnsitz der
      herrschenden Familie Zeforika ein tulamidisch anmutender Rundbau aus weißem
      und rosafarbenem Eternenmarmor ist.
    context: Die Reichen der Stadt bevorzugen weiß gekalkte Villen mit Veranda, Laubengängen
      und Gartenhof, während der Wohnsitz der herrschenden Familie Zeforika inmitten
      der Stadt ein tulamidisch anmutender Rundbau aus weißem und rosafarbenem Eternenmarmor
      ist.
  - question: Welche Gebäude befinden sich im Westen der Stadt, in Hafennähe?
    answer: Die Spielhäuser, das Pfandhaus und der Palast der Kurtisane Yezemin al
      Kirachin.
    context: 'Natürlich finden sich hier auch das Pfandhaus und der Palast der Kurtisane
      Yezemin al Kirachin. '
  - question: Wie gelangt man in die Stadt Chorhop?
    answer: Der Weg nach Chorhop führt von Norden durch das Mengbillaner Tor, von
      Osten durch das Novaditor, von Süden durch das Jaguartor und von Westen über
      den Hafen.
    context: Der Weg nach Chorhop führt von Norden durch das Mengbillaner Tor, von
      Osten durch das Novaditor, von Süden durch das Jaguartor und von Westen über
      den Hafen.
  G1-343:
  - question: Wer waren die Gründer von Chorhop?
    answer: Die Stadt wurde zuerst von Tulamidischen Deserteuren und Rebellen gegen
      das Diamantene Sultanat gegründet.
    context: 'etwa 1000 v.BF: Tulamidische Deserteure und Rebellen gegen das Diamantene
