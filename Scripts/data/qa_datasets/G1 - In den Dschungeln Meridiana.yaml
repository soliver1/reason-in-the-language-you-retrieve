  - question: Wie sind die Roben der Boron-Geweihten in Al'Anfa verziert?
    answer: Goldborten, goldene Stickereien und protzige Ringe.
    context: Ein besonderes Augenmerk verdienen aber die Roben der Boron-Geweihten.
      Ihr kennt die schwarzen Kutten, die die Priester unseres Herren Boron daheim
      kleiden, unscheinbar und verschwiegen wie der Tod, der leise über uns kommt.
      Nicht so hier. Goldborten schmücken die seidenen Roben der höheren Geweihten,
      goldene Stickereien, die manchen Fürsten vor Neid erblassen ließen. Protzige
      Ringe zieren die hageren Finger, und ein großes Gefolge, Wachen, Sklaven, Lustknaben,
      begleitet einen Priester, wenn er hinabsteigt in die Stadt.
