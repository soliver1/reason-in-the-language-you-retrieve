    context: Die Hand Borons besitzt sicher nicht mehr als zwei Dutzend aktive Attentäter
      und umfasst, mit Schülern, Ausbildern und Anführern, nicht viel mehr als fünfzig
      Personen. Über die Person oder auch nur Existenz eines Oberhauptes ist nichts
      bekannt. Die seit 500 Jahren in Gerüchten erwähnte ‘Schwarze Witwe’ ist vermutlich
      nur die Beste unter den Meuchlern. Ihre Macht beruht darauf, dass die Hand Borons
      die Infrastruktur und Ressourcen der gesamten Stadt des Schweigens nutzen kann
      – ob mit Unterstützung, Billigung oder auch nur Wissen des Patriarchen und der
      Granden kann niemand sagen. Jedenfalls sind sie die hauptsächlichen Nutzer des
      Labyrinthes, und wenn man bedenkt, was es erfordert, heimlich zwei Dutzend Elitekrieger
      auszubilden, auszurüsten, zu ernähren, zu versorgen und mit Informationen auszustatten,
      kann man ermessen, dass das Kontaktnetz der Hand Borons sich über die halbe
      Stadt und eine beträchtliche Anzahl Komplizen erstrecken muss.
