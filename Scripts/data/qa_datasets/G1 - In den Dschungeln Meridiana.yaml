  G1-236:
  - question: Welche Eigenschaften werden den Bornländern im Text zugeschrieben?
    answer: Die Bornländer werden als fleißig, arbeitsam, aufrecht und ehrlich beschrieben.
    context: “Fleißig und arbeitsam, wie die Bienen, aus deren Honig sie ihren Meskinnes
