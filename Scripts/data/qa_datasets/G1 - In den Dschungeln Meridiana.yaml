  G1-138:
  - question: Beschreibe die typischen Merkmale der Häuser im alanfanischen Baustil.
    answer: Die Häuser sind weiß getüncht und haben bunte Fensterläden. Außerdem besitzen
      sie einen großzügigen Innenhof mit Garten und sprudelndem Wasserbassin.
    context: 'Die typisch alanfanische Bauweise zeigt weiß getünchte Häuser mit bunten
      Fensterläden, großzügigem Innenhof mit Garten und sprudelndem Wasserbassin sowie
      die armseligen Hütten aus Palmwedeln, Brabaker Rohr und Palmbastmatten. '
  - question: Welche baulichen Veränderungen wurden in den letzten Jahren in der Altstadt
      und den Brabaker Baracken vorgenommen und warum?
    answer: Aufgrund der großen Einwandererströme, insbesondere in den letzten Jahren,
      werden in der Altstadt und den Brabaker Baracken bis zu vierstöckige Mietshäuser
      errichtet. Die Menschen hausen hier dicht gedrängt in winzigen Kammern.
    context: Durch die immer neuen Einwandererströme, die gerade in den letzten Jahren
      aus Tobrien, Aranien und Maraskan nach Al’Anfa geflossen sind, ist man zudem
      in jüngster Zeit dazu übergegangen, in der Altstadt und den Brabaker Baracken
      bis zu vierstöckige Mietshäuser zu errichten. Hier haust man für wenige Dirham
      dicht gedrängt in winzigen Kammern, immer in der Hoffung, dass gerade dieses
      Haus stabiler gebaut ist als jenes, das vor zwei Tagen unversehens in sich zusammengestürzt
      ist.
  - question: Welche Maßnahmen ergreifen die Alanfaner, um sich gegen das allgegenwärtige
      Ungeziefer zu wehren?
    answer: Die Alanfaner nutzen Moskitonetze aus Seide, Duftlampen mit Zedernöl,
      Perainapfelblüten und Sansaro-Sud sowie Fliegenleim aus Orazal-Lianen. Außerdem
      stellen sie Wasserbehälter auf, um Skorpione abzuhalten, und vertrauen auf Geckos
      zur Insektenbekämpfung.
    context: Die an der Zimmerdecke lauernden Mücken, Moskitos und Stechfliegen, aber
      auch Stechlibellen und sogar Vampirfledermäuse, dazu Fliegen, die ihre Eier
      in Nasen nichts ahnender Vier- und Zweibeiner legen, und Dutzende ähnlicher
      Plagegeister leben hier wie die Maden im Speck. Entsprechend zahlreich sind
      die Gegenmittel. Moskitonetze aus feiner Seide umgeben auf dem Silberberg jedes
      Bett, in der Stadt des Schweigens zumindest die Schlafsäle. Die Sansaro-Sieder
      ernten den Tang des Selemgrundes und erzeugen daraus eine desinfizierende Salbe.
      Duftlampen mit Zedernöl, Perainapfelblüten und Sansaro-Sud vertreiben die meisten
      Insekten. Der bekannte alanfanische Fliegenleim ist nichts anderes als Orazal-Lianen,
      die solange in warmes Wasser gelegt werden, bis ihr klebriger Saft austritt.
      Danach werden sie an die Decke gehängt. Die Bettpfosten stehen in Tonschälchen
      mit Wasser oder sogar Dattelwein, die verhindern, dass Skorpione daran hochklettern.
      Hilfreich sind auch die Geckos, die an der Zimmerdecke entlang laufen können
      und sich von Insekten ernähren.
  G1-139:
  - question: Wie wird die Sprache der Elite in der Stadt des Schweigens von Außenstehenden
