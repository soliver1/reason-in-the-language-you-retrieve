  - question: Muss ein Händler aus Perricum, der mit einem Kuslikischen Händler Geschäfte
      machen möchte, einen Brabaker in die Verhandlungen einbeziehen? Begründe deine
      Antwort.
    answer: Ja, seit der Zeit Königin Therseias gilt in Brabak das Gesetz, das den
      Handel ‘von Fremd zu Fremd’ verbietet. So muss bei einem Geschäftsabkommen zwischen
      einem Kusliker Kaufmann und einer Händlerin aus Perricum etwa stets ein Brabaker
      als Zwischenhändler angeworben werden.
    context: 'Seit langer Zeit dient die Stadt als Handelsplatz aller Güter. Und tatsächlich:
      Der stolze Ausspruch “Was immer irgendwo in Aventurien gehandelt wird, ist auch
      auf den Brabaker Märkten zu finden” entspricht der Wahrheit. Seit der Zeit Königin
      Therseias gilt in Brabak das Gesetz, das den Handel ‘von Fremd zu Fremd’ verbietet.
      So muss bei einem Geschäftsabkommen zwischen einem Kusliker Kaufmann und einer
      Händlerin aus Perricum etwa stets ein Brabaker als Zwischenhändler angeworben
      werden. Dessen Provision beträgt üblicherweise ein Zehntel des Warenwertes.'
  - question: Welche Erzeugnisse werden in Brabak selbst produziert?
