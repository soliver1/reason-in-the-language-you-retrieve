  G1-032:
  - question: Welche essbaren Wurzeln werden im Text erwähnt?
    answer: Die Sakowurzel ist für viele Waldmenschen Hauptnahrung, die leicht bittere
      Shatakknolle (ähnlich dem irdischen Maniok), von dem sich vor allem die Sklaven
      ernähren müssen, das berühmte Süßholz, das man erst raspeln muss, damit es seinen
      Zucker preisgibt, und die Brabaker Wurzeln (Kandiswurz), die vor allem Kinder
      gerne naschen.
