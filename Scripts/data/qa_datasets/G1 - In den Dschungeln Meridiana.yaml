  G1-407:
  - question: Welche Ureinwohner bewohnten einst Aeltikan und kämpften gegen die Geschuppten
      vom Stamm der Zzzt?
    answer: Die Kasam’Utulus waren ein Stamm schwarzhäutiger Siedler, die einst Aeltikan
      bewohnten und gegen die Geschuppten vom Stamm der Zzzt kämpften.
    context: Anders als Javalasi besaß das gleichfalls sumpfige und von Brackwasser
      durchzogene Aeltikan einmal menschliche Ureinwohner. Ein Stamm von schwarzhäutigen
      Siedlern, die Kasam’Utulus, bewohnte einst die Insel, und die Märchen der benachbarten
      Zimtinselvölker erzählen von tapferen Frauen und Männern im steten Kampf gegen
      die Geschuppten vom Stamm der Zzzt.
  - question: Was produzieren die Insel-Achaz aus den Blüten der Sumpflilien und wer
      nutzt dieses Produkt?
    answer: Die Insel-Achaz destillieren aus den Blüten weiß blühender Sumpflilien
      das teure, wohlduftende Boronsöl, welches die Kemi eintauschen und bei Begräbnisriten
      einsetzen.
    context: Bemerkenswert sind die endlosen Teppiche weiß blühender Sumpflilien,
      die sich wie ein Leichentuch über die flachen Brackwassertümpel des Inselinneren
      legen. Aus den Lilienblüten destillieren die Insel-Achaz durch ein geheimes
      Verfahren das teure, wohlduftende Boronsöl, das die Kemi eintauschen und bei
      Begräbnisriten einsetzen.
  - question: Warum wurde Fort Laguan errichtet und wer nutzt es?
    answer: Die Kemi haben Fort Laguan südwestlich von Port Honak errichtet und mit
      einer Handvoll Ordenskriegern besetzt. Seit kurzem werden die Befestigungen
      heimlich ausgebaut, nachdem die Kemi auch ihren horasischen Verbündeten die
      Nutzung des Forts angeboten haben.
    context: Um die Al’Anfaner im Auge zu behalten, haben die Kemi ein gutes Stück
      südwestlich von Port Honak vor einigen Jahren Fort Laguan errichtet und mit
      einer Handvoll Ordenskriegern besetzt. Seit kurzem werden die Befestigungen
      heimlich ausgebaut, nachdem die Kemi auch ihren horasischen Verbündeten die
      Nutzung des Forts angeboten haben.
  G1-408:
  - question: Warum ist der Südwesten von Mikkan oft überschwemmt?
    answer: Der Südhang des zentralen Vulkans ist bei einem heftigen Ausbruch vor
      einigen Jahren weggebrochen und der Südwesten ist jetzt derart flach, dass er
      bei Flut stets überschwemmt wird.
    context: Die kleinste der drei Moskitoinseln unterscheidet sich von Javalasi und
      Aeltikan insofern, als sie weniger sumpfig und um einiges wohnlicher ist. Der
