  G1-078:
  - question: Wann und wie endete der Widerstandskampf gegen den Statthalter Merkan
      von Al’Anfa?
    answer: Der Widerstandskampf gegen Statthalter Merkan von Al’Anfa endete am 27.
      Praios 1010 mit der Befreiung der Hauptstadt Trahelien.
    context: Vor allem der Überfall auf Trahelien löste beim jungen Adel der Mittelreiche
      romantische Begeisterung aus. Dutzende von Freischärlern beteiligten sich, nachdem
