  G1-084:
  - question: Welche Wetterbedingungen charakterisieren das Klima Südaventuriens?
    answer: Mörderische Luftfeuchtigkeit und sintflutartige Regenfälle zu Mittag und
      während der zwei Regenzeiten in den Monaten Tsa/Phex und Rondra/Efferd prägen
      das Klima Südaventuriens.
    context: Mörderische Luftfeuchtigkeit und sintflutartige Regenfälle zu Mittag
      und während der zwei Regenzeiten in den Monaten Tsa/Phex und Rondra/Efferd prägen
      das Klima Südaventuriens. Dann fällt das Wasser fässerweise auf die Dächer,
      und ein ununterbrochenes Rauschen und Dröhnen, begleitet von grollendem Donner
      erfüllt die Luft.
  - question: Welche negativen Auswirkungen hat das Klima Südaventuriens auf Menschen?
    answer: Drückende Schwüle und ständiger Feuchtigkeitsverlust schwächen Körper
      und Geist und zehren an Nerven und Entschlossenheit.
    context: Doch bringt dieser Regen nur kurze Abkühlung. Das Wasser verdunstet in
      der Hitze rasch, und die Luft lastet danach umso schwerer auf dem Land. Drückende
      Schwüle und ständiger Feuchtigkeitsverlust schwächen Körper und Geist und zehren
      an Nerven und Entschlossenheit.
  - question: Welcher Wind prägt das Klima Südaventuriens und woher kommt er?
    answer: Vorherrschender Wind ist der Siral, der mittelstark, aber stetig aus Nordost
      bläst und bisweilen sogar Flugsand aus der Khôm mitbringt.
    context: Vorherrschender Wind ist der Siral, der mittelstark, aber stetig aus
