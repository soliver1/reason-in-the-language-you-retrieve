  G1-359:
  - question: Wie heißt die beeindruckendste Halle des Boron-Tempels und wie ist sie
      gebaut?
    answer: Die Halle des Schweigens, ein neuneckiges Gebäude aus poliertem schwarzem
      Basalt.
    context: 'Auf dem Höhepunkt seines Glanzes hingegen steht der Boron-Tempel: Die
      neuneckige, aus poliertem schwarzem Basalt erbaute Halle des Schweigens liegt
      am Platz der Nacht und gilt als das beeindruckendste – wenn auch nicht das größte
      – Gebäude der Stadt.'
  - question: Wo tagt der Glaubensrat und wo hat der Oberste Tempelherr seine Gemächer?
    answer: Der Glaubensrat tagt im prächtigen Saal gegenüber des Tores. Der Oberste
      Tempelherr und Hohepriester Kerim Akbashi hat seine Gemächer gleich daneben.
    context: In dem prächtigen Saal gegenüber des Tores tagt der Glaubensrat. Gleich
      daneben hat Kerim Akbashi, der Oberste Tempelherr und Hohepriester der Stadt
