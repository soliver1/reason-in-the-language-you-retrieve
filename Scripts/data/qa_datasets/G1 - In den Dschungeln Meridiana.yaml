      unterschiedlich gewertete Münzen, entspricht die Legierung heute in beiden Fällen
      dem Wert eines Silbertalers. Der so genannte Kleine Oreal misst an Größe und
      an Wert genau die Hälfte seines großen Bruders, heute aber ist er nur noch selten
      zu finden. Die kleinste Münze Al’Anfas ist der kupferne Dirham, der drei Skrupel
      wiegt und den Wert des kaiserlichen Kreuzers hat.
