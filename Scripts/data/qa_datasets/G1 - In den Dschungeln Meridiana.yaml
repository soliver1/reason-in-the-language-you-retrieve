  G1-149:
  - question: Welche Güter unterliegen in Al'Anfa einem Importzoll von 25 Prozent?
    answer: Alle Einfuhren werden mit 25 Prozent belegt, außer Getreide, Schiffsbauholz
      und Metalle.
    context: Die extremste Einschränkung ist der Importzoll. Da Al’Anfa viele Güter
