      einst ein Vermögen gekostet hat.
  G1-257:
  - question: Wer steht an der Spitze einer Kolonie und welche Aufgaben hat er?
    answer: Ein Gouverneur, der von seinem Heimatland mit der Aufsicht über den Stützpunkt,
      der Sicherung des Handels und der Wahrung der Interessen des Mutterlandes beauftragt
      wird.
    context: An der Spitze einer Kolonie steht ein Gouverneur (mit häufig phantasievollen
      Titeln und Zusatzwürden), der von seinem Heimatland mit der Aufsicht über den
      Stützpunkt, der Sicherung des Handels und der Wahrung der Interessen des Mutterlandes
      beauftragt wird. Meist ist ihm ein militärischer Berater zur Seite gestellt.
  - question: Welche Unterstützung erhält der Gouverneur in einer Kolonie?
    answer: Meistens ein militärischer Berater
    context: An der Spitze einer Kolonie steht ein Gouverneur (mit häufig phantasievollen
      Titeln und Zusatzwürden), der von seinem Heimatland mit der Aufsicht über den
      Stützpunkt, der Sicherung des Handels und der Wahrung der Interessen des Mutterlandes
      beauftragt wird. Meist ist ihm ein militärischer Berater zur Seite gestellt.
  - question: Wie ist die politische Organisation in unabhängigen Städten geregelt?
    answer: Die Regierungsform variiert von Stadt zu Stadt.
    context: In den unabhängigen Städten wechselt die Regierungsform von Stadt zu
      Stadt, so dass hier auf die jeweiligen Stadtbeschreibungen verwiesen sei.
  G1-258:
  - question: Wie kleiden sich die Menschen während des Rahjanal?
    answer: Während des Rahjanal tragen alle, unabhängig von ihrer sozialen Stellung,
      phantasievolle Gewänder und verhüllen ihre Gesichter mit Masken.
    context: In den ersten Rahja-Wochen gibt es das Rahjanal, ein vierwöchiges Fest,
      an dem sich die Unterschiede zwischen Reich und Arm verwischen. Alle kleiden
      sich in phantasievolle Gewänder und verhüllen ihre Gesichter mit Masken.
  - question: Welchen Traum haben viele Kinder von Schuldknechten im Zusammenhang
      mit dem Rahjanal?
    answer: Es wird erklärt, dass Kinder von Schuldknechten versuchen Geld zu sparen
      um sich während des Festes prachtvolle Gewänder leisten zu können und einen
      reichen Gefährten kennen zu lernen.
    context: 'Viele Kinder von Schuldknechten versuchen von klein auf, genügend Geld
      zu sparen. Einmal in ihrem Leben möchten sie sich in prachtvolle Gewänder hüllen,
      das Gesicht mit einer Maske bedeckt. Und wer weiß: So Phex es will, mag es ihnen
      gelingen, auf dem Fest einen reichen Gefährten kennen zu lernen.'
  - question: Welche Art von Gladiatorenkämpfen ist in den meisten Stadtstaaten üblich
      und warum?
    answer: In den meisten Stadtstaaten sind Gladiatorenkämpfe zwischen Unbewaffneten
      üblich, da sie sich die Kosten für wertvolle Sklaven nicht leisten können.
    context: Auch Gladiatorenkämpfe spielen eine große Rolle, wobei man in den meisten
      Stadtstaaten nicht vermögend genug ist, um wertvolle Sklaven nur zum Vergnügen
      zu töten, wie es in der Arena zu Al’Anfa üblich ist. Weit verbreitet sind daher
      Kämpfe zwischen Unbewaffneten, die in einer kleinen Arena wild aufeinander einschlagen
      und hochtrabend als Gladiatoren bezeichnet werden.
  G1-259:
  - question: Wo befindet sich der Palast des Regenten?
    answer: Ein natürlicher oder selten künstlicher Hügel in der Mitte der Stadt,
      auf dem sich der Palast des einstigen Gouverneurs und heutigen Regenten erhebt.
    context: 'In der Mitte der Stadt liegt ein natürlicher, selten auch künstlicher
      Hügel, auf dem sich der Palast des einstigen Gouverneurs und heutigen Regenten
      erhebt. '
  - question: Wie sind die Häuser der Mittelschicht in Bezug auf Farbe und Dach gestaltet?
    answer: Die Häuser sind meist weiß getüncht (Korallenkalk) mit roten Dächern und
      haben meist nur kleine Fenster.
    context: Auch sie sind der Hitze wegen mit weißem Korallenkalk getüncht, mit roten
      Dächern und meist mit nur kleinen Fenstern versehen.
  - question: Welche Art von Einrichtungen findet man im Erdgeschoss der Häuser der
      Mittelschicht?
    answer: 'Sie beherbergen Werkstätten, Geschäfte oder Schänken, häufig unter einer
      Markise oder einem Vorbau. '
    context: Im Erdgeschoss befinden sich die Geschäfte, Werkstätten oder Schänken,
      häufig unter einer Markise, bisweilen auch unter einem von hölzernen Säulen
      getragenen Vorbau.
  - question: Wie ist das Aussehen der Plantagenanlagen?
    answer: In den Plantagenanlagen befindet sich eine große Villa mit Stallungen
      und kleinen Hütten für die Angestellten, Söldner und Sklaven.
    context: Auf diesen Pflanzungen befindet sich immer eine hochherrschaftliche Villa
      mit Stallungen und zahlreichen kleinen Hütten für Söldner, Aufseher, Schuldknechte
      und Sklaven.
  G1-261:
  - question: Welche sprachlichen Besonderheiten zeichnet das Brabaci aus?
    answer: Das Brabaci ist eine altertümliche Abart des Garethi, das noch viele Ausdrücke
      aus bosparanischer Zeit bewahrt und diese mit dem melodischen Tonfall der Tulamiden
      verbrämt hat.
    context: Der charakteristische Dialekt Südaventuriens, das Brabaci, wird im ganzen
      küstennahen Gebiet südlich von Drôl und Port Corrad gesprochen. Es ist eine
      altertümliche Abart des Garethi, die noch viele Ausdrücke aus bosparanischer
      Zeit bewahrt und diese mit dem melodischen Tonfall der Tulamiden verbrämt hat.
      Gerade die Oberschicht bemüht sich um Nähe zum Bosparano, während die unteren
      Schichten einen ganz eigenen Dialekt, das Gatamo, verwenden.
