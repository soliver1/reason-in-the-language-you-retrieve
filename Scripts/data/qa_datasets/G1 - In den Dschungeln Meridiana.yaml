      – vielleicht.
  - question: Was wird als sicherste Methode beschrieben, um den Dschungel zu bereisen?
    answer: Die sicherste Möglichkeit, im Dschungel zu reisen, ist per Boot über die
      Wasserwege. Zu Fuß kann ein Fluss schlecht im Auge behalten werden, da der Ufergürtel
      dicht von Mangroven bewachsen und stark bewohnt ist.
    context: Orientierungs-Proben sind um mindestens 7 Punkte erschwert – dieser Grundzuschlag
      wird nicht fällig für Kenner der Sonderfertigkeit Dschungelkundig, aber selbst
      diese müssen bisweilen noch Zuschläge von 5 oder mehr Punkten hinnehmen, wenn
      sie sich außerhalb ihrer vertrauten Region bewegen. Eine Kombination aus Dschungelkundig
      und Ortskenntnis haben dagegen die meisten Bewohner des Regenwaldes vorzuweisen.
