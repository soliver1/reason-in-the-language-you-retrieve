  G1-324:
  - question: Wie heißt die älteste von Menschen bewohnte Stadt Aventuriens?
    answer: H'Rabaal
    context: 'In einem Tal in den südlichen Ausläufern des Regengebirges liegt H’Rabaal:
      die älteste von Menschen bewohnte Stadt Aventuriens.'
  - question: Warum wurde H'Rabaal von den Echsenwesen gegründet?
    answer: Die Echsenwesen gründeten sie als religiöses Zentrum und opferten dort
      den H'Ranga, um die südlichen Reiche vor seinem Zorn zu schützen.
    context: Vor mehr als 5.400 Jahren wurde die ‘Heilige Stadt’ (so die Übersetzung
      H’Rabaals aus dem Rssah) als religiöses Zentrum der Echsenwesen gegründet. Hier
      wurde den H’Ranga geopfert, so dass die südlichen Reiche der Echsen vor seinem
      Zorn sicher waren.
  - question: Wie kam es zur Besiedlung von H'Rabaal durch die Menschen?
    answer: Nach Jahrhunderten erbitterter Kämpfe eroberten die Menschen H’Rabaal
      etwa 550 Jahre vor Bosparans Fall und besiedelten sie anschließend.
    context: Doch dann kam die Zeit, in der die Menschen die Geschuppten immer mehr
      zurückdrängten, und nach Jahrhunderten erbitterten Kampfes wurde H’Rabaal etwa
      550 Jahre vor Bosparans Fall von den Menschen erobert und anschließend besiedelt.
  G1-325:
  - question: Wie hat sich der Einfluss der Familie Charazzar durch den Anschluss
      an das Brabaker Reich verändert?
    answer: Obwohl die Charazzar durch den Anschluss an das Brabaker Reich mehr Einfluss
      erlangten, verloren sie ihren Anspruch auf die Königswürde.
    context: Mit dem Anschluss an das Brabaker Reich, durch den die Familie Charazzar
      noch mehr Einfluss erlangte, ging der Anspruch auf die Königswürde verloren.
  - question: Wie hat sich das Verhältnis zwischen den Menschen und den Achaz in H'Rabaal
      entwickelt?
    answer: Die Achaz in H’Rabaal halten nur Kontakt zu bestimmten Vertretern der
      Charazzar und bleiben sonst unter sich. Gründe für die angespannte Beziehung
      zwischen Menschen und Achaz sind unbekannt, da beide Seiten schweigen.
    context: Über viele Jahre besaßen die Charazzar uneingeschränkte Macht über die
      Bewohner der Umgebung H’Rabaals, aber durch Auseinandersetzungen mit den örtlichen
      Achaz kühlte das Verhältnis zwischen Menschen und Geschuppten in den letzten
      Jahren merklich ab. Es ist unklar, worin genau die Gründe dafür liegen. Achaz
      und Charazzar schweigen darüber, und andere Menschen verstehen die Achaz ohnehin
      nicht. Die Achaz in H’Rabaal bleiben unter sich, einzig zu bestimmten Vertretern
      der Charazzar halten sie Kontakt.
  - question: Beschreiben Sie die Einstellung verschiedener Gruppen gegenüber der
      Stadt H'Rabaal und wie diese mit der Stadt interagieren?
    answer: Der Stamm der Napewanha meidet die Stadt H'Rabaal als Tabu, während Sklaven
      aller Rassen hierher flüchten, da die Macht ihrer Peiniger kaum in die Stadt
      reicht. Viele dieser Flüchtlinge werden jedoch von Häschern der Charazzar eingefangen
      und auf Plantagen vor der Stadt versklavt.
    context: Der Stamm der Napewanha, der im Umland lebt, meidet die Stadt als Tabu.
      Sklaven aller Rassen flüchten aus Al’Anfa und Brabak hierher, da die Macht ihrer
      Peiniger kaum in diese Stadt reicht. Viele dieser Flüchtlinge werden jedoch
      von Häschern der Charazzar eingefangen und landen auf einer der großen Plantagen
      vor der Stadt, wo der Hauptteil der Nahrung für Einwohner, aber auch Luxusgüter
      angebaut werden.
  G1-326:
  - question: Wer kontrolliert hauptsächlich den Handel mit Kräutern, Giften und alchemistischen
      Zutaten in H'Rabaal?
    answer: Die Charazzar.
    context: 'Auch der Handel mit Kräutern, Giften und Grundlagen für alchimistische
      Tränke und Tinkturen aus H’Rabaal liegt zu einem großen Teil in den Händen der
      Charazzar. '
  - question: Welche Waren tauschen die Ziliten gegen Metallwaren und andere Güter?
    answer: Die Ziliten handeln graue Perlen gegen Metallwaren und andere Güter.
    context: Die Ziliten halten sich aus dem Streit zwischen Menschen und Achaz heraus.
      Die Fischmenschen bekommen für die grauen Perlen, die nur sie vom Grund der
      sumpfigen Seen holen können und die bei den Tulamiden als Mittel gegen das Altern
      und seine Folgen begehrt sind, Metallwaren und andere Güter, die sie nicht selbst
      herstellen können.
  - question: Wie findet die Kommunikation zwischen den Menschen und den Ziliten statt?
    answer: Die Verständigung erfolgt durch Dolmetscherfamilien, die eine Gestensprache
      verwenden, deren Ursprung im Atak liegt.
    context: 'Da die Ziliten die menschliche Sprache nicht sprechen können, ist die
      Verständigung mit ihnen sehr schwer. Doch haben sich im Laufe der Zeit einige
      Familien in der Stadt gefunden, die als Dolmetscher fungieren – mittels einer
      Gestensprache, die ihren Ursprung im Atak hat. '
  G1-327:
  - question: Wie ist die Stadt H’Rabaals strukturiert?
    answer: 'Die Stadt H’Rabaals besteht aus drei Teilen: den neuen Bauten der Menschen,
      den gut erhaltenen Überresten des Tempelkomplexes der Echsen und den Hütten
      der Achaz. Zusätzlich leben noch Ziliten im Sumpf vor der Stadt.'
    context: Der eigentliche Stadtfläche H’Rabaals besteht aus drei Teilen. Da sind
      zunächst die relativ neuen Bauten der Menschen – zum Großteil Glücksritter,
      Händler, Plantagenbesitzer und Sklaven –, des weiteren die gut erhaltenen Überreste
      des Tempelkomplexes der Echsen und den Hütten der Achaz und zuletzt die Ziliten
      im Sumpf vor der Stadt.
  - question: Welche Herausforderungen stellt der Dschungel für die Stadt dar und
      wie geht man damit um?
    answer: Der Dschungel wächst unaufhaltsam und würde die Stadt überwuchern, wenn
      nicht ständig Land freigehalten würde. Landwirtschaft ist nur durch Brandrodung
      möglich, was das Umland verändert.
    context: Der jahrtausendelange Kampf gegen den unaufhaltsamen Dschungel hat die
      Stadt geprägt; der Urwald überwuchert jeden Flecken, der nicht ständig freigehalten
      wird. Landwirtschaft ist nur durch Brandrodung möglich, die das Umland ständig
      verändert. Nur wenige der zu alten Zeiten kultivierten Flächen sind heute noch
      bewohn-, geschweige denn begehbar.
  - question: Welche sozialen Gruppen leben in den neuen Bauten der Menschen innerhalb
      von H’Rabaals?
    answer: Die Menschen, die in H’Rabaals leben, sind größtenteils Glücksritter,
      Händler, Plantagenbesitzer und Sklaven.
    context: Der eigentliche Stadtfläche H’Rabaals besteht aus drei Teilen. Da sind
      zunächst die relativ neuen Bauten der Menschen – zum Großteil Glücksritter,
      Händler, Plantagenbesitzer und Sklaven –, des weiteren die gut erhaltenen Überreste
      des Tempelkomplexes der Echsen und den Hütten der Achaz und zuletzt die Ziliten
      im Sumpf vor der Stadt.
  G1-328:
  - question: Zu welcher Familie gehören die meisten Bewohner der Villen in Khunchom?
    answer: Nur wenige Bauten in Khunchom verdienen die Bezeichnung 'Villa' und gehören
      fast alle zur Familie der Charazzar.
    context: Die Menschen leben größtenteils in einfachen Häusern tulamidischen Baustils.
      Die Bezeichnung ‘Villa’ verdienen nur wenige Bauten; und die Bewohner derselbigen
      gehören fast alle zur Familie der Charazzar.
  - question: Wo in Khunchom werden Waren aus fernen Ländern gehandelt?
    answer: 'Vor dem Palast liegt ein weiträumiger Marktplatz, auf dem Waren aus dem
      fernen Brabak und gelegentlich aus Al’Anfa ankommen und entladen und verkauft
      werden. '
    context: Von fern wirkt der Bau wie eine stufenförmige Pyramide; aus der Nähe
      betrachtet unterscheidet er sich jedoch nur durch die mysteriösen Steine von
      den umgebenden Villen. Gerüchten zufolge wurden beim Bau die Überreste einer
      uralten Tempelpyramide genutzt, was die seltsamen Zeichen auf den Steinen erklären
      könnte. Vor dem Palast liegt ein weiträumiger Marktplatz, auf dem Waren aus
      dem fernen Brabak und gelegentlich aus Al’Anfa ankommen und entladen und verkauft
      werden.
  - question: Beschreibe die Bauweise einiger Häuser aus den Anfangszeiten der menschlichen
      Besiedlung in Khunchom.
    answer: In den leerten Panzer von Riesenschildkröten wurden einige Häuser der
      Anfangszeit der menschlichen Besiedlung gebaut. Die Panzer haben eine Höhe zwischen
      2,5 und 5 Schritt und können ganze Familien beherbergen. Im größten Panzer befindet
