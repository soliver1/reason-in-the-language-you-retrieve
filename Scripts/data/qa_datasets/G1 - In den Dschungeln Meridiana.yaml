  G1-276:
  - question: Wie wurde im Jahr 154 v. BF eine Hungersnot in Brabak verhindert?
    answer: Durch die Ankunft der (später zur Nationalheiligen erklärten) Elida von
      Salza mit ihren vier Schiffen.
    context: Immer schon war die Siedlung ein wichtiger Schifffahrts-Stützpunkt zwischen
      Ost und West, das kärgliche Ackerland aber enttäuschte die zuströmenden Siedler
      jedes Mal aufs Neue und führte nicht nur zu häufiger Lebensmittelknappheit,
      sondern auch zu mehreren Hungersnöten. Im Jahre 154 v.BF konnte eine solche
      Katastrophe durch die Ankunft der (später zur Nationalheiligen erklärten) Elida
      von Salza mit ihren vier Schiffen abgewendet werden.
  - question: Welche politischen Umbrüche erlebte Brabak in den letzten Jahrhunderten?
    answer: Die Stadt wurde Hauptstadt der Provinz Mysobien und fiel nach dem großen
      Brand von 602 unter die Herrschaft des Vizekönigreichs Meridiana, dessen Regenten
      in Al’Anfa die Stadt als unterworfene Kolonie behandelten. Seine Unabhängigkeit
      erlangte Brabak 849 BF.
    context: Von vielen politischen Umschwüngen gezeichnet, war die Stadt in den letzten
      Jahrhunderten durchgängig Hauptstadt der Provinz Mysobien. Nach dem großen Brand
      von 602 fiel Brabak unter die ungnädige Herrschaft des Vizekönigreichs Meridiana,
      dessen Regenten in Al’Anfa die Stadt als unterworfene Kolonie behandelten. Seine
      Unabhängigkeit erlangte Brabak 849 BF, als die hungernde Meridianische Legion
      rebellierte, sich sowohl vom Mittelreich wie auch von Al’Anfa lossagte und den
      örtlichen Gouverneur Thiralion de Sylphur zum König Ariakon I. ausrief.
  - question: Wer regiert seit 980 BF das Königreich Brabak?
    answer: König Mizirion III. regiert seit 980 BF das Königreich – immer unter Druck
      und in Konkurrenz zur Audienzia, der Versammlung der wichtigsten Familien Brabaks.
    context: Seit 980 BF regiert König Mizirion III. das Königreich – immer unter
      Druck und in Konkurrenz zur Audienzia, der Versammlung der wichtigsten Familien
      Brabaks. Die notorische Leere in der Staatskasse und die permanente Verunglimpfung
      seiner Person durch Neider und Intriganten verhinderten über die Jahre das eigentliche
      Ziel Mizirions, Brabak in eine ruhmreiche Zukunft zu führen.
