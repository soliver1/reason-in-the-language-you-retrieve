      unter denen El Harkir wohl der berühmteste ist. Die Haipu legen mit ihren Katamaranen
      und Wellenreitbrettern nur selten an, ein uraltes, halbvergessenes Tabu liegt
      auf der Insel.
  G1-400:
  - question: Warum ist es schwierig, die Insel Nikkali zu erreichen?
    answer: Die Insel Nikkali ist durch Korallenriffe umgeben, die sich auch in die
      Meerenge nach Altoum hin ausdehnen und eine Durchfahrt unmöglich machen.
    context: 'Die westlichste Insel der eigentlichen Waldinselkette ist mittelgroß
      und sehr eng mit Altoum verbunden: Außer an einigen Stellen der Nordküste ist
      Nikkali ganz von Korallenriffen umgeben, die sich auch in die Meerenge nach
      Altoum hin ausdehnen und eine Durchfahrt unmöglich machen.'
  - question: Warum spezialisierten sich die ersten Siedler auf Nikkali auf die Seeräuberei?
    answer: Die Bukanier wandten sich der Seeräuberei zu, da Nikkali kaum den Vieh-
      und Wildreichtum der großen Nachbarinsel Altoum bot, und ihre erste Siedlung
      nur knapp ihr Verhungern verhinderte.
    context: Da Nikkali allerdings kaum den Vieh- und Wildreichtum der großen Nachbarinsel
      bot, wandten sich die Neusiedler schon bald der Seeräuberei zu, die anfangs
      gerade einmal ihr Verhungern verhinderte.
  - question: Woher kommt der Name des einzigen festen Ansiedlung auf Nikkali, Ingrimsport?
    answer: Ingrimsport wurde nach den unweit verlaufenden Lavaströmen benannt, die
      alle Jahrzehnte die Räumung des Ortes erfordern, ansonsten aber für die Rodung
      der Mangrove sorgen und so den Hafen offen halten.
    context: Seinen Namen hat es von den unweit verlaufenden Lavaströmen, die alle
      Jahrzehnte die Räumung des Ortes erfordern, ansonsten aber für die Rodung der
      Mangrove sorgen und so den Hafen offen halten.
  G1-401:
  - question: Welche Inseln sind für ihren Gewürzreichtum bekannt?
    answer: Token, Sokkina und Iltoken.
    context: 'Token, Sokkina und Iltoken sind für ihren Gewürzreichtum bekannt, so
      dass hier die meisten Seemächte und auch etliche Handelshäuser Forts oder Kontore
      angelegt haben. '
  - question: Welche Völker bevölkerten die Gewürzinseln zur Zeit des Diamantenen
      Sultanats?
    answer: Utulus und Kasam’Utulus von Aeltikan
    context: Die Ureinwohner der Inseln waren Utulus, die schon zur Zeit des Diamantenen
      Sultanats hier siedelten. Außerdem wurden zu jener Zeit die Kasam’Utulus von
      Aeltikan als Plantagensklaven hierher verschleppt.
  - question: Welche Bevölkerungsgruppe kontrolliert heute die Gewürzinseln?
    answer: Miniwatu, Nachkommen freigelassener Waldmenschen
    context: 'Heute beherrschen allerdings die Miniwatu, Nachkommen freigelassener
      Waldmenschen, die vor Jahrhunderten hierher gebracht wurden, die ‘Gewürzinseln’. '
  G1-402:
  - question: Wo auf Token herrscht das für Nordländer angenehmstes Klima?
    answer: Die nordöstliche Küste.
    context: 'Die nordöstliche Küste besitzt das für Nordländer angenehmste Klima
      im ganzen Archipel. '
  - question: Warum kann die Insel Token trotz der Präsenz des horasischen Kolonialreiches
      kaum als Besitz des Adlerthrones angesehen werden?
    answer: ' Sant Ascanio ist der wichtigste Stützpunkt des horasischen Kolonialreiches,  aber
      viele andere Landestellen sind in der Hand anderer Seemächte oder der Miniwatu.'
    context: ' Obwohl hier mit Sant Ascanio der wichtigste Stützpunkt des horasischen
      Kolonialreiches liegt, kann die Insel kaum als Besitz des Adlerthrones betrachtet
      werden. Viele andere Landestellen sind in der Hand anderer Seemächte oder der
      Miniwatu, die auch das Landesinnere beherrschen.'
  - question: Wie entwickelten sich die Beziehungen zwischen den Bewohnern von Token
      und den 'Kindern des Wassers'? Nennen Sie ein konkretes Beispiel.
    answer: Ascanio Numapatauponumutapoto wurde zunächst halb als Gast und Scholar,
      halb als Geisel an den Vinsalter Hof geschickt. Dort lernte er aber rasch und
      fand Gefallen an der horasischen Lebensweise.
    context: 'Mit den ‘Kindern des Wassers’ bestehen jedoch seit vielen Jahren gute
      Beziehungen: Ascanio Numapatauponumutapoto, ein Sohn der Fürstin von Token,
      wurde zunächst halb als Gast und Scholar, halb als Geisel an den Vinsalter Hof
      geschickt. Dort lernte er aber rasch und fand Gefallen an der horasischen Lebensweise.'
  G1-403:
  - question: Wo befindet sich die Residenz der Königin der Miniwatu?
    answer: Die Königin der Miniwatu, Kaba-Tica, residiert in der Palastsiedlung Tapam-Waba
      an der Westküste.
    context: Die kleinere Insel Sokkina steht ganz unter der Herrschaft der Miniwatu,
      deren Königin Kaba-Tica in der prachtvollen, aus Edelhölzern errichteten Palastsiedlung
      Tapam-Waba an der Westküste residiert.
  - question: Dürfen sich Kolonialisten auf Sokkina niederlassen?
    answer: 'Nein, die Königin achtet strikt darauf, dass sich keine Blasshäute auf
      Sokkina festsetzen. '
    context: Manchmal legen hier Kontorschiffe von kolonielosen Handelshäusern an.
      Die Königin achtet strikt darauf, dass sich auf ihrer Residenzinsel keine Blasshäute
      festsetzen.
  - question: Welche Art von Schiffen finden in Tapam-Waba Platz?
    answer: 'In Tapam-Waba gibt es einen Naturhafen, der mehreren Dutzend Kanus und
      Katamaranen Platz bietet. '
    context: Hier findet sich auch, inmitten von Lorbeersträuchern, ein Naturhafen,
      der mehreren Dutzend Kanus und Katamaranen Platz bietet.
  G1-404:
  - question: Warum wagte Vikko Stoerrebrandt den Sprung an den Südrand der bekannten
      Welt?
    answer: Der Grund für seinen Erfolg war der lukrative Kurkumer Safranhandel, den
      er übernommen hatte.
    context: 'Im Sommer 966 BF wurde hier das Falkenbanner des Vikko Stoerrebrandt
      gehisst: Der Festumer Gewürzkrämer hatte nach Übernahme des Kurkumer Safranhandels
      derartige Gewinne gemacht, dass er den kühnen Sprung zum Südrand der bekannten
      Welt wagte (wo nach allgemeiner Meinung nur blutrünstige Seeräuber und wilde
      Menschenfresserstämme hausten) und nie bereute.'
  - question: Wie ist Port Stoerrebrandt geschützt?
    answer: Port Stoerrebrandt ist der einzige sichere Hafen auf den Waldinseln. Er
      wird von einer Kompanie Neersander Söldner und einer Hand voll Seesöldner bedeckt.
    context: Das etwa 700 Einwohner umfassende Port Stoerrebrandt ist der einzige
      sichere Hafen auf den Waldinseln und wird von einer Kompanie Neersander Söldner
      und einer Hand voll Seesöldner bedeckt. Auch ist es traditioneller Hauptstützpunkt
      der ‘Seewölfe’, der berühmten Festumer Piratenjäger.
  - question: Was bekamen die Bornländer im Austausch für die Hälfte der Insel von
      den Miniwatu?
    answer: Die Miniwatu tauschten die halbe Insel gegen ein Dutzend Metallwaffen
      und einige Ballen Tuch mit den Bornländern.
    context: Dies gelang vor allem durch ein Geschäft mit den Miniwatu, die den Bornländern
      gegen ein Dutzend Metallwaffen und einige Ballen Tuch die halbe Insel überließen.
  G1-405:
  - question: Warum wurden die Moskitoinseln von Menschen nur wenig erfolgreich besiedelt?
    answer: Die Inseln Javalasi, Aeltikan und Mikkan sind durch eine besonders üppige
      Vegetation gekennzeichnet.
    context: 'Die drei Inseln Javalasi, Aeltikan und Mikkan sind durch eine besonders
      üppige Vegetation gekennzeichnet – so üppig, dass sie dem Menschen schon zu
      viel ist. '
  - question: Welche Tiere ernähren sich von Moskitos auf den Moskitoinseln?
    answer: 'Die Moskitos dienen allerlei Vögeln, vor allem aber Eidechsen, Chamäleons,
      Leguanen und anderen Kriechtieren als Nahrung. '
    context: Die Moskitos wiederum dienen allerlei Vögeln, vor allem aber Eidechsen,
      Chamäleons, Leguanen und anderen Kriechtieren als Nahrung.
  - question: Wie unterscheiden sich die Zwergdrachen von echten Drachen?
    answer: Die Zwergdrachen ähneln mit ihren langen Hälsen, knochigen Rückenkämmen
      und den Drachenflügeln tatsächlich winzigen Drachen, doch sind sie weder mit
      Intelligenz noch Magie noch Feueratem begabt.
    context: Eine Besonderheit der Insel ist der nur zwei Spann lange Zwergdrache.
      In Wirklichkeit handelt es sich um eine Echsenart – nicht zu verwechseln mit
      der gleichnamigen echten Drachenspezies, die auf den Waldinseln ebenfalls heimisch
      ist. Zwergdrachen ähneln mit ihren langen Hälsen, knochigen Rückenkämmen und
      den Drachenflügeln tatsächlich winzigen Drachen, doch sind sie weder mit Intelligenz
      noch Magie noch Feueratem begabt.
  G1-406:
  - question: Wie ist das Landschaftsbild der Insel Javalasi geprägt?
    answer: Das Eiland besteht fast ausschließlich aus dichtem Mangrovenwald und Brackwassersümpfen.
      Lediglich im Westen gibt es einen sandigen Uferstreifen.
    context: 'Javalasi (kemi: Pet’hesá) ist die unwirtlichste der menschenfeindlichen
      Moskitoinseln. Das flache Eiland besteht fast ausschließlich aus dichtem Mangrovenwald
      und Brackwassersümpfen. Lediglich im Westen gibt es einen sandigen Uferstreifen.'
  - question: Was macht die Gewässer rund um Javalasi für Schiffe gefährlich?
    answer: Ein besonders heimtückisches Atoll umgibt die Insel Javalasi unter Wasser
      mit einem ringförmigen Korallenriff und ist schon manchem Schiff zum Verhängnis
      geworden.
    context: Ein besonders heimtückisches Atoll umgibt die Insel Javalasi unter Wasser
      mit einem ringförmigen Korallenriff und ist schon manchem Schiff zum Verhängnis
      geworden.
  - question: Beschreibe die markante Felsformation im Osten der Insel Javalasi.
    answer: Östlich der Insel ragt eine hohe Obsidiansäule aus den Fluten und bietet
      einem großen Möwenschwarm ein Heim. Auffällig ist eine deutlich erkennbare Felszeichnung.
      Ein gewaltiger Dreizack, wohl sieben Schritt hoch, wurde hier von einem unbekannten
      Künstler in den schwarzen Fels geschlagen.
