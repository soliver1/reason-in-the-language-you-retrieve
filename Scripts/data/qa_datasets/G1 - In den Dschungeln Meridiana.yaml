  G1-214:
  - question: In welcher Stadt können Menschen die Hilfe von Boron anfordern?
    answer: In der Stadt des Totengottes.
    context: 'Während man in jeder größeren Stadt Aventuriens einen Halsabschneider
      für wenige Dukaten anheuern kann, steht es in der Stadt des Totengottes jedem
      frei, um ein Eingreifen der Hand Borons zu bitten. '
  - question: Wie kann man Boron um Hilfe bitten?
    answer: Man muss Zugang zur Stadt des Schweigens finden und dort einen unauffälligen
      Schrein mit einer Hand aus rotem Blutachat aufsuchen. Dort muss man Boron ein
      Opfer bringen - mindestens 20 Dublonen - und halblaut, aber deutlich seinen
      Wunsch formulieren.
    context: Angeblich muss man Zugang zur Stadt des Schweigens finden, wo in einem
