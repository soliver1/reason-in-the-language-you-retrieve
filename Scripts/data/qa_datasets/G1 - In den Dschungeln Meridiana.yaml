  G1-281:
  - question: Warum leben die Brabaker im Moment?
    answer: Die Brabaker Lebensweise ist ganz auf den Augenblick gerichtet. Wer arm
      ist, kann nicht planen, und wer reich ist, der braucht es nicht.
    context: Im Zentrum seines Lebens steht zunächst die Familie. Auf dem Land gibt
      die Großfamilie sozialen Schutz, der im Falle von Krankheit, Versehrtheit oder
      Alter das Überleben sichert. Aber auch am Beispiel der großen Grandenfamilien
      Brabaks ist ersichtlich, dass Blutsbande oft stärker sind als Treueide einem
      Herrn gegenüber. Die Brabaker Lebensweise ist ganz auf den Augenblick gerichtet.
      Wer arm ist, kann nicht planen, und wer reich ist, der braucht es nicht. Daraus
      entstand die Spontaneität und Kompromissbereitschaft, für die der Brabaker so
      berühmt ist.
  - question: Was ist wichtiger für die Brabaker beim Handel als das Geld?
    answer: Zwar sind Brabaker auch gewiefte Händler, mit denen es sich ausgezeichnet
