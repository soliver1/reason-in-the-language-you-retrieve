  - question: Beschreibe den Verlauf des Rahjanal-Festes und wie es die sozialen Strukturen
      beeinflusst.
    answer: Das Rahjanal ist ein Fest, bei dem die sozialen Grenzen verschwimmen und
      Menschen oft aufwendige Kostüme tragen. Es beginnt in der Stadt, in der es im
      vorherigen Jahr endete, und wandert über mehrere Tage durch verschiedene Städte.
    context: '"Neben den Städten veranstaltet es hauptsächlich die Kirche der Liebenden
      Herrin. Oft können die Bewohner einer Stadt den offiziellen Beginn des Rahjanal
      nicht abwarten und eröffnen die Feier schon, bevor sie in ihre Stadt zieht.
      Bemerkenswert an diesem Fest ist, dass die peinlichst aufrecht erhaltenen Standesgrenzen
      verschwinden, weshalb die armen Burschen und Mädchen oft einen ganzen Götterlauf
