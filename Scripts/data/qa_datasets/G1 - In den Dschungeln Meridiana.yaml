  G1-446:
  - question: Wie würde ein Freibeuter theoretisch nach seiner Gefangennahme behandelt
      werden?
    answer: Theoretisch als Kriegsgefangene.
    context: Streng genommen gelten sie als Söldner und müssen daher theoretisch nach
      ihrer Ergreifung als Kriegsgefangene behandelt werden. Dies ist jedoch keine
      rechtlich gesicherte Stellung, und so ist mehr als fraglich, ob ein gefangener
      Freibeuter darauf vertrauen kann, dass der Feind solche Formalitäten beachtet.
  - question: Wie verhält sich Al'Anfa gegenüber Freibeutern?
    answer: Al'Anfa erkennt keine fremden Kaperbriefe an und behandelt jeden Angreifer
      auf seine Schiffe als Pirat.
    context: So erkennt Al’Anfa keinerlei fremde Kaperbriefe an und behandelt jeden,
      der einen Angriff auf seine Schiffe wagt, als Pirat – mit allen Konsequenzen.
  - question: Welche Möglichkeit haben Piraten, ihren Status zu legalisieren?
    answer: Er kann gegen eine hohe Geldsumme eine Amnestie erlangen und im Dienst
      des ehemaligen Feindes weitermachen.
    context: Von Zeit zu Zeit stellt fast jeder Gouverneur eine Amnestie für Piraten
      in Aussicht. Bei dieser Gelegenheit können sich selbst berüchtigte Piraten gegen
      eine stattliche Summe Gold offizielle Vergebung erwerben und ihre Laufbahn fast
      unverändert ‘im Dienst’ des ehemaligen Feindes fortsetzen.
  - question: Welche Konsequenzen hat es für einen Freibeuter, der seinen Kaperbrief
