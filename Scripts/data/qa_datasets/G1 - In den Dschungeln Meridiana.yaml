      Wams nicht entledigt. '
    context: Das Bild eines typischen Bornländers ist in Al’Anfa geprägt von dem ewig
      schwitzenden, rotgesichtigen Händler, der sich trotz der Hitze seines zobelbesetzen
      Wams nicht entledigt und angesichts der freizügigen Lebensart in ein verlegenes
      Stammeln verfällt.
  - question: Wie verhalten sich die Bornländer gegenüber ihrer Konkurrenz in den
