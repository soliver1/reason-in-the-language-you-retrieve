  G1-244:
  - question: Warum werden die Maraskaner in Al'Anfa mit Misstrauen betrachtet?
    answer: Die Maraskaner werden als etwas seltsam und verschlossen beschrieben,
      und es wird gesagt, dass sie frevlerische Götter verehren. In Al'Anfa halten
      sie sich meist unter sich und schüren Misstrauen.
    context: “Die sind ja alle ein wenig irre, die Maraskaner, aber das ist auch kein
      Wunder bei diesen seltsamen Göttern. Eine absurde Vorstellung, dieser Diskus,
      und frevlerisch obendrein. Es gibt viele davon in Al’Anfa, aber die bleiben
      meist unter sich. Es soll gefährlich sein auf der Insel, habe ich mir sagen
      lassen. Kein Ort, um Geschäfte zu machen.” Die Exil-Maraskaner bilden in Al’Anfa
      eine verschlossene Gemeinschaft und schüren so Misstrauen und Argwohn, zumal
      in der Stadt die wildesten Geschichten über die Insel und ihre seltsamen Bewohner
