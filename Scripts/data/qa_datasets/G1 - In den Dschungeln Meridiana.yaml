  G1-425:
  - question: Welche Produkte werden hauptsächlich auf Cháset produziert?
    answer: Cháset bringt vor allem Rauschkräuter, Gewürze, Holz, Tabak und Tee hervor.
    context: Cháset bringt vor allem Rauschkräuter, Gewürze, Holz, Tabak und Tee hervor.
  - question: Was ist der Grund für die Auseinandersetzungen in den Pehukem-Sümpfen?
    answer: Die hier lebenden Stämme Chi’Rtsa und Zzszz befinden sich seit langer
      Zeit in einem regelrechten Krieg und setzen hierbei am liebsten Warmblüter gegen
      ihre Feinde ein.
    context: Die im Westen gelegenen Pehukem-Sümpfe dagegen sind Achaz-Land. Die hier
