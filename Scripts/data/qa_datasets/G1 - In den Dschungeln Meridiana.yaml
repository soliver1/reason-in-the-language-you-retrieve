  G1-224:
  - question: Aus welchem Material besteht die Falle, mit der der Attentäter sein
      Opfer tötet?
    answer: Eine abgeschälte, speziell präparierte und eingeritzte Mirhamer Seidenliane.
    context: Der Attentäter lässt nachts über dem Bett des Opfers eine abgeschälte,
      speziell präparierte und eingeritzte Mirhamer Seidenliane herabhängen – aus
      einer Dachluke, einem früher gebohrten Loch, oder – mittels einer Angel – seitlich
      von einem Fenster.
  - question: Warum bemerkt das Opfer die Falle des Attentäters nicht sofort?
    answer: Das Kukris muss in den Körperkreislauf des Opfers eindringen.
    context: Kukris wirkt erst, wenn es in den Körperkreislauf eindringt. Da das Opfer
      keine Verwundung spürt, schläft es meist trotz der ersten Juckanfälle weiter
      und erwacht erst, wenn die tödlichen Gliederkrämpfe einsetzen.
  - question: Wie gelangt das Gift Kukris in den Körper des Opfers?
    answer: Das Kukris tropft in Mund, Nase oder Ohr des Opfers.
    context: Der Attentäter lässt nachts über dem Bett des Opfers eine abgeschälte,
      speziell präparierte und eingeritzte Mirhamer Seidenliane herabhängen – aus
      einer Dachluke, einem früher gebohrten Loch, oder – mittels einer Angel – seitlich
      von einem Fenster. Das Kukris, das aus dem feinen Faden hervortritt, rinnt daran
      herab und tropft in Mund, Nase oder Ohr des Opfers.
  G1-225:
  - question: Welche geografische Grenze beansprucht das alanfanische Imperium und
      welche Gebiete fallen darunter?
    answer: Die Grenzen des alanfanischen Imperiums sind durch die Kaiser-Debrek-Linie
      festgelegt, welche dem Lauf des Chabab und Arrati folgt. Das Imperium beansprucht
      alle Gebiete und Gewässer südlich dieser Linie.
    context: Als ‘Erbe’ des alten Vizekönigreichs Meridiana beansprucht der Stadtstaat
      auch dessen Grenzen – zu Lande wie zur See. Da diese lediglich durch die so
      genannte Kaiser-Debrek-Linie festgelegt waren, die etwa dem Lauf des Chabab
      und des Arrati folgt, würde das bedeuten, dass alle Gebiete und Gewässer südlich
      dieser Linie dem alanfanischen Imperium unterstehen – ein Anspruch, den die
      übrigen Mächte des Südens kaum akzeptieren können.
  - question: Wie verhält sich Al’Anfa zum Seehandel in der Charyptik und wie wird
      dies durchgesetzt?
    answer: Obwohl der Seehandel in der Charyptik floriert, betrachtet Al’Anfa alle
      Handelsfahrten in diesem Gebiet als illegale Schmuggelunternehmungen. Der Zoll
      wird eingefordert, sofern der Kapitän nicht bereit ist, ihn zu bezahlen.
    context: Trotzdem sieht man konsequenterweise alle Handelsfahrten in diesem Gebiet
      als illegale Schmuggelunternehmungen an. Diese werden aufgebracht, sofern der
      Kapitän nicht bereit ist, den geforderten Zoll zu bezahlen, der natürlich an
      Ort und Stelle eingefordert wird.
  - question: Welche Ereignisse führten zum Konflikt zwischen Al'Anfa und dem Horasreich?
    answer: Al'Anfa geriet zunehmend in Konflikt mit dem Horasreich aufgrund der Horasproklamation
      zu Vinsalt, der Expansion horasischer Interessen nach Süden und der Ausrufung
      Amenes zur Königin des Südmeers. Die Spannungen führten schließlich zu einer
      offiziellen Kriegserklärung.
    context: Seit der Horasproklamation zu Vinsalt, der Expansion horasischer Interessen
      nach Süden und nicht zuletzt der Ausrufung Amenes zur Königin des Südmeers geriet
      Al’Anfa zunehmend in Konflikt mit dem Horasreich. Dieser Auseinandersetzung
      ist inzwischen eine offizielle Kriegserklärung gefolgt.
  G1-226:
  - question: Wie sind die Siedlungen auf den Waldinseln des alanfanischen Imperiums
      charakterisiert?
    answer: Die einzige nennenswerte Ortschaft auf den Waldinseln sind befestigte
      Handelsposten.
    context: Die einzigen nennenswerten Ortschaften sind Mirham und Port Corrad, während
      man auf den Waldinseln vor allem befestigte Handelsposten angelegt hat, die
      jeweils einem Präfekten unterstehen.
  - question: Welche strategische Bedeutung hat Port Corrad für das alanfanische Imperium?
    answer: 'Port Corrad schützt die Handelswege und die südlicher gelegenen Gebiete
      des Imperiums gegen Einfälle der Beni Arrat. '
    context: Port Corrad ist aufgrund seiner strategisch wichtigen Lage von großer
      Bedeutung und schützt zugleich die Handelswege als auch die südlicher gelegenen
      Gebiete des Imperiums gegen Einfälle der Beni Arrat.
  - question: Wie verhält sich das alanfanische Imperium gegenüber dem Sultan der
      Beni Szelemjati bezüglich seiner Ansprüche auf Selem?
    answer: Al'Anfas unterstützt den Großkönig von Selem gegen den novadischen Sultan
      der Beni Szelemjati, der sich ebenfalls als Herr von Selem bezeichnen lässt.
    context: 'Auch Selem gilt nominell als alanfanisches Besitztum, allerdings beschränkt
      man sich auf die Unterstützung des Großkönigs von Selem gegen den novadischen
      Sultan der Beni Szelemjati, der sich ebenfalls als Herr von Selem bezeichnen
      lässt. '
  G1-227:
  - question: Wie ist die aktuelle politische Situation im Königreich Meridiana?
    answer: Der König von Meridiana ist zwar formell noch Herrscher, aber seine Macht
      ist stark eingeschränkt. Tatsächlich werden wichtige außenpolitische Entscheidungen
      oft direkt vom Rat der Zwölf oder dem Patriarchen des alanfanischen Imperiums
      getroffen.
    context: Während es dem König nach wie vor obliegt, Gesetze des Hohen Rates im
      Namen des Königreiches Meridiana abzusegnen und zu repräsentieren, wird seine
      Unterschrift und offizielle Billigung bei dringenden außenpolitischen Fragen
      längst nicht mehr eingeholt. So kommt es, dass in manchen Städten sowohl dauerhafte
      Vertreter des Königs von Meridiana als auch zwischenzeitlich Botschafter des
      alanfanischen Imperiums auftreten, die direkt vom Rat der Zwölf oder gar vom
      Patriarchen entsandt worden sind.
  - question: Wie sieht die politische Präsenz des alanfanischen Imperiums im Horas-
      und Mittelreich aus?
    answer: In Horas und Mittelreich werden ausschließlich Gesandte Al’Anfas eingesetzt.
      Mirham wird dabei ignoriert, was zeigt, dass das alanfanische Imperium die Macht
      in diesen Gebieten faktisch übernommen hat.
    context: Im Horas- und Mittelreich findet man sogar ausschließlich Gesandte Al’Anfas,
      wobei Mirham kurzerhand ignoriert wird.
  - question: Warum wehren sich die traditionsverbundenen Granden gegen eine Abschaffung
      des Mirhamer Königtums?
    answer: Die traditionsverbundenen Granden lehnen eine Abschaffung des Mirhamer
      Königtums ab, weil sie sich durch die Verbindung zu diesem alten Vizekönigreich
      selbst geadelt fühlen.
    context: Dieser Forderung wollten die traditionsverbundenen Granden bislang nicht
      nachkommen, fühlt man sich durch die Verbindung zu dem alten Vizekönigreich
      doch selbst geadelt.
  G1-228:
  - question: Welche Art von Personen leiten die Handelsposten auf den Waldinseln?
    answer: Die Handelsposten auf den Waldinseln werden von abgesetzten Granden oder
      reichen Fanas geleitet, die zu Präfekten ernannt wurden.
    context: 'Die Handelsposten auf den Waldinseln unterstehen abgeschobenen Granden
      oder reichen Fanas, die man für einige Zeit aus der Stadt entfernt sehen will
      und kurzerhand zu Präfekten ernannt hat. '
  - question: Welche Maßnahmen werden getroffen, um die Präfekten bei militärischen
      Konflikten zu unterstützen?
    answer: Im Falle einer militärischen Auseinandersetzung steht den Präfekten oft
      ein ehemaliger Offizier der Dukatengarde als Berater zur Seite, dem man einen
      Altersruhesitz versprochen hat.
    context: Für den Fall einer militärischen Auseinandersetzung – sei es, dass es
      Ärger mit dem horasischen Befehlshaber der benachbarten Insel gibt, seien es
      Überfälle feindlicher Piraten oder aufgebrachter Einheimischer – steht nicht
      selten ein ausgedienter Offizier der Dukatengarde als Berater zur Verfügung,
      dem man hier einen angemessenen Altersruhesitz versprochen hat.
  - question: Wie werden die Präfekten über politische Veränderungen auf dem Laufenden
      gehalten?
    answer: Präfekten werden durch regelmäßigen Kontakt mit Handelsschiffen über politische
      Entwicklungen sowohl in Al'Anfa als auch international informiert.
    context: Zu Al’Anfa selbst besteht dank der häufig verkehrenden Handelsschiffe
      regelmäßiger Kontakt, so dass ein Präfekt in aller Regel rechtzeitig unterrichtet
      ist, sollte sich das Blatt (außen- wie auch innenpolitisch) wenden.
  G1-229:
  - question: Welcher Staat ist der bedeutendste Verbündete Al’Anfas?
    answer: Mengbilla
    context: Bedeutendster Verbündeter ist Mengbilla, vor allem durch den Handel mit
      Seide und Sklaven, erst in zweiter Linie durch den Boron-Kult, aber auch durch
      die verwandten plutokratischen Machtstrukturen.
  - question: Nennen Sie zwei Gründe für die Spannungen zwischen Al'Anfa und Mengbilla.
    answer: Die Beuteteilung nach dem Khôm-Feldzug und die Distanzierungen der Mengbiller
      Boron-Geweihtenschaft vom alanfaner Muttertempel.
    context: 'Es gibt jedoch Reibungspunkte: So fühlen sich die Mengbillaner gerade
      angesichts ihrer eigenen schweren Verluste im Khôm-Feldzug immer noch durch
      die anschließende Beuteteilung, die mit der Übernahme Port Corrads durch alanfanische
      Truppen endete, übervorteilt. Auf der anderen Seite werden die mehrfach laut
      gewordenen Distanzierungen der Mengbiller Boron-Geweihtenschaft vom alanfaner
      Muttertempel in der Stadt des gekrönten Raben misstrauisch beäugt.'
  - question: Nennen Sie drei Staaten oder Bündnisse, mit denen Al'Anfa eher schlechte
      Beziehungen pflegt.
    answer: Das Kalifat, das Bornland und die Heptarchien
    context: Mit den meisten tulamidischen Stadtstaaten und Aranien bestehen dagegen
      fruchtbare Handelsbeziehungen. Aus derselben Zeit rühren auch die kühlen Beziehungen
      zum Bornland, das seine kolonialen Besitzungen damals wie heute erbittert verteidigt.
      So beschränkt man sich auf einen hemmungslosen, aber am Gewinn orientierten
      und nicht mit tieferer Leidenschaft geführten Kaperkrieg, der von beiden Seiten
      nur in der Blutigen See ausgesetzt wird. Die Heptarchien gelten ganz generell
      als rotes Tuch – kein politischer Gegner, sondern ein Feind, der mit allen Mitteln
      bekämpft werden muss.
  - question: Warum ist Al'Anfa mit Albernia in Konflikt geraten?
    answer: Das Kopfgeld von 50 Dublonen auf den im Khôm-Krieg erfolgreichen Leomar
      vom Berg – heute Reichsmarschall – wurde keineswegs aufgehoben, sondern kann
