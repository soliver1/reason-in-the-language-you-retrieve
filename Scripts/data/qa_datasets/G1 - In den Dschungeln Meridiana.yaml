  G1-120:
  - question: Wo befindet sich der bedeutendste Sklavenmarkt in Aventurien?
    answer: Al’Anfa
    context: Der bedeutendste Markt für Sklaven ist aber unbestreitbar Al’Anfa, wo
      die große viertägige Sklavenauktion und Warenschau ab dem zweiten Boronstag
      des Boron-Mondes Käufer und Waren aus ganz Aventurien zusammenbringt.
  - question: Nennen Sie zwei Beispiele für kleinere, unabhängige Sklavenhändler.
    answer: Donna Messalia di Aragoja aus Charypso und verschiedene Piratenkapitäne
    context: Die Grandenfamilien sind die bedeutendsten Händler, doch gibt es auch
      eine Vielzahl kleinerer und unabhängiger Händler, etwa Donna Messalia di Aragoja
      aus Charypso und verschiedene Piratenkapitäne.
  - question: Welchen Richtwert gibt es für den Preis eines Sklaven in Aventurien?
    answer: drei Jahren Lohn für einen Arbeiter, der dieselbe Arbeit tut
    context: 'Der Preis eines Sklaven entspricht als Richtwert drei Jahren Lohn für
      einen Arbeiter, der dieselbe Arbeit tut:'
  G1-121:
  - question: Wie werden verschiedene Arten von Sklaven gekennzeichnet und welche
      Körperregionen werden dafür bevorzugt?
    answer: Minen-, Plantagen- und Rudersklaven werden mit dem Zeichen ihrer Besitzer
      an einer Stelle gebrandmarkt, die sich nicht ohne weiteres verbergen lässt,
      etwa auf der Stirn, den Händen oder Oberarmen. Kostbaren oder wohlgestalteten
      Sklaven bleibt das erspart – sie werden mit einer Luloa-Bemalung versehen, die
      sich lange hält und außerdem dekorativ ist.
