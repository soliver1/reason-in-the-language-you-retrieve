  G1-030:
  - question: Welche Tiere, außer den großen Vierbeinern, werden im Text als Bewohner
      des Dschungels genannt?
    answer: Wolfsratten, wilde Selemferkel, Ameisenbären, Gürteltiere, Riesenschildkröten,
      (selten) wilde Ongalobullen, der Tachik oder ‘Baumstinker’, Faultiere (auch
      Riesenfaultiere) oder allerlei Echsen.
    context: 'Große Vierbeiner gibt es nur wenige, wie etwa Wolfsratten, die den Dschungelstämmen
      als Delikatesse gelten. Andere sind: wilde Selemferkel, Ameisenbären, Gürteltiere,
      Riesenschildkröten, (selten) wilde Ongalobullen, der Tachik oder ‘Baumstinker’
      (ein kleiner Verwandter des mittelaventurischen Stinktiers) sowie Faultiere
      (auch Riesenfaultiere) oder allerlei Echsen.'
  - question: Wie verhält sich der Waldelefant im Dschungel gegenüber den Waldmenschen
      und wie wird er von ihnen wahrgenommen?
    answer: 'Die Waldelefanten sind den Waldmenschen heilig, die sie als Inkarnation
      des Kamaluq betrachten. Der Waldelefant ist dafür berüchtigt, trotz seiner Größe
      schleichen und sich verstecken zu können: Lautlos erscheint sein massiger Leib
      zwischen den Bäumen und verschmilzt wieder mit dem Buschwerk.'
    context: 'Die zweieinhalb Schritt großen Waldelefanten sind den Waldmenschen heilig,
      die sie als Inkarnation des Kamaluq betrachten. Der Waldelefant ist dafür berüchtigt,
      trotz seiner Größe schleichen und sich verstecken zu können: Lautlos erscheint
      sein massiger Leib zwischen den Bäumen und verschmilzt wieder mit dem Buschwerk.'
  - question: Welche Raubtiere werden im Text genannt und welche Besonderheiten haben
      diese?
    answer: Der große Jaguar ist nicht zu Unrecht so etwas wie das Wappentier Südaventuriens
      und attackiert Boa und Alligator ebenso wie Menschen. Auch Dschungeltiger und
      Riesenkaiman (ein bis sechs Schritt langes Ungeheuer, das sich einem trinkenden
      Ongalo-Bullen unbemerkt bis auf zwei Spann nähern und ihn dann mit einem Ruck
      ins Wasser zerren kann) oder Sultansechse (auch Schlinger genannt, eine vier
      Schritt hohe Echse mit mannshohen Laufbeinen und einem zahnstarrenden Maul)
      finden sich im Regenwald.
    context: Raubtiere jedoch, unerbittliche Jäger mit messerscharfen Zähnen, gibt
      es hier zuhauf. Der große Jaguar ist nicht zu Unrecht so etwas wie das Wappentier
