      theologische Einwände. Die meisten Brabaker Boron-Gläubigen schätzen die ekstatischen,
      mit Rauschkrautgenuss verbundenen Teile des Kultes sehr hoch und verzichten
      seit dem Rituswechsel nur ungern darauf. Aus diesem Grund wird dieser Teil des
      alanfanischen Boron-Kultes auch weiterhin praktiziert.
  - question: Wer führt den Rahja-Tempel in Brabak?
    answer: Natalina du Berilis
    context: Unter der Führung von Natalina du Berilis ist der Tempel zum größten
      Bordell der Stadt verkommen, dessen Geweihte und Novizen nicht einmal die Verfeinerung
      mancher Kurtisanen haben.
  - question: Worauf stützt sich die Lehre der beiden Priester im Tempel von Licht
      und Dunkelheit?
    answer: Die beiden einzigen Priester predigen – inspiriert von Satinavs Weltenbuch,
      in dem die Tage (Gegenwart) und Nächte (Zukunft) verzeichnet sind – von Licht
      und Finsternis.
    context: Als Beispiel für die Tempel und Schreine der vielen, andernorts unbekannten,
      Kulte kann der kleine, von einem Garten seltsamer Kräuter umgebene Tempel von
      Licht und Dunkelheit (6) dienen. Die beiden einzigen Priester predigen – inspiriert
      von Satinavs Weltenbuch, in dem die Tage (Gegenwart) und Nächte (Zukunft) verzeichnet
      sind – von Licht und Finsternis. Diese würden als Prinzipien die Welt lenken
      und müssten daher gleichermaßen verehrt werden.
  G1-295:
  - question: Beschreibe den Königspalast von Brabak.
    answer: Der Königspalast wurde ursprünglich als Palast des kaiserlichen Gouverneurs
      erbaut und ist mit drei Stockwerken und insgesamt vierzig Räumen eher eine große
      Villa als ein königlicher Palast.
    context: Auf dem Hügel liegt der Königspalast (7) mit der weit über Brabak sichtbaren
      Harpyienflagge. Er wurde vor langer Zeit als Palast des kaiserlichen Gouverneurs
      – üppig und geschmacklos verziert – aus dem teuren, rosenfarbenen Marmor der
      Eternen errichtet. Spätere Anbauten und Verzierungen bestehen aus preiswerterem
      Material (seien es die unzähligen Wasserspeier aus glitzerndem Feuerstein oder
      die stumpf-gelben Balkone und Erker aus billigem Sandstein). Durch all diesen
      Zierrat übersieht man leicht, dass das Gebäude mit drei Stockwerken und insgesamt
      vierzig Räumen eher eine große Villa ist als ein königlicher Palast – manche
      reiche Familie verfügt über eine größere Residenz. Hier wimmelt es nur so von
      Dienstboten und Leibwachen, die für das Wohlergehen der königlichen Familie
      sorgen.
  - question: Wie stark ist die Flotte Brabaks?
    answer: 'Die Admiralität hat mit ihren zwölf Galeeren, zehn Seglern, einigen Ottas
      und zahlreichen kleinen Freibeuterschiffen genug Schiffe, um Feinde zur See
      an der Eroberung Brabaks zu hindern. '
    context: In der außen prachtvollen, innen aber heruntergekommenen Admiralität
      (8) wachen zahlreiche Verwandte des Königs darüber, dass Brabak von See her
      kein Leid droht. Mit ihren zwölf Galeeren, zehn Seglern, einigen Ottas und zahlreichen
      kleinen Freibeuterschiffen ist sie durchaus in der Lage, Feinde zur See an der
      Eroberung Brabaks zu hindern. Die Bildung der Goldenen Allianz machte diese
      Schiffe auch wieder für größere Fahrten frei.
  - question: Wer ist der Großadmiral der brabaker Flotte?
    answer: Großadmiral der Flotte ist Hjaldar Hammerfaust, ein ehemaliger Drachenkapitän,
      der einige Kaperfahrten gegen Al’Anfa und Mengbilla persönlich geführt hat.
    context: Großadmiral der Flotte ist Hjaldar Hammerfaust, ein ehemaliger Drachenkapitän,
      der einige Kaperfahrten gegen Al’Anfa und Mengbilla persönlich geführt hat.
  - question: Wer ist der Schatzmeister von Brabak und welche Pläne hat er?
    answer: Pellione de Sylphur, Mizirions Cousine, leitet die Königlich Brabaker
      Schatzkammer. Sie bedrängt ihren Vetter seit Jahren, die Gründung einer königlichen
      Handelsgesellschaft nach aranischem Vorbild bekannt zu geben.
    context: Auch die Königlich Brabaker Schatzkammer (10) besitzt eine eigene Villa
      direkt neben dem Palast und wird von Mizirions Cousine Pellione de Sylphur als
      Schatzmeisterin geleitet. Seit Jahren bedrängt Pellione ihren Vetter, die Gründung
      einer königlichen Handelsgesellschaft nach aranischem Vorbild (quasi eine private
      Unternehmung Mizirions) bekannt zu geben.
  G1-296:
  - question: Welche Art von Ort ist der Brabaker Markt?
    answer: Der Brabaker Markt ist eine breite Straße.
    context: Der Brabaker Markt (12) ist, anders als in vielen Städten, kein Platz,
      sondern eine breite Straße, die sich fast durch die ganze Stadt zieht.
  - question: Aus welchen Bestandteilen setzt sich der Schlamm auf dem Markt zusammen?
    answer: Der Schlamm besteht aus Dreck und Sumpfwasser, vermischt mit zertrampeltem
      Obst, Fischabfällen und Hühnereingeweiden.
    context: Bis zum Abend wird diese von vielen hundert Füßen und Karrenrädern in
      zähen Schlamm verwandelt, in dem sich Dreck und Sumpfwasser mit zertrampeltem
      Obst, Fischabfällen und Hühnereingeweiden mischen.
  - question: Warum findet in der Woche vor einem Festzug oder einer Parade keine
      Markt statt?
    answer: Ein Gesetz besagt, dass eine Woche vor Festzügen oder Ausritten des Königs
      kein Markt stattfinden darf.
    context: Da auf der langen Straße auch alle eventuellen Festzüge und Ausritte
      des Königs stattfinden, darf eine Woche davor kein Markt stattfinden – ein Gesetz,
      dass derlei Festivitäten bei den Kaufleuten unbeliebt gemacht hat.
  G1-297:
  - question: Welche Art von Gästen zieht die Taverne Kap Brabak an?
    answer: Die Taverne Kap Brabak von Fiorella Sandoz wird eher von Seefahrern höherer
      Ränge aufgesucht.
    context: In der Seefahrerschenke Roter Jaguar (26) (Q3/P4/S10) unter dem launischen
      Jesodoro Cornio muss man auf sein Geld achten, während die Taverne Kap Brabak
      (27) (Q6/P6/S8) von Fiorella Sandoz schon eher von Seefahrern höherer Ränge
      aufgesucht wird.
  - question: Wo können sich Gäste in Brabak besonders wohlfühlen?
    answer: 'Das Hotel Güldener Mysob der lieben Terza Imogena ist eine gute Empfehlung
      für Gäste, die es sich gut gehen lassen möchten. '
    context: Yaslinda Bonions Herberge Südkap (29) (Q5/P5/S10) ist dagegen immer eine
      Empfehlung wert, und wer es als Gast wirklich gut haben will, der sucht das
      Hotel Güldener Mysob (30) (Q7/P7/S20) der liebevollen Terza Imogena auf.
  - question: Welches Hotel in Brabak ist besonders luxuriös ausgestattet?
    answer: 'Das überteuerte Hotel Brabaker Admiral der hart kalkulierenden Saranya
      Merion hat eine marmornen Eingangshalle. '
    context: Das beste Haus am Platze ist aber das überteuerte, dafür mit einer marmornen
      Eingangshalle ausgestattete Hotel Brabaker Admiral (25) (Q8/P9/S26) der hart
      kalkulierenden Saranya Merion.
  G1-298:
  - question: Wo befindet sich die Magierakademie? Beschreibe das Gebäude.
    answer: Die Akademie befindet sich in einem riesigen Granitgebäude mit einer schweren,
      bronzenen Eingangstür.
    context: Hinter der imposanten schwarzen Fassade des riesigen Granitklotzes der
      Dunklen Halle der Geister (13) verbirgt sich eine der berüchtigtsten Magierakademien
      des Kontinents. Der einzige Zugang liegt hinter einer schweren, bronzenen, mit
      Dämonenfratzen verzierten Eingangstür.
  - question: Welche berühmten Zauberer und Studiosi sind mit der Akademie verbunden?
    answer: Die Akademie ist bekannt für ihre berüchtigten Zauberer und Studiosi,
      wie Korobar, Saya di Zeforika oder Sulman al’Venish, die im Borbarad-Krieg berühmt
      wurden.
    context: Und tatsächlich ist man hier auf Kapazitäten wie Magister Magnus Pôlberra
      ebenso stolz wie auf seine Studiosi, die gerade im Borbarad-Krieg unter Namen
      wie Korobar, Saya di Zeforika oder Sulman al’Venish berühmt-berüchtigt wurden.
  - question: Wo befindet sich das Haupthaus der Werkstätten des Roten Salamanders?
      Nenne auch weitere Standorte.
    answer: Die Werkstätten des Roten Salamanders haben ihr Haupthaus in Brabak, neben
      Niederlassungen in Fasar, Festum und Andergast.
    context: Die Werkstätten des Roten Salamanders (14) haben neben Niederlassungen
      in Fasar, Festum und Andergast hier ihr Haupthaus, in dem Alchimisten unter
      Vorsteherin Hitta von Ilmenstein (einer Enkelin der Magisterin der Magister
      Haldana) gemeinsam forschen.
  - question: Nenne einen bekannten Philosophen aus Brabak und eine seiner Theorien.
    answer: Toton Mironimus ist ein berühmter Philosoph, der in Brabak lebt und die
      Ikosaederform Deres postuliert.
    context: Hier leben auch einige der berühmten Brabaker Philosophen, wie zum Beispiel
      der über die Stadtgrenzen hinaus berühmte Toton Mironimus, der kühn die Ikosaederform
      Deres postuliert oder die Notwendigkeit des Redens mit der des Atmens vergleicht.
  - question: Welche Art von Personal sucht die Akademie? Wofür?
    answer: Die Akademie sucht nach fähigem Soldvolk, um die Magister und Adepten
      in das Umland zu begleiten.
    context: Auch sucht man noch händeringend nach fähigem Soldvolk, das die Magister
      und Adepten in das Umland begleitet.
  G1-299:
  - question: Welche Art von Veranstaltungen finden regelmäßig in der Brabaker Arena
      statt?
    answer: Die Brabaker Arena ist ein Freilufttheater, in dem regelmäßig unblutige
      Gladiatorenkämpfe stattfinden.
    context: 'Der irreführende Name der Brabaker Arena (15) bezeichnet ein Freilufttheater,
      in dem auf kleiner Fläche regelmäßig – unblutige – Gladiatorenkämpfe stattfinden. '
  - question: Welche Gerüchte kursieren über die Residenz der Charazzar?
    answer: Die Residenz der Charazzar ist auffallend klein, manche munkeln von Katakomben
      und Labyrinthen im Sumpfboden, andere von magischen Räumen oder davon dass sich
      die Charazzar in H’Rabaal am wohlsten fühlen.
    context: Die Residenz der Charazzar (16) ist auffallend klein, so dass manche
      von Katakomben und Labyrinthen munkeln, die sich meilenweit im Sumpfboden (!)
      erstrecken sollen. Andere faseln von magischen Räumen in fernen Welten, während
      Dritte darauf hinweisen, dass sich die Charazzar wohl im heimatlichen H’Rabaal
      am wohlsten fühlen.
  - question: Wann nutzen die Bewohner der Villa Hammerfaust diese als Residenz?
    answer: Die Villa Hammerfaust dient der Familie nur dann als Residenz, wenn wichtige
      Ereignisse ihre Anwesenheit in der Hauptstadt erfordern. Sonst sind meist nur
      einige jüngere Familienmitglieder dort, von denen eines als Statthalter fungiert.
    context: Die Villa Hammerfaust (17) dient der Familie immer dann als Residenz,
      wenn wichtige Ereignisse ihre Anwesenheit in der Hauptstadt erfordern. Sonst
      sind hier meist nur einige jüngere Familienmitglieder zu finden, von denen eines
      als der örtliche Statthalter fungiert.
  - question: Beschreibe die Größe und das Aussehen der Casa Bocadilio.
    answer: Die Casa Bocadilio ist dreistöckig, schneeweiß und übertrifft in ihrer
      Größe sogar den Palast des Königs. Sie hat 90 Zimmer.
    context: Die dreistöckige, schneeweiße Casa Bocadilio (18) übertrifft in ihrer
      Größe sogar den Palast des Königs. Die Bocadilios können es sich leisten, mit
      ihrer neunzig Zimmer umfassenden Residenz die Fläche zu bebauen, auf der ansonsten
      Hunderte von ärmlichen Hütten Platz fänden – und vor Erbauung des Palastes auch
      fanden.
  G1-300:
  - question: Welche Art von Beziehung besteht zwischen dem Dorf Lrr'Zzkrot und dem
      König?
    answer: Die Achaz von Lrr'Zzkrot sind tributpflichtig dem König und werden in
      Angelegenheiten der Achaz aus den Mysobsümpfen angehört.
    context: Obwohl sie sich selbst verwalten, sind sie dem König tributpflichtig
      und werden dafür von ihm in Angelegenheiten der Achaz aus den Mysobsümpfen angehört.
  - question: Was ist der Grund für den Unfrieden zwischen den Achaz von Lrr’Zzkrot
      und anderen Gruppen?
    answer: 'Die Achaz von Lrr’Zzkrot gehören zu den wenigen Stämmen, die den Charazzar
      ablehnen. '
    context: Dies bildet eine Quelle des Unfriedens, da ihr Stamm zu den wenigen gehört,
      die den Charazzar ablehnend gegenüberstehen.
  - question: Was weiß man über die Rückkehr des geistigen Führers der Achaz von Lrr’Zzkrot?
    answer: Der geistige Führer der Achaz von Lrr’Zzkrot, ein stummer Zilit, kehrte
      nach zehnjähriger Klausur in den umliegenden Sümpfen in das Dorf zurück.
    context: Gesichert scheint nur zu sein, dass ihr geistiger Führer, ein stummer
      Zilit, nach zehnjähriger Klausur in den umliegenden Sümpfen in das Dorf zurückgekehrt
      ist.
  G1-301:
  - question: Welche Abenteuermöglichkeiten bietet Brabak abseits von Intrigen und
      Konflikten in der Stadt?
    answer: Brabak bietet neben Intrigen und Konflikten auch Abenteuer im unwirtlichen
      Hinterland mit mysteriösen Achaz, rituellen Bräuchen der Waldmenschen, gefährlichem
      Dschungel, undurchdringlichen Sümpfen und düsteren Geheimnissen vergangener
      Zeiten.
    context: 'Brabak stellt eine Zusammenfassung ganz Südaventuriens dar: Insbesondere
      die Stadt sprudelt über vor Intrigen, offenen und verborgenen Konflikten, Dekadenz
      und Lasterhaftigkeit. Aber auch das unwirtliche Hinterland ist Szenario für
      Begegnungen mit mysteriösen Achaz, rituellen Bräuchen der Waldmenschen, gefährlichem
      Dschungel, undurchdringlichen Sümpfen und düsteren Geheimnissen vergangener
      Zeiten.'
  - question: Kann man in Brabak als Abenteurer ohne Bezug zu den zwölf Göttern spielen?
    answer: Ja, Brabaks Freibeutertum und Weltoffenheit lassen Abenteurer ohne zwölfgöttlichen
      Hintergrund problemlos agieren, bieten aber genauso Abenteuerstoff und Konfliktpotential
      für tugendhafte Praios-, Rondra- oder Hesinde-Diener.
    context: Hinzu kommen Freibeutertum, stürmische Kapumseglung oder Aufbruch einer
      Expedition zu fernen Meeren. Insbesondere aber das Freidenkertum und die Weltoffenheit
      Brabaks lassen Abenteurer von eher zwielichtiger Gesinnung oder Helden ohne
      zwölfgöttlichen Hintergrund problemlos agieren, bieten aber genauso Abenteuerstoff
      und Konfliktpotential für tugendhafte Praios-, Rondra- oder Hesinde-Diener.
  - question: Welche Rolle spielt Brabak in Bezug auf das Spielsystem Al'Anfa?
    answer: Brabak kann als Übungsparcours für Al'Anfa eingesetzt werden.
    context: Gewissermaßen kann Brabak also als Übungsparcours für Al’Anfa eingesetzt
      werden.
  G1-302:
  - question: Welche ethnischen Gruppen leben im Káhet Ni Kemi und in welchen Prozentsätzen?
    answer: 70 % Kemi, 15 % Waldmenschen, 10 % Nordländer und 5 % Achaz.
    context: 'Geschätzte Bevölkerungszahl: 27.500, davon 70 % Kemi (eine Variante
      des südaventurischen Völkergemischs; Kemi haben im allgemeinen eine hellere,
      bronzefarbene Haut, jedoch ebenfalls nur spärlichen Bartwuchs und pechschwarzes
      Haar), 15 % Waldmenschen, 10 % Nordländer, 5 % Achaz; dazu kommen vermutlich
      noch einige Tausend tief in den Wäldern versteckt lebende Waldmenschen.'
  - question: Welche Religionen sind im Káhet Ni Kemi verbreitet?
    answer: Boron (75 %), Rastullah (10 %) und Schamanismus bei Waldmenschen und Achaz.
    context: 'Vorherrschende Religion: Boron (75 %), Rastullah (10 %), Schamanismus
      bei Waldmenschen und Achaz'
  - question: Welche Personen gelten im Káhet Ni Kemi als lokale Helden, Heilige oder
      mysteriöse Gestalten?
    answer: Kacha, Laguan und Peri II. (Boron-Heilige) sowie Peri III. (vormalige
      Nisut).
    context: 'Lokale Helden / Heilige / mysteriöse Gestalten: Kacha, Laguan und Peri
      II. (Boron-Heilige), Peri III. (vormalige Nisut)'
  G1-303:
  - question: Wie beeinflussten die Echsenwesen die Kultur der Kemi?
    answer: Die Kemi entwickelten eine Hochkultur, die vom Baustil bis zur Glyphenschrift
      deutliche echsische Wurzeln aufweist.
    context: Während die damals dominierenden Echsenwesen die Kemi, ein frühes Menschenvolk
      unbekannter Herkunft, als Hilfsvolk zur Niederwerfung der Waldmenschenstämme
      schätzten, übernahmen diese zahlreiche Errungenschaften der Echsen. Sie entwickelten
      so eine Hochkultur, die vom Baustil bis zur Glyphenschrift deutliche echsische
      Wurzeln aufweist.
  - question: Was führte zum Niedergang des Alten Kemi-Reiches?
    answer: Der Krieg der Drachen Pyrdacor und Famerlor veränderte auf immer das Antlitz
      der Welt. Ein langer Bürgerkrieg und die Rache der Waldmenschen dezimierten
      daraufhin die Kemi.
    context: Doch die Blüte des Alten Reichs verging, der Krieg der Drachen Pyrdacor
      und Famerlor veränderte auf immer das Antlitz der Welt. Ein langer Bürgerkrieg
      und die Rache der Waldmenschen dezimierten daraufhin die Kemi.
  - question: Wer beendete die ‘dunklen Zeiten’ und wie?
    answer: Monthu I., der erste Rabenpriester, kam auf den Kemi-Thron und löste die
      ‘dunklen Zeiten’ ab. Er verfügte, dass fortan geistliche und weltliche Macht
      in einer Hand vereinigt sein müssen.
    context: Schließlich jedoch kam mit Monthu I. der erste Rabenpriester auf den
      Kemi-Thron und die ‘dunklen Zeiten’ wurden abgelöst durch den Aufschwung des
      Mittleren Reiches. Zwar verfügte Monthu, dass fortan geistliche und weltliche
      Macht in einer Hand vereinigt sein müssen, doch schließlich verfiel auch das
      Mittlere Reich in Dekadenz und verging vor etwa 2.000 Jahren unter dem Ansturm
      verfeindeter Eingeborener.
  - question: Was geschah mit dem Kemi-Reich nach Hela-Horas Tod?
    answer: Nach Hela-Horas’ Tod folgten den altreichischen die garethischen Dynastien,
      die das Land ausbeuteten und zerstückelten. Doch die Sehnsucht der Kemi nach
      Eigenständigkeit war auch durch die jahrtausendealte Fremdherrschaft ungebrochen.
    context: Nach Hela-Horas’ Tod folgten den altreichischen die garethischen Dynastien,
      die das Land ausbeuteten und zerstückelten. Doch die Sehnsucht der Kemi nach
      Eigenständigkeit war auch durch die jahrtausendealte Fremdherrschaft ungebrochen.
  - question: Was führte zum Wendepunkt im Kampf gegen die Besatzer?
    answer: Erst mit der Flucht Königin Peris aus der Gefangenschaft und dem Tod Tar
      Honaks gewann der Widerstand in gleichem Maße an Kraft, wie die fremde Besatzung
      an Moral und Stärke einbüßte.
    context: Einzig auf den Inselkolonien Aeltikan, Javalasi, Mikkan, Anteorra und
      Cháset erhielt sich noch ein freies Kemi-Reich. Erst mit der Flucht Königin
      Peris aus der Gefangenschaft und dem Tod Tar Honaks gewann der Widerstand in
      gleichem Maße an Kraft, wie die fremde Besatzung an Moral und Stärke einbüßte.
  G1-304:
  - question: Wann und wie endete das erste Kemi-Reich?
    answer: Das Kemi-Reich wurde ca. 960 v.BF durch feindliche Stämme vernichtet.
    context: 'ca. 960 v.BF: Vernichtung des Kemi-Reichs durch feindliche Stämme'
  - question: Welche politischen Veränderungen erfuhr Kemi nach seiner Rückeroberung
      durch Bosparan?
    answer: Nach der Rückeroberung durch Bosparan im Jahr 72 v.BF wurde Kemi zunächst
      ein Gouvernement unter dem Namen Trahelien, später eine Kolonie des Neuen Reiches.
    context: "72 v.BF: Rückeroberung Kemis durch Bosparan\n23 BF: Kemi als Gouvernement
      Trahelien Kolonie des Neuen Reiches"
  - question: Welche Ehre wurde Peri III. im Jahr 1012 BF zuteil?
    answer: Peri III. wurde 1012 BF horasische Baronin von Benbukkula.
    context: '1012 BF: Allianz mit dem Horasreich, Peri III. wird horasische Baronin
      von Benbukkula'
  G1-305:
  - question: Beschreiben Sie die geographische Verteilung des Regenwaldes im Reich
      der Königin Ela XV.
    answer: Das Reich der Königin Ela XV. umfasst zum größten Teil immergrünen, feuchten
      Regenwald, der sich im Westen vom brabakischen Vinay über das Jalobgebiet und
      die Halbinsel von Hôt-Alem bis zur östlichen Provinz Yleha (Syllina) erstreckt.
      An der südwestlichen Küste geht der Wald in undurchdringlichen Mangrovendschungel
      über, während der gesamte Osten Kemis aufgrund seines Wasserreichtums sehr sumpfig
      ist.
    context: Das Reich der Königin Ela XV. umfasst zum größten Teil immergrünen, feuchten
      Regenwald, der sich im Westen vom brabakischen Vinay über das Jalobgebiet und
      die Halbinsel von Hôt-Alem bis zur östlichen Provinz Yleha (Syllina) erstreckt.
