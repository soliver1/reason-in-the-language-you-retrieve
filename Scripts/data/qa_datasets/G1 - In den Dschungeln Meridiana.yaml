  G1-253:
  - question: Welche Merkmale des Aussehens sind bei den Bewohnern der südlichen Städte
      vorherrschend?
    answer: Dunkle, bis ins Blauschwarz gehende Haare sind vorherrschend, ebenso wie
      eine bronzene Hautfarbe.
    context: Nahezu alle Städte des Südens haben über viele Jahrhunderte hinweg einen
      stetigen Zustrom aus den verschiedensten Kulturen erlebt, so dass man heute
      kaum von einer gemeinsamen Herkunft ihrer Bewohner oder einem gemeinsamen Äußeren
      sprechen kann. Dunkle, bis ins Blauschwarz gehende Haare sind jedoch vorherrschend,
      ebenso wie eine bronzene Hautfarbe, die an die der Tulamiden erinnert.
  - question: Beschreiben Sie die unterschiedlichen Stimmungen, die in den südlichen
      Kolonien herrschen.
    answer: Die Stimmung ist von den Interessen des jeweiligen Mutterlandes geprägt.
      In Handelsstützpunkten herrscht emsige Geschäftigkeit, während auf Befestigungen
      ein harscher Befehlston anzutreffen ist. Siedler selbst sind hoffnungsvoll,
      aber angesichts der Gefahren schnell verzweifelt. Adel versucht höfisches Leben
      in Gouverneursvillen zu etablieren. Sträflinge hingegen sind dumpf verdrossen.
    context: Die Stimmung in den südlichen Kolonien ist von den Interessen des jeweiligen
      Mutterlandes geprägt. Während in den Handelsstützpunkten emsige Geschäftigkeit
      herrscht und kaum jemand, der es sich leisten kann, länger als einen Mond vor
      Ort weilt, schlägt man auf den Befestigungen, die die Kolonien sichern, einen
      harschen Befehlston an. Unter den Siedlern selbst, die oft alles hinter sich
      gelassen haben, um ein neues Leben zu beginnen, herrscht hoffnungsvolle Aufbruchsstimmung
      – die angesichts der allgegenwärtigen tödlichen Gefahren rasch in Verzweiflung
      umschlagen kann. Der meist strafversetzte Adel bemüht sich verzweifelt, einen
      Hauch höfischen Lebens in die Gouverneursvillen zu bringen. Dumpfe Verdrossenheit
      beherrscht hingegen jene, die nicht freiwillig an das Ende der bekannten Welt
      gekommen sind, sondern als Sträflinge hierher deportiert wurden, um in der Fremde
      den Reichtum der Heimat zu mehren.
  - question: Wie definieren sich die Bewohner der unabhängigen Städte des Südens
      und was vereint sie?
    answer: ' Stolz und trotziges Bewusstsein der eigenen Freiheit bestimmen das Selbstverständnis.
      Unabhängig davon ob reicher Händler, Freibeuter oder Tagelöhner. Keiner wäre
      bereit, die eigene Stadt unter fremde Herrschaft zu stellen.'
    context: 'Anders ist es in den unabhängigen Städten des Südens. Stolz und trotziges
      Bewusstsein der eigenen Freiheit bestimmen das Selbstverständnis – egal, ob
      reicher Händler, Freibeuter oder Tagelöhner. Denn in einem ist man sich einig:
      Um nichts in der Welt wäre man bereit, die eigene Stadt unter die Herrschaft
      einer fremden Macht zu stellen – sei es nun Al’Anfa, Vinsalt oder Gareth.'
  G1-254:
  - question: Was sind die Gründe dafür, dass Adlige aus dem Norden in den Kolonien
      siedeln?
    answer: Der Hauptgrund für Adlige aus dem Norden ist entweder ein Amt (Gesandter,
      Marinekommandant, Gouverneur), oder sie möchten ihrer Vergangenheit im Heimatland
      entkommen, sei es wegen Fehden, Strafverfolgung oder Verarmung.
    context: Adlige aus den nördlichen Reichen, die in den Kolonien siedeln, haben
      entweder ein ehrenvolles Amt (wie das eines Gesandten, Marinekommandanten oder
      Gouverneurs) oder aber einen guten Grund, das Heimatland zu meiden – meist Fehde,
      Strafverfolgung oder Verarmung. So oder so ist eines ihrer Hauptziele, zu vergessen,
      wo sie gerade sind.
  - question: Wie ist die Rolle des Adels in den meisten unabhängigen Städten des
      Südens?
    answer: In den meisten unabhängigen Städten des Südens spielt der Adel keine große
      Rolle. Die Macht liegt oft bei einer reichen Oberschicht, während Adelshäuser
      versuchen, alten Glanz wiederzuerlangen.
    context: Außerhalb der Kolonien spielt der alte Adel in den meisten unabhängigen
      Städten des Südens keine große Rolle. In vielen Städten liegt die eigentliche
      Macht in den Händen einer reichen Oberschicht. Die mancherorts nominell herrschenden
      Adelshäuser (die sich meist auf die Zeit vor der Lossagung vom ursprünglichen
      Mutterland zurückführen) bemühen sich hingegen, alten Glanz und vergangene Größe
      zur Schau zu tragen.
  - question: Welche Gruppen gehören zur Oberschicht im Süden?
    answer: Die Oberschicht im Süden besteht aus Reeder, Handelsherren, Großgrundbesitzern,
      Viehzüchtern, Offizieren, Freibeutern, Gelehrten und Geweihten. Die Macht liegt
      meist bei ihnen.
    context: Die Oberschicht bilden im Süden vor allem Reeder, Handelsherren, Großgrundbesitzer,
      Viehzüchter, Offiziere, Freibeuter, Gelehrte und Geweihte. Die eigentliche Macht
      liegt meist bei ihnen.
  - question: Wie setzt sich die Unterschicht in den Kolonien zusammen?
    answer: In den Kolonien setzt sich die Unterschicht hauptsächlich aus Menschen
      zusammen, die in ihrem Heimatland unerwünscht sind und oft schwere Verbrechen
      begangen haben.
    context: In den Kolonien hingegen setzt sich die Unterschicht vor allem aus jenem
      ‘Gelichter’ zusammen, das im Heimatland unerwünscht ist – und der Grad der Verfehlung
      kann von Tagedieberei bis zu schwerwiegenden Verbrechen reichen.
  - question: Warum strömen viele Menschen aus den nördlichen Reichen in den Süden?
    answer: Viele Menschen aus den nördlichen Reichen kommen in den Süden, weil sie
      dort Freiheit und die Möglichkeit sehen, ihr Leben selbst in die Hand zu nehmen.
    context: Ehrgeiz und die Hoffnung auf ein neues Leben bewegen auch viele Angehörige
      der Unterschicht noch bei ihrer Ankunft. Getrieben von Hunger und Not strömen
      verzweifelte Einwanderer aus den nördlichen Reichen in die Städte des Südens,
      oft mit nicht mehr als einem Bündel Habseligkeiten auf dem Rücken – und ihrer
      Freiheit. Denn diese Freiheit, die ihnen in vielen nördlichen Gesellschaften
      vorenthalten bleibt, ist es, die geflohenen Leibeigenen wie eine glückliche
      Verheißung erscheinen mag.
  - question: Was passiert mit den meisten Angehörigen der Unterschicht im Süden?
    answer: Die meisten Angehörigen der Unterschicht müssen sich früher oder später
      in Schuldknechtschaft verkaufen, um nicht zu verhungern und enden oft als Fronarbeiter.
    context: 'So fristen sie als Fronarbeiter der Reichen, selten auch der Obrigkeit,
      ein bedauernswertes Dasein. '
  - question: Warum sind in einigen Städten eingeborene Sklaven ungebräuchlich?
    answer: In einigen Städten sind Sklaven ungebräuchlich, weil das Mutterland die
      Sklaverei verboten hat oder frühere Angriffe von Waldmenschenstämmen die Sklaverei
      als 'unklug' erscheinen lassen.
    context: 'Aber selbst dort haben sich die Gouverneure und Magnaten angewöhnt,
      die Kriegsgefangenen anderer Stämme von den Häuptlingen der Umgebung zu erwerben. '
  - question: Welche Gruppen gehören zu den Sklaven im Süden?
    answer: Sklaven im Süden sind fast ausschließlich Eingeborene, Mischlinge, Kriegsgefangene
      oder Nachfahren von Sklaven.
    context: In den Kolonien hingegen setzt sich die Unterschicht vor allem aus jenem
      ‘Gelichter’ zusammen, das im Heimatland unerwünscht ist – und der Grad der Verfehlung
      kann von Tagedieberei bis zu schwerwiegenden Verbrechen reichen. Auf der untersten
      Sprosse der Leiter stehen die Sklaven – fast ausschließlich Eingeborene, Mischlinge,
      Kriegsgefangene, hauptsächlich jedoch Nachfahren von Sklaven.
  G1-255:
  - question: Beschreibe den typischen Tagesablauf der vornehmen Gesellschaft am Morgen
      und Vormittag.
    answer: Der Tag beginnt mit einem kleinen Frühstück im Bett. Gegen Mittag trifft
      man sich zu einem zweiten Frühstück mit bis zu sechs Gängen in den Salons der
      Familien.
    context: Der Tag der vornehmen Gesellschaft beginnt in den Kolonien wie in den
      freien Städten mit einem kleinen Frühstück, das im Bett eingenommen wird. Üblicherweise
      trifft man sich dann gegen Mittag im Salon einer der übrigen Familien zu einem
      zweiten Frühstück. Diese von Maraskolinenklängen untermalte Mahlzeit kann aus
      fünf bis sechs Gängen bestehen.
  - question: Wie unterscheiden sich die Hygienepraktiken der verschiedenen sozialen
      Schichten?
    answer: Die Reichen baden morgens, reiben sich mit parfümiertem Kokosöl ein und
      tragen weit ausgeschnittene oder ärmellose Kleidung. Die Mittelschicht badet
      seltener. Sklaven und Schuldknechte waschen sich im Meer oder in Flüssen bzw.
      mit einer Schüssel Wasser.
    context: Aufgrund des schweißtreibenden Klimas pflegen die Reichen, morgens ein
      Bad zu nehmen. Anschließend reiben sie sich ihre Körper mit parfümiertem Kokosöl
      ein, das man auch gerne nutzt, um sich die Haare zu frisieren. Hier liebt man
      weit ausgeschnittene oder ärmellose Hemden und Westen, um die – soweit vorhanden
      – glänzenden Muskeln zu zeigen. Bei der Mittelschicht ist das Baden hingegen
      wenig verbreitet. Sklaven und Schuldknechte waschen sich – wenn überhaupt –
      im Meer oder in den Flüssen; für Haussklaven hält man hingegen eine Schüssel
      Wasser für die tägliche Körperreinigung (die man dann auch erwartet) bereit.
  - question: Wie ist die Wohnlage der Schuldknechte?
    answer: Die Schuldknechte leben meist in kleinen Hütten aus Rohr oder Palmwedeln,
      die ihrem Patron gehören. Die Hütten haben häufig nur einen Raum, der als Küche,
      Schlafplatz und Wohnraum dient.
    context: Die Schuldknechte meist in kleinen Hütten aus Rohr oder Palmwedeln, die
      ihrem Patron gehören. Diese Behausungen haben häufig nur einen Raum, der den
      zahlreichen Familienmitgliedern als Küche, Schlafplatz und Wohnraum dient.
  - question: Was essen Schuldknechte?
    answer: Die Hauptnahrung der Schuldknechte besteht aus kleingeschnittenen gekochten
      Wurzeln, Bohnen, Reis oder Maisbrei, selten auch scharf gewürzten Fischresten.
    context: Gegessen wird auf dem Boden sitzend. Als Kleidung dient nicht selten
      die abgelegte Garderobe der Reichen, die ihre Arbeiter damit belohnen. Die Hauptnahrung
      dieser Menschen setzt sich aus kleingeschnittenen gekochten Wurzeln, Bohnen,
      Reis oder Maisbrei, selten auch scharf gewürzten Fischresten zusammen.
  G1-256:
  - question: Welche Kleidungsstücke tragen die wohlhabenden Einwohner der Kolonien
      gerne?
    answer: Die Oberen orientieren sich gerne an der Mode des Mutterlandes. Beliebt
      sind Kleider aus spinnwebzarten Seidenstoffen und kunstvoll verarbeiteten aranischen
      Straußenfedern, dazu tulamidische Fächer gegen die Schwüle sowie ein farblich
      passender Sonnenschirm. Auch elegante Seidenanzüge und glänzende Stiefel erfreuen
      sich großer Beliebtheit.
    context: In den Kolonien orientieren sich die Oberen gerne an der Mode des Mutterlandes.
      Allgemein beliebt sind jedoch Kleider aus spinnwebzarten Seidenstoffen und kunstvoll
      verarbeiteten aranischen Straußenfedern. Dazu schätzt man tulamidische Fächer
      gegen die Schwüle sowie einen farblich passenden Sonnenschirm. Auch elegante
      Seidenanzüge und glänzende Stiefel erfreuen sich großer Beliebtheit.
  - question: Wie kleidet sich die Mittelschicht in den Kolonien?
    answer: Die Mittelschicht begnügt sich mit weiten Hemden und Tuniken, langen Westen
      und knielangen Hosen, selten auch Pluderhosen, kombiniert mit breitem Hut oder
      Kopftuch. Für besondere Anlässe hat man einen teureren Rock in der Truhe bereit
      liegen, den die Eltern einst mit dem Ersparten eines ganzen Jahres erworben
      haben.
    context: Die Mittelschicht begnügt sich mit weiten Hemden und Tuniken, langen
      Westen und knielangen Hosen, selten auch Pluderhosen, kombiniert mit breitem
      Hut oder Kopftuch. Für besondere Anlässe hat man einen teureren Rock in der
      Truhe bereit liegen, den die Eltern einst mit dem Ersparten eines ganzen Jahres
      erworben haben.
  - question: Wie unterschiedlich ist die Kleidung zwischen den verschiedenen sozialen
      Schichten?
    answer: Unter den Armen und Unfreien gibt es kaum jemanden, der mehr als ein grobes
      Hemd und eine zerschlissene Hose sein Eigen nennt. Doch kann es durchaus geschehen,
      dass man in den Straßen und Gassen der Städte der alten Dirne in einem brüchigen
      Brokatkleid begegnet, dem betrunkenen Piraten in dem zerschlissenem Seidenanzug
      oder dem einäugigen Bettler mit dem breitkrempigen Hut, der in Bethana einst
      ein Vermögen gekostet hat.
    context: Unter den Armen und Unfreien gibt es kaum jemanden, der mehr als ein
      grobes Hemd und eine zerschlissene Hose sein Eigen nennt. Doch kann es durchaus
