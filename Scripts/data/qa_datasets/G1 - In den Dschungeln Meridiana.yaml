  - question: Welche Methoden setzt die Hand Borons ein, um das Ansehen von Al'Anfa
      in Aventurien zu verbessern?
    answer: Die Geheimdiplomaten der Hand Borons versuchen, das Bild Al’Anfas in Aventurien
      positiv zu beeinflussen, indem sie Würdenträger bestechen, Gerüchteschmiede
      und Volksredner bezahlen und Geschenke an Herrscher verschicken.
    context: Ein solcher Geheimdiplomat tut alles, um das Bild Al’Anfas in Aventurien
