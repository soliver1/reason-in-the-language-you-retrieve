      Ob man sich darauf wirklich verlassen möchte, ist freilich jedem Angroscho,
      Schwarz- oder Rotpelz selbst überlassen.'
    context: 'Die Flussläufe wimmeln von Blutfischen (moh.: Piranha), die im Schwarm
