      halblaut, aber deutlich seinen Wunsch formulieren.
  - question: Was passiert, wenn Boron einen Wunsch nicht erfüllt?
    answer: Man findet eine schwarze Orchideenblüte in Bett oder Sänfte.
    context: Sollte der Opfernde jedoch binnen eines Tages eine schwarze Orchideenblüte
      in Bett oder Sänfte finden, hat er mit seinem Wunsch das Missfallen Borons erregt.
      Was das zur Folge hat, bleibt diversen Gerüchten überlassen.
  G1-215:
