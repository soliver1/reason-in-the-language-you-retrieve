      und damit einher gehende Kälteanfälligkeit tun ein Übriges.
  - question: Welche Vorteile haben Utulus und Südaventurier im Vergleich zu Waldmenschen
      und Garethern im Ewigen Wald?
    answer: Utulus sind gegenüber den Waldmenschen im Vorteil, da sie von Haus aus
      über Hitzeresistenz verfügen. Auch der Südaventurier, der von der Rasse her
      Tulamide oder Mittelländer ist, ist abseits aller Regeln das Klima eher gewohnt
      als der frisch zugereiste Garether.
    context: Hier sind sogar die Utulus den Waldmenschen gegenüber im Vorteil, da
