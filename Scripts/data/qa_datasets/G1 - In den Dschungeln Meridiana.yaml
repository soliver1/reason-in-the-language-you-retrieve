  G1-147:
  - question: Was macht die Gladiatorenkämpfe in Al'Anfa so besonders im Vergleich
      zu anderen Städten?
    answer: Die Gladiatorenkämpfe in Al’Anfa sind blutiger und härter als in anderen
      südlichen Städten, wahrscheinlich weil die Fana, die reiche und mächtige Bürger
      der Stadt sind, kein Mitleid mehr empfinden können.
    context: 'Gladiatorenkämpfe in Al’Anfa neigen dazu, blutiger und härter zu sein
      als in anderen südlichen Städten. Vielleicht liegt es an den verwöhnten Fanas,
      die bei ihrer eigenen Lage kaum noch Mitleid empfinden können, oder daran, dass
      die Granden ihren Reichtum und ihre Macht besonders rücksichtslos und im wörtlichen
      Sinne ‘zur Schau stellen’. '
  - question: Beschreibe die Naumachien, eine Sonderform der Schaukämpfe in Al'Anfa.
    answer: Die Naumachien sind eine besondere Form der Schaukämpfe, bei denen historische
      Seeschlachten vor dem Tempelhafen nachgestellt werden. Dabei werden Ruderer
      beider Seiten an den Bänken festgekettet und mit ihren Schiffen untergehen.
      Pfeil und Bogen werden ebenfalls eingesetzt.
    context: Eine Sonderform des Schaukämpfers gilt es noch zu erwähnen, obwohl weder
      Tierhetzer noch Gladiatoren diese als ihresgleichen betrachten würden. Dies
      sind die Unglücklichen, die der Fana als ‘nasse Gladiatoren’ oder ‘Fischhetzer’
      bezeichnet. Hinter diesen Spottnamen verbergen sich die Teilnehmer der Naumachien,
      die bei besonderen Anlässen vor dem Tempelhafen veranstaltet werden. Dabei werden
      (historische) Seeschlachten nachgestellt, in denen die Ruderer beider Seiten
      wie üblich an den Bänken festgekettet sind und mit ihren Schiffen untergehen.
      Hier wird dann auch mit Pfeil und Bogen gekämpft, da die Zuschauer außerhalb
      der Waffenreichweite sitzen.
  - question: Welche zwei Formen der Naumachie sind besonders beliebt?
    answer: 'Zwei beliebte Formen der Naumachie sind: Zum einen, wenn eine Schwarze
      Galeere mehrere fremde Schiffe versenkt (die entsprechend präpariert und benachteiligt
      sind), und zum anderen, wenn erbeutete Schiffe von Feinden oder Piraten mit
      ihrer ursprünglichen Besatzung (ergänzt durch weitere Kriegsgefangene und Verbrecher)
      aufeinander gehetzt werden.'
