  G1-095:
  - question: Beschreibe den Aufbau der Festungsinseln.
    answer: Die Festungsinseln bestehen aus fünf kahlen, schwarzen Felsen, jeder mit
      einer waffenstarrenden Basaltfestung gekrönt.
    context: Fünf kahle, schwarze Felsen liegen eine halbe Meile vor der Küste, jeder
      gekrönt durch eine waffenstarrende Basaltfestung.
  - question: Wie unterscheiden sich die Prozeduren für einheimische und fremde Schiffe
      beim Passieren der Festungsinseln?
    answer: Die Fahrrinnen sind so schmal, dass man sie nur mit einem Lotsen passieren
      sollte. Jedes einheimische Schiff wird durchgewunken, während fremde Schiffe
      anlegen und einer Inspektion unterzogen werden müssen.
    context: Die eigentlichen Fahrrinnen sind so schmal, dass man sie nur mit einem
      Lotsen passieren sollte. Jedes einheimische Schiff wird durchgewunken, während
      fremde Schiffe aus Sicherheitsgründen an einem Steg anlegen müssen und einer
      strengen Inspektion unterzogen werden.
  - question: Wer besetzt die Festungsinseln und wie verhalten sie sich gegenüber
      Bestechung?
    answer: Sie setzen sich aus 50 Männern und Frauen der Stadtgarde, manchmal auch
      einem Kontingent der Basaltfaust zusammen. Gegen Bestechung sehen sie jedoch
      von einigen Kontrollen ab.
    context: Außer den Beamten der Hafenmeisterei besetzen 50 Männer und Frauen der
      Stadtgarde, manchmal sogar ein Kontingent der Basaltfaust, die fünf Festungen
      mit ihren Böcken, Rotzen und Repetierarmbrüsten. Gegen eine entsprechende Bestechung
      in klingenden Dublonen sehen die Beamten allerdings davon ab, Bordgeschütze
      zu plombieren, und erweisen auch manch andere Dienste.
  G1-096:
  - question: Wie werden die Palastinseln heute genutzt?
    answer: Die Palastinseln dienen als Sommerresidenzen für die Granden und Grandessas.
      Dort überbieten sie sich in Prunk und Lebensart.
    context: Und wo ein Grande sich hervortut, da können die anderen unmöglich zurückstehen,
      und so wurden alle Palastinseln der Reihe nach zu Sommerresidenzen ausgebaut,
      mit eigenen Anlegemöglichkeiten, Gärten und einer raffinierten Wasserleitung,
      die die Paläste mit Regenwasser versorgt. Hier kreuzen die Granden und Grandessas
      auf Vergnügungsbooten, statten sich gegenseitig Höflichkeitsbesuche ab und überbieten
      einander in Prunk und Lebensart.
  - question: Warum wurden die Palastinseln zu einem beliebten Aufenthaltsort für
      die Granden?
    answer: 'Vor etwa hundert Jahren verlegte eine Grandessa ihre Residenz auf die
      Palastinseln, weil sie dort vom Unmut des Fanas verschont blieb. '
    context: Vor gut einhundert Jahren ist einer besonders extravaganten Grandessa
      aufgefallen, dass man hier, anders als auf dem Silberberg, vom Unmut des Fanas
      nicht berührt werden kann. Und als der Pöbel besonders aufgebracht erschien,
      verlegte sie ihre Residenz vom Silberberg hinaus auf das Meer. Was bei dieser
      Gelegenheit mit den Gefangenen geschah, bleibt ein Geheimnis der Streifenhaie.
  - question: Welche Sicherheitsvorkehrungen bestehen auf den Palastinseln und warum?
    answer: Die Inseln sind gut bewacht, weil die Gefahr durch Piraten besteht. Es
      gibt jedoch Spekulationen darüber, ob diese Sicherheitsmaßnahmen ausreichen
      werden.
    context: ' Aufgrund der allgegenwärtigen Gefahr durch Piraten sind die Inseln
      gut bewacht, aber es mag nur eine Frage der Zeit sein, bis jemand seine Tollkühnheit
      beweist.'
