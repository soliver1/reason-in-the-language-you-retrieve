      Fakultät aufbewahrt und welche besonderen Stücke befinden sich darunter?
    answer: Die Bibliothek der Philosophischen Fakultät beherbergt Schriftrollen aus
      Selemer Papyrus, Pergament und modernem Bütten. Darunter befinden sich Kostbarkeiten
      wie Texte in Ur-Tulamidya über die Erstürmung H’Rabaals, Gulagals und Nabuleths,
      philosophische Pamphlete der Rohalszeit, magostrategische Fehleranalysen der
      Bekämpfung Borbarads sowie altechsische Chrmk-Papyri im Kellergeschoss.
