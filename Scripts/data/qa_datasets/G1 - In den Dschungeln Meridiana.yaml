  G1-158:
  - question: Aus welchem Material bestehen die verschiedenen Münzen Al'Anfas?
    answer: Die Dublone, der Oreal und der Kleine Oreal sind aus Gold oder Silber,
      während der Dirham aus Kupfer besteht.
    context: Die berühmteste Münze Al’Anfas ist die Dublone, was im bosparanisierenden
      Brabaci einfach ‘die Doppelte’ oder ‘Doppelstück’ bedeutet. Es ist eine schwere
      Münze aus gutem Gold, die soviel wie zwei kaiserliche Dukaten wiegt und auch
      deren Wert hat. Als nächst kleinere Einheit kennt man den Oreal, der von Auswärtigen
      auch gern als Schilling bezeichnet wird. Er wiegt fünf Skrupel und ist entweder
