  G1-344:
  - question: Welche Einrichtung trägt maßgeblich zum wirtschaftlichen Erfolg von
      Chorhop bei?
    answer: Die Werft der Zeforikas
    context: Die größte Einnahmequelle Chorhops ist die Werft der Zeforikas.
  - question: Aus welchen Materialien fertigen die Bildhauer von Chorhop ihre Werke
      an?
    answer: Edelhölzer des Regenwalds und Elfenbein der Elefanten
    context: die Bildhauer der Stadt, die Wasserspeier, Statuen und Galionsfiguren
      aus den Edelhölzern des Regenwaldes und dem Elfenbein der Elefanten formen.
  - question: Welche Nahrungsmittel bilden die Grundlage der Ernährung der Einwohner
