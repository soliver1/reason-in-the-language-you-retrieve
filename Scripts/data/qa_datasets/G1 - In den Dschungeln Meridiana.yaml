  G1-448:
  - question: Welche drei Positionen auf einem Piratenschiff haben traditionell einen
      hohen Rang?
    answer: Der Kapitän, der Steuermann und der Zahlmeister.
    context: Dominante Figur eines jeden Piratenschiffes ist der Kapitän, auch wenn
      der Führungsstil bisweilen freizügig ist. In jedem Fall muss er seemännische
      Fähigkeiten sowie Mut und Entschlossenheit mitbringen. Entscheidungen des Kapitäns
      werden häufig in einem einfachen Mehrheitsentscheid durch Zuruf bestätigt. Nummer
      Zwei an Bord ist der Steuermann, der oft als Einziger neben dem Kapitän in die
      Geheimnisse der Navigation eingeweiht ist ... Auch die Auswahl des Zahlmeisters
      fällt meist nicht schwer, ist er doch neben dem Steuermann/Navigator häufig
      der Einzige an Bord, der lesen und schreiben kann.
  - question: Welche zwei Berufe sind besonders wichtig für die Überlebenschancen
      der Mannschaft bei einem Schiffbruch?
    answer: Der Schiffszimmermann und der Segelmacher.
    context: Schiffszimmerleute und Segelmacher genießen ebenfalls eine privilegierte
      Stellung. So kann es sein, dass sie im Falle eines Mastbruchs noch während des
      Sturmes den Mast und die ihn haltenden Taue kappen, über Bord werfen und durch
      einen Behelf ersetzen müssen. Ihre Fähigkeiten entscheiden unter Umständen über
      das Leben der gesamten Mannschaft, wenn es gilt, nach einem Schiffbruch in einsamer
      Gegend den ‘Kahn wieder flott zu machen’.
  - question: Beschreibe die Aufgaben und die Behandlung des Schiffsjungen auf einem
      Piratenschiff.
    answer: Der Schiffsjunge muss Aufgaben wie Deckschrubben, Hilfstätigkeiten für
      den Koch und das Leeren des Notdurfteimers erledigen. Er ist häufig Ziel von
      Hänseleien, Aggressionen oder sexuellen Übergriffen.
    context: Die undankbarste Rolle schließlich hat der Schiffsjunge als jüngstes
      Besatzungsmitglied, der als ‘Mädchen für alles’ Aufgaben wie Deckschrubben,
      Hilfstätigkeiten für den Koch, Notdurfteimer leeren und dergleichen mehr verrichtet
      und nicht selten zum Ziel von Hänseleien, aufkochenden Agressionen oder sexuellen
      Übergriffen wird. Glücklich können sich diejenigen schätzen, die einen Verwandten
      in der Mannschaft haben, der ihnen Schutz bieten kann.
  - question: Wer übernimmt die Aufgabe eines Geschützmeisters, wenn keiner an Bord
      ist?
    answer: In Notfällen kann der Zimmermann mit technischem Verständnis und Übung
      die Geschützmannschaften anweisen.
    context: Geschützmeister, die die gängige Bordbewaffnung bedienen können, sind
      selten. Meist werden sie von unterlegenen Schiffen entführt und zum Bleiben
      gezwungen, bis sie entweder tot sind oder sich angepasst haben. Gelingt das
      nicht, ist es oft der Zimmermann, der mit technischem Verständnis und genügend
      Übung die Anleitung der Geschützmannschaften übernimmt.
  - question: Welche Aufgaben hat der Steuermann auf einem Piratenschiff?
    answer: Der Steuermann ist meist der Einzige neben dem Kapitän, der die Navigation
      beherrscht und überwacht leichtere Bestrafungen wie Deckschrubben und schwerere
      wie das Auspeitschen.
    context: Nummer Zwei an Bord ist der Steuermann, der oft als Einziger neben dem
      Kapitän in die Geheimnisse der Navigation eingeweiht ist und (wie ein Bootsmann
      auf Handels- oder Kriegsschiffen) auf Befehl leichtere Bestrafungen wie Deckschrubben
      überwacht und schwerere wie das Auspeitschen ausführt. Oft gibt es auch einen
      zweiten Steuermann, um den ersten ersetzen zu können, wenn er verhindert ist.
  - question: Welche Rolle spielt ein Magier auf einem Piratenschiff?
    answer: Wenn ein Magiebegabter an Bord ist, wird er als Wettermacher und Heiler
      eingesetzt und kann in Gefechten die Waage zu Gunsten seiner Mannschaft beeinflussen.
    context: Selten – aber nicht ungewöhnlich – ist ein ‘Bordmagus’. Wenn ein kompetenter
      Magiebegabter an Bord ist, wird er als Wettermacher und Heiler stark beansprucht.
      In einem Gefecht kann er das Gleichgewicht zu Gunsten seiner Mannschaft verändern
      – mit katastrophalen Folgen für das gegnerische Schiff.
