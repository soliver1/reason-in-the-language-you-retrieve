  - question: Welche Hindernisse machen eine Flucht von der Sklaveninsel besonders
      schwierig?
    answer: Die Insel ist von einer drei Schritt hohen Mauer aus grob gefügten Basaltblöcken
      umgeben. Selbst wenn Sklaven mit den Fußeisen aus dem Pferch, dem Sklavenhaus
      und über die Mauer entkommen, reißen die scharfkantigen Klippen ihnen Hände
