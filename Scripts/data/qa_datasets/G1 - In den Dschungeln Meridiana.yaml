  G1-370:
  - question: Wer waren die beiden Schwestern, die gegen die Flotten des Diamantenen
      Sultanats kämpften?
    answer: Shahane
    context: '»Als vor mehr als 1900 Jahren die Truppen des Diamantenen Sultanats
      erstmals geschlagen wurden, entwickelte sich in der Folgezeit rund um die Stadt
      Zorgan ein ganz unbotsames Reich: Männer herrschten nur noch nominell, während
      die wahre Macht in den Händen der Gemahlinnen oder Mütter lag – das spätere
      Aranien. Damals lebten in Zorgan zwei Schwestern, Shila und Shahane, kühne Freibeuterinnen,
      die gegen die Flotten des Sultanats stritten.'
  - question: Wie erhielt die Stadt ihren Namen?
    answer: Die Stadt wurde nach Shila benannt.
    context: Shahane beschloss, den Kampf gegen die Kreatur zu wagen. Sie ließ den
      Rumpf der ‘Hai’ von innen mit Säbelklingen spicken, bis das Schiff mehr einem
      riesigen Seeigel denn einer Thalukke glich. Nur sie selbst behielt ihren Khunchomer
      in der Hand. Als die jadegrün geschuppte Seeschlange über die schmale Meerenge
      kam, steuerte Shahane ihr entgegen. Brüllend umschlang und zerbrach das Untier
      das Schiff, aber zugleich trieb es sich die wohl über hundert Klingen in den
      Leib. Shahane enthauptete die Seeschlange mit einem mächtigen Hieb ihres Khunchomers,
      und nur durch der Götter Gunst konnten sich die Freibeuterinnen von der zerstörten
      ‘Hai’ ans Festland retten. Eingedenk ihres Traumes erbat sich Shahane die Landzunge
      als Wohnplatz und das Recht, einen Hafen zu bauen und eine Stadt zu gründen.
      Dankbar gewährten die Eingeborenen den Wunsch, und Shahane gab der Stadt den
      Namen ihrer Schwester Shila. Pakaha aber nahm sie zum Mann und ihre Besatzung
      suchte sich ebenso Männer unter den Eingeborenen.
