  G1-413:
  - question: Welche vier Inseln bilden das Bilku-Archipel?
    answer: Die vier Inseln Sorak, Kossike, Pekladi und Bilku.
    context: Die vier Inseln Sorak, Kossike, Pekladi und – inmitten der drei anderen
      – Bilku sind auf ganz besondere Weise miteinander verbunden.
  - question: Welche besondere Verbindung hatten die vier Inseln des Bilku-Archipels
      vor 2000 Jahren?
    answer: Sie bildeten früher eine einzige runde Insel namens Adamantina.
    context: Bis vor 2.000 Jahren bildeten sie eine einzige runde Insel – manche meinen,
      das Adamantina der Legenden.
  - question: Was war der Grund für die Entstehung der vier Inseln des Bilku-Archipels?
    answer: Die Zerstörung der ursprünglichen Insel durch einen gewaltigen Vulkanausbruch
      löste eine Jahrhundertwelle aus, die die Katastrophe von Havena übertraf.
    context: In ihrer Mitte erhob sich ein gewaltiger Vulkan, der bei einem gewaltigen
      Ausbruch sich selbst und die Insel zerstörte. Die Explosion löste damals eine
      Jahrhundertwelle aus, die wohl noch bei weitem die Katastrophe von Havena übertraf
      und allenfalls mit dem Einschlag des Sterns von Selem vergleichbar ist.
  - question: Welche verschiedenen Bevölkerungsgruppen leben in der Siedlung NeuBosparan?
    answer: Die Siedlung NeuBosparan beherbergt neben Soldaten und Kolonisten auch
      verbannte Adelige, gestrandete Abenteurer sowie Geweihte der Hesinde und der
      Peraine.
    context: Neben den Verwandten der Soldaten gehören der Siedlung etwa 50 (in ihrer
      Heimat dafür begnadigte) Kolonisten, einige verbannte Adelige und gestrandete
      Abenteurer sowie Geweihte der Hesinde und der Peraine an, die hier die Fauna
      studieren.
  G1-414:
  - question: Welche beiden Inseln wurden nach der Grangorer Admiralin Yaquiria ter
      Rijssen benannt?
    answer: Sukkuvelani und Ibonka
    context: Sukkuvelani, die größte der Perleninseln, und ihr kleiner Trabant Ibonka
      wurden nach der Grangorer Admiralin Yaquiria ter Rijßen benannt, die die Inseln
      vor etwa 100 Jahren mit der Karavelle Phecadia entdeckte.
  - question: Wie sehen die Ansprüche auf Sukkuvelani und Ibonka von Vinsalt und Al’Anfa
      aus?
    answer: Vinsalt betrachtet die Inseln als Teil seines Territoriums unter dem Namen
      ‘Protectorat Perlenmeer’, während Sukkuvelani de facto ein Eckpfeiler des alanfanischen
      Imperiums ist, das die Inseln als echtes Adamantenland sieht.
    context: Sukkuvelani ist jedoch de facto ein Eckpfeiler des alanfanischen Imperiums;
      genau betrachtet sogar das echte Adamantenland, das von den Kartographen der
      Schwarzen Perle aus gutem Grund viel weiter im Osten dargestellt wird. Darauf
      gründet sich auch immer noch der Anspruch Vinsalts, das die Inseln unter dem
      Namen ‘Protectorat Perlenmeer’ als Teil seines Territoriums betrachtet.
  - question: Welche wirtschaftlichen Aktivitäten werden auf Sukkuvelani betrieben?
    answer: Gewürzplantagen, Stollen und Gruben für den Abbau von Gold, Silber und
      Diamanten.
    context: Hier finden sich mehrere Gewürzplantagen sowie zahlreiche Stollen und
      Gruben für den Abbau von Gold, Silber und vor allem Diamanten, die hier sehr
      häufig vorkommen.
  G1-415:
  - question: Welche Angaben über die Utulus finden sich in den Phecadia-Logbüchern?
    answer: Die Phecadia-Logbücher berichten von urtümlichen schwarzhäutigen Waldbewohnern,
      die oft Krieg führen und möglicherweise sogar Menschenfresser sind.
    context: 'Die Logbücher der Phecadia sprechen von urtümlichen schwarzhäutigen
      Waldbewohnern, die oft Krieg führen, möglicherweise sogar Menschenfresser sind. '
  - question: Welche Folgen hatte die Explosion der Nachbarinsel?
    answer: Die Explosion der Nachbarinsel hinterließ das Bilku-Archipel und verdunkelte
      für lange Zeit die Sonne. Außerdem verursachte sie eine turmhohe Flutwelle,
      die über die Inseln schwappte.
    context: Wahrscheinlich handelte es sich um die Explosion der Nachbarinsel, die
      das Bilku-Archipel zurückließ und nicht nur für lange Zeit die Sonne verdunkelte
      und eine turmhohe Flutwelle über die Inseln schickte, sondern nach der auch
      die wenigen Überlebenden wie wilde Tiere auf Landsuche hereinbrachen.
  - question: Was ist der Adamantenkonvoi und wie sieht er aus?
    answer: Der Adamantenkonvoi besteht aus 20 Zedrakken, die mit Ebenholz, Mohagoni,
      Gewürzen, Gold und Diamanten beladen sind. Dieser Konvoi wird unter schwerstem
      Geleitschutz entlang der Inselkette zum Festland eskortiert.
    context: 'Einmal im Jahr wird hier der legendäre Adamantenkonvoi zusammengestellt:
      20 Zedrakken mit Ebenholz, Mohagoni, Gewürzen, Gold und Diamanten beladen, die
      unter schwerstem Geleitschutz die Inselkette entlang zum Festland eskortiert
      werden.'
  G1-416:
  - question: Wie lautet die alternative Bezeichnung für Ibonka laut den Eingeborenen?
    answer: Die Insel Ibonka wird von den Eingeborenen 'Hand der Toten' genannt.
    context: 'Die Nachbarinsel Sukkuvelanis ist Ibonka, die Insel der Geister (moh.:
      ‘Hand der Toten’).'
  - question: Was ist auffällig an der einzigen Wasserquelle auf Ibonka?
    answer: 'Es gibt zwar eine Quelle auf Ibonka, aber ihr Wasser ist blutrot. '
    context: Es gibt zwar eine Quelle, aber ihr Wasser ist blutrot.
  - question: Welche Beschreibung gibt das Logbuch der Phecadia von Ibonka und warum?
    answer: Die alten Begräbnisriten werden noch immer durchgeführt, aber mit nur
      geringer Achtung vor den Toten. Das Logbuch der Phecadia verglich die Insel
      mit einem riesigen Notgrab, wie es in Seuchenzeiten notwendig ist.
    context: Die alten Begräbnisriten werden noch immer durchgeführt, aber mit nur
      geringer Achtung vor den Toten. Das Logbuch der Phecadia verglich die Insel
      mit einem riesigen Notgrab, wie es in Seuchenzeiten notwendig ist.
  G1-417:
  - question: Was glauben die meisten Gelehrten bezüglich der Perleninseln?
    answer: Die Gelehrten glauben an die Existenz des Adamantenlandes.
    context: Manche Gelehrte rechnen mit einem Dutzend, fast alle von ihnen glauben
      an die Existenz des Adamantenlandes.
  - question: Was ist bekannt über Ruban den Rieslandfahrer und seine Begegnung mit
      dem Mahlstrom?
    answer: Ruban der Rieslandfahrer war nicht der Erste, dessen Schiff in den Strudel
      gerissen wurde, wohl aber der Einzige, von dem man weiß, dass er es überlebte.
    context: Ruban der Rieslandfahrer war nicht der Erste, dessen Schiff in den Strudel
      gerissen wurde, wohl aber der Einzige, von dem man weiß, dass er es überlebte.
  - question: ' Beschreibe das Aussehen des Meeres um die Perleninseln und was es
      verrät.'
    answer: Die Inseln werden vom Perlenmeer umgeben und das Meer sieht friedlich
      aus, nur die eigenartige Schwarzfärbung lässt erahnen, dass sich nördlich von
      Nuvak einer der gefürchteten riesigen Mahlströme befindet.
    context: 'Das die Inseln umtosende Meer sieht friedlich aus – nur die eigenartige
      Schwarzfärbung lässt erahnen, dass sich nördlich von Nuvak einer der gefürchteten
      riesigen Mahlströme befindet (moh.: Seto).'
  G1-418:
  - question: Beschreibe das Aussehen der Dodotuko.
    answer: Die Dodotuko sind sanfte Laufvögel, die an aranische Strauße erinnern
      und fast drei Schritt hoch werden.
    context: Neben der Fülle schillernd bunter Alveranis, Kolibiris, Pfefferfresser,
      Papageien, Kormorane, Tölpel oder Albatrosse fallen vor allem die gewaltigen,
      an aranische Strauße erinnernde Laufvögel auf. Deren Hälse und Beine sind allerdings
      dick wie Elefantenbeine, und sie werden nahezu drei Schritt hoch.
  - question: Wie bezeichnen die Eingeborenen der Insel die Dodotuko?
    answer: Die Eingeborenen nennen die Dodotuko 'sehr dummes Essen da oben'.
    context: Die Eingeborenen der Insel kennen diese Vögel gut und nennen sie allgemein
      Dodotuko (’sehr dummes Essen da oben’).
  - question: Welche Gefahr droht den Dodotuko trotz ihrer friedlichen Natur?
    answer: Obwohl die Dodotuko friedlich sind und Menschen neugierig gegenüberstehen,
      könnte ein weiteres Vordringen der Kolonisten ihr Ende bedeuten.
    context: Ihr friedliches Leben macht diese sanften Riesen so furchtlos und zutraulich,
      dass sie selbst dann noch neugierig auf Menschen zulaufen, wenn diese – in Vorfreude
      auf die etwa 200 Portionen schmackhaften Fleischs – bereits vor ihren Augen
      einen Artgenossen erschlagen haben. Da fast alle Stämme Tabus haben, die die
      Tötung mehr als eines Dodotukos in einem festen Zeitraum (meist einem Monat)
      pro Stamm verbieten, sind die gewaltigen Tiere noch nicht bedroht – ein weiteres
      Vordringen der Kolonisten könnte allerdings rasch ihr Ende bedeuten.
  G1-419:
  - question: Welche Insel ist bekannt für ihren zentralen Vulkan und den dunklen
      Rauch darüber?
    answer: Nuvak
    context: Wie über vielen Inseln weht auch über Nuvak, einer der kleinsten Inseln
      des Schwerts des Südens (wie man die geschwungene Inselkette der Waldinseln
      auch nennt), dunkler Rauch aus dem zentralen Vulkan.
  - question: Welche Art von Barriere schützt eine Schlucht des Feuerbergs auf Nuvak?
    answer: Eine mächtige Palisade aus angespitzten MohagoniBäumen und Palmen
    context: Auffällig ist eine mächtige Palisade aus angespitzten MohagoniBäumen
      und Palmen, die eine der Schluchten des Feuerberges absperrt.
  - question: Welche Kreatur soll laut Tulamidenmärchen in den Bergen von Nuvak leben
      und Menschenopfer fordern?
    answer: Ein Riesenaffe oder Troll
    context: Das über ihn berichtende Tulamidenmärchen berichtet allerdings – je nach
      Version – von einem im Bergland lebenden Riesenaffen oder Troll, der wildes
      Zuckerrohr (wie man es sonst eher auf den maraskanischen Inseln findet) und
      Menschenfleisch verspeist.
  G1-420:
  - question: Welche unterschiedlichen Ernährungsgewohnheiten zeigen die Fledermausarten
      auf Andikan?
    answer: 'Die Fledermausarten auf Andikan nutzen fast jede denkbare Futterquelle:
      Es gibt Nektarschlürfer, falkengroße Insektenjäger, Aasfresser von fast Hundegröße
      und sogar einige Arten, die affengleich in den Bäumen leben und ihre Flughäute
      nur zu kurzen Gleitflügen von Baum zu Baum nutzen. '
    context: Auf Andikan haben sich keinerlei Vögel angesiedelt – oder diese sind
      einst verjagt worden, wie ein Taya der Eingeborenen andeutet. Stattdessen wird
      die übliche Dschungelfauna – im wahrsten Sinne des Wortes – überschattet von
      Fledermausscharen. Diese beherrschen die Luft, und ihre verschiedenen Arten
      nutzen fast jede denkbare Futterquelle.
  - question: Welche Farbgebungen kommen bei den Fledermausarten auf Andikan vor und
      welche Besonderheit wird über eine spezielle Art erzählt?
    answer: Manche der Fledermäuse haben die vertraut braunschwarze Färbung, andere
      hingegen sind bunt gefärbt wie Papageien. Tayas der Inselbewohner behaupten,
      dass es auch eine tiefschwarze Art gäbe, die etwa eulengroß wird und fast ausschließlich
      vom ausgesaugten Blut ihrer Opfer leben soll.
    context: Manche der Fledermäuse haben die vertraut braunschwarze Färbung, andere
      hingegen sind bunt gefärbt wie Papageien. Tayas der Inselbewohner behaupten,
      dass es auch eine tiefschwarze Art gäbe, die etwa eulengroß wird und fast ausschließlich
