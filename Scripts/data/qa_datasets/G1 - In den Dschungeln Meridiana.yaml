  G1-111:
  - question: Beschreibe den charakteristischen Baustil der meisten Paläste auf dem
      Silberberg.
    answer: Die meisten Paläste auf dem Silberberg sind eine Mischung aus dem verspielten
      Havena-Stil, tulamidischen Traditionen wie Zwiebeltürmen und geschwungenen Fenstern
      und eigenständigen Elementen, namentlich den alanfanischen Arkaden.
    context: Etwa ein Dutzend Paläste und ein weiteres Dutzend Wirtschaftsgebäude
      stehen auf dem Silberberg. Die meisten sind eine eigentümliche Mischung aus
      dem verspielten Havena-Stil, tulamidischen Traditionen wie Zwiebeltürmen und
      geschwungenen Fenstern und eigenständigen Elementen, namentlich den alanfanischen
      Arkaden.
  - question: Welchen besonderen Luxus weisen die Häuser auf dem Silberberg auf und
      wo findet man diesen sonst noch?
    answer: Die Häuser sind durchgehend mit großen, bunten Glasfenstern ausgestattet
      – ein Luxus, den man allenfalls noch in Vinsalt und Kuslik kennt.
    context: Die Häuser sind durchgehend mit großen, bunten Glasfenstern ausgestattet
      – ein Luxus, den man allenfalls noch in Vinsalt und Kuslik kennt.
  - question: Beschreibe die Geschichte und die Struktur der Zwingfeste auf dem Silberberg.
    answer: Die Kompanie der Dukatengarde ist in der alten vizeköniglichen Zwingfeste
      (H 16 X) stationiert, die teilweise auf einer priesterkaiserlichen Bastion basiert.
      Vorher stand hier die Burg des Gaugrafen, eine Pfalz der Klugen Kaiser. Der
      heutige Bau ist eine vollwertige Festung mit zwei getrennten Höfen, einem Doppelturm,
      einem Geschützturm und einem Bergfried, dem so genannten Posaunenturm. Auch
      die alte Zwingfeste ist mit den unterirdischen Anlagen verbunden.
    context: Die Kompanie der Dukatengarde ist in der alten vizeköniglichen Zwingfeste
      (H 16 X) stationiert, die teilweise auf einer priesterkaiserlichen Bastion basiert.
      Vorher stand hier die Burg des Gaugrafen, eine Pfalz der Klugen Kaiser. Der
      heutige Bau ist eine vollwertige Festung mit zwei getrennten Höfen, einem Doppelturm,
      einem Geschützturm und einem Bergfried, dem so genannten Posaunenturm. Auch
      die alte Zwingfeste ist mit den unterirdischen Anlagen verbunden.
  G1-112:
  - question: Wie hoch schwebt der Rabenfelsen über dem Wasser der Goldenen Bucht?
    answer: Der Rabenfelsen schwebt etwa fünfzig Schritt über dem Wasser der Goldenen
      Bucht.
    context: Beherrschender Anblick ist jedoch der Rabenfelsen, der etwa fünfzig Schritt
      über dem Wasser der Goldenen Bucht schwebt.
  - question: Wie würde man die Tempelmusik der Boron-Geweihten beschreiben?
    answer: Die Tempelmusik der Boron-Geweihten ist elegisch-schwebend.
    context: Aus den Flügeln des Tempels dringt die elegisch-schwebende Tempelmusik
      der Boron-Geweihten.
  - question: Welche Person löste das Schisma mit Punin aus?
    answer: Velvenya Karinor löste das Schisma mit Punin aus.
    context: Hier liegen die einbalsamierten Leichname der Patriarchen der Kirche,
      beginnend mit Velvenya Karinor, die das Schisma mit Punin auslöste, bis zu Tar
      Honak.
  - question: Wo befindet sich der Tempelhafen?
    answer: Der Tempelhafen liegt am Fuß des westlichen Silberberges.
    context: Am Fuß des westlichen Silberberges erstreckt sich der Tempelhafen (I
      14 X), in dem die Schwarzen Galeeren der Boron-Geweihten und die Vergnügungsschiffe
      der Silberbergfürsten liegen.
  - question: Wie viel kostet es, an den täglichen Opfern teilzunehmen?
    answer: Die kahl geschorenen Boron-Geweihten verlangen 1 Oreal für die Anwesenheit
      und 1 Dublone für die Teilnahme an den Handreichungen.
    context: 'Wer an den täglichen Opfern teilhaben will, muss bei den kahl geschorenen
      Boron-Geweihten seine Gebühr entrichten: 1 Oreal für die Anwesenheit, 1 Dublone
      für die Teilnahme an den Handreichungen.'
  - question: Welche Schiffe liegen im Tempelhafen?
    answer: Die Schwarzen Galeeren der Boron-Geweihten und die Vergnügungsschiffe
      der Silberbergfürsten liegen im Tempelhafen.
    context: Am Fuß des westlichen Silberberges erstreckt sich der Tempelhafen (I
      14 X), in dem die Schwarzen Galeeren der Boron-Geweihten und die Vergnügungsschiffe
      der Silberbergfürsten liegen.
  - question: Was ist der Stolz von Al’Anfa?
    answer: Der Stolz von Al’Anfa ist eine 600-Rojer-Galeere, die kürzlich wieder
      instand gesetzt wurde.
    context: In Schuppen im Norden ruht Bal Honaks erst kürzlich wieder Instand gesetzte
      600-Rojer-Galeere Stolz von Al’Anfa, eines der größten Seefahrzeuge, das jemals
      gebaut wurde.
  - question: Was wird als offizieller Eingang zum Labyrinth angesehen?
    answer: Die steile Treppe im Tempelhafen gilt als offizieller Eingang zum Labyrinth.
    context: In die Westwand gehauen verläuft im Zickzack die steile Treppe, die (über
      einen Tunnel) von der Vizeköniglichen Zwingfeste und der Stadt des Schweigens
      zum Tempelhafen führt. Sie gilt als offizieller Eingang zum Labyrinth (I 15
      X, siehe auch Seite 191f.).
  - question: Wann wurde die Treppe im Tempelhafen erweitert?
    answer: Die Treppe im Tempelhafen wurde nach der Großen Seuche erweitert.
    context: 'Die Treppe wurde nach der Großen Seuche erweitert, existierte aber schon
      in vor-tulamidischen Zeiten. '
  - question: Wie groß ist der Rabenfelsen?
    answer: Der Rabenfelsen ist 40 Schritt lang und im Kopfteil fast 30 Schritt hoch.
    context: 'Nach der Großen Seuche meißelte man aus der hoch aufragenden vordersten
      Klippe, wo sich Golgari niedergelassen hatte, sein Ebenbild. Binnen neun Jahren
      entstand eines der kunstvollsten Monumente des Kontinentes: vierzig Schritt
      lang, im Kopfteil fast dreißig Schritt aufragend, und zudem ausgehöhlt, um dem
      Tempel Platz zu bieten.'
  G1-114:
  - question: Was macht Al'Anfa zu einem Schmelztiegel des Kontinents?
    answer: Die Stadt Al'Anfa gilt als größter Schmelztiegel des Kontinents, da Menschen
      aus den unterschiedlichsten Gesellschaftsschichten und Kulturen hier zusammenkommen.
      Dazu gehören unter anderem Drittgeborene mittelländischer Bauern, aufständische
      Tagelöhner, entflohene Leibeigene, Vertriebene, fahnenflüchtige Söldner und
      Matrosen, Sektierer, Exil-Maraskaner, Opalsucher, Questadores, Tagediebe, Totschläger,
      Verräter, Verschwörer, Rebellen, Demokraten und Agitatoren.
    context: '"Al’Anfa gilt zweifelsohne zu Recht als größter Schmelztiegel des Kontinents.
      Drittgeborene mittelländischer Bauern, auf die zu Hause nur das Dasein als Knecht
      wartet, aufständische Tagelöhner, entflohene bornländische Leibeigene, Vertriebene,
      fahnenflüchtige Söldner und Matrosen, Sektierer, Exil-Maraskaner, Opalsucher,
      Questadores, die einer alten Legende nachjagen, Tagediebe, die sich ein leichtes
      Leben versprechen, Totschläger, die unter der schwarzen Flagge Karriere machen
      wollen, und schließlich Verräter und Verschwörer, Rebellen, Demokraten und Agitatoren
      – sie alle strömen in die Perle des Südens. "'
  - question: Beschreibe die typischen physischen Merkmale eines Al'Anfaners.
    answer: Al’Anfaner haben im Durchschnitt schwarzes Haar und dunklere Haut, da
      sich diese Merkmale bei Tulamiden wie bei Waldmenschen finden. Es gibt jedoch
      auch andere Phänotypen, wie etwa über zwei Schritt große, ebenholzschwarze Hünen,
      kleine Menschen mit gelocktem Haar der Zyklopeninsel-Bewohner oder dickliche
      Blonde ohne Bart.
    context: Neben über zwei Schritt großen, ebenholzschwarzen Hünen findet man eine
      auffällige Kleine mit dem gelockten Haar der Zyklopeninsel-Bewohner ebenso wie
      den dicklichen Blonden, dem nach Art der Waldmenschen kein Bart wächst. Im Durchschnitt
      neigen die Al’Anfaner zu schwarzem Haar und dunkler Haut, da sich beides bei
      Tulamiden wie bei Waldmenschen findet.
  - question: Erkläre die Gründe für die Sittenlosigkeit der Al’Anfaner.
    answer: Die Sittenlosigkeit der Al’Anfaner wird durch den Drang der Auswanderer,
      alle Bindungen hinter sich zu lassen, den enormen Reichtum und die bittere Armut
      in der Stadt erklärt. Diese Faktoren führen dazu, dass Grenzen, Bräuche und
      Gewissen als kleinmütige Einschränkungen eines Volkes erscheinen, das zu Großem
      bestimmt ist.
    context: 'Sprichwörtlich ist auch die Sittenlosigkeit der Al’Anfaner: Der Drang
      der Auswanderer, alle Bindungen hinter sich zu lassen, der enorme Reichtum und
      die bittere Armut lassen Grenzen, Bräuche und Gewissen als kleinmütige Einschränkung
      eines Volkes erscheinen, das zu Großem bestimmt ist. '
  G1-115:
  - question: Wer sind die Granden und wie haben sie ihren Reichtum erlangt?
    answer: Die Granden sind die acht regierenden Familien Al'Anfas, deren Reichtum
      hauptsächlich auf dem Sklavenhandel basiert.
    context: 'Gesellschaftlich ist Al’Anfa ebenso Plutokratie (Herrschaft der Reichen)
      wie Aristokratie (vererbbare Herrschaft einer Oberschicht). Allerdings wurden
      die feudalistischen Adeligen nach der Großen Seuche nach Mirham vertrieben,
      während die meisten der acht regierenden Familien (Granden) vor allem durch
      den Sklavenhandel reich geworden sind. Heutzutage ist es nicht mehr Phexens,
      sondern Tsas Wahlspruch, der die Zugehörigkeit zur Oberschicht bestimmt: Wer
      nicht als Grande geboren wird, hat es überaus schwer, später zu ihnen zu stoßen,
      unmöglich ist es jedoch nicht.'
  - question: Wer sind die 'Fana' und welche soziale Bandbreite umfasst dieser Begriff?
    answer: Der Begriff 'Fana' bezeichnet freie, aber unprivilegierte Bürger Al'Anfas.
      Dazu gehören sowohl reiche Händler als auch arme Bettler.
    context: Jeder Freie hingegen, der sich keiner familiären Beziehung zum Silberberg
      oder den Priestern der Stadt des Schweigens erfreut, wird als Fana bezeichnet.
      Der Ursprung dieses Wortes lässt sich nicht mehr ermitteln; es bezeichnet von
      alters her den freien, aber unprivilegierten Bürger Al’Anfas. Dabei fallen hier
      Händler, deren Reichtum dem der Granden in keiner Weise nachsteht, ebenso darunter
      wie der Bettler, der sich kaum alle zwei Tage ein Stück Brot ergaunern kann.
  - question: Welche Rolle spielen Sklaven in der Gesellschaft Al'Anfas und wie ist
      ihre Situation?
    answer: Sklaven machen ein Viertel der Bevölkerung Al’Anfas aus. Die meisten von
      ihnen verharren über Generationen in ihrem Stand, obwohl einige wenige im Alter
      freigelassen werden.
    context: Am unteren Ende der alanfanischen Gesellschaft stehen schließlich die
      Sklaven, die ein Viertel der Bevölkerung ausmachen. Einige wenige werden im
      Alter von ihren Herren freigelassen, die meisten jedoch verharren über Generationen
      in ihrem Stand.
  G1-116:
  - question: Wo wohnen die Granden?
    answer: Die Granden wohnen in ihren Palästen auf dem Silberberg, den Palastinseln
      und den Plantagen.
    context: Das Leben der Granden ist bestimmt von Luxus und Dekadenz, aber auch
      von Verfolgungswahn und dem Bewusstsein der Vergänglichkeit. Von den Göttern
      verwöhnt, wohnen sie in ihren Palästen auf dem Silberberg, den Palastinseln
      und den Plantagen.
  - question: Wie ist die Stimmung bei den Granden trotz ihres luxuriösen Lebens?
    answer: Die Granden schwelgen in Verschwendungssucht und Dekadenz wie in Kaiser-Yarums-Zeit
      und den letzten Tagen von Elem. Sie langweilen sich trotz des Luxus beinahe
      zu Tode.
    context: In Rahjas Diensten sucht man ständig nach Neuem, wobei die Grenzen zwischen
      dem, was der Schönen Göttin noch gefällig ist, und dem, was bereits der Herrin
      der Schwarzfaulen Lust zuspielt, sehr großzügig ausgelegt werden. Man schwelgt
      in Verschwendungssucht und Dekadenz, wie sie sonst nur aus Kaiser-Yarums-Zeit
      und den letzten Tagen von Elem berichtet wird – und langweilt sich doch beinahe
      zu Tode.
  - question: Wie oft werden Fanas zu Festen der Granden eingeladen?
    answer: Nur selten werden zu einem Fest auch Fanas geladen, eine große Ehre, die
      nur den verdientesten und wichtigsten Getreuen gewährt wird.
    context: 'Gängigerweise bleibt man unter sich, und nur selten werden zu einem
      Fest auch Fanas geladen – eine große Ehre, die nur den verdientesten und wichtigsten
      Getreuen gewährt wird. '
  G1-117:
  - question: Wie versuchen die wohlhabenden Fanas, ihren sozialen Status weiter zu
      verbessern?
    answer: Die Fanas, welche es zu Reichtum und Ansehen gebracht haben, versuchen
      sich durch Heirat mit einem Granden oder stetiger Loyalität zu ihrem Patron
      zu ‘versilbern’.
    context: Einen ähnlichen Stil pflegen Fanas, die es zu Reichtum und Ansehen gebracht
      haben, in verzweifelter Imitation der Silberberger, ohne jedoch von diesen als
      ihresgleichen angesehen zu werden. Dennoch bleibt die Hoffnung, sich durch Heirat
      mit einem Granden zu ‘versilbern’ – oder sich in steter Loyalität zu dem Patron
      und Gönner unabkömmlich zu machen und vielleicht einen ähnlichen Aufstieg zu
      erleben wie es den Pervals durch ihre ‘Nähe’ zu dem Haus Karinor möglich war.
  - question: In welcher Situation leben die meisten Fanas und welche Maßnahmen trifft
      die Stadtgarde gegen sie?
    answer: Der Großteil der Fanas lebt in erbärmlichen Verhältnissen und ist brutaler
      Willkür ausgeliefert. Die Stadtgarde treibt Steuern und Tempelzehnt ein, was
      oft mit dem Verkauf von Kindern oder Vertreibung der Familien endet.
    context: Der Großteil der Fanas jedoch lebt in erbärmlichen Verhältnissen, wo
      man sich selbst der Nächste ist, wo Kinder nicht einmal so viel wert sind wie
      das, was sie vertilgen, wo Prostitution, Diebstahl, Betrug und Denunziation
      Notwendigkeit sind und wo die einzige Erleichterung billigste Traumkräuter,
      die Spiele in der Arena und Rahjas Freuden sind. Ohne einen Gönner, der schützend
      die Hand über sie hält, ist die arme Masse oft brutaler Willkür ausgeliefert,
      die sie mit borongefälliger Ruhe über sich ergehen lässt. So sucht die Stadtgarde
      in unregelmäßigen Abständen die Bewohner der Altstadt, der Brabaker Baracken
      und des Schlundes heim, um den ausstehenden Tempelzehnt und die Steuern einzutreiben.
      Diese können natürlich selten bar gezahlt werden, so dass derartige ‘Besuche’
      meist mit dem Verkauf eines Kindes in die Sklaverei oder der Vertreibung der
      ganzen Familie enden.
  - question: Welche Alternativen zu verbotenen Organisationen bieten den Fanas Schutz?
    answer: Obwohl Gilden und Zünfte verboten sind, gibt es ‘Schutzbünde’, die für
      regelmäßiges Schutzgeld ein Mindestmaß an Sicherheit bieten.
    context: Jedoch steht jeder, von Familie und Freunden abgesehen, allein, da in
      Al’Anfa Gilden und Zünfte als staatsgefährdend verboten sind. Dennoch gibt es
      einige ‘Schutzbünde’, die für regelmäßiges Schutzgeld ein Mindestmaß an Sicherheit
      bieten – aber wehe dem, der seine Schulden nicht bezahlen kann.
  G1-118:
  - question: Wie überleben die Rattenmenschen?
    answer: Die Rattenmenschen überleben, indem sie den Abfall der Stadt sammeln und
      ihn zu ihren Behausungen außerhalb der Stadt transportieren. Aus Lumpen und
      Fetzen nähen sie Kleidung, Glas- und Tonscherben verarbeiten sie zu Schmuck
      und verkaufen es. Sie essen Obstreste und Knochen oder verfüttern sie an ihre
      Tiere.
    context: Es sind die Ärmsten der Armen, die überleben, indem sie den Abfall der
      Stadt zu ihren Behausungen außerhalb befördern. Lumpen und Fetzen werden mit
      Bast zu Kleidung vernäht, Glas- und Tonscherben verarbeiten sie zu armseligem
      Schmuck und Tand, den sie verkaufen. Obstreste und Knochen werden gereinigt
      und gegessen oder, wenn es selbst für sie nicht mehr genießbar ist, an die mageren
      Selemferkel und Hunde verfüttert, mit denen man sich die Behausung teilt und
      ebenfalls irgendwann aufisst und vollständig verwertet.
  - question: Wo befindet sich das Dorf Travinaia und wie sieht es aus?
    answer: Das Dorf Travinaia befindet sich einige Meilen nordwestlich von Al'Anfa.
      Es besteht aus Hütten aus Lehm und Unrat.
    context: Abseits aller Straßen hat sich einige Meilen nordwestlich Al’Anfas das
      Dorf Travinaia gebildet. Hütten aus Lehm und Unrat erheben sich wie Erdhaufen
      vom Boden, aus dem Kostbarsten hat man Travia und Peraine einen winzigen Altar
      errichtet, der neuerdings von einer Geweihten des Dreischwesternordens betreut
      wird.
  - question: Wie gehen die Bewohner von Travinaia mit ihrem eigenen Schicksal und
      dem anderer Menschen um?
    answer: Die Bewohner von Travinaia teilen ihr weniges Hab und Gut mit anderen,
      die in noch größerer Not sind. Sie nehmen auch jeden bei sich auf, unabhängig
      davon, wer er ist.
    context: Diese Menschen tragen ihr Schicksal ohne zu murren, kümmern sich rührend
      um den Nächsten und teilen das wenige, was sie besitzen, mit jedem, der in größerer
      Not ist als sie selbst. Auch nehmen sie jeden bei sich auf, wer er auch sein
      mag.
  G1-119:
  - question: Wie kommt die Mehrheit der Sklaven in Alanfan in die Sklaverei?
    answer: Die überwiegende Zahl der Sklaven ist in Gefangenschaft geboren, entweder
      als Kind von Sklaven oder als Bastard von Freien.
    context: Sklaven machen ein Viertel der alanfanischen Bevölkerung aus – doch kann
      man bei den vielfältigen Schicksalen, Fertigkeiten und Einstellungen kaum von
      ‘dem Sklaven an sich’ sprechen. Die überwiegende Zahl der Sklaven ist in Gefangenschaft
      geboren, entweder als Kind von Sklaven oder als Bastard von Freien.
  - question: Welche Gruppen von Menschen werden als 'Wildfänge' bezeichnet und warum
      sehen sie ihre Herren selten?
    answer: "'Wildfänge’ jedoch, Kriegsgefangene oder Verschleppte aus anderen Regionen,
      aber auch Fremde, denen Sklavenjäger in einer dunklen Gasse aufgelauert haben,
      sowie Freie, die in Schuldsklaverei verfallen sind, bekommen ihre Herren selten
      zu sehen."
    context: ‘Wildfänge’ jedoch, Kriegsgefangene oder Verschleppte aus anderen Regionen,
