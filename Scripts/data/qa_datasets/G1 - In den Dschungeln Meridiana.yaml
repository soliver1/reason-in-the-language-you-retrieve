  G1-412:
  - question: Warum ist die Insel Ilvat für Schiffe, die in großer Entfernung sind,
      schwer zu entdecken?
    answer: Ilvat ist so flach, und das Weiß der Korallenriffe, das Gelb des Strandes
      und das Grün der Palmen vermengt sich derart zu einem schillernden Kaleidoskop,
      dass die Insel aus mehr als zehn Meilen Entfernung praktisch unsichtbar ist.
    context: Die anderen beiden Zimtinseln, Ilvat und Numesi, sind fast vollkommen
      unbekannt. Ilvat etwa ist so flach, und das Weiß der Korallenriffe, das Gelb
      des Strandes und das Grün der Palmen vermengt sich derart zu einem schillernden
      Kaleidoskop, dass die Insel aus mehr als zehn Meilen Entfernung praktisch unsichtbar
      ist.
  - question: Woher kommt der Name Numesi?
    answer: Numesi hat seine Bezeichnung von dem faszinierenden Regenwald, der im
      Abstand von mehreren Tagen in einer anderen Farbe erscheint – je nachdem, welche
      Bäume dort gerade erblühen.
    context: 'Numesi (moh.: ‘Insel-täuscht-durch-Farbenwechsel’) hat seine Bezeichnung
      von dem faszinierenden Regenwald, der im Abstand von mehreren Tagen in einer
      anderen Farbe erscheint – je nachdem, welche Bäume dort gerade erblühen. '
  - question: Was wird über das Landesinnere der Insel Unaiekk erzählt und warum wird
      es gemieden?
    answer: Das Landesinnere wird von den Eingeborenen gemieden. Hierhin sollen die
      Utulus vor Jahrhunderten einen finsteren Gegner des Sonnensohns verbannt haben.
      Immer wieder werden tapfere Krieger ausgesandt, um das ‘Gefängnis’ – einen unheimlichen
      Ritualplatz inmitten von behauenen Felsen – zu inspizieren. Doch bis zum heutigen
      Tage kann von keinerlei Auffälligkeiten berichtet werden.
