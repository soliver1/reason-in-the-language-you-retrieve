      und nach Entscheidung der Mannschaft geht der Kampf bis zum ersten Blut, bis
      zur Kampfunfähigkeit oder bis zum Tod.
  G1-450:
  - question: Welche Flagge hissen die Piraten, wenn sie einen Kampf auf Leben und
      Tod führen wollen?
    answer: Die Piraten hissen eine blutrote Flagge, um anzuzeigen, dass sie einen
      Kampf auf Leben und Tod führen wollen.
    context: Wenn jedoch ein Kampf auf Leben und Tod gefochten werden soll, wird die
      blutrote Flagge an der Mastspitze aufgezogen. Dies ist beileibe nicht die gängige
      Taktik, denn sie ist allzu verlustreich. Und so droht ein solcher Kampf nur,
      wenn Todfeinde blind vor Hass aufeinander treffen.
  - question: Wie gehen Piraten normalerweise in einem Kampf gegen ein anderes Schiff
      vor?
    answer: Piraten bevorzugen es, das gegnerische Schiff schnell zu erreichen, mit
      Enterhaken festzumachen und zu entern. Sie vermeiden langwierige Geschützduelle.
    context: Im Kampf selber versuchen die Piraten, das gegnerische Schiff schnell
      zu erreichen, mit Enterhaken am eigenen Schiff festzumachen und zu entern. Für
      langwierige Geschützduelle fehlt ihnen meist die Ausrüstung, die Kenntnis oder
      die Geduld.
  - question: Welche Art von Schiffen bevorzugen Piraten als Ziel für ihre Angriffe?
    answer: Piraten bevorzugen es, Schiffe mit einer wertvollen Ladung wie zum Beispiel
      Gold oder Edelsteine zu kapern. Sie meiden Schiffe, die schwere Güter wie Korn
      oder Holz transportieren.
    context: Alles mitzunehmen ist selten möglich, da Piratenschiffe zu klein und
      maßgeblich auf Geschwindigkeit angewiesen sind – aus diesem Grund sind Kornschiffe
      oder solche mit Holz oder Baugeste-ein an Bord meist recht sicher vor Piraterie.
  - question: Wie verhalten sich Piraten gegenüber der Besatzung eines gekaperten
      Schiffs?
    answer: Piraten behandeln die Besatzung eines gekaperten Schiffs unterschiedlich,
      je nachdem, ob und wie stark sie sich gewehrt haben. Haben sie kampflos kapituliert,
      werden nur Geld und die wertvollste Ladung geraubt. Haben sie Widerstand geleistet,
      wird das ganze Schiff beschlagnahmt und die Mannschaft auf einem Beiboot ausgesetzt.
    context: Die Behandlung der Unterlegenen hängt stark davon ab, ob und wie stark
      sie sich gewehrt haben. Hat sich der Kauffahrer kampflos ergeben, werden nur
      seine Kasse und der größte Teil der Ladung geraubt.  Bei Widerstand wird üblicherweise
      das ganze Schiff beschlagnahmt und die Mannschaft in einem Beiboot oder an einem
      entlegenen Küstenabschnitt mit wenig Proviant ausgesetzt.
  - question: Welche Tricks verwenden Piraten, um ihre Opfer zu täuschen?
    answer: Piraten setzen verschiedene Tricks ein, um ihre Opfer zu täuschen und
      näher an das Schiff heranzukommen. Dazu gehören falsches Hissen von Flaggen,
      Verkleidung als harmlose Händler oder sogar das Einschleusen von Saboteuren
      in die Besatzung eines Handelsschiffs.
    context: Häufig werden Tricks angewendet, um den Gegner so lange zu täuschen,
      bis man nahe genug heran ist, um das Schiff entern zu können. Beliebt sind zum
      einen das Hissen falscher Flaggen bis hin zur Verkleidung der Mannschaft als
      harmlose Händler oder Siedler. Piraten haben auch schon als Matrosen auf einem
      Handelsschiff angeheuert, um die Bordwaffen zu sabotieren oder durch verdorbene
      Lebensmittel die überlegene Mannschaft auszuschalten.
  G1-451:
  - question: Welche Götter werden von den meisten Piraten verehrt?
    answer: Die meisten Piraten verehren Efferd, Phex, Rahja, Aves, Kor und Swafnir.
    context: Fast alle Seefahrer beten Efferd als Herrn von Wind und Wogen an. Da
      bilden auch Piraten und Freibeuter keine Ausnahme, denn kein anderer Gott hat
      – so die weitgehend einhellige Meinung – mehr Einfluss auf ihr Schicksal. Daneben
      genießen Phex, Rahja (in erster Linie als Göttin des Rauschs) und die Halbgötter
      Aves, Kor und Swafnir die meiste Verehrung.
  - question: Gibt es Piraten, die andere Gottheiten als die meistverehrten verehren?
      Wenn ja, welche?
    answer: Neben den genannten Göttern gibt es Ausnahmen. So beten manche Piraten
      Praios oder Rondra an, andere Waldmenschen Kamaluq und einige Novadi Rastullah.
    context: Kaum ein Pirat betet zu Praios oder Rondra, doch Ausnahmen gibt es ebenso,
      wie auch den einen oder anderen Waldmenschen, der Kamaluq anbetet, oder einen
      Novadi, der immer ein Rastullah-Anhänger bleiben wird. So vielfältig wie die
      Piraten sind auch ihre religiösen Überzeugungen.
  - question: Wie reagieren die meisten Piraten auf diejenigen unter ihnen, die Charyptoroth
      dienen? Wo befindet sich das Zentrum ihrer Aktivitäten?
    answer: Die meisten Piraten hassen und fürchten diejenigen unter ihnen, die sich
      den Göttern abgewandt haben und Charyptoroth und ihrem Gefolge dienen. Das Zentrum
      ihrer Aktivitäten liegt in der Blutigen See.
    context: Die finsteren Gesellen jedoch, die sich abgekehrt haben von den Göttern,
      und den Versuchungen der Erzdämonin Charyptoroth und ihres Gefolges anheim gefallen
      sind, werden von den meisten Piraten gehasst und gefürchtet. Das Zentrum charyptoroth-unheiliger
      Aktivität liegt allerdings in der Blutigen See. Und dorthin streben auch solche
      Seeleute aus dem Süden, die ihre Seele an die Herrin der Nachtblauen Tiefen
      verloren haben.
  G1-452:
  - question: Warum vergnügen sich Piraten an Land mit Suchtmitteln wie Alkohol und
      Glücksspiel?
    answer: Die Piraten verbringen ihre Zeit an Land mit Suchtmitteln wie Alkohol
      und Glücksspiel, weil sie sich nicht an das Leben an Land gewöhnt haben und
      auf die nächste Gelegenheit für eine Kaperfahrt warten.
    context: Andererseits jedoch sind sie so sehr an das Leben auf einem Schiff und
      auf See gewöhnt, dass sie an Land völlig orientierungslos und ohne Ziel ihre
      Zeit totschlagen. Im Leben der Landratten kennen sie sich nicht aus oder können
      sich nicht mehr an dieses anpassen, so dass sie zwischen Suff, Glückspiel und
      Hurerei auf die nächste Gelegenheit für eine Kaperfahrt warten.
  - question: Welche verschiedenen alkoholischen Getränke werden von Seeräubern bevorzugt?
    answer: Rum ist das beliebteste Getränk unter Seeräubern. Thorwalsche Piraten
      bevorzugen jedoch ihren Premer Feuer und Syllaner Freibeuter ihren Syllarak.
    context: Beliebtestes Getränk ist der Rum, wobei thorwalsche Piraten, auch wenn
      es sie in den Süden verschlagen hat, für immer ihr Premer Feuer vorziehen werden
      und ein Syllaner Freibeuter selbstverständlich nichts über seinen Syllarak kommen
      lässt.
  - question: Warum können Piraten keinen Schatz anhäufen?
    answer: Piraten können keinen Schatz anhäufen, weil sie ihn nicht mit an Bord
      nehmen können, ohne ihn sofort an ihre Kameraden zu verlieren. Außerdem haben
      die meisten keine sichere Zuflucht an Land, um ihren Schatz aufzubewahren.
    context: Schätze anzuhäufen ist einem Piraten nicht möglich, denn er kann sie
      nicht mit an Bord nehmen, ohne sie sofort an seine Kumpane zu verlieren. Und
      kaum einer hat eine Zuflucht an Land, die sicher genug ist und die er regelmäßig
      aufsucht.
  G1-453:
  - question: Welche Gruppen von Menschen gehören typischerweise zu den Bukanier?
    answer: Die Bukanier sind Nachkommen tulamidischer oder mittelländischer Siedler
      und Plantagenarbeiter, die die zivilisierte Lebensweise zugunsten der Wildbeuterei
      aufgegeben haben. Viele sind auch Flüchtlinge, Gestrandete verschiedener Kriege,
      Deserteure, Partisanen, Schiffbrüchige und entlaufene Sklaven.
    context: Auch die Bukanier verbindet eher ihre Lebensweise als die Zugehörigkeit
      zu einem echten Volk. Sie sind die Nachkommen tulamidischer oder mittelländischer
      Siedler und Plantagenarbeiter, die die zivilisierte Lebensweise ihrer Vorfahren
      zugunsten der barbarischen Wildbeuterei aufgegeben haben. Viele sind auch Flüchtlinge,
      Gestrandete verschiedener Kriege, Deserteure, Partisanen, Schiffbrüchige und
      entlaufene Sklaven.
  - question: Wie entstand die Sprache Charypto, welche von den Bukanier gesprochen
      wird?
    answer: Das Charypto ist ein wildes Gemisch aus Garethi und Tulamidya, das stark
      von südaventurischen Dialekten gefärbt ist und zahlreiche Elemente aus anderen
      Sprachen enthält. Prägend dafür waren die verschiedenen Mundarten der Waldmenschenstämme
      sowie das Thorwalsch.
    context: So wie schon die Bukanier selbst kein einheitliches Volk sind, hat sich
      unter ihnen das Charypto als Verständigungsform herausgebildet. Dies ist ein
      wildes Gemisch aus Garethi und Tulamidya, das stark von südaventurischen Dialekten
      gefärbt ist und zahlreiche Elemente aus anderen Sprachen enthält. Prägend dafür
      waren die verschiedenen Mundarten der Waldmenschenstämme sowie das Thorwalsch,
      das viele Dinge einfach, treffend und oft derb beschreibt.
  - question: Wo leben die Bukanier hauptsächlich?
    answer: Die Bukanier leben vor allem auf den Pirateninseln Altoum, Souram und
      Nikkali, doch gibt es auch auf anderen Waldinseln und im Gebiet zwischen Sylla
      und Hôt-Alem sowie zwischen Mirham und Selem viele Menschen mit vergleichbarer
      Lebensweise.
    context: Die Bukanier leben vor allem auf den Pirateninseln Altoum, Souram und
      Nikkali, doch gibt es auch auf anderen Waldinseln und im Gebiet zwischen Sylla
      und Hôt-Alem sowie zwischen Mirham und Selem viele Menschen mit vergleichbarer
      Lebensweise.
  - question: Was passiert mit dem größten Teil des Wildbrets, welches die Bukanier
      erlegen?
    answer: 'Nur ein Teil der erlegten Beute wandert in ihre Mägen – der Rest wird
      in Form von Trockenfleisch und grob gegerbten Häuten eingetauscht. '
    context: Heute ist aus der Jagd bei den Bukaniern fast ein Handwerk geworden.
      Nur ein Teil der erlegten Beute wandert in ihre Mägen – der Rest wird in Form
      von Trockenfleisch und grob gegerbten Häuten eingetauscht.
  G1-454:
  - question: Wie werden wichtige Entscheidungen unter den Bukanieren getroffen?
    answer: Die Entscheidungen werden in der örtlichen Schänke durch einfache Mehrheitsentscheide
      getroffen.
    context: Wichtige Abstimmungen, die alle betreffen werden bei der Versammlung
      in der örtlichen Schänke durch einfache Mehrheitsentscheide getroffen.
  - question: Welche Funktionen erfüllt die Schänke neben ihrer Rolle als Versammlungsort?
    answer: Die Schänke dient neben dieser Rathausfunktion ebenso als Gericht wie
      auch als Treffpunkt der übelsten Gesellen, die stets bereit sind, sich an den
      Meistbietenden zu verdingen – natürlich ohne jeden Begriff von Loyalität oder
      Diensttreue.
    context