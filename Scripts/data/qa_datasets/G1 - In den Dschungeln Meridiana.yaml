      dahin. Kamaluq lenkte das erste Boot.
  - question: Wie wurde verhindert, dass die Insel, die Kamaluq aus dem Meer gezogen
      hatte, weiter trieb?
    answer: Aus dem Spinnenkokon schlüpften Spinnen, die ihre Fäden in die Wolken
      spannen und so verhinderten, dass die Insel forttrieb.
    context: 'Aus dem Spinnenkokon schlüpften Spinnen, die ihre Fäden in die Wolken
      spannen und so verhinderten, dass die Insel forttrieb. '
  - question: Was passiert mit dem Blut, das Zecken von ihren Opfern saugen, laut
      einer Sage der Miniwatu?
    answer: Sie tragen es zu ihrer Königin Sumu-ca, die unter der Erde schläft und
      deren Leib immer weiter anschwillt.
    context: Einer Sage der Miniwatu nach sammeln die Zecken das Blut ihrer Opfer
      nicht für sich selbst. Sie tragen es zu ihrer Königin Sumu-ca, die unter der
      Erde schläft und deren Leib immer weiter anschwillt.
  - question: Was passiert, wenn jemand Tango-Tsch-Ha-Tanga stört?
    answer: Wer ihn stört, der erschreckt ihn. Dann verschluckt er sich. Und der Zeitenfluss
      gerät in Unordnung.
    context: 'In einem Tabu, das von den besten Kriegern der Oijaniha bewacht wird,
      soll Tango-Tsch-Ha-Tanga (moh.: Vater sehen-schwarz-Mann-Vater fallen) leben,
      der Schwarze Mann. Er frisst die Zeit. Wer ihn stört, der erschreckt ihn. Dann
      verschluckt er sich. Und der Zeitenfluss gerät in Unordnung.'
  - question: Warum gibt es im 'Tal des lebenden Wassers' keine Tabuzeichen?
    answer: 'Da jedes Kind der Chirakaka die Taya dieses Ortes kennt, existieren keine
      Tabuzeichen. '
    context: Da jedes Kind der Chirakaka die Taya dieses Ortes kennt, existieren keine
      Tabuzeichen.
  - question: Was passiert laut der Sage, wenn jemand Viel-Bunt-Flügel-das-Sturm-sät
      weckt?
    answer: Man sagt, dann würde es mit den Flügeln schlagen, und ein großer Sturm
      würde aufziehen, um die Bäume zu knicken und den Tollpatsch samt Familie hinwegzufegen.
    context: Doch wehe dem, der das Wesen weckt. Man sagt, dann würde es mit den Flügeln
      schlagen, und ein großer Sturm würde aufziehen, um die Bäume zu knicken und
      den Tollpatsch samt Familie hinwegzufegen.
  - question: Wer tötete das Wesen, das einst zu einem Wesen gehörte, das das letzte
      seiner Art war?
    answer: Haya-Tepe, der Sohn des Häuptlings, tötete es – nachdem alle anderen schon
      die Waffen gesenkt hatten.
    context: Als es die Jäger vor vielen Regenzeiten stellten, bat es um Gnade, doch
      Haya-Tepe, der Sohn des Häuptlings, tötete es – nachdem alle anderen schon die
      Waffen gesenkt hatten.
  - question: Was passiert, wenn jemand etwas von dem Staub erhascht, der Viel-Bunt-Flügel-das-Sturm-sät
      umgibt?
    answer: Gelingt es dem Finder, ein wenig von dem Staub zu erhaschen, der das Geschöpf
      umweht, wird er großes Glück finden, ein starker Krieger mit vielen Nachkommen
      werden und seiner Sippe wird es lange Zeit gut gehen.
    context: Doch wehe dem, der das Wesen weckt. Man sagt, dann würde es mit den Flügeln
      schlagen, und ein großer Sturm würde aufziehen, um die Bäume zu knicken und
      den Tollpatsch samt Familie hinwegzufegen.
  - question: Was für eine Art Wesen ist Rachsüchtiger-der-mit-dem-Wind-tötet?
    answer: Es ist ein Geist, der einst zu einem Wesen gehörte, das das letzte seiner
      Art war.
    context: Die Taya der Anoihas berichten von dem Wesen Rachsüchtiger-der-mit-dem-Wind-tötet.
      Es ist ein Geist, der einst zu einem Wesen gehörte, das das letzte seiner Art
      war.
  G1-042:
  - question: Wie wird die Geschichte des aventurischen Südens in diesem Text charakterisiert?
    answer: Die Geschichte des aventurischen Südens wird in dieser Darstellung als
      bunt, ausschweifend und verwirrend beschrieben.
    context: 'Eine Historie des aventurischen Südens muss zwangsläufig – wie das Leben
      dort – bunt, ausschweifend und verwirrend sein. '
  - question: Welche Rolle spielt die Schwarze Perle Al'Anfa in der Darstellung der
      Geschichte des Südens?
    answer: Obwohl die Schwarze Perle Al’Anfa im Mittelpunkt der Betrachtungen steht,
      sollen alle anderen Reiche, Stadtstaaten und Einflussgebiete im größeren Zusammenhang
      betrachtet werden.
    context: 'Zwar steht im Mittelpunkt der folgenden Betrachtungen stets die Schwarze
      Perle Al’Anfa als größte und einflussreichste Stadt des Südens, doch werden
      all die anderen Reiche, Stadtstaaten und Einflussgebiete möglichst im größeren,
      zusammenhängenden Rahmen präsentiert. '
  - question: Welche Einschränkung hinsichtlich der Kenntnis der Geschichte des Südens
      wird im Text gemacht?
    answer: Die hier dargestellte Historie ist detailreicher und komplexer als das
      Wissen, welches aventurischen Gelehrten zur Verfügung steht. Geschichtsschreibung
      wird in Meridiana oft von Herrschenden kontrolliert und dient propagandistischen
      Zwecken.
    context: 'Zur Beachtung: Die hier präsentierte Historie ist in dieser Dichte und
      mit diesen Zusammenhängen keinem aventurischen Gelehrten bekannt, denn auch
      in Meridiana ist Geschichtsschreibung zunächst einmal Herrschaftsgeschichte
      und Propaganda. '
  G1-043:
  - question: Welche sechs Echsenrassen dominierten das Zehnte Zeitalter?
    answer: Die Echsenrassen Achaz, Marus, Leviatanim, Ssrkhrsechim, Shinthr und Jhrarhra.
    context: Als Nachfolger dieser aquatischen Wesen gelten die Echsenrassen der Achaz,
      Marus, Leviatanim, Ssrkhrsechim, Shinthr und Jhrarhra, die das folgende Zehnte
      Zeitalter dominieren sollten.
  - question: Welche Rolle spielten die Shinthr in der achäischen Gesellschaft?
    answer: Die Shinthr waren eine kleine, herrschende Kaste von Priestern und Zauberern,
      die zum Sonnengott, aber auch zu anderen H’Ranga beteten.
    context: Als kleine, aber herrschende Kaste der Priester und Zauberer fungierten
      die kobraköpfigen Shinthr, die zum Sonnengott, aber auch zu anderen H’Ranga
      beteten.
  - question: Wer griff in den Konflikt zwischen den Achaz und den Sumurrer ein?
    answer: Der Alte Drache Pyrdacor, nachdem er den Ersten Drachenkrieg in der Dritten
      Sphäre überlebt hatte.
    context: Als seine Zeit zu Ende ging, war ihr wichtigster Gegner das Volk der
      menschlichen Sumurrer, etwa aus dem heutigen Aranien. Die sumurrischen Vorstöße
      nach Süden weckten schließlich die Neugier und dann den Zorn des Alten Drachen
      Pyrdacor. Der nach dem Ersten Drachenkrieg in der Dritten Sphäre verbliebene
      Pyrdacor beschloss, die Herrschaft über die Echsenvölker an sich zu reißen und
      das Ende ihres Zeitalters hinauszuzögern.
  - question: Wie brachte Pyrdacor die Dschungel des Echsenreiches zum Wuchern?
    answer: Pyrdacor öffnete mit dem Schlüssel des Humus einen magischen Kanal von
      der Zitadelle der Elemente in die Südhälfte des Kontinents. Dadurch wurden die
      sagenumwobenen Dschungel des Echsenreiches Zze’Tha zum Wuchern gebracht, deren
      Reste wir heute in den Regenwäldern von Maraskan, Meridiana und den Waldinseln
      sehen.
    context: Und so öffnete der Goldene Drache – in mythischen Zeiten zum Hüter der
      Elemente bestimmt – mit dem Schlüssel des Humus einen magischen Kanal von der
      Zitadelle der Elements in die Südhälfte des Kontinents. Die elementaren Energien
      ließen die sagenumwobenen Dschungel des Echsenreiches Zze’Tha wuchern, deren
      Reste wir heute in den Regenwäldern von Maraskan, Meridiana und den Waldinseln
      sehen.
  - question: Wo stehen noch heute Stufenpyramiden der Echsenvölker?
    answer: H’Rabaal und Gulagal am mittleren Mysob.
    context: 'Noch heute stehen am mittleren Mysob, in H’Rabaal und Gulagal als stumme
      Zeugen ihre Stufenpyramiden. '
  - question: Welche Kreaturen werden in den Höhlenmalereien der Anoihas dargestellt?
    answer: Sphingen, Greifen, Rote Jaguare.
    context: Die Höhlenmalereien der Anoihas zeigen Sphingen und Greifen, uralte Tabus
      und Tayas berichten von Roten Jaguaren, die vom Himmel stiegen und sich auf
      den Stufenbergen niederließen.
  G1-044:
  - question: Welches Reich entstand durch die Gründung von H’Rabaal?
    answer: Das Echsenreich von H’Rabaal.
    context: Die Gründung von H’Rabaal als religiöses Zentrum der im Süden lebenden
      Echsen bildete den Auftakt zur Errichtung des Echsenreichs von H’Rabaal ab etwa
      4500 v.BF. Es dehnte sich bis zum heutigen Brabak aus und sollte rund 3.600
      Jahre Bestand haben.
  - question: Welche Völker führten die ersten Aufstände gegen die Diener des Gottdrachen?
    answer: Waldmenschen und ein Volk, das vermutlich zu den Vorgängern der Kemi wurde.
    context: Hierbei handelte es sich um Waldmenschen, aber auch um ein anderes Menschenvolk,
      das vermutlich zu den Vorgängern der Kemi wurde.
  - question: Beschreibe die Entwicklung und den Verfall des Kemi-Reichs.
    answer: Das Kemi-Reich erblühte unter Peri I. auf der alemitischen Halbinsel für
      etwa sieben Jahrhunderte, bevor es im Anfang des zweiten vorbosparanischen Jahrtausends
      bereits wieder im Niedergang war.
    context: Etwa ab 2800 v.BF erblühte unter Peri I. die auf der alemitischen Halbinsel
      errichtete Hochkultur des Kemi-Reiches (begründet vom mythischen König Kacha)
      für etwa sieben Jahrhunderte. Sie befand sich Anfang des zweiten vorbosparanischen
      Jahrtausends aber bereits wieder im Niedergang.
  G1-045:
  - question: Wann entstand das erste Sultanat der Tulamiden und was war sein Anlass?
    answer: Die Tulamiden entstanden etwa 400 Jahre nach Pyrdacors Ende und errichteten
      das Erste Sultanat der Tulamiden.
    context: Kaum vierhundert Jahre nach Pyrdacors Ende errichteten die Ureinwohner
      des Raschtulswalls und Mhanadistans das Erste Sultanat der Tulamiden und stellten
      sich dem Kampf gegen die überlebenden Echsenvölker.
  - question: Welche militärischen Erfolge erzielte Bastrabun ibn Rashtul?
    answer: Bastrabun ibn Rashtul vertrieb die letzten Echsen von Yash’hualay (dem
      späteren Khunchom) auf die Insel Marustan (Maraskan) und drängte die Leviatanim
      bis Loch Harodrôl und H’Rabaal zurück.
    context: Etwa 1750 v.BF vollendete Bastrabun ibn Rashtul seinen großen Bannspruch.
      Er vertrieb die letzten Echsen von Yash’hualay (dem späteren Khunchom) auf die
      Insel Marustan (Maraskan) und zwang mit seinen schwer gepanzerten Kataphrakten
      die Leviatanim bis Loch Harodrôl und H’Rabaal zurück, wo diese um die bereits
      zu diesem Zeitpunkt uralte Stadt ein neues Reich errichteten.
  - question: Welche Faktoren trugen zum Aufstieg des Emirates Mirham bei?
    answer: Das Emirat Mirham wurde durch den Handel mit Seide, Edelsteinen, Sklaven
      und Edelhölzern sehr reich.
    context: Die Emire von Mirham machten das Land urbar und errichteten den ersten
      Seidenhandel über Elem. Dies hatte nicht nur einen Aufstieg des Emirates Mirham
      zur Folge (Al’Anfa wurde bis ins 7. Jh. v.BF durch Wesire des reichen Emirates
      Mirham verwaltet). Der Handel begründete mit seinen Tributen (Seide, Edelsteine,
      Sklaven und Edelhölzer) auch den märchenhaften Reichtum des Großsultanats Elem,
  - question: Wann erreichten die Elemitischen Seefahrer das Perlenmeer?
    answer: DieElemitischen Seefahrer erreichten um 1400 v.BF die Küsten des Perlenmeers.
    context: 'Etwa 1400 v.BF sind erstmals tulamidische Seefahrer an den Küsten des
      Perlenmeers unterwegs: alte Schriftrollen erwähnen ‘elemitische Zedrakkenflotten
      mit den Schätzen aus Mirham’.'
  - question: Welchen Angriff befahl der Diamant Sultan Amr al-Dhubb und warum?
    answer: Der Diamant Sultan Amr al-Dhubb befahl um 1200 v.BF einen Angriff auf
      die echsischen Tempelpyramiden von H’Rabaal, Gulagal und Nabuleth.
    context: ' Aufgrund alter Märchen befahl der Diamante Sultan Amr al-Dhubb um 1200
      v.BF einen Angriff auf die echsischen Tempelpyramiden von H’Rabaal, Gulagal
      und Nabuleth.'
  - question: Wann und wie ging das zweite Kemi-Reich unter?
    answer: Das zweite Kemi-Reich ging 960 v.BF durch Angriffe verfeindeter Waldmenschenstämme
      zugrunde.
    context: 960 v.BF verging das zweite Kemi-Reich durch Angriffe verfeindeter Waldmenschenstämme.
  G1-046:
  - question: Welche Auswirkungen hatte Glowasils Terror auf das Emirat Mirham?
    answer: Glowasil tyrannisierte das Emirat Mirham.
    context: Um 1500 v.BF begann der Purpurwurm Glowasil das Emirat Mirham zu tyrannisieren.
      Karawanen und Plantagen fielen seinem Feueratem und seiner Beherrschungszauberei
      zum Opfer.
  - question: Wie bereitete sich Arika auf den Kampf gegen Glowasil vor?
    answer: Arika versteckte sich in einem selbstgegrabenen Loch unter Palmenblättern
      vor der Höhle Glowasils.
    context: Vor der Höhle ließ sie ein Loch graben und verbarg sich darin unter Palmenblättern.
      Als die Drachin erschien, wurden die Bogenschützen von ihrer Zauberei in die
      Flucht geschlagen oder in den Wahnsinn getrieben.
  - question: Nenne zwei weitere berühmte Drachentöter neben Arika.
    answer: 'Neben Arika gehören Festo von Aldyra und Geron dem Einhändigen zu den
      berühmten Drachentötern der aventurischen Geschichte. '
    context: Arika ist eine der berühmten, anerkannten Drachentöter der aventurischen
      Geschichte und steht neben Festo von Aldyra, der den Drachen von Festum vergiftete,
      und Geron dem Einhändigen, der mit dem Schwert Siebenstreich den Wurm von Chababien
      und den Ewigen Drachen von Phecadien tötete.
  G1-047:
  - question: Welche Kreaturen unterstützten die Magier-Priester der Ssrkhrsechim?
    answer: Die Magier-Priester der Ssrkhrsechim wurden von den 'Geflügelten' und
      Marus unterstützt.
    context: Schriftrollen der alanfanischen Universität zufolge wurde jede der Stufenpyramiden
      von H’Rabaal, Gulagal und Nabuleth von einem Magier-Priester der Ssrkhrsechim
      geleitet, dem zahllose ‘Geflügelte’ und Marus unterstanden.
  - question: Wie gelang es dem dritten Magier-Priester zu entkommen?
    answer: Der dritte Priester konnte entkommen, indem er den Kessel der Wiedergeburt
      verschwinden ließ und mit seinem Gefolge in eine Nebenwelt floh.
    context: 'Der dritte Priester aber konnte entkommen: Es heißt, dass die Kataphrakten
      (Panzerreiter), nachdem sie sich durch Heerscharen echsischer Monstrositäten
      gekämpft hatten, die Hand bereits auf den Kessel der Wiedergeburt gelegt hatten.
      Aber der Ssrkhrsech konnte selbigen verschwinden lassen und entkam mit seinem
      Gefolge in eine Nebenwelt (siehe auch das Abenteuer Inseln im Nebel im Sammelband
      Die Phileasson-Saga).'
  - question: Zu welcher Gruppe von Artefakten gehört der Kessel der Wiedergeburt?
    answer: Der Kessel der Wiedergeburt ist einer der legendären 'Dreizehn Kessel
      der Urkräfte'.
    context: Der Kessel der Wiedergeburt ist einer der legendären ‘Dreizehn Kessel
      der Urkräfte’, von denen es in H’Rezxem und Raxx’Mal weitere gegeben haben soll.
      Mehr dazu finden Sie in SRD 54 ff..
  G1-048:
  - question: Wer besiegte die Bestie Harodia?
    answer: Geron des Einhändigen
    context: Irgendwann zwischen Mitte und Ende des zweiten vorbosparanischen Jahrtausends
      fällt auch der Sieg Geron des Einhändigen über die Bestie Harodia.
  - question: Welche Eigenschaft der Bestie wird in den Quellen übereinstimmend beschrieben?
    answer: 'Die Quellen sind sich einig, dass die Bestie eine geradezu dämonische
      Fähigkeit der Regeneration hatte. '
    context: 'Die zahlreichen Quellen – von den hesindianischen Annalen des Götteralters
      über das Buch Geron im Rondrarium bis zu den Sammlungen der Volksmärchen – zeichnen
      jedoch ein sehr unterschiedliches Bild von diesem Ungetüm. Von sieben riesenhaften
      Schlangenhälsen wird berichtet, von der Fähigkeit, die Gestalt zu wechseln,
      von zersetzend giftigem Blut und von abgetrennten Körperteilen, die wieder anwuchsen.
      Über zwei Fakten sind sich jedoch alle Legenden und Märchen einig: Die Bestie
      hatte eine geradezu dämonische Fähigkeit der Regeneration.'
  - question: Wie gelang es Geron, den Fluch der Bestie zu brechen?
    answer: Geron konnte diesen Fluch – nach drei vergeblichen Angriffen mit dem legendären
      Schwert Siebenstreich – erst brechen, als er die Macht aller Götter zur Hilfe
      rief.
    context: 'Geron konnte diesen Fluch – nach drei vergeblichen Angriffen mit dem
      legendären Schwert Siebenstreich – erst brechen, als er die Macht aller Götter
      zur Hilfe rief. '
  G1-049:
  - question: Wer beherrschte Südaventurien vor dem Bosparanischen Reich?
    answer: Die Tulamiden
    context: Ich suche nach den Herrschern von Südaventurien vor dem Aufstieg des
      Bosparanischen Reichs.
  - question: Welche Völker profitierten vom Rückzug der Tulamiden aus Südaventurien?
    answer: Die Wudu und die Kemi
    context: Dass es dem Bosparanischen Reich nicht gelang, in den verlassenen Gebieten
      die eigene Macht zu begründen, liegt zum großen Teil an den gleichzeitig aufblühenden
      Eingeborenenreichen der Wudu und den neu erstarkenden Kemi (wobei letztere sogar
      die Moskitoinseln besiedelten).
  - question: Wann brach die Erste Seuche in Al'Anfa aus?
    answer: 650 v.BF
    context: Etwa 650 v.BF suchte die Erste Seuche (vermutlich Zorgan-Pocken) Al’Anfa
      heim und drohte ständig, auch auf Mirham überzugreifen.
  - question: Was war das letzte Schiff, das Mirham verließ?
    answer: Eine viermastige Zedrakke
    context: Die örtliche Sage berichtet, dass das letzte Schatzschiff aus Mirham,
      eine viermastige Zedrakke, am Ausgang der Bucht von Mirham auf ein Riff lief
      und sank – mit einer Jahresproduktion an Opalen an Bord.
  - question: Welche kostbare Ware transportierte das letzte Schiff aus Mirham?
    answer: Opale
    context: Die örtliche Sage berichtet, dass das letzte Schatzschiff aus Mirham,
      eine viermastige Zedrakke, am Ausgang der Bucht von Mirham auf ein Riff lief
      und sank – mit einer Jahresproduktion an Opalen an Bord.
  - question: Wer ließ den Leuchtturm von Sylla errichten?
    answer: Fran-Horas
    context: Sein Enkel Fran-Horas errichtete hier etwa 580 v.BF den berühmten Leuchtturm
      von Sylla, der bis heute als eines der Zwölf Menschenwunder gilt.
  - question: Wann wurde der Leuchtturm von Sylla gebaut?
    answer: 580 v. BF
    context: Sein Enkel Fran-Horas errichtete hier etwa 580 v.BF den berühmten Leuchtturm
      von Sylla, der bis heute als eines der Zwölf Menschenwunder gilt.
  - question: Wer nutzte die verlassenen Garnisonen nach dem Abzug der Tulamiden?
    answer: Sklavenjäger
    context: Die verlassenen Garnisonen wurden weiter von tulamidischen Sklavenjägern
      genutzt, die Hunderte von Waldmenschen ins Reich der Ersten Sonne verschleppten.
  - question: Wen verschleppten die Tulamiden nach ihrem Abzug als Sklaven?
    answer: Waldmenschen
    context: Die verlassenen Garnisonen wurden weiter von tulamidischen Sklavenjägern
      genutzt, die Hunderte von Waldmenschen ins Reich der Ersten Sonne verschleppten.
  - question: Welcher Friedenskaiser befahl die Annexion von Shila?
    answer: Thuan-Horas
    context: Friedenskaiser Thuan-Horas war zwar schon im Jahr zuvor verstorben, doch
      wurde durch seinen Befehl der Hafen Shila an der Altoum-Straße durch das Bosparanische
      Reich annektiert und in Sylla umbenannt.
  - question: Welche Route sollte die Straße von Brabak aus nehmen?
    answer: Das Mysob entlang und quer durch den Regenwald
    context: Der Versuch, von der Kronkolonie Brabak aus eine Straße entlang dem Mysob
      und quer durch den Regenwald zu bauen, kostete hunderten von Menschen das Leben.
  G1-050:
  - question: In welchem Zeitraum spielt die Sage von der Mirhamer Brautwerbung?
    answer: Die Mirhamer Brautwerbung soll etwa um 700 v.BF stattgefunden haben.
    context: Eine der bekanntesten und ausschweifendsten der Aventurischen Götter-
      und Heldensagen ist die von der Mirhamer Brautwerbung, die etwa in die Zeit
      um 700 v.BF datiert wird.
  - question: Warum versammelten sich so viele Helden vor dem Palast des Emirs?
    answer: Sheyrazada wollte nur den größten Helden Aventuriens heiraten und viele
      Helden kamen, um sie zu beeindrucken.
    context: Sheyrazada, die Tochter des Emirs, soll so schön und anspruchsvoll gewesen
      sein, dass sie nur den größten Helden Aventuriens heiraten wollte. Über ein
      Jahr lang trafen aus allen Himmelsrichtungen Helden ein (die wohl unter den
      Friedenskaisern wenig zu tun hatten) und lagerten vor dem Palast.
  - question: Was führte zur Zerstörung der Stadt Mirham?
    answer: Der Emir wurde von einem Helden erschlagen, während er einen Stapellauf
      über Sklaven veranstaltete. Daraufhin brannten die Helden die Stadt nieder.
    context: ' Schließlich gar wird der Emir, als er nach tulamidischem Brauch einen
      Stapellauf über die Leiber lebender Sklaven vorführt, von einem erzürnten Helden
      erschlagen, und die entfesselten Helden brandschatzen die Stadt.'
  G1-051:
  - question: Wann fand der Staatsbesuch des Fran-Horas in Al'Anfa statt?
    answer: Im Jahre 606 v.BF.
    context: Merkwürdig ist der überlieferte ‘Staatsbesuch’ des Fran-Horas in Al’Anfa
      im Jahre 606 v.BF, denn zu diesem Zeitpunkt ist der schwarze Visraberg der Stadt
      bereits Zentrum des unheimlichen und kaum horasgefälligen Wudu-Kultes.
  - question: Warum wird der Staatsbesuch des Fran-Horas als merkwürdig bezeichnet?
    answer: Der schwarze Visraberg der Stadt ist bereits Zentrum des unheimlichen
      und kaum horasgefälligen Wudu-Kultes.
    context: Merkwürdig ist der überlieferte ‘Staatsbesuch’ des Fran-Horas in Al’Anfa
      im Jahre 606 v.BF, denn zu diesem Zeitpunkt ist der schwarze Visraberg der Stadt
      bereits Zentrum des unheimlichen und kaum horasgefälligen Wudu-Kultes.
  - question: Welche politische Veränderung setzt Fran-Horas nach seinem Besuch in
      Al'Anfa im Alten Reich durch?
    answer: Er führt im ganzen Alten Reich die Sklaverei für Kriegsgefangene und Verbrecher
      ein.
    context: Erstaunlich ist jedoch, dass Fran-Horas kurz darauf im ganzen Alten Reich
      die Sklaverei für Kriegsgefangene und Verbrecher einführt. Und noch heute rätseln
      Magiehistoriker, welch verderbtes Wissen der Dämonenkaiser damals aus dem Süden
      mit nach Hause nahm.
  G1-052:
  - question: Bis zu welchem Jahr beherrschten die Wudu die gesamte Syllanischeen
      Halbinsel?
    answer: Um 450 v.BF beherrschten sie zeitweise die gesamte Syllanischeen Halbinsel
      bis Sylla.
    context: Vornehmlich waren sie um Al’Anfa und Mirham zu finden, um 450 v.BF zeitweise
      auf nahezu der gesamten Syllanischeen Halbinsel bis Sylla.
  - question: Welcher Gott war das Zentrum des Glaubens der Wudu?
    answer: Der Todesgott Visar.
    context: Im Mittelpunkt ihres Glaubens stand der Todesgott Visar.
  - question: Warum praktizierten die Wudu einen exzessiven Todes- und Opferkult?
    answer: "Sie schlachteten Menschen zu Hunderten, um den Gott Visar zu besänftigen
      und seine 'Ernte' an Toten zu gewährleisten. "
    context: Speziell auf den Schwarzen Pyramiden am Fuß des Visarberges, die sie
      nach den Tulamiden besetzt hatten, pflegten sie einen exzessiven Todes- und
      Opferkult und schlachteten Menschen zu Hunderten.
  - question: Welche Rolle spielte der Leichenblasse Prophet Nemeka für die Wudu?
    answer: Er soll ihnen das volle Verständnis des Gottes gebracht und danach noch
      viele Jahrhunderte als ihr geistiger Führer gelebt haben.
    context: Eine wichtige Rolle spielte neben gewissen Geistern (die die Toten einer
      Opferzeremonie oder eines Schlachtfeldes davontrugen) und Tschumbies (die als
      die erwählten Krieger Visars galten) auch – in späterer Zeit – der ‘Leichenblasse
      Prophet’ Nemeka. Er war es, der den Wudu das volle Verständnis des Gottes gebracht
      und danach noch viele Jahrhunderte als ihr geistiger Führer gelebt haben soll.
  - question: Wer übernahm nach dem Syllanischen Turmsturz die Macht in Sylla?
    answer: Ismaban, eine tulamidische Offizierin, ernannte sich zur Harani von Sylla
      und ‘Säbelkönigin’.
    context: Im Jahr 548 v.BF kam es bei Aufständen zum ‘Syllanischen Turmsturz’,
      bei dem die bosparanischen Beamten und Offiziere vom Leuchtturm geworfen wurden
      und sich die tulamidische Offizierin Ismaban zur Harani von Sylla und ‘Säbelkönigin’
      ernannte.
  - question: Warum beschloss man, das Schwert Siebenstreich zu zerstören?
    answer: Da es in diesen Zeiten keinen würdigen Helden mehr gäbe, der es hätte
      führen können.
    context: Geweihte aller Kirchen beschlossen zu jener Zeit, das Schwert Siebenstreich
      in seiner Gestalt zu zerstören, da es in diesen Zeiten keinen würdigen Helden
      mehr gäbe, der es hätte führen können.
  G1-053:
  - question: Wie sahen Nemekaths Anhänger den Tod?
    answer: Nemekath predigte den erlösenden Tod als Mittel zum Seelenheil und seine
      Anhänger glaubten, dass der Tod durch Rauschkrautorgien ihre Seele befreien
      würde.
    context: Denn sein Todeskult predigte den erlösenden Tod als Mittel zum Seelenheil.
      Die Flucht in den Dunst der Rauschkrautorgien löste bei vielen den fanatischen
      Glauben an den Propheten Nemekath aus.
  - question: In welchem Jahr und wo fand der Massenselbstmord statt, bei dem Anhänger
      Nemekaths in den Tod gingen?
    answer: 502 v.BF kam es zu einem Massenselbstmord vor dem Boron-Tempel zu Kuslik,
      bei dem über 400 Jünger des Rabensohnes in den Freitod gingen.
    context: Derart angestachelt kam es 502 v.BF zu einem Massenselbstmord vor dem
      Boron-Tempel zu Kuslik, bei dem über 400 Jünger des Rabensohnes in den Freitod
      gingen.
  - question: Wer führte die Überlebenden des Vulkanausbruchs in Palakar an und wohin
      zogen sie?
    answer: Nihrman, der Oberpriester der Überlebenden Nemekathäer, führte sie nach
      Mengbilla auf dem Festland. Von dort aus verbreiteten sie den Boron-Kult später
      nach Al’Anfa.
    context: Daraufhin zogen die Überlebenden Nemekathäer unter ihrem Oberpriester
      Nihrman zurück aufs Festland nach Mengbilla, von wo aus sie den Boron-Kult viele
      hundert Jahre später weiter nach Al’Anfa brachten.
  G1-054:
  - question: Wann und wo gründete Prinz Ukhraban Hôt-Elem?
    answer: Prinz Ukhraban gründete Hôt-Elem im Jahr 341 v.BF am Tirob.
    context: 'Mit der Gründung HôtElems (tulamidisch: Groß-Elem, das spätere Hôt-Alem;
      341 v.BF) am Tirob durch Prinz Ukhraban gelang wieder die Etablierung einer
      weiteren größeren Stadt im Süden.'
  - question: Woher stammten die Söldner, auf die sich die Elemiten zunehmend stützten?
    answer: Die Elemiten setzten zunehmend auf Söldner aus dem Unterwasserreich Wajahd,
      das sich irgendwo im westlichen Perlenmeer befindet.
    context: Zunehmend stützten die Elemiten ihre Macht auf Söldner aus dem Unterwasserreich
      Wajahd, irgendwo im westlichen Perlenmeer.
  - question: Was war die Folge der großen Schlacht im Jahr 336 v.BF?
    answer: Nach der vernichtenden Schlacht gegen die Wudu im Jahr 336 v.BF wurde
      die Macht der Wudu zum ersten Mal schwer angeschlagen.
    context: In der großen Schlacht 336 v.BF, an der sogar ein Greifenreiter aus Bosparan
      beteiligt gewesen sein soll, wurde die Macht der Wudu zum ersten Mal schwer
      angeschlagen.
  - question: 'Wen besiegte Großsultan Ghulshev von Elem '
    answer: Großsultan Ghulshev von Elem eroberte Belenas und benannte es in Mengbilla
      um.
    context: Dort vernichtete Großsultan Ghulshev von Elem etwa 200 v.BF in der Dreivölkerschlacht
      die bosparanischen Entsatztruppen. Anschließend eroberte er das bis dato faktisch
      unabhängige Belenas, das unter dem neuen Namen Mengbilla in das weit gespannte
      Reich eingefügt wurde.
  G1-055:
  - question: Wie gelang es den Tulamiden schließlich den Dornenwall zu überwinden?
    answer: Der Großsultan ließ aus Seidenpapier Drachen bauen und damit Grassamen
      aussäen.
    context: Nachdem die monströsen Söldner daran gescheitert waren, ließ der Großsultan
      – dem Rat einer kleinen Reisbäuerin folgend – aus Seidenpapier Drachen bauen
      und damit Grassamen aussäen.
  - question: Was geschah mit den Wudu nach dem Brand des Dornwalls?
    answer: Die elemitischen Kataphrakten stürmten, fast unverwundbar, durch die letzten
      Flammen und machten alle Wudu nieder, die das Feuer überlebt hatten.
    context: Die elemitischen Kataphrakten stürmten, fast unverwundbar, durch die
      letzten Flammen und machten alle Wudu nieder, die das Feuer überlebt hatten.
  - question: Welche Bedeutung hat das Märchen von den Grassamen für die Tulamiden?
    answer: Das Märchen von den Grassamen gilt bis heute als Inbegriff tulamidischer
      Tugenden wie Geduld, Klugheit und Gnadenlosigkeit.
    context: Bis heute gilt das Märchen von den Grassamen als Inbegriff tulamidischer
      Tugenden wie Geduld, Klugheit und Gnadenlosigkeit.
  G1-056:
  - question: Wie gelang es Großsultan Ghulshev Mengbilla zum Angriff auf die kaiserlichen
      Truppen zu bewegen?
    answer: Großsultan Ghulshev sandte einen Boten zu Mengbillas Befehlshaber, um
      eine kurzfristige Allianz gegen den Kaiser zu schmieden.
    context: Da sandte Großsultan Ghulshev quer über das Schlachtfeld einen berittenen
      Boten zum Befehlshaber Mengbillas. Usim-Horas’ General war klar, was ihm drohte,
      falls sich die beiden Kontrahenten auch nur kurzfristig verständigen sollten,
      und gab seiner Reiterei den Angriffsbefehl.
  - question: Warum trägt die Schlacht den Namen 'Dreivölkerschlacht'?
    answer: 'Die Dreivölkerschlacht wurde so genannt, weil drei Parteien daran beteiligt
      waren: das Großsultanat Elem unter Führung von Großsultan Ghulshev, der Stadtstaat
      Mengbilla und das Kaiserreich unter Usim-Horas II.'
    context: So kam es zur Dreivölkerschlacht. Alle drei Parteien zögerten, im Bewusstsein,
      dass die erste Bewegung einen Gegenangriff beider Gegner provozieren würde.
  - question: Wie gelang es Großsultan Ghulshev, nach der Zerstörung des kaiserlichen
      Heeres auch noch Mengbilla zu besiegen?
    answer: Großsultan Ghulshev nutzte die Situation aus und griff Mengbilla in die
      Flanke an, während ihre Truppen zusammen mit Elems Armee das kaiserliche Heer
      angriffen.
    context: Als Mengbillas Truppen bis zum kaiserlichen Feldlager vordrangen, hielt
      Großsultan Ghulshev seine Truppen zurück und warf sie in die Flanke des kurzfristigen
      Verbündeten. Mengbillas Befehlshaber und Usim-Horas’ General kapitulierten noch
      auf dem Schlachtfeld.
  G1-057:
  - question: Wann begann die kurze Ära des Alten Reichs?
