  G1-085:
  - question: Woher stammt der Name 'Goldene Bucht' und was hat ihn inspiriert?
    answer: Der Begriff 'Goldene Bucht' stammt aus dem Logbuch von Admiral Sanin III.
      und beschreibt das Glitzern der Sonnenstrahlen auf dem türkisblauen Wasser.
    context: Die Bucht, die durch die vorspringende Landzunge der Halbinsel von Al’Anfa
      und durch die Mündung des Jalob begrenzt wird, heißt spätestens seit Bastan
      Munters Reise die ‘Goldene Bucht’. Diesen Begriff entnahm der große Geograph
      dem Logbuch Admiral Sanins III., und er beschreibt treffend das Glitzern der
      Sonnenstrahlen auf dem türkisblauen Wasser.
  - question: Welche Gefahren bergen die Gezeiten für die Lebewesen in der Bucht?
    answer: Die starken Gezeiten, die bis zu vier Schritt hoch sein können, sorgen
      für tückische Springfluten, bei denen sogar Morfus oder Tlalucswürmer ertrinken
      können.
    context: Im starken Kontrast dazu stehen die finsteren Mangrovensümpfe entlang
      der Küste, deren Stelzwurzeln bei Flut dem beinahe größten Gezeitenhub Aventuriens
      (vier Schritt) trotzen. Während Vollmonden in Herbst und Frühjahr treten binnen
      kürzester Frist tückische Springfluten auf, bei denen bisweilen sogar die Morfus
      oder Tlalucswürmer, die sich hier zu Hunderten herumtreiben, überrascht werden
      und ertrinken.
  - question: Welche Spuren haben die Lavamassen des Visra in der Bucht hinterlassen?
    answer: Die Palastinseln, die fünf Festungsinseln und die Sklaveninsel sind Überreste
      der größten Lavamassen des Visra, die hier über Äonen ins Meer ergossen haben.
    context: Am Ende der Bucht färbt sich das Wasser dunkel. Das liegt weniger am
      trüben Wasser des Hanfla als an den schwarzen Lavamassen des Visra, die sich
      hier über Äonen ins Meer ergossen haben. Überreste der größten Ausbrüche sind
      die Palastinseln einige Meilen vor der Stadt, die fünf Festungsinseln und die
      berüchtigte Sklaveninsel, die eine halbe Meile vor dem Hafen liegen, und die
      kleine Inselkette der Wassergärten direkt unterhalb des Rabenfelsens.
