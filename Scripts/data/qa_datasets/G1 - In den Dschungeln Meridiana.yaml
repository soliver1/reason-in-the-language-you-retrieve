      gepflegt. '
  G1-231:
  - question: Wann wurde die Schwarze Allianz gegründet und unter welchem Namen war
      sie zu dieser Zeit bekannt?
    answer: Die Schwarze Allianz, auch bekannt als Rabenpakt, wurde 955 BF gegründet.
    context: Bereits viele Jahre vor der Unabhängigkeit Mengbillas gelangte das aufstrebende
      Al’Anfa dort zu gehörigem Einfluss. Dies führte schließlich 955 BF zur Gründung
      des ‘Rabenpaktes’ – der für Mengbilla zunächst den Schutz vor den wiederholt
      einfallenden Thorwalern, für Al’Anfa die Erlangung eines Außenpostens im Norden
      zum Ziel hatte.
  - question: Welche Machtstrukturen sind innerhalb der Schwarzen Allianz zu erkennen?
    answer: Al'Anfa ist die dominierende Macht innerhalb der Schwarzen Allianz. Mengbilla,
      Selem, Mirham, Port Corrad, Charypso und Thalusa sind ebenfalls Teil des Bündnisses,
      wobei letztere drei nur assoziierte Mitglieder sind.
    context: Innerhalb der Schwarze Allianz ist Al’Anfa die dominierende Macht. Eine
      gewisse Eigenständigkeit ist im Gegensatz zu den Vasallenstädten Selem, Mirham
      und Port Corrad nur dem ‘kleinen Bruder’ Mengbilla und den notorisch unzuverlässigen
      Piratenbanden aus Charypso zuzuschreiben. Die Schwarze Allianz strebt neben
      der Vereinnahmung der alanfanischen Anspruchsgebiete nach der Sicherung ihrer
      Handelsinteressen und der Ausweitung ihrer nördlichen Grenzen gegen die – sich
      im Kampf gegen die Heptarchien erschöpfenden – Nordreiche an.
  - question: Welche inneren Probleme plagen die Schwarze Allianz?
    answer: Das Verhältnis zwischen Mengbilla und Al'Anfa ist seit dem Khôm-Krieg
      abgekühlt, da Mengbilla die Beuteverteilung als ungerecht empfindet. Auf die
      assoziierten Verbündeten Charypso und Thalusa kann man vermutlich nicht zählen,
      sollten sich die politischen Umstände oder die Beutesituation ändern.
    context: Dabei hat sie aber mit inneren Problemen zu kämpfen. Seit der in den
      Augen Mengbillas ungerechten Beuteverteilung im Khôm-Krieg ist das Verhältnis
      der beiden stärksten Verbündeten abgekühlt. Auf die assoziierten Verbündeten,
      insbesondere Charypso und Thalusa, ist vermutlich wenig Verlass, sollte sich
      die politische Großwetterlage oder die Beuteaussicht ändern.
  G1-232:
  - question: Welche Länder gehören zur neuen Goldenen Allianz?
    answer: Die Allianz wurde zum 80. Jahrestag der Alten Goldenen Allianz geschlossen
      und umfasst neben dem Alten Reich, Brabak, Kemi und Sylla auch das Inselreich
      Ghurenia.
    context: Im Jahre 1027 BF kam es durch die Vermittlung der sowohl mit Brabak und
      Sylla (seit 1010 BF) als auch mit dem Horasreich (seit 1012 BF) verbündeten
      Kemi zu erneuten Verhandlungen über eine gemeinsame Allianz. Diese wurde schließlich
      zum 80. Jahrestag der Alten Goldenen Allianz geschlossen und umfasst neben dem
      Alten Reich, Brabak, Kemi und Sylla auch das Inselreich Ghurenia.
  - question: Was motiviert das Horasreich neben der Sicherheit, sich der Goldenen
      Allianz anzuschließen?
    answer: Das Horasreich strebt die Etablierung von regen Handelsbeziehungen mit
      profitablen und begehrten Südmeerprodukten an.
    context: Vor allem aber streben die Alliierten die Etablierung von regen Handelsbeziehungen
      mit profitablen und begehrten Südmeerprodukten an.
  - question: Welche inneren Schwierigkeiten hat die Goldene Allianz?
    answer: Während in Brabak Teile der einflussreichen Audienza weiterhin gegen das
      Bündnis agieren, erstarken in Kemi mehr und mehr die allen fremden Einfluss
      ablehnenden traditionalistischen Kräfte. Die Lage von Ghurenia fernab der gebräuchlichen
      Schifffahrtsrouten kann zudem nicht nur Segen, sondern Fluch sein.
    context: Auch die Goldene Allianz hat mit erheblichen inneren Schwierigkeiten
