  G1-122:
  - question: Welche unterschiedlichen Möglichkeiten bietet der Text für den Einsatz
      von Sklaverei als SpielszENARIO?
    answer: 'Die Sklaverei kann in vielen verschiedenen Szenarien eingesetzt werden:
      Helden könnten Sklavenjäger sein oder einen Lieblingssklaven zurückholen, einem
      versklavten Fremden bei der Flucht helfen, sich Sklavenbefreiern anschließen
      oder für Auftraggeber verschwundene Personen finden. Auch die Aufnahme einer
      befreiten Sklavin in die Gruppe oder ein Abenteuer, in dem alle Helden versklavt
      sind, sind Möglichkeiten.'
    context: 'Die Sklaverei lässt sich für viele mögliche Szenarien einsetzen: Helden
      könnten selbst Sklavenjäger sein oder angeheuert werden, um einen Lieblingssklaven
      zurückzuholen. Ein versklavter Fremder könnte sie bitten, ihm die Flucht aus
      Al’Anfa zu ermöglichen und ihn wieder nach Hause zu bringen (sie werden darauf
      vertrauen müssen, dass der Sklave tatsächlich ein mittelländischer reicher Erbe
      ist). Die Helden könnten sich Sklavenbefreiern anschließen oder für Auftraggeber
      die verschwundene Tochter, den verschleppten Freund oder Armeekameraden wiederfinden.
      Eine neue Heldin könnte in die Gruppe eingeführt werden, wenn die Gruppe eine
      Sklavin aus Mitleid aufkauft und – nach bestandenen ersten Abenteuern – zum
      Dank freilässt. Auch wäre es möglich, ein Abenteuer zu konzipieren, in dem alle
      Helden zum Gefolge einer Grandessa gehören und unrechtmäßig versklavt wurden.
      Im Sklavenalltag zusammengeschweißt, planen sie eines Tages die Flucht, die
      ein Abenteuer darstellt, das sich auch mal wohltuend vom Prolog in der düsteren
      Taverne abhebt.'
