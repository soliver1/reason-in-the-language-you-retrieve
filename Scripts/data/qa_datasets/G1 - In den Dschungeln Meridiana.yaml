  G1-141:
  - question: Welche charakteristischen Merkmale weisen die Namen der Einwohner auf?
    answer: Die Namen der Einwohner zeigen oft eine Verbindung zum Ehrfurchtshauch
      des Echsischen und werden mit einem hervorgehobenen H geschrieben, wie z.B.
      K’Hestofer oder G’Hliatan.
    context: Unter den Eigennamen sind solche mit einem hervorgehoben, fast gekeuchten
      H typisch, wie K’Hestofer, G’Hliatan, Vald’Han oder G’Huizan. Dass hierbei eine
      Verwandtschaft zum Ehrfurchtshauch des Echsischen (z.B. H’Rabaal) besteht, liegt
      zumindest nahe, wenn auch der Verdacht besser nicht laut geäußert werden sollte.
  - question: Warum haben viele Einwohner ihre ursprünglichen Namen geändert und welche
      neuen Namen wählten sie?
    answer: Viele Einwohner haben ihre ursprünglichen Namen abgelegt und sich neue,
      adligere Namen gegeben. Beispiele hierfür sind Drucker Gutmund (ursprünglich
      ein anderer Name), Historienmaler Immenstatt oder Schönmacher Klippstein.
    context: 'Typisch sind auch blumige, lyrische Namen – denn viele, die einst hierher
      kamen, um ihr Glück zu machen, hatten einen guten Grund, ihren alten Namen abzulegen:
      Drucker Gutmund, Historienmaler Immenstatt, Spezerer Oldenport, Schönmacher
      Klippstein und Waffenschmied Tannspitz haben nicht so nobel angefangen, wie
      sie sich heute darstellen.'
  - question: Welche Strategien verwenden manche Familien, um ihren sozialen Status
      durch ihre Namen zu erhöhen?
    answer: Manche Familien wie die Florios oder Bonareth greifen auf alte Namen aus
      Bosparano zurück, um ihren Status aufzuwerten. Auch tulamidische Namen, die
      mit 'Al-' beginnen, werden oft mit beeindruckenden Attributen versehen.
    context: 'Manche Grandenfamilien haben aus ähnlichen Überlegungen auf das alte
      Bosparano zurückgegriffen: Den Florios sieht man schon an der Hautfarbe an,
      dass sie eher von den Waldinseln stammen, und die Bonareth haben auch nicht
      immer so hübsch geheißen. Ähnliche Hochstapelei liegt vielen Namen tulamidischer
      Herkunft zugrunde, deren mit ‘ Al-’ beginnenden Namen die Eigentümer stets mit
      beeindruckenden Attributen belegen.'
  G1-142:
  - question: Welche Arten von Kämpfen finden im Vorprogramm der Gladiatorenspiele
      statt?
    answer: Die Kämpfe im Vorprogramm der Gladiatorenspiele umfassen Tierhatzen, bei
      denen Jäger gegen wilde Tiere antreten, und Hinrichtungen durch wilde Tiere,
      die als 'spiegelnde Strafen' bezeichnet werden.
    context: In der Tat treten verschiedene Arten von Arenakämpfern auf, die oft irrtümlich
      alle als ‘Gladiatoren’ bezeichnet werden. Im Vorprogramm der Spiele werden Tierhatzen
      gezeigt, die sowohl harmlose Jagdspiele sein können (das Wiedereinfangen eines
      halbwüchsigen Stiers) als auch gefährliches Kräftemessen zwischen einem oder
      mehreren Jägern gegen wilde, gefährliche oder exotische Tiere. In besonderen
      Fällen werden auch Kämpfe gegen magische Wesen wie Chimären gezeigt. Geschick,
      List und gute Kenntnisse über Schwächen und Stärken des Jagdwildes sind wesentliche
      Fähigkeiten der Tierkämpfer. Fernkampfwaffen sind wegen der Nähe zu den Logen
      der Granden natürlich in der Arena nicht erlaubt – Arenakämpfer, die werfbare
      Spieße oder Speere verwenden, werden von Armbrustschützen im Auge behalten.
      Viel Geld lässt sich damit verdienen, exotische Tiere wie Firunsbären, Säbelzahntiger
      oder Schlinger aus ganz Aventurien herbeizuschaffen und für die Tierhatz abzurichten,
      in dem man ihnen etwa die Scheu nimmt oder sie an Sklaven lehrt, Menschen zu
      reißen. Andere Attraktionen im Vorprogramm umfassen Hinrichtungen durch wilde
      Tiere. Hierbei werden ‘spiegelnde Strafen’ bevorzugt. So richtet man etwa rastullahgläubige
      Sklaven üblicherweise durch Löwen hin, die Symboltiere des novadischen Eingottes.
  - question: Wer sind die Gladiatoren und warum tragen sie den Beinamen ‘Könige der
      Arena’?
    answer: Gladiatoren sind meist versklavte Kriegsgefangene oder Freie, die so heruntergekommen
      sind, dass sie sich diesem blutigen Handwerk freiwillig widmen. Der Beiname
      ‘Könige der Arena’ ist ironisch.
    context: Am Nachmittag treten schließlich Gladiatoren an, die ‘Könige der Arena’.
      Der Beiname ist ironisch, handelt es sich bei ihnen doch meist um versklavte
      Kriegsgefangene, die man zwingt, so zu kämpfen, wie man es in ihrer Heimat tut,
      oder um Freie, die weit genug heruntergekommen sind, um dieses blutige Handwerk
      freiwillig zu versehen. In der Tat wird eine Fremde, die sich in Al’Anfa während
      eines hand-greiflichen Disputs besonders geschickt zeigt oder eine exotische
      Waffe beherrscht, rasch von einem Lanisto auf Talentsuche angesprochen, ob sie
      ihre Fähigkeiten in der Arena vergolden will.
  - question: Wie werden Sklaven für die Tierhatz vorbereitet?
    answer: Sklaven werden für die Tierhatz trainiert, indem man ihnen die Scheu nimmt
      oder sie an Menschen reißen lehrt.
    context: Viel Geld lässt sich damit verdienen, exotische Tiere wie Firunsbären,
      Säbelzahntiger oder Schlinger aus ganz Aventurien herbeizuschaffen und für die
      Tierhatz abzurichten, in dem man ihnen etwa die Scheu nimmt oder sie an Sklaven
      lehrt, Menschen zu reißen.
  G1-143:
  - question: Warum werden Lanistos meist aus ehemaligen Gladiatoren ausgewählt?
    answer: Lanistos sind typischerweise ehemalige Gladiatoren, die zu alt oder zu
      reich geworden sind, um selbst anzutreten.
    context: Typischerweise sind sie selbst ehemalige Gladiatoren, die zu alt oder
      zu reich geworden sind, um selbst anzutreten – wirklich los kommt von der Arena
      aber kaum jemand.
  - question: Wer muss den von den Lanistos geplanten Kämpfen zustimmen?
    answer: Die Geweihtenschaft des Kor, die die Arena verwaltet.
    context: Lanistos kümmern sich um die Unterbringung und Ausbildung von Gladiatoren.
      Sie kennen die Gladiatoren der anderen Lanistos gut genug, um Kämpfe zu planen
      und Paarungen zusammenzustellen, die von der Geweihtenschaft des Kor, die die
      Arena verwaltet, genehmigt werden müssen.
  - question: Warum bemühen sich Lanistos darum, die Kämpfer auf beiden Seiten einigermaßen
      gleichstark zu machen?
    answer: 'Um die Wetten in die Höhe zu treiben und die Kämpfe zu verlängern. '
    context: 'Lanistos sorgen dafür, dass die Kämpfer auf beiden Seiten ungefähr gleich
      stark sind – nicht aus Menschenfreundlichkeit, sondern um die Wetten in die
      Höhe zu treiben und die Kämpfe zu verlängern. '
  G1-144:
  - question: Welche Waffen verwenden Fischer im Kampf und welche anderen Kämpfertypen
      gehören zu dieser Gruppe?
    answer: Fischer kämpfen mit Netz und Dreizack oder Schlingen mit kurzen Jagdspießen.
      Andere typische Vertreter dieser Gattung wären der mohische Stammeskrieger mit
      Speer und Schild, die Bukanierin mit zwei Entermessern oder der Fanadillo mit
      Haumesser und mehreren Wurfmessern.
    context: 'Es gibt eine ganze Anzahl verschiedener Gladiatorengattungen, die sich
      auch von Stadt zu Stadt unterscheiden. Ständig werden neue erfunden – doch unterteilen
      sie sich in drei große Gruppen. Der Fischer (Brabaci: Pescator) kämpft mit Netz
      und Dreizack oder Schlingen mit kurzen Jagdspießen. Fischer sind sehr leicht
      oder gar nicht gepanzert und wendig. Andere typische Vertreter dieser Gattung
      wären der mohische Stammeskrieger mit Speer und Schild, die Bukanierin mit zwei
      Entermessern oder der Fanadillo mit Haumesser und mehreren Wurfmessern.'
  - question: Beschreibe die typische Ausrüstung eines Schwertes und seine Stärken
      und Schwächen im Kampf.
    answer: Schwerter tragen schwere Helme, Armund Schulterschienen, oft auch Beinschienen
      und weitere Rüstung, manchmal Schilde. Die wesentlichen Fertigkeiten eines Schwertes
      sind Ausdauer und Kraft – imposant, doch langsam, weshalb sie meistens gegen
      Fischer eingesetzt werden.
    context: 'Schwert (Brabaci: Secutor) ist eigentlich eine missverständliche Bezeichnung
      für die größte Gruppe – denn alle schwerer gepanzerten Fußkämpfer werden als
      Schwerter bezeichnet, mögen sie nun mit Axt oder Arbach antreten. Schwerter
      tragen schwere Helme, Armund Schulterschienen, oft auch Beinschienen und weitere
      Rüstung, manchmal Schilde. Die wesentlichen Fertigkeiten eines Schwertes sind
      Ausdauer und Kraft – imposant, doch langsam, weshalb sie meistens gegen Fischer
      eingesetzt werden.'
  - question: Gegen wen werden Reiter im Kampf eingesetzt und wie können diese Kämpfe
      gestaltet sein?
    answer: Reiter werden meist gegen andere Reiter oder Schwerter eingesetzt, gern
      auch in ungleich großen Gruppen gegeneinander, womit der Gladiatorenkampf dann
      einer kleinen Schlacht gleicht.
    context: 'Als letzte Gruppe sind die Reiter (Brabaci: Equitor) zu nennen, berittene
      Kämpfer, zu denen auch Wagenlenker gezählt werden. Reiter werden meist gegen
      andere Reiter oder Schwerter eingesetzt, gern auch in ungleich großen Gruppen
      gegeneinander, womit der Gladiatorenkampf dann einer kleinen Schlacht gleicht.'
  G1-145:
  - question: Wie macht der Spielegeber seine Entscheidung bekannt?
    answer: Der Spielegeber entscheidet durch ein Daumenzeichen oder ein schwarzes
      oder rotes Seidentuch.
    context: Wenn der Kampf durch die Kampfunfähigkeit einer der Beteiligten beendet
      ist, entscheidet der Spielegeber, der die Spiele ausgerichtet, bezahlt und organisiert
      hat, mit einem Daumenzeichen oder einem schwarzen oder roten Seidentuch über
      das Schicksal der Unterlegenen.
  - question: Wann ruft das Publikum meist um Gnade für den unterlegenen Gladiator?
    answer: Wenn der Gladiator sein Äußerstes gegeben und furchtlos gekämpft hat,
      ruft das Publikum meist um Gnade.
    context: Wenn das Publikum um Gnade ruft – und das tut es meist, wenn der Gladiator
      sein Äußerstes gegeben und furchtlos gekämpft hat – fällt das rote Tuch oder
      wird der Daumen nach oben gerichtet, schon, um die Großherzigkeit des Spielegebers
      zu zeigen.
  - question: Was passiert, wenn der Spielegeber einen Gladiator zum Tod verurteilt?
    answer: Der Spielegeber muss dem Besitzer des Gladiators den Verlust entschädigen.
      Dies kann auch eine Gelegenheit sein, Reichtum zu demonstrieren.
    context: Fällt das schwarze Tuch oder weist der Daumen nach unten, ist das Todesurteil
      gefällt. Der Spielegeber muss dann dem Besitzer des Gladiators den Verlust entschädigen,
      was immer wieder eine gute Gelegenheit ist, um Reichtum zu zeigen.
  G1-146:
  - question: Wie verbringen Gladiatoren ihre Zeit zwischen den Kämpfen und wie werden
      sie während dieser Zeit behandelt?
    answer: Gladiatoren verbringen ihre Zeit in Gladiatorenschulen, die manchmal 'Ställe'
      genannt werden. Dort werden sie unter Aufsicht der Lanista zu zweit in Zellen
      untergebracht, üppig und gut verpflegt, ausgebildet und für die Kämpfe ausgerüstet
      und herausgeputzt.
    context: Bis auf diese Anlässe verbringen sie ihre Zeit jedoch in den Gladiatorenschulen,
      die manchmal geringschätzig ‘Ställe’ genannt werden. Dort werden sie unter der
      direkten Aufsicht der Lanista zu zweit in Zellen untergebracht, üppig und gut
      verpflegt, ausgebildet und für die Kämpfe ausgerüstet und herausgeputzt. Bewunderer
      haben keinen Zugang.
  - question: Haben freie Gladiatoren die Möglichkeit, sich während ihrer freien Zeit
      in der Stadt aufzuhalten?
    answer: Ja, freie Gladiatoren können sich zwischen den Kämpfen in der Stadt bewegen
      und verdingen sich oft zusätzlich als Beschützer oder Begleiter – oder als bezahlte
      Schläger.
    context: Freie Gladiatoren können sich natürlich zwischen den Kämpfen in der Stadt
      bewegen und verdingen sich oft noch zusätzlich als Beschützer oder Begleiter
      – oder als bezahlte Schläger.
  - question: Wie werden Gladiatoren vor ihren Kämpfen von ihren Besitzern behandelt?
    answer: Vor den Kämpfen werden Gladiatoren auf die Feiern oder Orgien ihrer Besitzer
      eingeladen, wo sie bestaunt und bewundert werden. Oft stehen Gladiatoren auch
      im Mittelpunkt eines pikanten Skandals.
