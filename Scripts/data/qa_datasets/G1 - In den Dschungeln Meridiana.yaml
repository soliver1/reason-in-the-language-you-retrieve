  G1-087:
  - question: Welche zwei Theorien gibt es über die Natur des Visra?
    answer: Der Visra ist ein erloschener Vulkan, oder zumindest wird dies von der
      Mehrheit angenommen. Einige glauben jedoch, dass es sich um eine gigantische
      Pyramide handelt.
    context: Berühmt ist der Visra jedoch für die Schwarzen Pyramiden an seinen Flanken.
      Diese sind prächtige – teils gestufte, teils verkleidete – Grabanlagen voller
      Fallen und Schätze, von denen die ältesten schon in formenschlichen Zeiten entstanden
      sein sollen. Nach gängiger Auffassung ist der schwarze Riese ein erloschener
      Vulkan. Andere behaupten dagegen, er sei eine so gigantische Pyramide, dass
      Menschen sie nicht als künstlich erkennen könnten.
  - question: Welche beiden Gruppen zerstörten Gebäude am Hang des Visra und warum?
    answer: Die Elems zerstörten viele Tempel am Hang des Visra und raubten einige
      der Schätze. Nardes, der Kaiser des Neuen Reiches, ließ alle offenkundig heidnischen
      Gebäude am Hang des Berges zerstören.
    context: Schon die gepanzerten Reiter Elems zerstörten die meisten Tempel an seinem
      Hang und raubten viele der Schätze aus Jade und Obsidian. Die endgültige Zerstörung
      aller offenkundig heidnischen Gebäude befahl erst Nardes, der Kaiser des Neuen
      Reiches, seinen Heerscharen, die die letzten Wudu erschlugen.
  - question: Was passierte mit den kleineren schwarzen Pyramidengräbern nach der
      Großen Seuche?
    answer: Nach der Großen Seuche wurden die kleineren schwarzen Pyramidengräber
      Schritt für Schritt in den Boron-Kult integriert, nachdem sie von der ersten
      Matriarchin Velvenya Karinor als “Zeugnisse frommen, wenn auch fehlgeleiteten
      Boron-Kultes” unter staatskirchlichen Schutz gestellt worden waren.
    context: In der Umgebung des Berges erheben sich schwarze Pyramidengräber von
      wenigen Schritt Höhe. Diese sind so zahlreich, dass selbst die wildesten Eiferer
      der Priesterkaiserzeit sie nicht alle schleifen und die gierigsten Grabräuber
      sie nicht alle plündern konnten. Nach der Großen Seuche wurden sie Schritt für
      Schritt in den Boron-Kult integriert, nachdem sie die erste Matriarchin Velvenya
      Karinor als “Zeugnisse frommen, wenn auch fehlgeleiteten Boron-Kultes” unter
      staatskirchlichen Schutz gestellt hatte. Heute dienen die meisten den Grandenfamilien
      als Begräbnisstätten.
  G1-088:
