  G1-349:
  - question: Wer waren die Gründer der Stadt und warum siedelten sie sich dort an?
    answer: Die Stadt wurde von den Cuori gegründet, einem kleinen Stamm von Waldmenschen
      aus dem Mirhamer Raum, der sich um das Jahr 1000 v.BF auf der Flucht vor mächtigen
      Feinden auf sumpfigen Inselchen und Halbinseln im und am Nordask niederließ.
    context: Die Begründer der Stadt waren die Cuori, ein kleiner Stamm von Waldmenschen
      aus dem Mirhamer Raum, der sich um das Jahr 1000 v.BF auf der Flucht vor mächtigen
      Feinden auf sumpfigen Inselchen und Halbinseln im und am Nordask niederließ.
  - question: Wann und unter welchem Namen wurde die erste militärische Präsenz des
      Alten Reichs in der Stadt errichtet?
    answer: Im Jahr 873 v.BF gründete das Alte Reich eine Garnison namens Belenas
      auf dem Gebiet der heutigen Stadt.
    context: Hundertfünfzig Jahre später, am 1. Praios des Jahres 873 v.BF, gründete
      das Alte Reich hier eine Garnison, die den Namen Belenas erhielt.
  - question: Wie kam es zur Umbenennung der Stadt in Mengbilla?
    answer: Das Großsultanat von Elem eroberte die Stadt etwa 200 Jahre vor dem Fall
      Bosparans. Die Stadt erhielt den tulamidischen Namen Mengbilla und erlebte einen
      steten Zuzug von Siedlern aus dem Szintotal.
    context: Etwa 200 Jahre vor Bosparans Fall allerdings eroberte das Großsultanat
      von Elem in seinem unaufhaltsamen Heerzug alle Lande zwischen Szinto und Westmeer.
      Die Stadt Belenas erhielt ihren tulamidischen Namen Mengbilla und erlebte einen
      steten Zuzug von Siedlern aus dem Szintotal, die im Jahre 187 v.BF das Großemirat
      Mengbilla ausriefen.
  - question: Wo zogen sich die Boron-Geweihten zurück und wie versuchten sie ihren
      Einfluss zu verbreiten?
    answer: Die Boron-Geweihten zogen sich in die ‘Sümpfe der Seelen’ zurück, wo sie
      die geheime Siedlung Al’Bor gründeten. Im Jahre 450 BF begannen sie damit, heimliche
      Missionare zu den entfernten Stammesbrüdern im Szintotal zu senden.
    context: Die ersten Großwesire residierten nur selten im städtischen Fürstenpalast,
      sondern bevorzugten die offene Landschaft um die Siedlung El’Halem, wo bald
      eine bemerkenswerte Pferdezucht entstand. Mit der Zeit wuchs der boronische
      Einfluss jedoch immer mehr – nicht zuletzt dank Al’Anfaner Missionaren, die
      nach 700 BF den Glauben an ‘Boron als Götterfürst’ der teils widerstrebenden
      Bevölkerung nahe brachten.
  - question: Wann erklärte Mengbilla seine Unabhängigkeit und wie reagierten die
      Boron-Anhänger auf die Wiederaufnahme des Praios-Kults?
    answer: Mengbilla erklärte im Jahr 858 BF seine Unabhängigkeit vom Neuen Reich.
      Um diese vollendete Tatsachen zu schaffen, erschlugen zwei Jahre darauf ein
      kleiner, aber fanatischer Trupp boronischer Mengbillaner die wenigen Praios-Geweihten.
    context: Im Jahre 858 BF schließlich erklärte Mengbilla endgültig seine Unabhängigkeit
      vom Neuen Reich. Um vollendete Tatsachen zu schaffen, erschlug zwei Jahre darauf
      ein kleiner, aber fanatischer Trupp boronischer Mengbillaner die wenigen Praios-Geweihten,
      die seit Kaiser Eslams Zeiten den Kult wieder aufgenommen hatten.
  - question: Wann und durch wen wurden die Vorstädte von Mengbilla geplündert?
    answer: Der legendäre Hetmann Hyggelik plünderte im Jahr 906 BF sämtliche Vorstädte
      der Stadt.
    context: Gegen den nächsten Feind jedoch half der Stadt kein Sturm – kaum hatte
      sich Mengbilla einen Namen als Sklavenhandelsstadt gemacht, überfielen mehrere
      Jahrzehnte lang immer wieder Thorwaler das reiche Großemirat. Im Jahre 906 BF
      plünderte der legendäre Hetmann Hyggelik sämtliche Vorstädte.
  - question: Wie reagierte Kaiser Eslam auf die Unabhängigkeitserklärung Mengbillas
      und was war das Ergebnis seines Eingreifens?
    answer: Kaiser Eslam schickte eine Flotte, um Mengbillas Unterwerfung zu erzwingen.
      Dieser Versuch endete jedoch in der ‘Großen Havarie’ vor den Zyklopeninseln
      in einer Katastrophe.
    context: Und so sandte er im Jahr 864 BF eine Flotte aus, um Mengbillas Unterwerfung
      zu erzwingen. Doch in der ‘Großen Havarie’ vor den Zyklopeninseln endete dieser
      Versuch in einer Katastrophe. Die Unabhängigkeit Mengbillas war gesichert und
      die Boron-Geweihten deuteten den Tod so vieler Seesöldner und Matrosen als göttlichen
      Akt des Totenherrschers, der seiner Stadt Mengbilla huldvoll zugeneigt sei.
  G1-350:
  - question: Beschreibe die Gründung und die wechselvolle Geschichte der Herrschaft
      über Mengbilla bis zum Jahr 467 v.BF.
    answer: Mengbilla wurde um 1000 v.BF. von dem Waldmenschenstamm der Cuori als
      Siedlung Cuoris gegründet. Im Laufe der Geschichte wurde es mehrmals erobert
      und unter die Herrschaft verschiedener Mächte gestellt, darunter Yarums Horasiat,
      Elem, Silem-Horas, die Markgrafschaft Drôl und Rohal.
    context: "um 1000 v.BF: Waldmenschenstamm der Cuori gründen die Siedlung Cuoris\n
      873 v.BF: bosparanische Garnison Belenas am Nordask bei Cuoris\nDunkle Zeiten:
      erste Thorwaler Plünderzüge \n476 v.BF: Teil von Yarums Horasiat (Lex Imperia)
      \nca. 200 v.BF: Elem erobert Mengbilla; seither ‘Großemirat’. \nca. 100 v.BF:
      Silem-Horas erobert Mengbilla zurück; Zwölfgötteredikt: Verbot mehrerer Götzenkulte.\n
      ab 56 BF: Teil der Markgrafschaft Drôl \n292 BF: Gründung des Boron-Tempels
      \n360–464 BF: während der Priesterkaiserzeit Al’Bor als geheime Siedlung der
      Boron-Gläubigen \n464 BF: Befreiung durch boronbekehrte Beni Szintaui \n467
      BF: Mengbilla unterstellt sich Rohal; Statthalter (Großwesir). "
  - question: Wann wurde der Boron-Tempel gegründet und welche Rolle spielte Mengbilla
      während der Priesterkaiserzeit Al'Bor?
    answer: Der Boron-Tempel wurde 292 BF gegründet. Während der Priesterkaiserzeit
      Al'Bor (360–464 BF) diente Mengbilla als geheime Siedlung für Anhänger des Borons.
    context: "292 BF: Gründung des Boron-Tempels\n360–464 BF: während der Priesterkaiserzeit
      Al’Bor als geheime Siedlung der Boron-Gläubigen "
  - question: Nenne vier wichtige Ereignisse in der Geschichte von Mengbilla zwischen
      dem Jahr 815 BF und 906 BF.
    answer: Die ‘Große Havarie’ ereignete sich im Jahr 864 BF. Weitere wichtige Ereignisse
      in dieser Zeit waren die Explosion der alchimistischen Akademie im Jahr 815
      BF, die Unabhängigkeitserklärung Mengbillas als Großemirat im Jahr 858 BF und
      die Plünderung sämtlicher Vorstädte durch Hetmann Hyggelik den Großen im Jahr
      906 BF.
    context: "815 BF: Explosion der alchimistischen Akademie zerstört ein ganzes Stadtviertel.\n
      858 BF: Unabhängigkeitserklärung Mengbillas als Großemirat\n864 BF: die ‘Große
      Havarie’ \n906 BF: Plünderung sämtlicher Vorstädte durch Hetmann Hyggelik den
      Großen"
  G1-351:
  - question: Wie verdient die Stadt Mengbilla Geld?
    answer: Mengbilla verdient Geld mit dem Handel von Exotika aus dem Regenwald,
      Meer und Gärten des Südens wie Purpurfarbstoff, Seidentaft, Duftwässer, Parfümöle,
      Traumkräutern, Giften und Sklaven. Außerdem exportiert Mengbilla eigene Produkte
      wie Getreide (Hirse, Mais, Weizen), Bier, Seidentuche und -taft sowie ist bekannt
      für seine Färberkunst.
    context: 'Die Wirtschaft Mengbillas lebt überwiegend vom Handel mit den Exotika,
      die der Regenwald, das Meer und die üppigen Gärten des Südens bereithalten:
      Vom allerorten gerühmten Purpurfarbstoff über Seidentaft, allerlei Duftwässer
      und Parfümöle bis zu so verrufenen – und dennoch vielerorts begehrten – Produkten
      wie Traumkräutern, Giften und Sklaven. Daneben ist die Stadt der Westküstenhafen
      seines Verbündeten Al’Anfa. ... Außerdem verdient die Stadt gut an den zahlreichen
      Fremden, die Mengbilla gerade aufgrund seines schlechten Rufs besuchen. Geradezu
      berühmt ist die Stadt für ihre Färberkunst (mit Purpur oder Lotos).'
  - question: Welche Rolle spielt Mengbilla im Handel mit Waren aus der Schwarzen
      Perle?
    answer: Mengbilla profitiert vom Handel mit Waren aus der Schwarzen Perle, die
      über den Hafen der Stadt transportiert werden. Da diese Waren oft nicht direkt
      über den Seeweg um Kap Brabak nach Norden gelangen, sondern über Mengbilla,
      ist die Stadt ein wichtiger Umschlagplatz für diesen Handel.
    context: Daneben ist die Stadt der Westküstenhafen seines Verbündeten Al’Anfa.
      Sehr viele Waren aus der Schwarzen Perle erreichen den Norden nicht per Schiffsroute
      um Kap Brabak, sondern über Mengbilla.
  - question: Wie ist die Verkehrsinfrastruktur von Mengbilla im Vergleich zu anderen
      Städten?
    answer: Die Landverbindungen zu Mengbilla sind schlecht ausgebaut. Die Reichsstraße
      umgeht die Stadt und es gibt nur zwei miserable Straßenverbindungen zu Drôl
      und dem Horasreich sowie zu Chorhop. Nur die Verbindung über El’Halem und Lorfas
      nach Port Corrad ist in gutem Zustand.
    context: 'Die Landverbindungen der Stadt sind eher schlecht: Mengbilla wird von
      der Reichsstraße aus dem Horasreich zum Perlenmeer umgangen und ist durch zwei
      miserable Straßen mit Drôl und dem Horasreich sowie mit Chorhop verbunden, während
      die Straße über El’Halem und Lorfas nach Port Corrad in vergleichsweise gutem
      Zustand ist. '
  G1-352:
  - question: Aus welchen Ursprungsgruppen haben sich die Gilden des Großemirats entwickelt?
    answer: Die Gilden des Großemirats haben sich aus kleineren Handelshäusern, bedeutenden
      Familien und Zusammenschlüssen von Handwerksbetrieben entwickelt.
    context: Den größten Machtfaktor im Großemirat bilden die Gilden der Stadt, einflussreiche
      Vereinigungen, die aus kleineren Handelshäusern, bedeutenden Familien und Zusammenschlüssen
      von Handwerksbetrieben hervorgegangen sind. Inzwischen haben diese Gruppen mit
      den Gilden des Nordens nur noch den Namen gemein.
  - question: Wie ist die hierarchische Struktur innerhalb der Gilden aufgebaut?
    answer: Jede Gilde kontrolliert einen oder mehrere Erwerbszweige und wird von
      einem Patron oder einer Patronin geführt, der/die von Gefolgsleuten unterstützt
      wird. Die einfachen Mitglieder dienen meist als Handlanger oder werden ausgenutzt.
    context: Jede Gilde beherrscht einen oder mehrere Erwerbszweige und wird ihrerseits
      von einem Patron oder einer Patronin kontrolliert, den einige ergebene und oft
      sehr kampfkräftige Gefolgsleute unterstützen und für den die einfachen (zumeist
      hoch verschuldeten) Mitglieder kaum mehr als Handlanger oder Milchkühe sind.
  - question: Welche Schutzfunktionen hat die Kurtisanengilde und wer kontrolliert
      sie tatsächlich?
    answer: Die Kurtisanengilde bietet zwar ihren Mitgliedern einen gewissen Schutz,
      doch werden sie letztendlich von wenigen Bordellwirtinnen und Zuhältern kontrolliert.
    context: 'So bietet zum Beispiel die Kurtisanengilde zwar eine gewisse Sicherheit
      für ihre Freudenmädchen und Lustknaben, doch beherrscht wird sie letztlich von
      wenigen Bordellwirtinnen und Zuhältern. '
  G1-353:
  - question: Wie ist der Hohe Rat von Mengbilla zusammengesetzt?
    answer: Der Hohe Rat besteht aus neun Mitgliedern und wird von den wichtigsten
      Gilden gestellt.
    context: Die Aufgabe des Hohen Rates – neun Ratsherren und Ratsfrauen, die von
      den wichtigsten Gilden gestellt werden – erschöpft sich weitgehend darin, die
      unvermeidlichen Streitigkeiten auf ein erträgliches Maß zu beschränken und die
      allgemeine, sprich äußere, Sicherheit des Stadtstaates zu gewährleisten.
  - question: Warum ist die Absetzung eines Großemirs in Mengbilla trotz des politischen
      Systems komplex?
    answer: Der Großemir kann zwar vom Hohen Rat mit Zustimmung von mindestens sechs
      Mitgliedern abgesetzt werden, aber da er auch Oberster Richter und Oberbefehlshaber
      der Truppen ist, ist dies in der Praxis schwierig.
    context: Zu diesem Zweck wählt der Hohe Rat einen Großemir (oder eine Großemirin),
      der mit der Zustimmung von mindestens sechs Ratsherren und -frauen auch wieder
      abgesetzt werden kann. Doch da er zugleich oberster Richter Mengbillas und Oberbefehlshaber
      der Truppen ist, kann eine solche Absetzung in der Praxis schwierig werden.
  - question: Welche Rolle spielt die Kirche des Boron im religiösen und politischen
      Leben von Mengbilla?
    answer: Der Glaubensrat wird von der Kirche des Boron dominiert, die neun der
      15 Sitze innehat und somit den Hohepriester stellt. Der Kult des Praios wie
      des Phex sind verboten, während alle anderen Gottheiten im Vergleich zu Boron
      verblassen.
    context: Der Glaubensrat der Mengbiller Tempel dagegen wird von der Kirche des
      Boron dominiert, die neun der 15 Ratssitze innehat, und daher stets den Hohepriester
      der Stadt stellt. Mengbilla wird zu Recht “Stadt, in der Sonne und Mond nicht
      scheinen” genannt – sowohl der Kult des Praios wie der des Phex sind verboten
      (wiewohl letzterer natürlich geheime Abgesandte in der Stadt unterhält). Alle
      anderen Gottheiten verblassen neben Boron, dem höchsten aller Götter.
  G1-354:
  - question: Welche Gilde ist für alle Bereiche des Sklavenhandels in Mengbilla verantwortlich?
    answer: Die 'Bruderschaft der Sklavenmeister' beherrscht fast alle Erwerbszweige,
      die mit der Sklaverei zu tun haben.
    context: 'Die bedeutendsten Gilden (mit Sitz im Hohen Rat) sind im Jahr 1027 BF:
      Sklavenhändler: Die ‘Bruderschaft der Sklavenmeister’ beherrscht fast alle Erwerbszweige,
      die mit der Sklaverei zu tun haben. Jäger, Aufseher und kleine Händler werden
      durch sie vertreten und gegen Gebühr ‘geschützt’. Da der Sklavenhandel maßgeblich
      zum Reichtum Mengbillas beigetragen hat, gehört die Gilde trotz der eher geringen
      Mitgliederzahlen zu den einflussreichsten der Stadt und stellt zur Zeit sogar
      den Großemir.'
  - question: Wer kontrolliert den Basar von Mengbilla?
    answer: Alrik Gerbelstein, der Herr der Mulis, Karren und Galeeren, herrscht mit
      seiner Marktwache über den Basar der Stadt.
    context: 'Fernhändler: Die Fernhändlergilde ist nur eine umständliche Bezeichnung
      für das Haus Gerbelstein und seine kleineren Kompagnons. Alrik Gerbelstein,
      der Herr der Mulis, Karren und Galeeren, herrscht mit seiner Marktwache über
      den Basar der Stadt.'
  - question: Wie verhalten sich die 'Freunde der Traumbunten Kraft' gegenüber den
      Alchimisten in Bezug auf ihren Handel?
    answer: Die 'Freunde der Traumbunten Kraft' teilen oder verteidigen ihre Waren
      je nach Geschäftslage mit den Alchimisten.
    context: 'Traumkrauthändler: Rauschmittel, Weihrauch und Duftwässer sind die Domäne
      der ‘Freunde der Traumbunten Kraft’, die sie – je nach Geschäftslage – mit den
      Alchimisten teilen oder erbittert gegen sie verteidigen.'
  G1-355:
  - question: Wie ist die Truppenstärke des Großemirats aufgebaut?
    answer: Etwa jeder zehnte Mengbillaner ist Stadtoder Bezirksgardist, und fast
      jeder hat wegen der allgemeinen Wehrpflicht in der Armee gedient.
    context: 'Das Großemirat fällt durch seine gewaltige Truppenstärke auf: Etwa jeder
      zehnte Mengbillaner ist Stadtoder Bezirksgardist, und fast jeder hat wegen der
      allgemeinen Wehrpflicht in der Armee gedient. Von dieser Wehrpflicht kann man
      sich freikaufen – das allerdings ist sehr teuer und kostet pro Jahr 200 Goldstücke.
      Die Garden sollen theoretisch für die Sicherheit in der Stadt sorgen.'
  - question: Wie wird in Mengbilla Recht gesprochen?
    answer: Mengbilla besitzt kein geschriebenes Strafrecht, so dass vor allem die
      Laune des Richters oder die Angebote der Prozessparteien einen Fall entscheiden.
    context: 'Mengbilla besitzt kein geschriebenes Strafrecht, so dass vor allem die
      Laune des Richter oder die Angebote der Prozessparteien einen Fall entscheiden.
      Ein im Norden beliebtes Sprichwort behauptet: “In Mengbilla gibt es außer der
      Regierung kein organisiertes Verbrechen” – und daran ist etwas Wahres.'
  - question: Welche Rolle spielen kriminelle Aktivitäten im politischen System von
