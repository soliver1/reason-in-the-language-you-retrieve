      beschlagenen oder massiven Votivtafeln bedeckt, die Marbo für die Fürsprache
      bei ihrem gestrengen Vater und für Überleben und Weiterleben danken.
    context: 'Der Saal ist fast immer gefüllt, und die Wände mit versilberten, mit
      Silber beschlagenen oder massiven Votivtafeln bedeckt, die Marbo für die Fürsprache
      bei ihrem gestrengen Vater und für Überleben und Weiterleben danken. '
  G1-110:
  - question: Wie groß ist der Silberberg im Verhältnis zur Stadtfläche und zu anderen
      Gebäuden in Gareth?
    answer: Der Silberberg nimmt etwa ein Drittel der Stadtfläche ein und ist der
      Neuen Residenz in Gareth ebenbürtig an Größe.
    context: Der Silberberg, der ausschließlich Granden und Geweihten vorbehalten
      ist, nimmt etwa ein Drittel der Stadtfläche ein. Er ist der Neuen Residenz in
      Gareth ebenbürtig an Größe – die sagenumwobenen unterirdischen Anlagen und Gewölbe
      nicht eingerechnet.
  - question: Was halten die Fana für den wahren Schatz des Silberbergs?
    answer: Die Fana munkeln, dass der ganze Silberberg ausgehöhlt und voll von Silber
      und Gold sein soll – bewacht von den mumifizierten Leichen gescheiterter Diebe.
    context: Die Fana munkeln, dass der ganze Silberberg ausgehöhlt und voll von Silber
      und Gold sein soll – bewacht von den mumifizierten Leichen gescheiterter Diebe.
  - question: Welche Zugänge zum Silberberg gibt es und wie sind sie gesichert?
    answer: 'Es gibt zwei offene Zugänge: das Silberbergtor am Aufzug im Westen, ein
      doppeltes, mit Silber beschlagenes Steineichentor, das stets von vier Dukatengardisten
      bewacht wird, und das Torhaus der Zwingfeste im Süden, mit ebenfalls zweimal
      zwei Flügeln aus eisenbeschlagenem Mohagoni. Außerdem existieren noch ein Dutzend
      verborgener Fluchttunnel.'
    context: 'Es gibt zwei offene Zugänge: das Silberbergtor am Aufzug im Westen,
      ein doppeltes, mit Silber beschlagenes Steineichentor, das stets von vier Dukatengardisten
