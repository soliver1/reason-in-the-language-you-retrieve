  G1-263:
  - question: Wie werden Rufnamen im Brabaci ausgewählt?
    answer: Kinder erhalten mehrere Vornamen und wählen sich einen Rufnamen aus.
    context: 'Das Brabaci ist eine sehr klangvolle Sprache, in der Namen oft lang
      und blumig sind. Die Kinder erhalten mehrere Vornamen, so dass sie sich auf
      einen Rufnamen festlegen müssen. '
  - question: Welche Bedeutung hat der Nachname im Brabaci?
    answer: Der Nachname wird vom wohlhabenderen oder „wohlklingenderen“ Elternteil
      vererbt und gilt als wertvolles Erbe.
    context: 'Der Nachname wird von den Eltern, meist vom reicheren oder ‘wohlklingenderen’
      Elternteil, übernommen und als besonderes Besitztum betrachtet. '
  - question: Welche Möglichkeiten gibt es im Brabaci, einen Namen zu verändern?
    answer: Eine Koseform eines Namens entsteht durch das Anfügen von -ela/-elo oder
      -ita/ -ito. Um Tatkraft auszudrücken, wird der Name oft nach der ersten Silbe
      abgekürzt.
    context: 'Aus jedem Namen kann durch ein angefügtes -ela/-elo oder -ita/ -ito
      die Koseform gebildet werden. Nur wer seine Tatkraft betonen will, kürzt seinen
      Namen ab (meist hinter der ersten Silbe). '
