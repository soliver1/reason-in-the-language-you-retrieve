  G1-020:
  - question: Wie sollen sich Proben in Bezug auf ihren Schwierigkeitsgrad an den
      verschiedenen Orten des Regenwaldes unterscheiden?
    answer: Der Text gibt an, dass man den Schwierigkeitsgrad von Proben am Rande
      des Dschungels erleichtern und in seinen Tiefen erschweren sollte.
    context: Variieren Sie die unten angeführten Richtwerte nach Gutdünken. Erleichtern
      Sie Proben am Rande des Dschungels, und erschweren Sie sie in seinen Tiefen.
  - question: Welche Art von Wald wird im Text hauptsächlich beschrieben und gibt
      es in Aventurien noch andere Waldtypen?
    answer: Der Text erwähnt, dass der klassische Regenwald beschrieben wird, aber
      nicht der gesamte Süden Aventuriens von dichtem Wald bedeckt ist.
    context: Doch nicht der gesamte Süden Aventuriens ist von dichtem Ewigen Wald
      überwuchert. Je nach Klima verändert auch der Wald sein Gesicht.
  - question: Welche Bücher werden als zusätzliche Informationsquellen für den Regenwald
      in Aventurien empfohlen?
    answer: 'Für detailliertere Informationen zu Pflanzen, Tieren und Krankheiten
      im Zusammenhang mit dem Regenwald werden zwei weitere Bücher empfohlen: Zoo-Botanica
      Aventurica und Geographia Aventurica.'
    context: Weitere Anregungen zu Pflanzen und Tieren finden Sie im Band Zoo-Botanica
      Aventurica, über aventurische Krankheiten informiert die Geographia Aventurica
      auf den Seiten 205ff..
  G1-021:
  - question: Welche Pflanzenarten prägen die Landschaft des Trockenwaldes?
    answer: Die Landschaft wird von Zierkakteen, Schmuckpalmen und Fassbäumen geprägt.
    context: 'An den südlichen Küsten der Syllanischen Halbinsel und der Waldinseln
      sowie auf der süd-elemitischen Halbinsel findet sich Wald, der auf längere Trockenzeiten
      eingestellt ist. Hier prägen Zierkakteen, Schmuckpalmen und Fassbäume die Landschaft. '
  - question: Welche Funktion haben die Fassbäume im Trockenwald?
    answer: Die gewaltigen Stämme der Fassbäume speichern Wasser, das in Dürrezeiten
      auch Tieren, Menschen und anderen Lebewesen das Überleben sichert.
    context: 'Die gewaltigen Stämme der Fassbäume speichern Wasser, das in Dürrezeiten
      auch Tieren, Menschen und anderen das Überleben sichert. '
  - question: Warum wirkt der Trockenwald im Vergleich zum Regenwald lichtdurchflutet?
    answer: Im Vergleich zum Regenwald wirkt dieser Trockenwald licht, weil Lianen
      und andere Schlingpflanzen hier sehr selten sind.
    context: 'Lianen und andere Schlingpflanzen gibt es hier nur sehr selten, und
      im Vergleich zum Regenwald mit seinen grünenden ‘Vorhängen’ wirkt dieser Trockenwald
      – der nur in den Regenzeiten zu einer Farbenpracht erblüht, die dem Regenwald
      nicht nachsteht – so licht wie die Wälder des aventurischen Nordens. '
  G1-022:
  - question: Wie erhält der Nebelwald seine Feuchtigkeit?
    answer: Die Feuchtigkeit erhält der Nebelwald nicht vom Regen, sondern direkt
      durch den ewigen Nebel der Wolken, die sich an den warmen vulkanischen Abhängen
      schon in einer Höhe von zwei Meilen bilden.
    context: Seine überlebenswichtige Feuchtigkeit erhält er aber nicht vom Regen,
      sondern direkt durch den ewigen Nebel der Wolken, die sich an den warmen vulkanischen
      Abhängen schon in einer Höhe von zwei Mehlen bilden.
  - question: Welche Anpassungen haben die Tiere im Nebelwald vorgenommen?
    answer: ' Oft haben selbst solche, die ursprünglich ein Fell trugen, dies über
      die Jahrtausende verändert. Reiseberichten nach soll es hier große Raub-Säugetiere
      geben, deren Haut an die einer Nacktschnecke erinnert.'
    context: 'Die Tiere haben sich den Gegebenheiten angepasst: Oft haben selbst solche,
      die ursprünglich ein Fell trugen, dies über die Jahrtausende verändert. Reiseberichten
      nach soll es hier große Raub-Säugetiere geben, deren Haut an die einer Nacktschnecke
      erinnert.'
  - question: Was passierte mit den Forschern, die in den Nebelwäldern Altoums eine
      Suppe aus Pilzen kochten?
    answer: Es heißt, sie hätte ihre Begleiter zurücklassen müssen. Diese hätten eine
      Suppe aus Pilzen gekocht – und dieser Pilz habe sich ausgebreitet, ihre Körper
      überwuchert. Sie selber habe Pilze noch nie gemocht – und so als einzige überlebt.
    context: Von zehn Forschern einer Gruppe, die einst in die Nebelwälder Altoums
      aufbrach, kehrte, so heißt es, nur eine junge Frau zurück. Ihre Begleiter, so
      berichteten die Noioniten, die sie betreuten, hätte sie zurücklassen müssen.
      Diese hätten eine Suppe aus Pilzen gekocht – und dieser Pilz habe sich ausgebreitet,
      ihre Körper überwuchert. Sie selber habe Pilze noch nie gemocht – und so als
      einzige überlebt.
  G1-023:
  - question: Beschreibe die Eigenschaften von Mangroven.
    answer: Mangroven sind baum- oder strauchgroße Pflanzen, deren Stelzenwurzeln
      auch in Schlamm oder feinem Sand Halt finden.
    context: In regenreichen Gebieten sind auch Mangrovensümpfe verbreitet. Mangroven,
      baum- oder strauchgroße Pflanzen, deren Stelzenwurzeln auch in Schlamm oder
      feinem Sand Halt finden, siedeln sich im Meer, an der Küste oder schon am Strand
      an.
  - question: Welche Vorteile bieten Mangrovensümpfe als Lebensraum?
    answer: Mangrovensümpfe sind fischreich und gute Verstecke für kleine und mittelgroße
      Boote wie etwa Piraten-Thalukken.
    context: Mangrovensümpfe sind fischreich und gute Verstecke für kleine und mittelgroße
      Boote wie etwa Piraten-Thalukken.
  - question: Welche Gefahren können bei der Navigation durch Mangrovensümpfe auftreten?
    answer: Hier wird besonders häufig von Irrlichtern und Geistererscheinungen berichtet.
      Wenn man sich in den Mangroven verfährt, kann man bei Ebbe auf einer Schlickbank
      liegen, zwischen Luftwurzeln, die wie Speerspitzen aus dem zähen Schlamm ragen.
    context: Hier wird besonders häufig von Irrlichtern und Geistererscheinungen berichtet.
      Wenn man sich in den Mangroven verfährt, kann man bei Ebbe auf einer Schlickbank
      liegen, zwischen Luftwurzeln, die wie Speerspitzen aus dem zähen Schlamm ragen.
  G1-024:
  - question: Wie wird das Loch Harodrôl geographisch beschrieben?
    answer: Der See ist das viertgrösste Binnengewässer Aventuriens und wird von Schilf
      und Mangrovenwäldchen durchzogen.
    context: Das viertgrößte Binnengewässer Aventuriens (inklusive des deutlich kleineren
      Drunab-Sees und etwa zwei Dutzend weiterer Gewässer) ist Marschland, durchzogen
      von Schilf und Mangrovenwäldchen und außerdem ein Paradies für Vögel.
  - question: Welche Gefahren lauern laut Überlieferung im Loch Harodrôl?
    answer: Die Menschen fürchten den Algendämon Ulchuchu, dessen Leib laut Überlieferung
      ein fünf Meilen durchmessendes Feld von Blasentang sein soll. Außerdem gibt
      es Sumpfechsen, Riesenkaimane und Schlinger im See.
    context: Doch dieses Paradies hat etwas Trügerisches an sich, das die Menschen
      seit Jahrtausenden unsicher macht und von einer dichteren Besiedlung abhält,
      ohne dass sich handfeste Gründe finden ließen. Hier soll der Algendämon Ulchuchu
      sein Unwesen treiben – sein Leib soll ein fünf Meilen durchmessendes Feld von
      Blasentang sein. Und natürlich gibt es in der Ebene Sumpfechsen, Riesenkaimane
      und sogar einige Schlinger.
  - question: Wie wird der Preis für die Benutzung des Knüppeldamms bezahlt?
    answer: Ein alter Handel zwischen Echsenwesen und Menschen fordert für die Benutzung
      des Knüppeldamms ein Opfer, das den Echsen in Form von Metall dargebracht werden
      muss. Eisenhändler in Drôl verkaufen Reisenden, die den Damm passieren wollen,
      dafür unbrauchbare Metallteile.
    context: Ein alter Handel zwischen Echsenwesen und Menschen fordert für die Benutzung
      des Knüppeldamms ein Opfer, das den Echsen in Form von Metall dargebracht wird.
      Aus diesem Grunde verkaufen Eisenhändler in Drôl unbrauchbar gewordene Metallteile,
      stumpfe Werkzeuge und allerhand unnützes Schmiedewerk an Reisende, die den Knüppeldamm
      passieren wollen.
  G1-025:
  - question: Welcher Typ von Führer wäre laut dem Text am besten geeignet, um durch
      den Regenwald zu reisen?
    answer: Man sollte sich am besten einem Führer aus einem der Stämme anvertrauen,
      die im Regenwald heimisch sind.
    context: Den Regenwald ‘bereist’ man nicht. Doch auch, wer ihn nur durchqueren
      muss, hat mit einer Unzahl von Gefahren zu rechnen. Ratsam ist es natürlich,
      sich einem Führer anzuvertrauen. Am besten geeignet wären zweifelsohne ein Mann
      oder eine Frau aus einem der Stämme, die im Regenwald heimisch sind.
  - question: Was ist die Gefahr, wenn man sich einem unseriösen Führer anvertraut?
    answer: Die Gefahr besteht darin, dass sie die Reisenden zu ihren Komplizen führen,
      wo diese beraubt und oft sogar getötet werden.
    context: Allerdings gibt es unter diesen nicht viele, die Fremde durch den Wald
      führen, da die ‘Bleichhäute’ selten Gutes im Schilde führen. Und so muss man
      als Reisender zumeist mit den Leuten vorlieb nehmen, die sich als Führer anbieten.
      Darunter sind immer wieder Halsabschneider, die die ihnen Anvertrauten auf schnellstmöglichem
      Weg in das Lager ihrer Komplizen führen, wo dann Hab und Gut der Reisenden den
      Besitzer wechselt und diese selbst nicht selten die Reise über das Nirgendmeer
      antreten.
  - question: Was passiert mit Reisenden, die im Regenwald verschwinden?
    answer: Nach den Verschwundenen wird kaum jemand suchen, da sie nicht die ersten
      wären, die nicht aus dem Regenwald zurückkehren.
    context: 'Nach den Verschollenen fragen wird kaum jemand. Sie wären nicht die
      ersten, die nicht aus der grünen Hölle zurückgekehrt sind. '
  G1-026:
  - question: Was sind Sin-Ra und was tun sie mit Schuhen?
    answer: Die Sin-Ra sind Schleimpilze, die sich am liebsten über lederne Schuhe
      legen, diese umschließen und verdauen.
    context: 'Die Sin-Ra (mohisch: SchuhDinge, die auf unheimliche Weise nasskalt
      werden) sind Schleimpilze. Sie legen sich am liebsten über lederne Schuhe, umschließen
      und verdauen sie.'
  - question: Welche Nahrungsquellen bevorzugen Insekten im Regenwald und welche Folgen
      können diese Nahrungsaufnahme haben?
    answer: Viele Insekten sehen umherwandelnde Blutspeicher als willkommene Nahrungsquelle
      für sich oder ihre Eier und etliche übertragen dabei Krankheiten oder Gift.
      Moskitos, Termiten, Wespen, Bremsen und kleine Bienen fliegen gern ins Auge,
      um dort die Tränenflüssigkeit aufzusaugen.
    context: Viele Insekten sehen umherwandelnde Blutspeicher als willkommene Nahrungsquelle
      für sich oder ihre Eier, und etliche übertragen dabei Krankheiten oder Gift.
      Doch nicht nur Blut ist begehrt. Moskitos, Termiten, Wespen, Bremsen und kleine
      Bienen fliegen gern ins Auge, um dort die Tränenflüssigkeit aufzusaugen.
  - question: Was sind Blutegel und wie kann man sie entfernen?
    answer: Blutegel sind im feuchten Regenwald überall zu finden. Man kann sie mit
      Pfeffer oder ähnlichem bestreuen, um sie loszuwerden. Das Abreißen der Sauger
      aber führt zu schlimmen Wunden.
    context: Sehr unangenehm sind auch Blutegel, die im feuchten Regenwald überall
      sein können und die man mit Pfeffer oder ähnlichem bestreuen sollte, um sie
      loszuwerden. Das Abreißen der Sauger aber führt zu schlimmen Wunden.
  G1-027:
  - question: Wie bezeichnen die Waldmenschen die Söldnerameisen?
    answer: Die Waldmenschen nennen sie mata-mata-kiran, was so viel bedeutet wie
      laufender Boden, der frisst und frisst.
    context: 'Von einer Insektenspezies kannte man Jahrhunderte lang nur den Namen,
      den ihm die Waldmenschen gaben: mata-mata-kiran (mohisch: laufender Boden, der
      frisst und frisst) – und die Auswirkungen: verlassene Plantagen, auf denen man
      von Herr und Sklave, Hund und Ratte nur mehr blank polierte Knochen fand.'
  - question: Wie greifen Söldnerameisen ihre Beute an?
    answer: 'Sie ziehen in einer hundert Schritt breiten Schneise durch den Urwald
      und jede Kreatur, die sie in der Dunkelheit nicht rechtzeitig erkennt, wird
      mit Hunderten kleiner lähmender Bisse niedergeworfen und verspeist. '
    context: Zu Hunderttausenden ziehen sie in einer hundert Schritt breiten Schneise
      durch den Urwald. Jede Kreatur, die – vor allem in der Dunkelheit – die lautlose
      Gefahr nicht rechtzeitig erkennt, wird mit Hunderten kleiner lähmender Bisse
      niedergeworfen und – buchstäblich im Vorübergehen – verspeist.
  - question: Wie häufig kommen Söldnerameisen vor und wie groß ist die Gefahr, denen
      man in der Wildnis ausgesetzt sein kann?
    answer: Es wird wohl kein halbes Dutzend dieser Heere im Dschungel geben. Eines
      von ihnen könnte durchaus unbemerkt hundert Schritt neben einem nichts ahnenden
      Nachtlager vorüberziehen.
    context: Es wird wohl kein halbes Dutzend dieser Heere im Dschungel geben. Eines
      von ihnen könnte durchaus unbemerkt hundert Schritt neben einem nichts ahnenden
      Nachtlager vorüberziehen.
  G1-028:
  - question: Welche Vogelarten werden in diesem Textabschnitt explizit genannt?
    answer: Papageien, Loris (kleine Sittiche), Kakadus, Alveranis, Faulenzervogel,
      Hohnlacher, Fischreiher, Paradiesvogel und Glockenvogel.
    context: In einer Umwelt, in der fast jedes Tier auf Tarnung und leise Bewegung
      setzt, fallen sie durch bunte Farben und unentwegtes Kreischen und Singen besonders
      auf. Papageien, Loris (kleine Sittiche), Kakadus, die schillernden Alveranis,
      der Faulenzervogel (mit seinem amüsierten Keckern), der Hohnlacher (dessen gellendes
      Gelächter selbst den Waldmenschen schon die eine oder andere Tigerjagd verdorben
      hat), der Fischreiher (dessen klagender Balzruf schon manchen kinderlieben Seemann
      in helle Aufregung stürzte), der überderisch schöne Paradiesvogel (das heilige
      Tier des Aves) und der geheimnisvolle, noch nie gesichtete Glockenvogel mit
