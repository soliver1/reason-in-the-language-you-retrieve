  G1-356:
  - question: Welche Kosten entstehen täglich, um ein Bürgerrecht in Mengbilla zu
      erwerben?
    answer: Wer ein Bürgerrecht in Mengbilla erwerben möchte, muss mindestens zwei
      Taler pro Tag zahlen.
    context: 'Der lebenswichtige Unterschied zwischen Freiheit und Sklaverei ist in
      Mengbilla nicht kostenlos: Wer nicht in Knechtschaft und Unfreiheit fallen will,
      muss regelmäßig sein Bürgergeld entrichten. Wer es nicht zahlen kann, wird schneller
      zum Sklaven, als er “Großemir von Mengbilla” sagen kann, sofern keine mitfühlende
      Seele, oft der Gildenmeister selbst, die Gebühr vorschießt. Die Gesamtgebühr
      kann pro Tag zwei Taler betragen und setzt sich zusammen aus den fünf Hellern
      ‘Wohn- und Verweilgebühr’ und fünf Hellern für das ‘Mindere Waffenrecht’ (Besitzrecht
      für kleine Waffen bis 24 Finger Gesamtlänge), zu denen oft noch ein Taler für
      längere Waffen kommt – eine beträchtliche Summe, wenn man bedenkt, dass die
      Nahrung für einen Tag zwischen fünf und zehn Heller kostet.'
  - question: Wie wird das Bürgerrecht in Mengbilla nachgewiesen?
    answer: Das Bürgerrecht wird durch ein Dokument bewiesen, welches die erworbenen
      Rechte auflistet und mit dem Hai-Siegel der Stadt versehen ist.
    context: Jeder Bürger erhält ein in Mengbillas Flaggenfarben Schwarz und Weiß
      gehaltenes Dokument, das die erworbenen Rechte aufzählt und mit dem Hai-Siegel
      der Stadt geschmückt ist. Wer sich seinen Bürgerbrief stehlen lässt, hat gute
      Aussichten, alsbald in einem Sklavenpferch zu verschwinden.
  - question: Wie kann man das Gewerberecht in Mengbilla erwerben und warum ist es
      für Kaufleute wichtig?
    answer: Das Gewerberecht kann durch die Mitgliedschaft in einer Gilde oder durch
      die Zahlung von zwei Talern pro Tag erworben werden. Kaufleute müssen es besitzen,
      um Handel treiben zu dürfen.
    context: Das Gewerberecht erwirbt man durch die Mitgliedschaft in einer Gilde
      oder durch die Zahlung von weiteren zwei Talern am Tag. Weitere Steuern gibt
      es nicht, wenn man von den oft horrenden Abgaben und Schutzgeldern an die Gildenmeister
      absieht. Kaufleute müssen zudem das Gewerberecht erstehen, da nur ein Bürger
      in der Stadt Handel treiben darf.
  G1-357:
  - question: Beschreibe die allgemeine Atmosphäre und die Bedingungen in den älteren
      Teilen der Stadt Mengbilla.
