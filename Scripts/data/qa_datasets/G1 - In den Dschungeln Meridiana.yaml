      Amt und somit keine Vorgesetzten, stellen aber dennoch eine besondere Form des
      Seekriegers dar.
  - question: Welche Informationen enthält ein Kaperbrief?
    answer: Der Kaperbrief enthält die Namen des Ausstellers, des begünstigten Kapitäns
      und der Feinde, die er überfallen darf, die Geltungsdauer und eine Klausel über
      den Beuteanteil des Ausstellers.
    context: Der Kaperbrief enthält die Namen des Ausstellers, des begünstigten Kapitäns
      und der Feinde, die er überfallen darf, die Geltungsdauer und eine Klausel über
      den Beuteanteil des Ausstellers. Letztere variiert stark nach Ruhm und Erfolg
      des jeweiligen Kapitäns.
  - question: Wer sind keine Freibeuter und warum werden sie in diesem Zusammenhang
      genannt?
    answer: Keine Freibeuter hingegen sind die finsteren Gesellen, die sich von schwachen
      Handelsherren einen Brief ausstellen lassen, der sie zu ihren ‘eigenen Freibeuter’
      macht, damit sie deren Schiffe verschonen. Dies ist letzten Endes keine Freibeuterei,
      sondern Schutzgelderpressung.
