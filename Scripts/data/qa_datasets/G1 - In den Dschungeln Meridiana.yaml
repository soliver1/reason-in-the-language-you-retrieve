    context: '875 v.BF: Besiedlung der tulamidischen Gründung durch die Friedenskaiser.
      Neuer Name der Stadt: Corapia'
  - question: Wie war die politische Zugehörigkeit von Corapia vor ihrer Unabhängigkeit?
    answer: Nach einer Zeit als Teil der yaquirischen Protektorate und später als
