  - question: Welche zwei Aktionen der Hand Borons im Krieg sind im Text erwähnt?
    answer: Die Hand Borons drängte Chanya Al’Mout’pekeret, die kemsche Oberbefehlshaberin,
      in alanfanische Dienste und eliminierte Pydilyon, den erstgeborenen Sohn des
