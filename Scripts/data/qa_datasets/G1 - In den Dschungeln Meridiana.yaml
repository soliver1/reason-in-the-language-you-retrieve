  - question: Wie kam es zur Zerstörung des Großsultanats Elem?
    answer: 'Durch höhere Mächte: 106 v.BF setzten anscheinend die Götter dem dämonischen
      Treiben selbst ein Ende – ein glühender Himmelstern stürzte in die Bucht von
      Selem. Durch die entstehende Flutwelle brach etwa dort, wo der Arrati in einer
      Lagune ins Meer mündete, eine natürliche Landbrücke.'
    context: 'Die eigentliche Zerschlagung des Großsultanats Elem jedoch erfolgte
      durch höhere Mächte: 106 v.BF setzten anscheinend die Götter dem dämonischen
      Treiben selbst ein Ende – ein glühender Himmelstern stürzte in die Bucht von
      Selem. Durch die entstehende Flutwelle brach etwa dort, wo der Arrati in einer
      Lagune ins Meer mündete, eine natürliche Landbrücke. Das Meer drängte in das
      dahinter liegende Tiefland ein und verwüstete auch das Umland von Elem.'
  - question: Was geschah mit der Stadt Mirham nach der Flutkatastrophe?
    answer: Sie wurde in den folgenden Jahrhunderten Schlupfwinkel für tulamidische
