  G1-346:
  - question: Welche Ämter können bei der Großen Lotterie gewonnen werden?
    answer: Die neun höchsten Ämter des Stadtstaates sind Almosar, Oberster Kadi,
      Würfelmeister, Meister der Spiele oder Gubernator, Zoll- und Handelsprätor,
      Schutzprätor, Kriegsprätor, Hafenprätor, Meister der städtischen Kloake.
    context: Eine Lotterie aber, die zu jedem ersten Frühlingsvollmond abgehalten
      wird, verlost jährlich die neun höchsten Ämter des Stadtstaates (Almosar, Oberster
      Kadi, Würfelmeister, Meister der Spiele oder Gubernator, Zoll- und Handelsprätor,
      Schutzprätor, Kriegsprätor, Hafenprätor, Meister der städtischen Kloake).
  - question: Welche Vorteile haben die Prätoren neben ihrem Amt?
    answer: Die Gewinner der Lotterie erhalten ein Dienstdomizil samt Hausstand und
      Dienern, ein Gehalt von 100 Dukaten im Mond, die faktische Immunität vor Strafverfolgung
      (Verurteilungen können allerdings nach der Amtszeit vollstreckt werden) sowie
      das Anrecht auf die Anrede ‘Exzellenz’.
    context: 'Den Gewinnern (fortan: Prätoren) winkt überdies ein Dienstdomizil samt
      Hausstand und Dienern, ein fürstliches Gehalt von 100 Dukaten im Mond, die faktische
      Immunität vor Strafverfolgung (Verurteilungen können allerdings nach der Amtszeit
      vollstreckt werden) sowie das Anrecht auf die Anrede ‘Exzellenz’.'
  - question: Wer führte den Brauch der Großen Lotterie ein und in welcher Beziehung
      steht er zu Meister Adnan?
    answer: Sarkisian Zeforika, der Großvater und Vorgänger Meister Adnans, führte
      den Brauch der Großen Lotterie ein.
    context: 'Der Brauch der Großen Lotterie wurde von Sarkisian Zeforika eingeführt,
