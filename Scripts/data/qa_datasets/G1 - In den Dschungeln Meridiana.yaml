      wurde die wahrscheinlich beste Gelegenheit, authentische Berichte über den sagenhaften
      Nachbarkontinent zu erlangen, vereitelt. Die seit der ersten Besiedlung vermutlich
      größte Expedition aus dem Güldenland wurde vernichtet.
