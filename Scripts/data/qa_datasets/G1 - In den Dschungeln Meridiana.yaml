      der zufolge das Schicksal Chorhops künftig ganz von den Entscheidungen des Glücksgottes
      abhängen sollte. '
  G1-347:
  - question: Was macht Chorhop zu einem Paradebeispiel im Hinblick auf Götterglauben
      und das Verhältnis von Leben und Tod?
    answer: Chorhop ist ein Paradebeispiel dafür, wie dünn das Eis zwischen Götterglauben
      und Frevel, zwischen Tod und Leben ist.
    context: Chorhop ist ein Paradebeispiel dafür, wie dünn das Eis zwischen Götterglauben
      und Frevel, zwischen Tod und Leben ist. Wer Phex treu bleibt, den wird er belohnen,
      wenn es ihm beliebt. Doch wer nicht findig ist und Verzweiflung oder Gier allzu
      viel Raum gewährt, wenn Unheil oder übermäßiges Glück ihm zuteil wird, dem mag
      es geschehen, dass er den falschen Einflüsterungen folgt – oder den Tod findet.
  - question: Welche Art von Person würde sich in Chorhop nicht wohlfühlen und warum?
    answer: Wer den Gott der Diebe und Händler nicht schätzt, wer den Kitzel eines
      Glücksspiels nicht kennt und das Feilschen lieber anderen überlässt, der wird
      sich in Chorhop verloren fühlen – und die Stadt mit leeren Taschen wieder verlassen.
    context: Korruption ist in Südaventurien die Norm, aber in Chorhop ist sie beinahe
      Pflicht. Wer den Gott der Diebe und Händler nicht schätzt, wer den Kitzel eines
      Glücksspiels nicht kennt und das Feilschen lieber anderen überlässt, der wird
      sich in Chorhop verloren fühlen – und die Stadt mit leeren Taschen wieder verlassen.
      Wem des Herren Praios’ Gesetz Lebensinhalt und oberstes Dogma ist, der wird
      sie verfluchen.
  - question: Welche religiösen und ethnischen Gruppen sind in Chorhop vertreten?
    answer: Die Tulamiden der Stadt sind größtenteils rastullahgläubig, die Sklaven
