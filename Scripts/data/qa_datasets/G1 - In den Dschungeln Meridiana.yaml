    answer: Die Beziehung zwischen den Menschen der Stadt und den Achaz der Umgebung
      ist angespannt und hat sich in den letzten Jahren verschlechtert.
    context: 'Stimmung in der Stadt: Die H’Rabaaler pflegen obskure alte Sitten und
