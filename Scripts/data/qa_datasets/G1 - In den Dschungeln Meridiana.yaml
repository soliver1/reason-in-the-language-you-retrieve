  G1-035:
  - question: Warum ist eine Orientierung im Ewigen Wald ohne einheimischen Führer
      so schwierig?
    answer: Landmarken können nicht ausgemacht werden, da man stets unter einem dichten
      Blätterdach wandert und meist von hohem Gesträuch umschlossen ist, durch das
      man sich Schritt für Schritt voran quält. Selbst hier mag es geschehen, dass
      man sich im Kreis bewegt.
    context: Eine Orientierung ist ohne einheimischen Führer so gut wie nicht möglich.
      Landmarken können nicht ausgemacht werden, da man stets unter einem dichten
