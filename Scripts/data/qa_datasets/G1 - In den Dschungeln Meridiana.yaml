  G1-316:
  - question: Wo genau liegt die Stadt Charypso geographisch?
    answer: Die Stadt Charypso liegt zwischen den schroffen Klippen im Norden und
      der Mündung der Ilara.
    context: Dort, wo sich die Durchfahrt zwischen der Insel Altoum und dem Festland
      zu einem schmalen Tor verengt, liegt heute Charypso, die ‘Stadt der Schwarzen
      Schlange’. Schon seit vielen Jahrhunderten ließen sich immer wieder syllanische
      Siedler an dem schmalen Streifen zwischen den schroffen Klippen im Norden und
      der Mündung der Ilara nieder.
  - question: Wie würde man die allgemeine Atmosphäre und politische Situation in
      Charypso beschreiben?
    answer: Charypso ist ein Piratennest, in dem nur die Stärksten überleben. Die
      Stadt wird von einer Ochlokratie, also der Herrschaft des Pöbels, regiert und
      beherbergt viele Freibeuter.
    context: 'Stimmung in der Stadt: Ein abgrundtief verdorbenes Piratennest, in dem
      nur die Stärksten überleben. Wer Al’Anfa für den Gipfel an Grausamkeit hält,
      muss sich in Charypso eines Besseren belehren lassen. Besonderheiten: die ‘Planke’,
      Charyptoroth-Unheiligtum nördlich der Stadt  Charypso für den eiligen Leser
      Einwohner: um 1.900 Wappen: schwarze Schlange auf grünem Grund (inoffiziell)
      Herrschaft/ Politik: Ochlokratie (Herrschaft des Pöbels) Garnisionen: 15 ‘Büttel’
      (Schläger), etwa 400 Freibeuter der Schwarzen Schlange'
  - question: Was ist die Geschichte der Entstehung der Stadt Charypso?
    answer: Die Stadt wurde auf den Ruinen einer älteren syllanischen Siedlung erbaut.
      Viele Gebäude stehen noch leer, da sich die junge Stadt noch nicht alle angeeignet
      hat.
    context: Das heutige Charypso, ebenfalls eine syllanische Gründung, wurde auf
      den Ruinen ihrer Vorgängerin erbaut. Noch längst hat sich die junge Stadt nicht
      alle Gebäude angeeignet, die seit der Zerstörung durch die Waldmenschen leer
      stehen.
  G1-317:
  - question: Welche politischen Beziehungen pflegt Charypso zu anderen Städten?
    answer: Charypso ist seit über 100 Jahren Erzfeindin von Sylla und pflegt ein
      enges Bündnis mit Al’Anfa.
    context: Seit der Lossagung von Sylla vor über 100 Jahren ist Charypso zur Erzfeindin
      der einstigen Mutterstadt geworden. Diese Rivalität führte zu einem engen Bündnis
      mit Al’Anfa. Zu diesem Pakt steht Charypso auch heute noch treu, was der Stadt
      aber auch die erbitterte Feindschaft fast aller übrigen Stadtstaaten der Region
      – namentlich Brabaks und Khefus – eingetragen hat.
  - question: Beschreibe den Ausgang der Seeschlacht vor Charypso im Jahr 947 BF.
    answer: Die Seeschlacht vor Charypso im Jahr 947 BF. führte zum Sieg der verbündeten
      Flotten von Charypso und Al’Anfa über die Entsatzflotte von Al’Anfa, was Al’Anfa
      zum Waffenstillstand zwang.
    context: Damals gelang es den verbündeten Flotten in der Seeschlacht vor Charypso
      im Jahre 947 BF., die Al’Anfaner Entsatzflotte vernichtend zu schlagen und somit
      Al’Anfa zum Waffenstillstand zu zwingen – mehr, als zu Kriegsbeginn erhofft
      worden war.
  - question: Erkläre den Ursprung von Charypsos Ruf als die gesetz- und gottloseste
      Stadt des Südens.
    answer: Charypso wurde durch die Ansiedlung von Al’Anfaner Piraten nach der Seeschlacht
      und weiteren Verstoßenen aus anderen Ländern zu einem Zentrum für Piraterie.
      Dieser Ruf hat dazu geführt, dass Charypso als die gesetz- und gottloseste Stadt
      des Südens gilt.
    context: Die überlebenden Al’Anfaner ließen sich zum größten Teil in Charypso
      nieder, und es dauerte nur wenige Jahre, bis sie erneut die Meere des Südens
      unsicher machten – diesmal als Piraten. Ihr Beispiel lockte andere an, die nirgendwo
      sonst mehr Zuflucht fanden, und heute ist Charypso ein günstig gelegener Stützpunkt
      für ihre Raubzüge. Es ist dieser Abschaum aus aller Herren Länder, der stark
      zum Ruf Charypsos als der gesetz- und gottlosesten Stadt des Südens beigetragen
      hat.
  G1-318:
  - question: Was entdeckten die Tulamidischen Zedrakken, als sie Souram und Al’Toum
      erreichten?
    answer: Die Tulamidischen Zedrakken entdeckten die Tempelstadt und die Dämonenhöhle
      'As Shabija al Charypsodor'.
    context: 'ca. 1000 v.BF: Tulamidische Zedrakken erreichen Souram und Al’Toum.
      Entdeckung von Tempelstadt und Dämonenhöhle ‘ As Shabija al Charypsodor’. '
  - question: Beschreibe den Verlauf der Gründung und Zerstörung der Stadt Charypsos.
    answer: Die Stadt wurde zuerst von syllanischen Siedlern gegründet, allerdings
      gab es 802 BF schwere Zerstörungen durch die Haipu und Darna. Danach wurde sie
      854 BF erneut von Sylla gegründet.
    context: '499 BF: Syllanische Siedler gründen erstmals eine Stadt 802 BF: schwere
      Zerstörungen durch die Haipu und Darna 854 BF: Neugründung durch Sylla '
  - question: Welche Gruppe gründete die erste Stadt in Charypsos?
    answer: 'Die ersten Siedler waren syllanische Siedler. '
    context: '499 BF: Syllanische Siedler gründen erstmals eine Stadt'
  G1-319:
  - question: Wo tagt der Rat der Kapitäne, und wo verlegt man die Sitzungen bei Anwesenheit
      eines bestimmten Kapitäns?
    answer: Der Rat der Kapitäne findet sich gewöhnlich im Betrunkenen Papagei ein,
      einer der zahlreichen schmierigen Hafenkaschemmen. Sollte aber Dagon Lolonna
      in der Stadt weilen, trifft man sich im Hotel Gütiger Perval, dessen weitläufige
      Salons zwischen dem abgenutzten Mobiliar den einstigen Glanz der Stadt noch
      erahnen lassen.
    context: Wo finden die Sitzungen des Rates der Kapitäne statt?
  - question: Wie verlaufen die Sitzungen des Rates der Kapitäne in der Regel?
    answer: 'In aller Regel endet eine solche Ratssitzung ohne Ergebnis und mit viel
      Branntwein und Gebrüll. '
    context: In aller Regel endet eine solche Ratssitzung ohne Ergebnis und mit viel
      Branntwein und Gebrüll.
  - question: Wie wird in dem Text die Brutalität der Charyptischen Piraten beschrieben?
    answer: Auch Menschen anderer Herkunft sind nicht vor seinen sinnlosen und kaltblütigen
      Schlächtereien gefeit. Neben alt eingesessenen Größen wie Lolonna kennt die
      charyptische Piratengemeinschaft noch eine Vielzahl von jüngeren Kapitänen,
      die dem großen Vorbild kaum nachstehen und sich untereinander ein ständiges
      Wetteifern an Grausamkeiten liefern.
    context: Auch Menschen anderer Herkunft sind nicht vor seinen sinnlosen und kaltblütigen
      Schlächtereien gefeit. Neben alt eingesessenen Größen wie Lolonna kennt die
      charyptische Piratengemeinschaft noch eine Vielzahl von jüngeren Kapitänen,
