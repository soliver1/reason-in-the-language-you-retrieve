  G1-152:
  - question: Warum ist die Getreideflotte für die Stadt Al'Anfa von großer Bedeutung?
    answer: Die Getreideflotte ist ein sensibler Punkt, da sie für die Versorgung
      der Stadt mit lebenswichtigen Nahrungsmitteln verantwortlich ist und deren Ausbleiben
      zu Hungersnot führen kann.
    context: Die allmonatliche Getreideflotte zählt daher zu den empfindlichsten Punkten
      Al’Anfas, bedeutet ein Ausbleiben doch trotz der Reisterrassen rings um die
      Stadt eine Nahrungsmittelknappheit, die bei längeren Störungen in eine Hungersnot
      umschlagen kann.
  - question: Welche Gründe führten dazu, dass Al'Anfa seinen Getreideimport diversifizierte?
    answer: Aufgrund politischer Spannungen zwischen Al’Anfa und Aranien, dem bisherigen
      Hauptlieferanten, wurde der Reisimport aus Khunchom und Thalusa intensiviert.
    context: Stammte der größte Teil des importierten Getreides bislang aus Aranien,
      so hat der immer offensichtlichere Kontakt Al’Anfas mit Oron zu Verstimmungen
      geführt, die sich auch auf den Getreidehandel niederschlugen. Daher ist man
      dazu übergegangen, einen Großteil der notwendigen Mengen durch Reis zu ersetzen,
      den man aus Khunchom und Thalusa bezieht – und damit das durch die Ereignisse
      im Maraskansund deutlich gestiegene Risiko auf zwei Flotten zu verteilen.
  - question: Wie versucht Al'Anfa, das Risiko des Getreidetransports zu minimieren?
    answer: 'Um das Risiko durch den Transport des Getreides zu reduzieren, wird ein
      Teil der notwendigen Nahrungsmittelmenge nun durch Reis aus Khunchom und Thalusa
      ersetzt. '
