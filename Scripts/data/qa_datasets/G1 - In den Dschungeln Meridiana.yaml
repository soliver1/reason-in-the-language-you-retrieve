  G1-358:
  - question: Wie wird der Handel mit den meisten Waren der Stadt abgewickelt?
    answer: Die Waren der Stadt werden fast ausschließlich auf dem Basar gehandelt.
    context: Auf dem Basar findet täglich von Sonnenauf-bis Sonnenuntergang reger
      Klein- und Großhandel statt. Die meisten Waren der Stadt werden ausschließlich
      hier umgesetzt, so dass es in Mengbilla fast keine Läden gibt.
  - question: Was passiert einmal wöchentlich auf dem Kermalibn-Aldar-Platz?
    answer: Sklaven werden einmal wöchentlich auf dem Kermalibn-Aldar-Platz gehandelt
