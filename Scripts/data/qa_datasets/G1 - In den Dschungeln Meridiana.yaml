  G1-195:
  - question: Welche unterschiedlichen Gruppen von Menschen haben sich unter dem Decknamen
      „Skorpion“ zusammengeschlossen?
    answer: Dritte Söhne reicher Händler, erfolglose Gelehrte, ehemalige Gladiatoren
      und ihre Lanistas, sowie eine Gruppe ehemaliger Agenten der Hand Borons.
    context: Allerlei Gelichter hat sich unter diesem Decknamen gesammelt. Dritte
      Söhne reicher Händler, erfolglose Gelehrte, die sich im Untergrund den Ruhm
      versprechen, der ihnen an der Universität versagt blieb, sowie ehemalige Gladiatoren
      und ihre Lanistas, die man einst auf die Straße gesetzt hat, finden sich hier.
      Man munkelt gar, dass der gleichnamige Kopf dieses Verbrechersyndikats eine
      ehemalige Agentin der Hand Borons sei, die sich in den Gassen der Stadt vor
      ihren einstigen Kameraden erfolgreich zu verstecken weiß.
  - question: Welche kriminellen Aktivitäten werden dem Skorpion vorgeworfen?
    answer: Sie pressen Schutzgeld, betreiben Hehlerei, Schmuggel, Diebstahl und Zuhälterei.
    context: Der Skorpion – das ist eine Gruppe skrupelloser Gauner und Halsabschneider,
      die ihre Geschäfte (Schutzgelderpressungen, Hehlerei, Schmuggel, Diebstahl und
      Zuhälterei) im Schutz der Nacht und verborgen vor den Augen der Granden erledigen.
  - question: Wie reagieren die Stadtwache und die Granden auf die Aktivitäten des
      Skorpions?
    answer: 'Die Stadtwache möchte dem Skorpion den „Stachel ziehen“, weil er in einem
      ihrer Hoheitsgebiete wildert: Schutzgelderpressungen. Die Granden bleiben jedoch
      größtenteils desinteressiert, solange ihre eigenen Interessen nicht betroffen
      sind.'
    context: Während die Stadtwache dem Skorpion lieber heute als morgen den Stachel
      ziehen würde – wildert dieser doch in einem der ureigensten Hoheitsgebiete der
      Stadtgarden, den Schutzgeldforderungen –, beobachten die meisten Granden das
      Treiben eher gelangweilt und desinteressiert, solange ihre eigenen Interessen
      nicht in Mitleidenschaft gezogen werden.
