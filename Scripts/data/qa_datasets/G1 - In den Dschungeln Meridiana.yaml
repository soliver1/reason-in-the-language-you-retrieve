  - question: Welche Probleme können bei der Orientierung im Nebelgebirge auftreten?
    answer: Südweiser scheinen in einigen Regionen des Ewigen Waldes ihren Dienst
      zu versagen – fast so, als wüssten sie, dass die Gesetze der Zivilisation hier
      nicht gültig sind. Gerade im Nebelgebirge berichten überlebende Expeditionsteilnehmer
      von sonderbaren Phänomenen. Mancherorts versagten alle Südweiser der Gruppe
      – wie auf ein unsichtbares Kommando hin. Gleichzeitig soll dann der Nebel dichter
      werden, und ferne, klagende Schreie ertönen, die sich langsam nähern.
    context: Südweiser scheinen in einigen Regionen des Ewigen Waldes ihren Dienst
      zu versagen – fast so, als wüssten sie, dass die Gesetze der Zivilisation hier
