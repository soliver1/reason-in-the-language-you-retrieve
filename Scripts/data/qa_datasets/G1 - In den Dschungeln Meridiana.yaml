  G1-031:
  - question: Welche Namen verwenden die Waldmenschen für die bis zu armlangen Echsentiere
      im Dschungel?
    answer: Die Waldmenschen nennen die bis zu armlangen Echsentiere je nachdem, ob
      sie am Boden oder auf Bäumen leben, kopfüber laufen, ihren Schwanz abwerfen
      oder die Farbe wechseln können, als Warane oder Leguane, Geckos, Sakis oder
      Chamelehs.
    context: Im Dschungel leben viele wechselwarme Schuppentiere, von kleinsten Eidechsen
      bis zu den trampelnden Hornechsen. Ohne Zahl sind die bis zu armlangen Echsentiere,
      die die Waldmenschen – der merkwürdigen Logik ihrer Sprache nach – je nachdem,
      ob sie am Boden oder auf Bäumen leben, kopfüber laufen, ihren Schwanz abwerfen
