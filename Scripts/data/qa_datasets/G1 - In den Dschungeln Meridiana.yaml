  - question: Welche Gruppe agiert als Verbündete Al'Anfas im Süden?
    answer: Die Piraten der Schwarzen Schlange von Charypso
    context: Im Süden selbst haben sich die Piraten der Schwarzen Schlange von Charypso
      als leicht beeinflussbare und wertvolle Verbündete erwiesen. Dabei werden die
