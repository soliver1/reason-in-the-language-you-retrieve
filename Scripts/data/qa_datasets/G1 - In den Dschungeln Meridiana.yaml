  G1-409:
  - question: Wie heißt das wichtigste Handelsprodukt der Zimtinseln?
    answer: Benbukkel
    context: Als Zimtinseln bezeichnen die Mittelländer die fünf Eilande von Benbukkula
      bis Numesi, deren wichtigstes Handelsprodukt der Zimt (Benbukkel) ist.
  - question: Wer ist der Oberherrscher der Zimtinseln?
    answer: Der Sonnensohn
    context: 'Die Insel Ulikkani ist der Mittelpunkt eines großen Utulu-Kultes: Hier
      lebt der Sonnensohn, der Oberherrscher der Inseln.'
  - question: Wie werden die Schivonen bei ihrem Besuch auf den Zimtinseln häufig
      empfangen?
    answer: Sie werden oft mit Speeren und Keulen attackiert.
    context: Doch ihre Botschaft ist allenfalls freundliche Zurückweisung, ja, oft
      genug werden die Blasshäute mit Speeren und Keulen attackiert.
  - question: Auf welcher Insel leben sowohl der Sonnensohn als auch das Achaz-Volk
      der Kyshn't?
    answer: Ulikkani
    context: 'Die Insel Ulikkani ist der Mittelpunkt eines großen Utulu-Kultes: Hier
      lebt der Sonnensohn, der Oberherrscher der Inseln. Ebenfalls auf Ulikkani beheimatet
      ist das Achaz-Volk der Kyshn’t.'
  G1-410:
  - question: Wie heißt die gesamte Inselgruppe und woher stammt dieser Name?
    answer: Die Inselgruppe heißt Benbukkulen, benannt nach der namensgebenden Pflanze,
      dem Zimmetbaum.
    context: Traditionell die bekannteste der Waldinselkette hatte die Insel ihren
      Schwestern einst den (inzwischen ungebräuchlichen) Namen Benbukkulen gegeben.
      Die namensgebende Pflanze der ganzen Inselgruppe, der strauchartige Zimmetbaum,
      gedeiht an vielen Orten.
  - question: Wie ist die religiöse Ausrichtung der verschiedenen Utulus-Stämme auf
      Benbukkula?
    answer: Fünf Stämme erkennen den Sonnensohn auf Ulikkani als Oberherrscher an,
      während zwei Stämme dem 'Haus der Sonne' aus Horasreich folgen.
    context: Die meisten Bewohner sind Utulus in sieben einander feindlichen gesonnenen
      Stämmen. Oft herrschen Fehden zwischen ihnen, doch fünf der Stämme erkennen
      den Sonnensohn auf Ulikkani als Oberherrscher an und beugen sich seinen seltenen
      Urteilssprüchen. Die zwei abtrünnigen Stämme verehren seit der Landung des liebfeldischen
      Prinzregenten Salman 880 BF die Gesandten des ‘Hauses der Sonne’ (aus dem fernen
      Horasreich) als Schamanen Obarans.
  - question: Wie ist der politische Status von Benbukkula und wer profitiert von
      der Anwesenheit der Kemi?
    answer: Benbukkula gehört offiziell zu Horas, wird aber faktisch von den Kemi
      verwaltet. Die Insel dient als Lehen für die kemischen Könige und soll Frieden
      zwischen den Utulus-Stämmen gewährleisten.
    context: Benbukkula ist Teil des kemschhorasischen Condominiums und gehört damit
      faktisch zu beiden Reichen. Offiziell ist Benbukkula eine horasische Baronie,
      die ‘auf ewig’ als Lehen der kemschen Könige betrachtet wird, in deren Händen
      auch die alltägliche Verwaltung der Insel liegt. Bis jetzt deckt die Ausbeute
      an Kolonialwaren gerade die Kosten der Besatzung und der zahlreichen Siedlungsversuche.
      Neben dem wertvollen, rauchig schmeckenden Benbukkel werden insbesondere Hesindigo
      und Bimsstein auf Schivonen und Karavellen verladen. Nicht zuletzt verdanken
      die Blasshäute ihre Anwesenheit der Zustimmung des Sonnensohns, der die Fremdlinge
      als gutes Mittel ansieht, die zerstrittenen Utulustämme friedlich zu halten
      – ein Spiel mit unübersehbarem Risiko für die Kolonisten, wie die verkohlten
      Trümmer der Holzfestung Castello Firdayon in der nordwestlichen Bucht zeigen.
  - question: Welche Krankheit tritt häufig auf Benbukkula auf und wie äußert sie
      sich?
    answer: Das Fieber kommt häufig auf Benbukkula und einigen entlegenen Gebieten
      im Osten des Kemi-Reiches vor. Es äußert sich in Fieberschüben und Blutungen
      aus den Sinnesorganen.
    context: Das in vielen Fällen tödliche Fieber ist eine typische Erkrankung auf
      Benbukkula und einigen entlegenen Gebieten im Osten des KemiReiches und äußert
      sich in heftigen Fieberschüben und Blutungen aus Ohren, Nase und Augen.
  - question: Was für eine Form haben die steinernen Figuren am Kap Sanin und welche
      Bedeutungen werden ihnen von den verschiedenen Bewohnern zugeschrieben?
    answer: Die steinernen Figuren ähneln eher Echsen als Menschen und werden von
      den Utulus als Stein gewordene Geister angesehen. Die Achaz vom Stamm O'shr
      bezeichnen sie als 'Wacht gegen das geflügelte Himmelsfeuer'.
    context: 'Am Kap Sanin ragen mehrere steinerne Figuren empor. Die grünen, inzwischen
      mit Moos überwucherten Basaltkolosse stehen – zum Teil schon schief – auf einer
      Klippe oberhalb des Strandes. Sie sind, so scheint es, die stummen, fünf Schritt
      großen Zeugen einer längst vergangenen Zivilisation. Die Utulus sind nicht in
      der Lage, solch ein Werk zu errichten. Auch die Gestalt der Figuren, die mehr
      mit geschlossenen Beinen hockenden und stehenden Echsen als Menschen, erzählen
      von den “Augen, die den Weg zum Südlichen Volk weisen”. Die im Inneren der Insel
      lebenden Achaz vom Stamm der O’shr kennen sie als die “Wacht gegen das geflügelte
      Himmelsfeuer”. '
  G1-411:
  - question: Welchen Zweck erfüllt die Insel Ibekla für die Utulus?
    answer: Die Insel Ibekla dient den Utulus von Benbukkula bis Numesi als Begräbnisstätte.
    context: Ibekla (’Erhebung der Toten’) hat keine menschlichen Bewohner und dient
      den Utulus von Benbukkula bis Numesi als Begräbnisstätte für ihre Verstorbenen.
  - question: Wie werden die Toten von ihren jeweiligen Inseln zu den Dörfern gebracht?
    answer: Die Toten werden auf Flößen herangeschafft, Häuptlinge auf Sänften, berühmte
      Jäger und Krieger auf Bahren und einfache Verstorbene auf dem Rücken ihrer Hinterbliebenen.
    context: Von jeder Insel werden die Toten auf Flößen herangeschafft, in das jeweilige
      Dorf getragen (Häuptlinge auf Sänften, berühmte Jäger und Krieger auf Bahren
      und einfache Verstorbene auf dem Rücken ihrer Hinterbliebenen) und dort bestattet,
      wo es ihr Rang im Leben gebietet.
  - question: Wo haben vor vielen Jahrhunderten die Verstorbenen der Insel Mikkan
      ihre Ruhe gefunden?
    answer: Im Innern der Insel soll ein weiterer, inzwischen verfallener Totenkral
      liegen, in dem vor vielen Jahrhunderten die Verstorbenen der Insel Mikkan ihre
      Ruhe fanden.
    context: Im Innern der Insel soll ein weiterer, inzwischen verfallener Totenkral
      liegen, in dem vor vielen Jahrhunderten die Verstorbenen der Insel Mikkan ihre
      Ruhe fanden. Das Wiederauffinden eines solchen Platzes erweist sich in der üppigen
