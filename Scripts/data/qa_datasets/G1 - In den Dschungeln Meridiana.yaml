  G1-075:
  - question: Beschreibe Bal Honaks Umgang mit dem Labyrinth und seinen Gefangenen.
    answer: Bal Honak befahl den Bau des Labyrinthes und schickte ausgewählte Gefangene
      hinein, von denen nur Sirinda Eulensang entkommen konnte.
    context: Schon am ersten Tag seines Patriarchates befahl Bal Honak den Bau des
      Labyrinthes, ein gigantisches Projekt, das den Al’Anfanern, da es keinerlei
      Pläne gab, als Aushöhlung des gesamten Silberberges erschien. Tausende Sklaven
      wurden beschäftigt und Hunderte kostete es das Leben – nicht zuletzt, weil bei
      zahlreichen Einbauten nach Vollendung alle Zeugen getötet wurden. Nach einigen
      Jahren begann Seine Erhabenheit, ausgewählte Gefangene im lichtlosen Labyrinth
      auszusetzen. Von nur einer Gefangenen hat man je gehört, dass sie entkommen
      konnte. Es war die Elfe Sirinda Eulensang, die einen Faden aus ihrem Bauschkleid
      benutzte, um im Labyrinth eine Fährte zu legen. Die anderen verhungerten und
      verdursteten elendiglich.
  - question: Wie beurteilte Prinz Storko von Gareth die Gefahr, die von Bal Honak
      ausging?
    answer: Prinz Storko von Gareth sah Bal Honak als gefährlicher ein als seinen
      Onkel Kaiser Perval, der bekannt für seine Grausamkeit war.
    context: Aber bis zu seinem Tod konnte niemand auch nur eine Vermutung äußern,
      was dieses Ziel hätte sein können. Prinz Storko von Gareth, der zu dieser Zeit
      (etwa 973–993) als Botschafter nach Al’Anfa abgeschoben worden war, schätzte
      Bal Honak als viel gefährlicher ein als seinen eigenen Onkel – und der war immerhin
      der grausame Kaiser Perval.
  - question: Was geschah mit Bal Honaks Frau?
    answer: Bal Honak heiratete mit über 60 Jahren eine tulamidische Prinzessin, die
      aber bei der Geburt seines Sohnes Tarquinio starb.
    context: 'Mit über 60 Jahren nahm der Patriarch – so unvorhersehbar wie alles,
      was er tat – eine tulamidische Prinzessin zur Gemahlin, die jedoch kurz darauf
      bei der Geburt seines Sohnes Tarquinio 952 unvermittelt starb. '
  G1-076:
  - question: In welchem Jahr starb Bal Honak?
    answer: '981'
