  G1-247:
  - question: Was ist laut Text das Grundprinzip, nach dem sich das Leben in Al'Anfa
      richtet?
    answer: 'In Al’Anfa ist alles zuerst Ware: Menschen, Gefühle, Dienste, Gefallen.'
    context: 'Al’Anfa ist nicht einfach eine mittelländische Stadt, gewürzt mit Dolchen
      und Rauschmitteln. Sie ist eine der Hochkulturen Aventuriens und eine Großmacht
      – und eine ‘stadtgewordene’ Versuchung. Was Bösartigkeit, Dekadenz, Vielfalt
      und Leibesfreuden angeht, ist die Schwarze Perle absolut maßgebend: Was es in
      Al’Anfa nicht gibt, gibt es auf dem ganzen Kontinent nicht – außerhalb der Schwarzen
      Lande, versteht sich. In Al’Anfa ist alles zuerst Ware: Menschen, Gefühle, Dienste,
      Gefallen.'
  - question: Wie wird im Text das Verhältnis von Moral und Erfolg in Al'Anfa beschrieben?
    answer: 'Helden, die an moralisches Verhalten gewöhnt sind, werden den Gedanken
      an Bestechung und das gegenseitige ‘Händewaschen’ möglicherweise abstoßend finden.
      Dennoch: Hier hängt alles davon ab, wie gut man seine Schwächen verbirgt und
      seine Stärken nutzt.'
    context: 'In Al’Anfa ist alles zuerst Ware: Menschen, Gefühle, Dienste, Gefallen.
      Nichts geschieht ohne Grund oder Hintergedanken, nichts ist so, wie es auf den
      ersten Blick zu sein scheint. Das Mitleid des Fana mit den Verlierern ist äußerst
      begrenzt – wie sich trefflich in der Bal-Honak-Arena beobachten lässt. Ein Menschenleben
      ist in Al’Anfa nicht viel wert, aber die Stadt ist keineswegs gesetzlos. Helden,
      die an moralisches Verhalten gewöhnt sind, werden den Gedanken an Bestechung
      und das gegenseitige ‘Händewaschen’ möglicherweise abstoßend finden. Dennoch:
      Hier hängt alles davon ab, wie gut man seine Schwächen verbirgt und seine Stärken
      nutzt. Natürlich bleiben dabei viele auf der Strecke.'
  - question: Welchen Vorteil bietet Al'Anfa im Vergleich zu streng hierarchischen
      Gesellschaften?
    answer: Nicht zu vergessen, dass, anders als in strikteren Hierarchien, diese
      Art gesellschaftlichen Aufstiegs (vom Sklaven zum Granden) tatsächlich möglich
      ist – unter den richtigen Voraussetzungen. Wenn die Helden einem Granden imponieren,
      kann er ihnen ein mächtiger Mentor sein.
    context: Natürlich bleiben dabei viele auf der Strecke. Elend, Krankheit und Tod
      sind allgegenwärtig, aber die wenigen, die es schaffen, erfreuen sich an einem
      Luxus, der seinesgleichen sucht. Nicht zu vergessen, dass, anders als in strikteren
      Hierarchien, diese Art gesellschaftlichen Aufstiegs (vom Sklaven zum Granden)
      tatsächlich möglich ist – unter den richtigen Voraussetzungen. Wenn die Helden
      einem Granden imponieren, kann er ihnen ein mächtiger Mentor sein. Denn die
      Mächtigen sind ständig auf der Suche nach fähigen Handlangern und Werkzeugen,
      um ihre mannigfaltigen Pläne in die Tat umzusetzen. Natürlich macht man sich
      damit die Feinde seines Gönners (und dessen Handlanger) zu Feinden.
  G1-248:
