  - question: Wann dürfen Radfahrzeuge in Al'Anfa für den Transport von Lasten genutzt
      werden und warum?
    answer: Lastenverkehr mit Radfahrzeugen darf nach altem, vizeköniglichen Gesetz
      nur nachts stattfinden, damit die Straßen nicht völlig verstopft sind.
