  - question: Wie gelangt man zum großen Kultraum und welche Statue befindet sich
      dort?
    answer: Der große Kultraum liegt unterirdisch und ist durch eine breite schwarze
      Treppe erreichbar. Ein Rabenstatue mit weit ausgebreiteten Flügeln beherrscht
      den Saal.
    context: Der große Kultraum liegt unterirdisch – eine breite, schwarze Treppe
