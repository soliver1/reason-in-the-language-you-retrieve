  - question: Wie bezeichnen die Inselbewohner die Fledermäuse?
    answer: Die Inselbewohner nennen die Fledermäuse Tayas.
    context: 'Auf Andikan haben sich keinerlei Vögel angesiedelt – oder diese sind
      einst verjagt worden, wie ein Taya der Eingeborenen andeutet. '
  G1-421:
  - question: Welche Besonderheit kennzeichnet die Besiedlung von Setokan?
    answer: Setokan ist ein Paradies ohne Menschen, selbst die Utulus konnten den
      vor der Insel liegenden Mahlstrom nicht überwinden.
    context: 'Doch Setokan ist ein Paradies ohne Menschen – nicht einmal den Utulus
      ist es gelungen, den vor der Insel liegenden Mahlstrom zu überwinden. '
  - question: Beschreibe die Landschaft von Setokan anhand der Details, die im Text
      genannt werden.
    answer: Am weiten, feinen Sandstrand wiegen sich Palmen träge im Wind, ein sanft
      ansteigender Hügel führt in einen Wald aus unzähligen Orchideen, wo farbenprächtige
      Vögel und schrill kreischende Affen geschäftig von Ast zu Ast huschen.
    context: Am weiten, feinen Sandstrand wiegen sich Palmen träge im Wind, ein sanft
      ansteigender Hügel führt in einen Wald aus unzähligen Orchideen, wo farbenprächtige
      Vögel und schrill kreischende Affen geschäftig von Ast zu Ast huschen.
  - question: Mit welcher Metapher wird die Position Setokans innerhalb einer größeren
      Region dargestellt?
    answer: Setokan wird als Spitze des Schwerts des Südens beschrieben.
    context: Setokan stellt die Spitze des Schwerts des Südens dar.
  G1-422:
  - question: Welche Gefahren machen den Boronsgrund für die meisten Seefahrer zu
      einem zu vermeidenden Gebiet?
    answer: Die Gefahren des Boronsgrunds sind gefährliche Untiefen, scharfe Klippen,
      sogartige Strömungen und niederhöllische Winde.
    context: Im südlichen Perlenmeer, inmitten der Waldinseln, befindet sich eine
      Gruppe von Klippen und Felseilanden, die sich etwa 100 Meilen in der Länge und
      70 Meilen in der Breite erstrecken. Ob Kauffahrer, Eingeborene oder Piraten
      – die meisten Seefahrer meiden diese Gegend aus gefährlichen Untiefen, scharfen
      Klippen, sogartigen Strömungen und niederhöllischen Winden.
  - question: Warum zeigen viele Parteien Interesse an dem Boronsgrund trotz seiner
      Gefahren?
    answer: Es wird vermutet, dass sich aufgrund der abgelegenen Lage im Boronsgrund
      geheime Piraten- oder Schmugglerstützpunkte befinden könnten. Zudem gilt der
      Boronsgrund als einer der größten Schiffsfriedhöfe der südlichen Meere, was
      reichlich Beute verspricht.
    context: Von offiziellen Stellen wird vermutet, dass sich hier gerade aufgrund
      der gemiedenen Lage der ein oder andere geheime Piraten- oder Schmugglerstützpunkt
      befindet. Denn immerhin gilt der Boronsgrund als einer der größten Schiffsfriedhöfe
      der südlichen Meere, was reichlich Beute verspricht.
  - question: Was besagen die Legenden über den Ursprung der Geisterschiffe?
    answer: Die Legenden besagen, dass alle Geisterschiffe ihren Ursprung im Boronsgrund
      hätten und auf die Meere der Welt geschickt würden, um an allen Frevlern blutige
      Rache zu üben.
    context: Diese nämlich besagen, dass hier alle Geisterschiffe ihren Ursprung hätten
      und auf die Meere der Welt geschickt würden, um an allen Frevlern blutige Rache
      zu üben. Andere – weit seltener gehörte – Legenden besagen dagegen, dass diese
      Gegend eine (natürliche?) Barriere gegen das dem Unterwasserreich Wajahd zugehörige
      Yug’-Z’Guul darstellt.
  G1-423:
  - question: Welche Inselgruppe gehört zur Süd-Charyptik und hat einen eigenen Handelsstützpunkt?
    answer: Die Inselgruppe Efferds Tränen mit dem eigenständigen Handelsstützpunkt
      Ghurenia gehören zur Süd-Charyptik.
    context: Insbesondere die kemschen Kolonialposten Cháset und Anterroa (Áaresy)
      sowie die Inselgruppe Efferds Tränen mit dem eigenständigen Handelsstützpunkt
      Ghurenia gehören dazu.
  - question: Warum werden bestimmte Inseln im nördlichen Südmeer als Süd-Charyptik
      bezeichnet?
    answer: Obwohl recht weit von der eigentlichen Charyptik entfernt, gibt es im
      nördlichen Südmeer noch einige Inseln, die man noch nicht dem unbekannten Feuermeer
      zuschreiben will und als Süd-Charyptik bezeichnet.
    context: Obwohl recht weit von der eigentlichen Charyptik entfernt, gibt es im
