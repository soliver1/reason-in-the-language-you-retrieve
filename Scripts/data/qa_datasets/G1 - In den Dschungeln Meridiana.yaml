  - question: Nennen Sie drei größere Häfen im Reich der Kemi und deren Lage.
    answer: So verfügt das Reich nur über wenige größere Häfen – Yleha im Nordosten,
      Djáset am Nordufer der Bucht von Khefu und die Hauptstadt Khefu selbst auf der
      alemitischen Halbinsel, dem südlich vom unwegsamen Herzen des Landes gelegenen
      Kernland der Kemi.
    context: So verfügt das Reich nur über wenige größere Häfen – Yleha im Nordosten,
      Djáset am Nordufer der Bucht von Khefu und die Hauptstadt Khefu selbst auf der
      alemitischen Halbinsel, dem südlich vom unwegsamen Herzen des Landes gelegenen
      Kernland der Kemi.
  - question: Warum siedeln die Kemi hauptsächlich in Dörfern an den Wasserläufen?
    answer: Die Kemi siedeln im Landesinneren in gesicherten Dörfern an den Wasserläufen,
      da Pfade im Dschungel binnen Tagen wieder zuwachsen und so im Vergleich zu den
      Flüssen als Verkehrswege nur geringe Bedeutung haben.
