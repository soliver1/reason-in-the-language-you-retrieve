      darauf besteht, dass ihre Sänftensklaven einander ähnlich sehen, sei es, dass
      exotische Sklaven besonders hohe Preise auf dem Markt einbringen.
    context: Die Völker der Waldmenschen sowie Aranier, Tulamiden und Novadis stellen
