      aus Selemer Papyrus, Pergament und modernem Bütten. Darunter befinden sich Kostbarkeiten
      wie Texte in Ur-Tulamidya, die über die Erstürmung H’Rabaals, Gulagals und Nabuleths
      berichten, philosphische Pamphlete der Rohalszeit, magostrategische Fehleranalysen
      der Bekämpfung Borbarads sowie – im für Studenten strikt verbotenen Kellergeschoss
      – altechsische Chrmk-Papyri, deren Inhalte zum größten Teil noch gar nicht entziffert
      wurden.
  - question: Wie bemühen sich die Bibliothekare um den Aufbau ihrer Sammlung und
      wo suchen sie nach neuen Stücken?
    answer: Die Bibliothekare streben danach, eine Sammlung der wichtigsten wissenschaftlichen
      Schriftstücke des Kontinentes zusammenzustellen. Sie sind bereit, mit Dublonen,
      Versprechungen und Tauschangeboten an einzigartige Schriftstücke zu gelangen.
      Gesandte der Universität finden sich im Hesinde-Tempel zu Kuslik, in der Academia
      der Hohen Magie in Punin und in der Schreiberschule von Zorgan.
    context: Die Bibliothekare haben es sich zum Ziel gesetzt, eine Sammlung der wichtigen
      wissenschaftlichen Schriftstücke des Kontinentes zu erstellen – und jeder neue
      Lehrmeister hegt diesbezüglich neue Wünsche. Sollte dieses Ziel gelingen – und
      es scheint so, als wäre man hier erfolgreicher als in Methumis –, so dürfte
      die Bibliothek bereits in einigen Jahrzehnten derjenigen in Kuslik vor der Zerstörung
