  G1-426:
  - question: Wo auf Anterroa befindet sich die Stadt Kcht’l?
    answer: Im Zentrum Áaresys liegt die Stadt Kcht’l.
    context: Im Zentrum Áaresys liegt, vollständig vor den Augen der Nichtgeschuppten
      verborgen, die Stadt Kcht’l, die noch von einem mächtigen Wesen, womöglich einem
      Leviatan, wie zu den Tagen des Zehnten Zeitalters regiert werden soll.
  - question: Wer kümmert sich um die Menschen, die durch den Nebel der Waldinseln
      ihren Verstand verloren haben?
    answer: Die Noioniten betreuen in einem Kloster in den Ausläufern des Hochgebirges
      unweit von Morek all diejenigen, denen der dampfende Nebel der Waldinseln den
      Verstand geraubt hat.
    context: In den Ausläufern des Hochgebirges unweit von Morek haben boronische
      Missionare vor vielen Jahren ein Kloster errichtet. Hier werden heute all diejenigen
      von den Noioniten betreut, denen der dampfende Nebel der Waldinseln den Verstand
      geraubt hat.
  - question: Welche Art von Arbeit müssen die Insassen des Tashcár-Gefängnisses verrichten?
    answer: 'Schwerverbrecher aus dem Kemi- und dem Horasreich verbringen hier in
      schweren Eisenketten die letzten Jahre ihres Lebens mit harter Arbeit: Die Muschelbänke
      vor der Inselküste bieten Perlen, der dichte, sumpfige Wald um das Gefängnis
      wertvolles Holz.'
    context: 'Auch wenn die Strafen häufig auf 20 Jahre befristet sind, geht niemand
      davon aus, jemals wieder andere Zeichen von Zivilisation außer den modrigen
      Steinmauern der trutzigen, viereckigen Anlage mit den hohen Zinnen und den schmalen
      Lichteinlässen zu sehen. Schwerverbrecher aus dem Kemi- und dem Horasreich verbringen
      hier in schweren Eisenketten die letzten Jahre ihres Lebens mit harter Arbeit:
      Die Muschelbänke vor der Inselküste bieten Perlen, der dichte, sumpfige Wald
      um das Gefängnis wertvolles Holz.'
  G1-427:
  - question: Wie heißt die Siedlung, die die Kemi-Königin auf Nosfan bisher errichten
      ließ?
    answer: Nova Aurandis
    context: Bislang hat man lediglich eine Ansammlung von Holzhütten mit Palisadenzaun
      errichtet, die sich Nova Aurandis nennt.
  - question: Wann und durch wen wurde Nosfan für die Kemi-Königin beansprucht?
    answer: Die Insel Nosfan wurde erst vor wenigen Jahren durch den Entdecker Jacomo
      Aurandis für die Kemi-Königin in Besitz genommen.
    context: 'Die bewaldete Insel wurde erst vor wenigen Jahren durch den Entdecker
      Jacomo Aurandis für die Kemi-Königin in Besitz genommen und daher steckt die
