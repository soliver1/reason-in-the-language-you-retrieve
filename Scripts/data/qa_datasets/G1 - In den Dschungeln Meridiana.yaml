  - question: Welche Gefahren drohen Reisenden im Ewigen Wald sowohl tagsüber als
      auch nachts?
    answer: Während des Tages droht bei schweren Rüstungen oder Traglasten Überhitzung
      und Atemnot, die zu 3–4 Punkten zusätzlicher Erschöpfung führen kann. In der
      Nacht besteht bei unzureichender Vorsorge die Gefahr der Unterkühlung (1–3 SP(A),
      keine Regeneration von LeP, AuP oder Erschöpfung), denn es ist zwar nie viel
      kälter als 20 Grad, doch die hohe Luftfeuchtigkeit sorgt dafür, dass Kleidung
      und Haut niemals trocken sind.
    context: Aufgrund der generellen Strapazen bei einer ‘Reise’ durch den Ewigen
      Wald ist die nächtliche Regeneration für einen Ortsfremden um jeweils ein bis
