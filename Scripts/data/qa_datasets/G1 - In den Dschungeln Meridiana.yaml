  - question: Was geschah mit der Güldenlandexpedition?
    answer: Die Expedition wurde vernichtet. Die Gesandten wurden hingerichtet, nachdem
      sie sich weigerten, ihrem 'Götzen', dem Thearchen, abzuschwören, und die Schiffe
      wurden in Brand gesteckt.
    context: Da sie sich weigerten, ihrem ‘Götzen’, dem Thearchen, abzuschwören, wurden
      sie alle dem Scheiterhaufen überantwortet. Die Protokolle der Verhöre, ohnehin
