    context: Die Seeschlacht von Charypso am 28. Ingerimm 947 BF schließlich war ein
      dreitägiges Katz- und Mausspiel, bei dem die zahlreichen unterschiedlichen Gegner
      einander überraschende und empfindliche Verluste zufügten.
  - question: Welche Auswirkungen hatte die Seeschlacht von Charypso auf Sylla und
      Hôt-Alem?
    answer: Sylla hatte mit der Unterstützung Brabaks vor Charypso de facto den Schritt
      zur Unabhängigkeit getan, während Brabak durch die kommenden internen Probleme
      so beschäftigt war, dass die Protektoren von Hôt-Alem praktisch unabhängig waren.
    context: Sylla hatte mit der Unterstützung Brabaks vor Charypso de facto den Schritt
      zur Unabhängigkeit getan, während Brabak durch die kommenden internen Probleme
      so beschäftigt war, dass die Protektoren von Hôt-Alem praktisch unabhängig waren.
  - question: Wer war der Admiral der alanfanischen Flotte bei der Seeschlacht von
      Charypso?
    answer: Admiralissimus Jonnar Wilmaan
    context: Am dritten Tag kam es durch den Mut Torgal Hammerfausts und die Unfähigkeit
      von Admiralissimus Jonnar Wilmaan zu einem Desaster, bei dem zwölf Biremen,
      zu einem brennenden Haufen verkeilt, an den Klippen Altoums strandeten, während
      die Brabaker das Flaggschiff erbeuteten, selbst aber kaum Verluste zu verzeichnen
      hatten.
  - question: Wer war der Anführer der Hammerfausts bei der Seeschlacht von Charypso?
    answer: Torgal Hammerfaust
    context: Am dritten Tag kam es durch den Mut Torgal Hammerfausts und die Unfähigkeit
      von Admiralissimus Jonnar Wilmaan zu einem Desaster, bei dem zwölf Biremen,
      zu einem brennenden Haufen verkeilt, an den Klippen Altoums strandeten, während
      die Brabaker das Flaggschiff erbeuteten, selbst aber kaum Verluste zu verzeichnen
      hatten.
  - question: Warum konnten die Armada und ihre Verbündeten die Brabaker Flotte lange
      Zeit nicht zum Kampf zwingen?
    answer: Die Armada und ihre charyptischen Verbündeten konnten die Brabaker Flotte
      jahrelang nicht zum Kampf zwingen – möglicherweise auch wegen solcher ‘Irrtümer’
      wie dem Kampf zweier alanfanischer Kaperschiffe unter falscher Flagge, die sich
      gegenseitig versenkten.
    context: Weiterhin übernahm Brabak ein formelles Protektorat über Hôt-Alem, welches
      sich so ebenfalls vor dem alanfanischen Joch bewahren konnte. In Folge konnten
      die Armada und ihre charyptischen Verbündeten die Brabaker Flotte jahrelang
      nicht zum Kampf zwingen – möglicherweise auch wegen solcher ‘Irrtümer’ wie dem
      Kampf zweier alanfanischer Kaperschiffe unter falscher Flagge, die sich gegenseitig
      versenkten.
  - question: Wer war der König von Brabak während des Krieges mit Al'Anfa?
    answer: König Peleiston
    context: Diese Verhandlungen wären beinahe an der Kampfeslust der Thorwaler gescheitert,
      doch schließlich hatte König Peleiston ohne einen Toten den Machtbereich Brabaks
      mehr als verdoppelt.
  - question: Wie verfuhr die 'Hand Borons' während des Krieges mit Brabak?
    answer: Die ‘Hand Borons’ wurde ihrem Namen unter Bal Honak mehr als gerecht und
      dezimierte den Brabaker Adel mit einem halben Dutzend Attentaten.
    context: Die berüchtigte ‘Hand Borons’ wurde ihrem Namen unter Bal Honak mehr
      als gerecht und dezimierte den Brabaker Adel mit einem halben Dutzend Attentaten.
  - question: In welchem Jahr fand die Brandkatastrophe in Al'Anfa statt?
    answer: 970 BF
    context: In der Folge legten sich alle Granden Leibmagier zu, die vor allem mit
