      Bord mit schlechtem Essen, Ungeziefer und der erbitterte Kampf gegen rivalisierende
      Seeräuber. Einige Seeräuber sterben eines natürlichen Todes, manche kommen durch
      Fieber oder Hunger um oder werden ausgesetzt. Andere sterben so gewaltsam, wie
      sie gelebt haben. Ein Dolchstoß, der Strick oder das Richtbeil befördern sie
      ins Jenseits.'
  - question: Wie wird das Bild der Piraten im Text dargestellt?
    answer: 'Das Bild von den Piraten wird im Text als zweigeteilt dargestellt: Einerseits
      die romantische Seite mit Abenteuer, Freiheit und dem Kampf gegen das Böse.
      Andererseits die harte Realität des Lebens an Bord mit Gefahren und Kämpfen.'
    context: 'Dieses Bild ist jedoch nur eine Seite des Piratendaseins. Auf der anderen
      ist da der Kampf ums Überleben: ein hartes Leben an Bord mit schlechtem Essen,
      Ungeziefer und der erbitterte Kampf gegen rivalisierende Seeräuber.'
  - question: Warum sind die Piraten vom Südmeer zur Westküste gezogen?
    answer: 'Die Gründe für die Migration der Piraten vom Südmeer zur Westküste sind
      der Aufstieg der Blutigen See und der Rückgang des Handels an der Ostküste. '
    context: Wegen der Ausbreitung der Blutigen See und des Niedergangs des Ostküstenhandels
      haben sich inzwischen viele der Piraten des Südmeers gen Westküste gewandt,
      kehren jedoch immer wieder in ‘ihren’ Süden zurück.
  G1-443:
  - question: Welche verschiedenen Kulturen und Volksgruppen findet man typischerweise
      unter Piraten?
    answer: Menschen aller Länder und Kulturen, wie Mittelländer, Tulamiden, Angehörige
      der südlichen Stadtstaaten, Waldmenschen, Thorwaler und andere 'Exoten'.
    context: Ein einheitliches Äußeres aller Piraten gibt es nicht. Menschen aller
      Länder und Kulturen hat es in dieses Dasein verschlagen, und so ist eine Piratenmannschaft
      in Bezug auf Hautfarbe, Haartracht und Kleidung oft ein bunt zusammengewürfelter
      Haufen. Mittelländer, Tulamiden, Angehörige der südlichen Stadtstaaten sind
      dabei wohl am häufigsten anzutreffen, aber auch Waldmenschen, Thorwaler und
      andere ‘Exoten’ werden auf einem Piratenschiff im Süden gesichtet.
  - question: Wie kleiden sich Piraten typischerweise?
    answer: Leichte Oberbekleidung und Hosen, vielleicht noch eine bunte Weste und
      selten Schuhe. Zusätzlich werden häufig schreiend bunten Kopftücher, allerlei
      Talismane und die Bewaffnung mit Dolch und Entermesser oder Säbel getragen.
    context: Es hat sich bewährt, auf schwere Rüstung zu verzichten, und so tragen
      die meisten leichte Oberbekleidung und Hosen, vielleicht noch eine bunte Weste
      und selten Schuhe. Zusätzlich werden häufig schreiend bunten Kopftücher, allerlei
      Talismane und die Bewaffnung mit Dolch und Entermesser oder Säbel getragen.
  - question: Welche körperlichen Folgen hat das gefährliche Leben als Pirat?
    answer: Viele der rauen Gesellen tragen Narben oder Verstümmelungen wie ein fehlendes
      Auge, einen fehlenden Finger oder mehr. Piraten mit einem Holzbein werden oft
      nur noch in der Kombüse eingesetzt.
    context: Piratenleben gefährlich ist und so häufig gekämpft wird wie in kaum einer
      anderen Profession, ist es nicht verwunderlich, dass viele der rauen Gesellen
      Narben oder sogar Verstümmelungen wie ein fehlendes Auge, einen fehlenden Finger
      oder mehr davongetragen haben. Die berühmten Fälle derer, die noch mit einem
      Holzbein zur See fahren, täuschen leicht darüber hinweg, dass diese Piraten
      oft nur noch Verwendung in der Kombüse finden.
  G1-444:
  - question: Nennen Sie mindestens drei Gründe, warum Menschen dazu entscheiden,
      Piraten zu werden.
    answer: Die Gründe für das Piratenleben sind vielfältig und reichen von der Herkunft
      aus piratennationale Familien über harte Bedingungen auf Handels- oder Kriegsschiffen
      bis hin zu persönlichen Dramen, Verrat oder Verbrechen.
    context: Die Gründe, als Pirat zu leben, sind so vielfältig wie das Aussehen der
      Seeräuber. Einige werden für dieses Leben geboren, wenn sie etwa aus Sylla oder
      Charypso stammen oder in einer Familie von Thorwaler Piraten das Licht der Welt
      erblickten. Andere jedoch waren vorher Seeleute auf Handels- oder Kriegsschiffen
      und schlossen sich den Seeräubern bei der Kaperung ihres Schiffes freiwillig
      an, sei es, weil das Regime des Kapitäns allzu hart war, sie zum Dienst gepresst
      wurden oder weil schlicht das viele Gold zu sehr lockte. Häufig finden sich
      auch entlaufene oder während einer Kaperung befreite Sklaven an Bord. Doch nicht
      nur die Ärmsten der Armen suchen ihr Heil auf See. Umgekehrt mag ein Mitglied
      der vornehmen Gesellschaft durch Familiendrama, Krieg, Verrat oder ein Verbrechen
      zu diesem Leben gezwungen werden.
  - question: Erläutern Sie die verschiedenen Bedeutungen von 'Freiheit' im Kontext
      des Piratenlebens.
    answer: 'Die Motivation hinter dem Streben nach Freiheit ist zweideutig: Einerseits
      kämpfen manche für eine Freiheit von jeglicher Herrschaft und sehen sich als
      Verfechter gegen die göttliche Ordnung Praios‘. Andererseits schätzen andere
      ihre Unabhängigkeit auf See und lehnen Sklaverei ab. Es gibt jedoch auch Piraten,
      die ihre Freiheit als Recht missbrauchen, um andere zu unterdrücken und auszubeuten.'
    context: 'Freiheitsliebe ist neben der Goldgier die größte Antriebskraft – und
      auch dies ist ein zweischneidiges Schwert: Auf die Freiheit berufen sich gern
      solche Querköpfe, die meinen, kein Mensch dürfe Macht über einen anderen haben.
      Diese werden dann als Ketzer gegen die göttliche Ordnung Praios’ verfolgt. Doch
      auch jene gemäßigteren Vertreter, die ihre Unabhängigkeit auf See schätzen und
      lediglich gegen die Sklaverei ins Feld ziehen, halten die Fahne der Freiheit
      hoch. Daneben gibt es jedoch auch solche, für die ihre persönliche Freiheit
      bedeutet, andere nach Lust und Laune schikanieren zu können. Diese sind es,
      die aus dem Elend anderer Profit schlagen, indem sie erbeutete Sklaven weiterverkaufen.'
  - question: Welche weiteren Motive könnten Menschen dazu bewegen, ein Leben als
