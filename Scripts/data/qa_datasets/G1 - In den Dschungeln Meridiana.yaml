  G1-220:
  - question: Wie sammelt die Hand Borons Informationen?
    answer: 'Die Hand Borons nutzt ein weitläufiges Netz aus Informanten und Agenten.
      Geweihte in jedem Tempel des Al’Anfaner Ritus, ehemalige Söldner und Gladiatoren,
      sogar der Fürstprotektor Refardeon II. und Offiziere der Kemi-Armee dienen als
      Quelle für Informationen. '
    context: Die Hand Borons lebt vor allem von ihrem Informationsnetz, das sich weit
      über Südaventurien hinaus erstreckt. In jedem Boron-Tempel des Al’Anfaner Ritus’
      gibt es Geweihte, die über Mittelsmänner regelmäßige Berichte in die Hauptstadt
      abschicken, und häufig einen weiteren, der vor seiner Weihe Söldner oder Gladiator
      in Al’Anfa war und jederzeit einen Mord begehen würde. Fürstprotektor Refardeon
      II. plaudert bei seiner Mätresse regelmäßig seine (wenig bedeutenden) Geheimnisse
      aus, die sich für die Zeit danach schon jetzt einen Vorrat an Dublonen anlegt.
      Ebenso halten es Offiziere der Kemi-Armee.
  - question: Welche Techniken und Waffen verwendet die Hand Borons, um ihre Opfer
      zu töten?
    answer: Die Hand Borons verwendet eine Vielzahl von Methoden, um ihre Opfer zu
      beseitigen.  Sie beherrschen Waffen wie Armbrüste, Feilen, Hruruzat, Kukris
      und sogar Lianen und Schlangen. Für gezielte Tötungen werden spezielle Techniken
      wie der Mengbiller Würgeknoten eingesetzt, oder es werden rituelle Markierungen
      mit Obsidian oder einem handförmigen Brandeisen hinterlassen.
    context: Was die Techniken angeht, Opfer zu beseitigen, können die Meuchler auf
      ein enormes Repertoire zurückgreifen. Erklärtes Ziel der Ausbildung ist, dass,
      so die Verantwortlichen, “in der Hand eines Dieners Borons jedes Mittel zum
      Schlüssel zu Borons Reichs” wird. Ein ausgebildeter Kämpfer der Hand Borons
      kann mit einer Armbrust ebenso töten wie mit einer Feile, mit Hruruzat ebenso
      wie mit Kukris, mit einer Liane ebenso wie mit einer Schlange. (Weitere Meuchlerwaffen
      werden übrigens im Aventurischen Arsenal beschrieben.) Sollten Personen gefesselt
      werden, wird der Mengbiller Würgeknoten verwendet, der jeden Befreiungsversuch
      verbietet, da er sich bei der kleinsten Bewegung spürbar zusammenzieht – um
      den Hals. Falls es im Interesse der Hand Borons ist, dass man eine rituelle
      Tötung auf sie zurückführen kann, wird eine fingergliedgroße Hand aus Obsidian
      zurückgelassen oder das Opfer mit einem handförmigen Brandeisen markiert.
  - question: Wie signalisiert die Hand Borons, dass ein Mord rituell ausgeführt wurde?
    answer: Um  rituelle Morde der Hand Borons zu signalisieren, hinterlässt man eine
      fingergliedgroße Obsidianhand oder ein handförmiges Brandmal am Opfer. Bei besonders
      wichtigen Opfern wird sogar der Kopf in Seide und Edelholz eingepackt und an
      den politischen Gegner geschickt.
    context: Falls es im Interesse der Hand Borons ist, dass man eine rituelle Tötung
      auf sie zurückführen kann, wird eine fingergliedgroße Hand aus Obsidian zurückgelassen
      oder das Opfer mit einem handförmigen Brandeisen markiert. Bei besonders prominenten
      Opfern kommt es vor, dass der Kopf des Gegners – unmissverständlich in Seide
      und Edelholz, den Schätzen Al’Anfas, verpackt – an den politischen Gegner geschickt
      wird.
