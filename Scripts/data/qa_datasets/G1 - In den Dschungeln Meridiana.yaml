    answer: Der Hochgeweihte der südlichen Praios-Kirche
    context: Seit dem Hochgeweihten der südlichen Praios-Kirche in einer Vision der
      Hl. Gurvan erschien und ihm prophezeite, er sei der Erwählte, der in naher Zukunft
      den Kult des Greifen zu alter Glorie führen werde, hat sich die Arroganz des
      herrschsüchtigen Mannes in pure Blasphemie gewandelt.
  - question: Wer profitiert davon, dass Amosh Tiljak nun glaubt, von Praios geführt
      zu werden?
    answer: Nareb Zornbrecht
    context: Mag diese Spinnerei für die Priesterschaft des Raben noch harmlos sein,
      so bedeutet sie für seinen Vetter Nareb Zornbrecht, dass er mit einem Mal einen
      unberechenbaren Verbündeten an seiner Seite hat.
  - question: Welche Überzeugung hat Amosh Tiljak hinsichtlich seiner Rolle als Richter
      gewonnen?
    answer: Er ist davon überzeugt, dass alle seine Urteile durch den Willen von Praios
      gelenkt werden.
    context: War der Oberste Richter früher stets geneigt, den Machenschaften seiner
      Familie zuliebe das ein oder andere Auge zuzudrücken, so ist er nunmehr davon
      überzeugt, dass all seine Urteile auch wahrhaft durch Praios’ Willen gelenkt
      werden müssen.
  G1-189:
  - question: Welche drei Strategien nutzt Irschan Perval, um seine Macht zu festigen?
    answer: Intrigen spinnen, Zwietracht säen und sich selbst im rechten Augenblick
      als Vermittler anzubieten.
    context: Intrigen spinnen, Zwietracht säen und sich selbst im rechten Augenblick
      als Vermittler anzubieten, diese Kunst hat der ehrgeizige Magier zu wahrer Meisterschaft
      gebracht.
  - question: Wie gelang es Irschan Perval trotz anfänglicher Skepsis die Machtposition
      zu festigen?
    answer: Zunächst verspottet, hat sich Irschan Perval durch geschicktes Ausspielen
      von Informationen und dem Abschluss wechselnder Bündnisse ein sicheres Standbein
      unter den Alteingesessenen verschafft.
    context: Zunächst als politischer Aufsteiger verspottet, hat sich der mittlerweile
      zweitmächtigste Mann der Stadt durch geschicktes Ausspielen von Informationen
      und dem Abschluss wechselnder Bündnisse längst ein sicheres Standbein unter
      den Alteingesessenen verschafft.
  - question: Wie verhält sich Irschan Perval gegenüber der Position des Patriarchen
      und Amir Honak?
    answer: Er stützt zunächst die Position des Patriarchen und achtet darauf, dass
      diese nicht geschwächt wird. Gleichzeitig erzeugt er Neid auf die gestärkte
      Stellung Amir Honaks.
    context: Verwendete er zunächst seine Kraft darauf, die nach dem Krieg ungesicherte
      Position des Patriarchen (und damit seine eigene) zu stützen, so achtet er nun
      darauf, die Waagschale nicht in die Gegenrichtung ausschlagen zu lassen und
      – natürlich höchst diskret – stets einen gehörigen Nachschub an Neid auf die
      gestärkte Stellung Amir Honaks zu erzeugen.
  G1-190:
  - question: Welche Positionen bekleidet Nareb Emano Zornbrecht?
    answer: Nareb Emano Zornbrecht ist Custos Coloniae (Hütter und für das Kaperwesen)
      und zuständig für die Flotte.
    context: Nareb Emano Zornbrecht, Custos Coloniae (Hüt... [...] ... und für das
      Kaperwesen; zuständig für die Flotte)
  - question: Welche Rolle spielt das Schicksal der Stadt und des Imperiums für die
      Zornbrechts?
    answer: Die Interessen der Zornbrechts stehen über allem anderen. Das Schicksal
      der Stadt und des Imperiums betreffen sie nur insoweit, wie die Macht ihrer
      eigenen Sippe davon berührt wird.
    context: Subtilität war niemals eine der Stärken der Zornbrechts. Und so handelt
      auch der derzeitige Familienpatriarch im Rat eher nach der Art eines hungrigen
      Löwen und mit dem Feingefühl einer durchgehenden Elefantenherde. Seine eigenen
      Interessen gehen ihm über alles. Das Schicksal der Stadt und des Imperiums betreffen
      ihn nur insoweit, wie die Macht seiner eigenen Sippe davon berührt wird.
  - question: Wie reagiert Nareb Emano Zornbrecht auf die Entwicklungen rund um Amosh
      und Goldo Paligan?
    answer: Nareb Emano Zornbrecht beobachtet die zunehmende Einflussnahme seines
      Vetters Amosh und seines Erzfeindes Goldo Paligan mit Misstrauen bzw. als Dorn
      im Auge. Er glaubt jedoch, aufgrund seiner Machtposition abwarten zu können
      und zum richtigen Zeitpunkt zuschlagen zu können.
    context: Die jüngste gurvanische Erleuchtung seines ihm bislang treu ergebenen
      Vetters Amosh betrachtet er mit Misstrauen, und der gleichfalls zunehmende Einfluss
      seines Erzfeindes Goldo Paligan ist ihm ein tiefer Dorn im Auge. Bestärkt durch
      das sichere Wissen, nach wie vor der bedeutendste Faktor alanfanischer Machtpolitik
      zu sein, kann er es sich jedoch leisten, abzuwarten, um im richtigen Augenblick
      effektiv zuzuschlagen.
