  G1-373:
  - question: Welche Eigenschaften sind typisch für die Einwohner von Sylla?
    answer: Die Einwohner von Sylla sind bekannt für ihre farbenfrohe Schminke, ihr
      Verhandlungsgeschick, ihren Wagemut und ihre fröhlichen Feste.
    context: 'Nicht nur der Stadt, auch den Menschen ist das aranisch-tulamidische
      Erbe deutlich anzusehen: farbenfrohe Schminke bei Mann und Frau, Verhandlungsgeschick,
      Wagemut und fröhliche Feste, die gefeiert werden, wenn ein Kapitän reiche Beute
      bringt und bei denen reichlich Alkoholika fließen – besonders Syllarak, ein
      kräftiger Schnaps aus Palmwein.'
  - question: Was ist der 'umgekehrte Sklavenmarkt' und wie oft findet er statt?
    answer: Der 'umgekehrte Sklavenmarkt' findet viermal jährlich statt und ermöglicht
      es Vertretern des Feindes, gegen hohes Lösegeld Gefangene freizukaufen.
    context: Auch das daneben wichtigste Spektakel ist der viermal jährlich stattfindende
      ‘umgekehrte Sklavenmarkt’. An diesem Tag, und nur an diesem, haben Vertreter
      des Feindes freies Geleit in Sylla und können die Gefangenen der letzten Monde,
      meist alanfanische Seeoffiziere oder Sklavenhändler, gegen hohes Lösegeld freikaufen.
  - question: Welchen Schnaps schätzen die Einwohner Syllas besonders und wie wird
      seine Popularität beschrieben?
    answer: Der Syllarak ist ein kräftiger Schnaps aus Palmwein, dessen Beliebtheit
      bei den Einwohnern Syllas mit dem Feuer der Thorwaler vergleichbar ist.
    context: 'Überhaupt steht der Syllarak bei den Einheimischen in seiner Beliebtheit
