      zu erteilen.
  - question: Wie kann ein freier Bürger in Al'Anfa eine Klage einreichen?
    answer: 'Klagen kann jeder Freie der Stadt. Dazu sucht man den zuständigen Beamten
      auf und trägt ihm seinen Fall vor. Dieser Beamte entscheidet dann, ob es zu
      einer Verhandlung kommt. '
    context: Klagen kann jeder Freie der Stadt. Dazu sucht man den zuständigen Beamten
