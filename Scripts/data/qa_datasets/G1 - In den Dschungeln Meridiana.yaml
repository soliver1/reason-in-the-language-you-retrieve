  G1-320:
  - question: Wie finden die Gladiatorenkämpfe in Charypso statt?
    answer: Die Gefangenen werden auf eine schwimmende Plattform im Hafenbecken abgesetzt
      und müssen sich dort einen Kampf auf Leben und Tod liefern.
    context: Denn oft genug, wenn es die grausame Spendierlaune der großen Kapitäne
      erlaubt, werden in der Stadt Gladiatorenkämpfe veranstaltet. Dabei werden die
      stärksten und stolzesten Gefangenen auf eine schwimmende Plattform im Hafenbecken
      abgesetzt, um sich dort einen Kampf auf Leben und Tod zu liefern.
  - question: Wer kauft die Gefangenen, die kein Lösegeld versprechen?
    answer: Donna Messalia di Aragoja ist eine in die Jahre gekommene Al’Anfaner Sklavenhändlerin,
      die sich dem Konkurrenzdruck der Schwarzen Perle entzogen hat.
    context: Denn oft genug, wenn es die grausame Spendierlaune der großen Kapitäne
      erlaubt, werden in der Stadt Gladiatorenkämpfe veranstaltet. Dabei werden die
      stärksten und stolzesten Gefangenen auf eine schwimmende Plattform im Hafenbecken
      abgesetzt, um sich dort einen Kampf auf Leben und Tod zu liefern. Von den Kaianlagen
      aus klatscht die Bevölkerung johlend Beifall, wenn einer der Verwundeten ins
      Wasser stürzt – wo er sogleich von zahlreichen Haien zerfleischt wird. Wer kein
      Lösegeld verspricht oder seinen ‘Besitzern’ zu lästig ist, findet sich schnell
      bei Donna Messalia di Aragoja wieder, einer in die Jahre gekommenen Al’Anfaner
      Sklavenhändlerin, die sich dem Konkurrenzdruck der Schwarzen Perle entzogen
      hat, indem sie ihr Geschäft nach Charypso verlegte.
  - question: Wo in Charypso werden die Sklavenmärkte abgehalten?
    answer: Die Sklavenmärkte finden monatlich im ehemaligen Theater statt.
    context: Die Gefangenen, die das Glück haben, als profitabel zu gelten, werden
      mit großer Wahrscheinlichkeit auf einem der allmonatlich stattfindenden Sklavenmärkte
      im ehemaligen Theater ausgestellt.
  - question: Wer ist der Anführer der Geweihten im Efferd-Tempel?
    answer: Raul Moreno ist der Tempeloberster des Efferd-Tempels in Charypso.
    context: Der Efferd-Tempel im Zentrum der Stadt ist weniger eine Stätte der Andacht
      als ein Ort, wo Piraten mit ihren Untaten prahlen und Teile ihrer Beute für
      weiteren Beistand des Meeresgottes opfern. Unter der Führung des Tempelobersten
      Raul Moreno – einst als Schiffbrüchiger auf hoher See gerettet und zum Geweihten
      geworden – haben sich die Geweihten zu einer sehr einflussreichen Kraft im Gewirr
      Charypsos entwickelt.
  - question: Warum trauen sich die meisten Menschen in Charypso nicht, Raul Moreno
      zu widersprechen?
    answer: Die Piraten der Stadt sind gläubige Anhänger des hiesigen Efferd-Kultes.
    context: So überzeugend und dreist ist ihr Auftreten, dass kaum jemand Widerspruch
      wagt, zumal die Piraten der Stadt gläubige Anhänger des hiesigen Efferd-Kultes
      sind. Moreno scheut sich nicht, Efferds Zorn ein wenig nachzuhelfen, sollte
      man seine Autorität allzu dreist in Frage stellen.
  G1-321:
  - question: Wie wird das Leben in Charypso beschrieben?
    answer: Das Leben in Charypso ist gefährlich und brutal. Ein Leben gilt nur so
      viel wie das Geschick im Kampf.
    context: 'Charypso erfüllt die Funktion der abgrundtief schlechten Piratenstadt,
      in der das Leben eines Einzelnen gerade mal so viel wert ist wie sein Geschick,
      selbiges mit dem Säbel in der Hand zu behaupten. '
  - question: Welche Situationen könnten für Helden in Charypso entstehen?
    answer: Die Helden könnten von charyptischen Piraten gefangen genommen werden,
      sich den Machthabern der Stadt anschließen müssen oder im Auftrag einer Familie
      kommen, um einen vermissten Sohn zu suchen.
    context: Hier können Sie alles ansiedeln, was an götterlosen Gesellen die Meere
      unsicher macht und was an Bosheit und Grausamkeit seinesgleichen sucht. Fast
      jederzeit mag es Helden passieren, dass ihr Schiff in die Hand charyptischer
      Piraten gerät. Vielleicht werden sie aber auch in die Ränke der Mächtigen Charypsos
      gezogen und müssen sich mit der animalischen Brutalität Dagon Lolonnas, der
      schmierigen Dekadenz Messalia di Aragojas oder der fanatischen Dreistigkeit
      des Hochgeweihten Raul Moreno auseinandersetzen. Ebenso gut kann es passieren,
      dass sich die Helden im Auftrag einer verzweifelten Familie hierher verirren,
      auf der Suche nach dem vermissten Sohn, der sich zum neuen Lieblingssklaven
      einer einflussreichen Kapitänin mausert – oder just in diesem Moment über die
      Planke geschickt wird.
  - question: Wer sind die einflussreichen Personen in Charypso und welche Eigenschaften
      werden ihnen zugeschrieben?
    answer: Die Mächtigen von Charypso sind Dagon Lolonnas, bekannt für seine animalische
      Brutalität, Messalia di Aragoja, die durch ihre schmierige Dekadenz auffällt
      und Raul Moreno, der durch fanatische Dreistigkeit besticht.
    context: Vielleicht werden sie aber auch in die Ränke der Mächtigen Charypsos
      gezogen und müssen sich mit der animalischen Brutalität Dagon Lolonnas, der
      schmierigen Dekadenz Messalia di Aragojas oder der fanatischen Dreistigkeit
      des Hochgeweihten Raul Moreno auseinandersetzen.
  G1-322:
  - question: Wie ist die Bevölkerungsstruktur von H’Rabaal?
    answer: Die Stadt H’Rabaal hat etwa 1.100 Einwohner, darunter 10 % Waldmenschen
      und 5 % Achaz. Zusätzlich leben noch etwa 1.600 Achaz und 200 Ziliten in den
      Sümpfen um die Stadt.
    context: 'H’Rabaal für den eiligen Leser Einwohner: um 1.100 (10 % Waldmenschen,
      5 % Achaz), zusätzlich noch etwa 1.600 Achaz und 200 Ziliten in den Sümpfen
      der Umgebung'
  - question: Wer hält die Macht in H'Rabaal und wie ist die militärische Situation?
    answer: Die Herrschaft liegt bei der Familie der Charazzar unter dem alten 'König'
      Azzaph. Die Stadt verfügt über 20 Stadtgardisten, eine Lanze Königlich Brabaker
      Hellebardiere und einige Achaz-Tempelwachen.
    context: 'Herrschaft/Politik: Die Familie der Charazzar (unter dem alten ‘König’
