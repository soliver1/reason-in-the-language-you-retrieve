  - question: Wie ist das Militärsystem im Königreich Brabak aufgebaut?
    answer: Brabaks Militär besteht aus wenigen stehenden Truppen, während alle freien
      Bürger theoretisch an Wehrübungen teilnehmen müssen. Der Freikauf von dieser
      Pflicht bringt dem König finanzielle Mittel.
