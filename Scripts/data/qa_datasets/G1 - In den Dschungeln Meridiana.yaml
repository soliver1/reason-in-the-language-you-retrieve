  - question: Was geschah mit der kemschen Insel Aeltikan während des Khôm-Kriegs?
    answer: Die Al'Anfaner stürmten die kemsche Insel Aeltikan und gründeten dort
      Port Honak. Selem geriet unter alanfanischen Einfluss.
    context: In der Zwischenzeit hatten die Al’Anfaner auch die kemsche Insel Aeltikan
      gestürmt und dort Port Honak gegründet. Selem geriet unter alanfanischen Einfluss.
  - question: Warum ist der Einfluss Al'Anfans auf Selem heute nur noch nominal?
    answer: Nach drei Statthaltern, die innerhalb von fünf Jahren durch Mord oder
      Wahnsinn starben, erlahmte das Interesse Al’Anfans an der Herrschaft über Selem.
      Die Herrschaft wird heute nur noch nominell durch den Marschall-Gubernator in
      Port Corrad ausgeübt.
    context: Nachdem jedoch binnen fünf Jahren drei Statthalter (natürlich mit den
      fantasievollsten Titeln und reichlich Söldnern ausgestattet) Meuchelmord oder
      Wahnsinn zum Opfer fielen, erlahmte jedoch das Interesse, und die Herrschaft
      wird heutzutage nur noch nominell durch den Marschall-Gubernator in Port Corrad
      ausgeübt.
