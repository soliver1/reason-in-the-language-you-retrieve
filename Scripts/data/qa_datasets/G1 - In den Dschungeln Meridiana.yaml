  - question: Welche Art von Wegen gibt es in den wichtigsten Straßen von Al'Anfa
      und wer nutzt sie hauptsächlich?
    answer: In den wichtigsten Straßen liegen aus schwarzem Basalt gemeißelte Laufstege,
      die vor allem für die Sänftenträger gedacht sind. Die Granden achten peinlich
      auf die Wartung und Säuberung dieser Laufstege.
