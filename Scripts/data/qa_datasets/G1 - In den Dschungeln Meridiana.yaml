  - question: Aus welchen Völkern stammen die meisten Sklaven und warum werden Sklaven
      aus verschiedenen Völkern gehandelt?
    answer: Die Völker der Waldmenschen sowie Aranier, Tulamiden und Novadis stellen
      die meisten Sklaven, doch finden sich auch Mittelreicher und Bornländer. Sklaven
