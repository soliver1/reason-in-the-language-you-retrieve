      auf der Sklaveninsel angekommen sind?
    answer: Die Sklaven werden nach ihrer Ankunft in die stinkenden Pferche für Gladiatoren
      und Arbeitssklaven oder in die Zellen des Hausund Lustsklaventraktes gebracht.
      Dort werden sie ‘abgerichtet’, bis sie für eine Versteigerung geeignet sind.
