    context: 'Erst Walkir Zornbrecht, einem friedlosen Thorwaler, gelang es 660 BF,
      zwischen Fasar und Hylailos ein Heer von 2.000 Söldnern aufzustellen: die Alanfanische
      Fremdenlegion.'
