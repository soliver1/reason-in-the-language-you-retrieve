    context: Ist die Hand Borons schon in Friedenszeiten gnadenlos, so schlägt sie
      im Krieg stets an den empfindlichsten Punkten des Gegners zu. Im Krieg gegen
      Brabak (944–947 BF) fielen ihr König Peleistons Gattin und sein ältester Sohn
      sowie drei Mitglieder der Audienza zum Opfer...
  - question: Wie zwang die Hand Borons Königin Peris III. zur Kapitulation im Krieg
