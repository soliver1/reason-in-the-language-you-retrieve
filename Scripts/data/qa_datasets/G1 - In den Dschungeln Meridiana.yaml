  - question: Welche Gesetze und Rechtstexte bilden die Grundlage für das Ius Meridiana?
    answer: Das Ius Meridiana basiert zu großen Teilen auf Rohals 'Codex Pax Aventuriana',
      Kaiser Eslams ' Allgemeynes Hand- und Halsrecht' und einigen uralten tulamidischen
      Gesetzen. Im Laufe der Jahrhunderte wurde die Sammlung immer wieder durch unzählige
      neue Gesetze und Erlasse, Ergänzungen und Ausnahmen erweitert, die die Vizekönige,
      der Hohe Rat der Zwölf und die Patriarchen erlassen haben.
    context: 'Es mag überraschend klingen, doch Al’Anfa ist die Stadt mit den meisten
      Gesetzen Aventuriens. Bei dem hier geltenden ‘Ius Imperii Meridianae’ (kurz:
      Ius Meridiana) handelt es sich um eine Gesetzessammlung, die zu großen Teilen
      auf Rohals ‘Codex Pax Aventuriana’, Kaiser Eslams ‘ Allgemeynes Hand- und Halsrecht’
      und einigen uralten tulamidischen Gesetzen basiert (die vor allem Angelegenheiten
      wie Seidenhandel, Meuchelmord und Gifte regeln). Im Laufe der Jahrhunderte wurde
      die Sammlung immer wieder durch unzählige neue Gesetze und Erlasse, Ergänzungen
      und Ausnahmen erweitert, die die Vizekönige, der Hohe Rat der Zwölf und die
      Patriarchen erlassen haben. Insgesamt stellt das Ius Meridiana, das in der Bibliothek
      der Universität mehrere Regalreihen füllt, jede andere Gesetzessammlung in den
      Schatten. Die meisten Studiosi der hiesigen juristischen Fakultät ergreifen
      angesichts der sich türmenden Pergamente, Schriftrollen und Folianten bereits
      nach kurzer Zeit voller Grausen die Flucht – vielleicht auch ein Grund, weshalb
      die dringend notwendige Überarbeitung des Ius bis heute ausgeblieben ist.'
  - question: Welche Konsequenzen hat es für einen verheirateten Grande, der sich
      mit einer Gauklerin einlässt? Darf er ihr dennoch einen Mordauftrag erteilen?
    answer: Ein verheirateter Grande, der sich mit einer Gauklerin einlässt, läuft
      Gefahr, vor dem Travia-Tempel gesteinigt zu werden, aber kein Gesetz verbietet
      ihm, derselben Gauklerin einen Mordauftrag an einem Konkurrenten zu erteilen.
    context: Aufgrund der Tatsache, dass man über Jahrhunderte hinweg Gesetz an Gesetz
      gereiht hat, ohne sich um Verhältnismäßigkeiten zu scheren, kommt es heute zu
      einer Reihe kurioser Sonderregelungen. So riskiert etwa ein Hesinde-Geweihter,
      der versucht, einem begabten Handwerksburschen ohne Entgelt das Lesen beizubringen,
      schwere Strafen, während sich ein Herumtreiber fast ungeniert als Alrik von
      Sturmfels ausgeben kann. Ein verheirateter Grande, der sich mit einer Gauklerin
      einlässt, läuft Gefahr, vor dem Travia-Tempel gesteinigt zu werden, aber kein
