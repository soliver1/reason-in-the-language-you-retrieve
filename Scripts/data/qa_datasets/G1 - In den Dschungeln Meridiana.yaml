  - question: Wer sind Freibeuter und wie unterscheiden sie sich von Piraten?
    answer: Freibeuter dagegen sind Kapitäne, die mit offizieller Lizenz, dem ‘Kaperbrief
      ’, Schiffe des Feindes überfallen. Insofern haben sie zwar kein militärisches
      Amt und somit keine Vorgesetzten, stellen aber dennoch eine besondere Form des
      Seekriegers dar.
