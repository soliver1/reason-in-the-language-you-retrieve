questions:
  G1-008:
  - question: Welche Abkürzung steht für das Werk 'Stäbe, Ringe, Dschinnenlampen'?
    answer: SRD
    context: 'Bei den in diesem Band verwendeten Verweisen auf neuere Titel handelt
      es sich um die folgenden Publikationen: Basis Das Schwarze Auge Basisregeln
      Hardcover WdH Wege der Helden Hardcover WdZ Wege der Zauberei Hardcover WdG
      Wege der Götter Hardcover GA Geographia Aventurica ZBA Zoo-Botanica-Aventurica
      SRD Stäbe, Ringe, Dschinnenlampen '
  - question: Welche Abkürzung wird für das Werk 'Wege der Helden' verwendet?
    answer: WdH
    context: 'Bei den in diesem Band verwendeten Verweisen auf neuere Titel handelt
      es sich um die folgenden Publikationen: Basis Das Schwarze Auge Basisregeln
      Hardcover WdH Wege der Helden Hardcover'
  - question: Welche beiden Publikationen werden durch die Abkürzungen GA und ZBA
      repräsentiert?
    answer: GA steht für Geographia Aventurica und ZBA steht für Zoo-Botanica-Aventurica.
    context: 'Bei den in diesem Band verwendeten Verweisen auf neuere Titel handelt
      es sich um die folgenden Publikationen: ... GA Geographia Aventurica ZBA Zoo-Botanica-Aventurica...'
  G1-009:
  - question: Für wen könnten die Inseln Ucuris und Kaiser-Raul-Land interessant sein?
    answer: Die Eilande Ucuris und Kaiser-Raul-Land sind höchstens für Piraten interessant.
    context: Die beiden kleineren Eilande Ucuris und Kaiser-Raul-Land sind höchstens
      für Piraten interessant.
  - question: Wie heißt der südwestlichste Teil der Meridianischen Halbinsel?
    answer: Mysobien
    context: 'Den äußersten Südwesten der Meridianischen Halbinsel nimmt Mysobien
      ein. '
  - question: Wie heißen die beiden Namen des Gletschersees im Hochland von H’Rabaal?
    answer: Madas Auge, H’Sszirhzz
    context: 'Inmitten dieser Bergwelt liegt ein gewaltiger, düsterer Gletschersee:
      Madas Auge tauften ihn bosparanische Forscher, H’Sszirhzz nennen ihn die Achaz.'
  - question: Wie weit ist es von der Quelle des Hanfla bis zur Goldenen Bucht?
    answer: 70 Meilen
    context: Als zweiter nennenswerter Fluss entspringt der Chamir in den Höhen des
      Regengebirges nördlich von Mirham, passiert die Königsstadt und mündet in der
      schmalen Schicksalsbucht ins Meer. **Der Hanfla mündet bereits nach 70 Meilen
      bei Al'Anfa in die Goldene Bucht.**
  - question: Welche Insel an der Alemitischen Bucht hat eine mittelreichische Kolonie?
    answer: Praiosruh
    context: Drei Inseln sind der Alemitischen Bucht vorgelagert, von denen vor allem
      das stark befestigte Praiosruh mit der mittelreichischen Kolonie Port Emer von
      Bedeutung ist.
  - question: Wie heißt die Siedlung an der östlichsten Spitze der Syllanischen Halbinsel?
    answer: Sylla
    context: Einzig Sylla an der östlichsten Spitze der Halbinsel und die Siedlung
      Yar’dasham im Südosten wären hier hervorzuheben.
  - question: Wie heißt die Siedlung im Südosten der Syllanischen Halbinsel?
    answer: Yar’dasham
    context: Einzig Sylla an der östlichsten Spitze der Halbinsel und die Siedlung
      Yar’dasham im Südosten wären hier hervorzuheben.
  - question: Wo liegt Kemi?
    answer: Kemi liegt östlich von Mysobien und südlich des Jalob bis zur Alemitischen
      Bucht.
    context: Das Gebiet östlich Mysobiens und südlich des Jalob bis zur Alemitischer
      Bucht mit ihren endlosen Sandstränden bezeichnet man allgemein als Kemi.
  - question: Wie heißt der Golf, der zusammen mit dem Perlenmeer die Alemitische
      Halbinsel umschließt?
    answer: Golf von Khefu
    context: Zwischen Perlenmeer und Südmeer gelegen, sind weite Teile des Landstrichs
      von dichtem Dschungel bedeckt.
  - question: Welcher Fluss mündet bei Hôt-Alem in die Alemitische Bucht?
    answer: Tirob
    context: Dieser ist durchzogen von zahlreichen Wasserläufen und Seen, unter denen
      vor allem der bei Hôt-Alem in die Alemitische Bucht einmündende Tirob und der
      bei Khefu in den Golf von Khefu mündende Astaroth zu erwähnen sind.
  - question: Welcher Fluss mündet bei Khefu in den Golf von Khefu?
    answer: Astaroth
    context: Dieser ist durchzogen von zahlreichen Wasserläufen und Seen, unter denen
      vor allem der bei Hôt-Alem in die Alemitische Bucht einmündende Tirob und der
      bei Khefu in den Golf von Khefu mündende Astaroth zu erwähnen sind.
  - question: Wie heißt die Hauptstadt des Kemi-Reiches?
    answer: Khefu
    context: Wichtigste Ortschaften sind neben der kemschen Hauptstadt Khefu das weiter
      südlich gelegene Setepen und Hôt-Alem.
  - question: Wie hoch ragen die Gipfel des Hochlandes von H'Rabaal?
    answer: Mehr als 2.500 Schritt
    context: Die beiden kleineren Eilande Ucuris und Kaiser-Raul-Land sind höchstens
      für Piraten interessant.
  G1-010:
  - question: Wer war der erste, dem die Durchfahrt durch die Straße von Altoum gelang?
    answer: Admiral Sanin III.
    context: Nach den ältesten erhaltenen Berichten begann die Erkundung der Charyptik
      und der Waldinseln (die dieses Meeresgebiet nach Norden begrenzen) durch Mittelländer
      und Tulamiden vor etwa 2.000 Jahren. Damals entdeckten tulamidische Zedrakkenfahrer
      während des Diamantenen Sultanats Altoum. Admiral Sanin III. gelang 857 v.BF
      die Passage durch die Straße von Altoum.
  - question: Wann begann die gezielte Navigation zu, zwischen und von den Waldinseln
      aus?
    answer: Erst im 7. Jh. nach Bosparans Fall erlaubte die Blütezeit Havenas den
      Karavellen nicht nur die Fahrt ins Güldenland, sondern auch die gezielte Navigation
      zu, zwischen und von den Waldinseln aus.
    context: Erst im 7. Jh. nach Bosparans Fall erlaubte die Blütezeit Havenas den
      Karavellen nicht nur die Fahrt ins Güldenland, sondern auch die gezielte Navigation
      zu, zwischen und von den Waldinseln aus. Zunächst unternahmen Kapitäne diese
      nur in der Hoffnung auf Entdeckung unschätzbarer Reichtümer. Erst nach und nach
      kam es zur Einrichtung regelmäßiger Handelsrouten und zur Gründung von Kolonien.
  - question: Welche Inselgruppen der Charyptik sind bis heute die einzigen, deren
      Existenz und Lage allgemein gesichert sind?
    answer: Die Gewürzinseln, die Moskitoinseln und die Zimtinseln
    context: Überdies entwickelte sich in diesem Rahmen der Brauch, missliebige Adlige
      (von denen wohl Prinzgemahl Salman, bis 880 BF Regent des Lieblichen Feldes,
      der berühmteste war) auf die Inseln zu verbannen. Mit der Zeit wurden die Gewürzinseln,
      die Moskitoinseln und die Zimtinseln annektiert. Bis heute sind diese die einzigen,
      deren Existenz und Lage allgemein gesichert ist.
  G1-011:
  - question: Warum ist die Bestimmung der Längengrade auf Aventurien schwierig?
    answer: Vor allem aufgrund der mangelnden Genauigkeit der aventurischen Zeitmessung.
    context: 'Die Höhe und damit die Nord-Süd-Ausdehnung des Kontinentes lässt sich
      recht deutlich am Blickwinkel zu den Sternen des Zwölfkreises festmachen. Die
      West-Ost-Ausdehnung dagegen kann (auf dem Meer) kaum gemessen werden – sprich:
      Selbst bei den Geographen, die die Kugelgestalt Deres annehmen (also fast alle),
      ist eine exakte Methode zur Bestimmung der Längengrade annähernd unbekannt,
      was vor allem an der mangelnden Genauigkeit der aventurischen Zeitmessung liegt.'
  - question: Warum wird das 'Brabakische Großreich' auf den meisten Karten oft zu
      groß dargestellt?
    answer: Aufgrund der Stürme um Kap Brabak und der Sümpfe zu Land sind im 'Brabakischen
      Großreich' Streckenmessungen sehr ungenau. Daher wird es auf den meisten Karten
      seit Jahrhunderten zu groß dargestellt.
    context: Führend ist hier – mit knappem Abstand – Al’Anfa vor dem Horasreich.
      Aufgrund der Stürme um Kap Brabak und der Sümpfe zu Land sind auch dort Streckenmessungen
      sehr ungenau. Und so ist auch das ‘Brabakische Großreich’ seit Jahrhunderten
      auf den meisten Karten viel zu groß verzeichnet.
  - question: Wie viele Waldinseln sind auf aktuellen aventurischen Karten verzeichnet?
    answer: 'Die neuesten aventurischen Karten, wie die der Aves-Freunde aus dem Jahr
      1023 BF und ältere Dokumente, verzeichnen acht Inseln, sowie weit draußen das
      sagenumwobene Adamantenland.  '
    context: Detailreiche, zutreffende Farbkarten stehen nur Meistern und Spielern
      zur Verfügung. Helden müssen mit aventurischen Karten Vorlieb nehmen. Selbst
      die neueste Karte der Aves-Freunde aus dem Jahr 1023 BF sowie alle älteren Dokumente
      (siehe z.B. GA 100) zeigen nur acht Inseln sowie weit draußen das sagenumwobene
      Adamantenland.
  - question: Warum ist es schwierig, die West-Ost-Ausdehnung des Kontinents zu bestimmen?
    answer: Wegen der Schwierigkeit der Bestimmung der Längengrade.
    context: 'Die Höhe und damit die Nord-Süd-Ausdehnung des Kontinentes lässt sich
      recht deutlich am Blickwinkel zu den Sternen des Zwölfkreises festmachen. Die
      West-Ost-Ausdehnung dagegen kann (auf dem Meer) kaum gemessen werden – sprich:
      Selbst bei den Geographen, die die Kugelgestalt Deres annehmen (also fast alle),
      ist eine exakte Methode zur Bestimmung der Längengrade annähernd unbekannt,
      was vor allem an der mangelnden Genauigkeit der aventurischen Zeitmessung liegt.'
  G1-012:
  - question: Aus welchen Sternzeichen besteht der Zwölfkreis?
    answer: Der Zwölfkreis besteht aus den Sternzeichen der zwölf Götter.
    context: Wie Goldborte und zugleich Sternenwall des Himmels, spannt sich der aus
      den Sternzeichen der Götter bestehende Zwölfkreis über die Mitte des Firmaments.
  - question: Was ist die Finstersonne?
    answer: Die Finstersonne ist ein lichtloser Körper von der Form einer Sphäre oder
      eines Gallertklumpens, schwarz wie Endurium und ohne jegliche Reflexionseigenschaft.
      Sie schiebt sich alle Jahre über den Himmel Deres und verdunkelt alles in ihrer
      Aura.  Sie ist etwa dreimal so groß wie Sonne und Mond zusammen und verharrt
      nächtelang am Himmel, bevor sie wieder verschwindet.
    context: Ein lichtloser Körper von der Form einer Sphäre oder eines Gallertklumpens,
      schwarz wie Endurium und ohne jegliche Reflexionseigenschaft, schiebt sich alle
      Jahre über den Himmel Deres und verdunkelt alles in seiner Aura.
  - question: Wann entdeckte Harika ni Coalgha die 'Kiefernzweige'?
    answer: Harika ni Coalgha entdeckte die 'Kiefernzweige' im Jahr 988 BF.
    context: Harika ni Coalgha hat hier 988 BF mit einem Fernrohr grün und weiß glosende
      Risse im Himmelszelt ausgemacht, als hätten Krallen über das Firmament gekratzt
      oder Linien aus Kraft ein Geflecht gebildet.
  - question: Wie nennen die Waldmenschen das Ereignis, bei dem glühende Funken, Stahlbrocken
      und Meteoriten auf ein großes Meeresareal niedergehen?
    answer: Die Waldmenschen nennen dieses Ereignis Guachakabu.
    context: Die Waldmenschen nennen das Ereignis Guachakabu – Silben, die sie für
      gewöhnlich nur Raubtieren geben.
  - question: Wie viele Sterne hat die Hand, das achte große Sternbild des Südhimmels?
    answer: Die Hand beherrscht mit vierzehn hellen bis mittelgroßen, arkaniumgleißenden
      Sternen und Sternhaufen die südlichsten Breiten.
    context: 'Was altgüldenländische Texte und Niobara als das ‘Unwissbare’ bezeichnet
      haben, das achte und letzte große Sternbild des Südhimmels, wurde es von der
      Roten Harika als das erkannt, was es ist: Die Hand beherrscht mit vierzehn hellen
      bis mittelgroßen, arkaniumgleißenden Sternen und Sternhaufen die südlichsten
      Breiten.'
  - question: Wo befindet sich Sumus Schale?
    answer: Sumus Schale liegt im Feuermeer.
    context: Nur im Feuermeer wird sichtbar, dass in Sumus Schale ein opalisierender
      Nebel liegt, dessen Schlieren immer wieder aus dem Sternbild zu fließen scheinen
      und tief im Süden als Himmelslichter gesehen werden können, die dem Ifirnslicht
      der nördlichen Eisregionen gleichen sollen.
  - question: Womit wird der 'Atem Sumus' verglichen?
    answer: Der ‘Atem Sumus’ gilt als das himmlische Ebenbild zu den Lüften im Tempel
      des Lebens aus Dere.
    context: Dieser ‘ Atem Sumus’ gilt als das himmlische Ebenbild zu den Lüften im
      Tempel des Lebens aus Dere.
  - question: Wie greift das Sternbild der Hand nach dem unteren Himmelspol?
    answer: Das Sternbild der Hand greift mit vierzehn hellen bis mittelgroßen, arkaniumgleißenden
      Sternen und Sternhaufen nach dem unteren Himmelspol oder hält ihre Finger schützend
      darüber.
    context: 'Die Hand beherrscht mit vierzehn hellen bis mittelgroßen, arkaniumgleißenden
      Sternen und Sternhaufen die südlichsten Breiten. Sie greift (manche sagen: mit
      sechs Fingern) klauenartig nach dem unteren Himmelspol oder hält ihre Finger
      schützend darüber.'
  - question: Was wird in alten Texten als 'Unwissbares' bezeichnet?
    answer: Das 'Unwissbare' ist das achte und letzte große Sternbild des Südhimmels.
    context: 'Was altgüldenländische Texte und Niobara als das ‘Unwissbare’ bezeichnet
      haben, das achte und letzte große Sternbild des Südhimmels, wurde es von der
      Roten Harika als das erkannt, was es ist: Die Hand beherrscht mit vierzehn hellen
      bis mittelgroßen, arkaniumgleißenden Sternen und Sternhaufen die südlichsten
      Breiten.'
  - question: Was befindet sich an der Stelle des 'Unwissbaren'?
    answer: Das ist unbekannt.
    context: ' Was sich an seiner Stelle zeigt – der adamantene Südstern, das ursprüngliche
      Zeichen, das man heute als ‘Stern’ kennt, oder eine andere Konstellation?  -
      ist unbekannt. '
  G1-013:
  - question: Welche Kultur bildet den größten Bevölkerungsanteil im tiefen Süden
      Aventuriens?
    answer: Südaventurien (WdH 68)
    context: Der ‘tiefe Süden’ – Aventurien vom Loch Harodrôl an südwärts sowie die
      Inseln des Südmeers – beherbergt eine Vielzahl von Völkern unterschiedlichster
      Rassen und Kulturen eng nebeneinander. Der größte Bevölkerungsanteil gehört
      der Kultur Südaventurien (WdH 68) an.
  - question: Wie haben Sklavenimporte und Einwanderungswellen die Städte des Südens
      beeinflusst?
    answer: Beispielsweise führte die Versklavung zahlreicher Novadis während des
      Khômkriegs dazu, dass der Rastullahglaube in Al’Anfa Fuß fassen konnte; maraskanische
      Exilanten sorgten für einen Aufschwung in Holzschnitzerei und Druckkunst und
      machten neben dem schwarzen den roten Pfeffer als Gewürz populär.
    context: Bis in die Gegenwart bringen Einwanderungswellen und Sklaven-Importe
      immer wieder neue Einflüsse in die Städte des Südens. Beispielsweise führte
      die Versklavung zahlreicher Novadis während des Khômkriegs dazu, dass der Rastullahglaube
      in Al’Anfa Fuß fassen konnte; maraskanische Exilanten sorgten für einen Aufschwung
      in Holzschnitzerei und Druckkunst und machten neben dem schwarzen den roten
      Pfeffer als Gewürz populär.
  - question: Welche Bevölkerungsstrukturen sind typisch für Brabak und die Gebiete
      westlich des Regengebirges?
    answer: In Brabak relativ viele Thorwaler; dafür wird man westlich des Regengebirges
      fast keine Utulus antreffen. H’Rabaal und Brabak haben recht große echsische
      Gemeinden; in anderen Städten kommen Achaz allenfalls vereinzelt vor.
    context: In Brabak relativ viele Thorwaler; dafür wird man westlich des Regengebirges
      fast keine Utulus antreffen. H’Rabaal und Brabak haben recht große echsische
      Gemeinden; in anderen Städten kommen Achaz allenfalls vereinzelt vor.
  - question: Welche menschlichen Stammeskulturen gibt es im tiefen Süden Aventuriens?
    answer: Darna, Dschungelstämme, Miniwatu, Tocamuyac, Verlorene Stämme und Waldinsel-Utulus
      (WdH 61 ff.)
    context: 'An menschlichen Stammeskulturen bietet der tiefe Süden: Darna, Dschungelstämme,
      Miniwatu, Tocamuyac, Verlorene Stämme und Waldinsel-Utulus (WdH 61 ff.). Darna,
      Miniwatu und Tocamuyac sind Waldmenschen, die Waldinsel-Utulus selbstverständlich
      Utulus. Von den Dschungel- und Verlorenen Stämmen setzen sich einige aus Waldmenschen
      zusammen, andere aus Utulus.'
  - question: Welche Rolle spielen die Tocamuyac in der Verbindung von verschiedenen
      Kulturen?
    answer: Die Tocamuyac als ‘reisende Händler’ haben dagegen regelmäßig Kontakt
      zu anderen Kulturen. Sie bestreiten einen wichtigen Teil des Handels zwischen
      den Waldinseln, Inseln im Südmeer und dem Festland und tragen Nachrichten weiter.
    context: Die Tocamuyac als ‘reisende Händler’ haben dagegen regelmäßig Kontakt
      zu anderen Kulturen. Sie bestreiten einen wichtigen Teil des Handels zwischen
      den Waldinseln, Inseln im Südmeer und dem Festland und tragen Nachrichten weiter.
  - question: Wie lässt sich der Status der Chirakahs beschreiben?
    answer: Untertanen der Horas, halbzivilisiert und zum Glauben an Tsa bekehrt.
    context: 'Ebenfalls nicht zu den ‘Wilden’ gezählt werden die Chirakahs, ein Verlorener
      Stamm im Hinterland von Drôl: Untertanen der Horas, halbzivilisiert und zum
      Glauben an Tsa bekehrt.'
  - question: Wo lebt der Novadi-Stamm der Beni Arrat?
    answer: Nordlich von Port Corrad
    context: In Arratistan, der Landschaft nördlich von Port Corrad, lebt der Novadi-Stamm
      (WdH 54) der Beni Arrat, deren ursprünglich nomadische und auf den Rastullahglauben
      ausgelegte Kultur bereits verwässert ist infolge des Kontakts mit Südaventuriern,
      tulamidischen Städten und sogar Achaz.
  G1-014:
  - question: Wie nennen verschiedene Völker den Wald, der vom Bergland der südlichen
      Eternen bis zur Spitze der Syllanischen Halbinsel reicht?
    answer: "Die Mittelländer nennen ihn Regenwald, die Tulamiden Dschungel (etwa:
      ‘höllische Schwüle’), und die Eingeborenen Nipa ('Baumleben')."
    context: "Vom Bergland der südlichen Eternen und den Echsensümpfen östlich von
      Selem aus erstreckt sich ein wucherndes, immergrünes Meer über das mächtige
      Regengebirge bis zur Spitze der Syllanischen Halbinsel, über Altoum und die
      meisten der Waldinseln. Die Mittelländer nennen es Regenwald, die Tulamiden
      Dschungel (etwa: ‘höllische Schwüle’), die Eingeborenen Nipa ('Baumleben').
      Wer einmal dort war, mag daheim am wohlig knisternden Herdfeuer von einem Ort
      berichten, an dem Tsas wildeste Träume wahr geworden sind."
  - question: Welche Bedeutung hat der Dschungel für Südaventurien?
    answer: Der Dschungel ist zusammen mit der Inselwelt das prägende Element Südaventuriens,
      das nicht nur das Leben der Waldmenschen, sondern auch der Siedler aus kühleren
      und trockeneren Gefilden tagtäglich bestimmt.
    context: Der Dschungel ist zusammen mit der Inselwelt das prägende Element Südaventuriens,
      das nicht nur das Leben der Waldmenschen, sondern auch der Siedler aus kühleren
      und trockeneren Gefilden tagtäglich bestimmt.
  - question: Wie beschreiben Reisende den Regenwald nach ihrer Rückkehr?
    answer: Wer einmal dort war, mag daheim am wohlig knisternden Herdfeuer von einem
      Ort berichten, an dem Tsas wildeste Träume wahr geworden sind.
    context: "Vom Bergland der südlichen Eternen und den Echsensümpfen östlich von
      Selem aus erstreckt sich ein wucherndes, immergrünes Meer über das mächtige
      Regengebirge bis zur Spitze der Syllanischen Halbinsel, über Altoum und die
      meisten der Waldinseln. Die Mittelländer nennen es Regenwald, die Tulamiden
      Dschungel (etwa: ‘höllische Schwüle’), die Eingeborenen Nipa ('Baumleben').
      Wer einmal dort war, mag daheim am wohlig knisternden Herdfeuer von einem Ort
      berichten, an dem Tsas wildeste Träume wahr geworden sind."
  G1-015:
  - question: Warum wirkt der Dschungel auf Eindringlinge erschreckend schön?
    answer: Der Dschungel wirkt auf Eindringlinge erschreckend schön, da er im Überfluss
      Farben, Pflanzen, Tiere, Insekten, Geräusche, Schwüle und Regen bietet.
    context: 'Der Dschungel kennt alles im Überfluss: Farben, Pflanzen, Tiere, Insekten,
      Geräusche, Schwüle und Regen. Die Natur im Regenwald ist fremd – und so wirkt
      sie auf Eindringlinge im wahrsten Sinne des Wortes erschreckend schön. '
  - question: Warum würde ein Städter einen Waldmenschen, der zum ersten Mal eine
      Metropole betritt, als naiv bezeichnen?
    answer: Ein Städter würde einen Waldmenschen, der zum ersten Mal eine Metropole
      betritt, naiv nennen, weil dieser auf jedes fremde Geräusch wie ein gehetztes
      Tier reagiert und angstvoll Schutz sucht.
    context: Der Bewohner Gareths kennt das stete Stimmgewirr des Marktes und den
      Gong zur Praios-Stunde. Der Waldmensch aber, der zum ersten Mal in seinem Leben
      eine Metropole betritt, reagiert auf jedes fremde Geräusch wie ein gehetztes
      Tier, sucht angstvoll Schutz – und weiß nicht, wo er ihn finden könnte. Der
      Städter belächelt ihn deswegen und nennt ihn naiv.
  - question: Was kennzeichnet die Atmosphäre einer tropischen Nacht im Dschungel?
    answer: Die Tropennacht ist erfüllt von Rascheln, Augenpaaren, die im Dunkeln
      glühen, und dem Höllenkonzert der Frösche, Affen, Vögel und Insekten.
    context: Wenn sich die Nacht über den Dschungel senkt, ist bis zur Dämmerung die
      Hand vor Augen nicht zu sehen. Die Tropennacht ist erfüllt von Rascheln, Augenpaaren,
      die im Dunkeln glühen, und dem Höllenkonzert der Frösche, Affen, Vögel und Insekten.
  - question: Wie wird die Situation des Menschen im Dschungel beschrieben?
    answer: Im Dschungel gibt es kein Maß, keine menschlichen Regeln, kein Mitleid.
      Der Eindringling ist ein todgeweihter Tollpatsch in einem heiligen Hain.
    context: 'In der Unendlichkeit des Regenwaldes gibt es kein Maß, keine menschlichen
      Regeln, kein Mitleid. Hier ist der Kultur schaffende Zweibeiner klein. Die Pflanzen
      sind riesenhaft, die Tiere allgegenwärtig, der Eindringling auf zwei Beinen
      ist ein todgeweihter Tollpatsch in einem heiligen Hain. Hier herrscht die Natur.
      Und sie erklärt ihre Gesetze nicht. '
  G1-016:
  - question: Wie wird die Dichte des Urwalds im Text beschrieben?
    answer: Der Dschungel wird mit einer Wand aus wucherndem Leben verglichen. Bäume
      sind hier keine Einzelwesen, sondern eine verwachsene Masse aus großen und kleinen
      Pflanzen, Schlinggewächsen und Parasiten.
    context: Pfade erkennt nur das kundige Auge. Der Fremde steht, wohin er sich auch
      wenden mag, vor einer Wand aus wucherndem Leben. Bäume sind hier keine Einzelwesen,
      sondern eine verwachsene Wand aus großen und kleinen Pflanzen, Schlinggewächsen
      und Parasiten, die alle in fiebrigem Kampf der Dunkelheit des Unterholzes zu
      entrinnen suchen und zur Sonne drängen.
  - question: Welche Arten von Bäumen und Pflanzen wachsen im Urwald?
    answer: Die meisten Blätter sind fleischig, hart wie Leder und saftig-dunkel.
      Dennoch gibt es auch viele Nadelbäume. Eine Unzahl Bäume und selbst Lianen sind
      derart von pelzigem, nassem Moos umhüllt, dass sie an fremdartige Lebewesen
      gemahnen.
    context: In den Stämmen entstehen Vertiefungen, die dann, ein, zwei Schritt tief
      mit Wasser gefüllt, zu Tümpeln und Brutplätzen für vielerlei Larven werden.
      Die meisten Blätter sind fleischig, hart wie Leder und saftig-dunkel. Dennoch
      gibt es auch viele Nadelbäume. Eine Unzahl Bäume und selbst Lianen sind derart
      von pelzigem, nassem Moos umhüllt, dass sie an fremdartige Lebewesen gemahnen.
  - question: Was erschwert es dem Fremden im Dschungel, Rast zu machen?
    answer: Ameisen und Insekten verteidigen ihre Wohnstatt aggressiv und wirkungsvoll.
      Und allzu oft entpuppt sich das, was wie ein Baumstumpf aussah, als etwas völlig
      anderes – die Tarnung vieler Tiere ist perfekt.
    context: Doch wohin sich setzen und ausruhen? Ameisen und Insekten sind allgegenwärtig
      und verteidigen ihre Wohnstatt aggressiv und wirkungsvoll. Und allzu oft entpuppt
      sich das, was wie ein Baumstumpf aussah, als etwas völlig anderes – die Tarnung
      vieler Tiere ist perfekt.
  - question: Welche zwei giftigen Pflanzen werden im Text erwähnt und welche Eigenschaften
      haben sie?
    answer: Die Orchidee Schleichender Tod, deren Pollen, als Samthauch bekannt, rauschhafte
      Träume erzeugt, während der betörend schönen Jaguarlilie mit ihren schwarzgelb
      gefleckten Blüten nachgesagt wird, dass sie Dämonen Unterschlupf bietet.
    context: Doch allzu oft ist das, was in besonderer Pracht strahlt, auch besonders
      giftig. Berüchtigt ist die Orchidee Schleichender Tod, deren Pollen, als Samthauch
      bekannt, rauschhafte Träume erzeugt, während der betörend schönen Jaguarlilie
      mit ihren schwarzgelb gefleckten Blüten nachgesagt wird, dass sie Dämonen Unterschlupf
      bietet.
  - question: Welche Zeichen deuten darauf hin, dass bestimmte Bereiche des Dschungels
      gefährlich sind?
    answer: Die Leichen mit schreckensstarren Augen und seltsamen Verletzungen sprechen
      eine eigene Sprache. Die Einheimischen verstehen die Warnung. Sie kennzeichnen
      diese Gebiete als Tabu und meiden sie.
    context: Dass Würgeschlangen oft wie Lianen wirken und Krokodile wie im Wasser
      treibende, bemooste Baumstämme aussehen, deren Augen im Fackelschein rot aufleuchten,
      ist noch bekannt. Doch der Regenwald birgt Geheimnisse, von denen kein lebendes
      Wesen bislang berichtet hat. Die Leichen mit schreckensstarren Augen und seltsamen
      Verletzungen sprechen eine eigene Sprache. Die Einheimischen verstehen die Warnung.
      Sie kennzeichnen diese Gebiete als Tabu und meiden sie.
  G1-017:
  - question: Wie reagieren die Eingeborenen auf das bevorstehende Unwetter?
    answer: Die Eingeborenen erwarten den Regen mit ausgebreiteten Armen und freuen
      sich darüber, da er das Leben im Wald nährt.
    context: Die Schwüle wird noch drückender, die Luftfeuchtigkeit presst den Schweiß
      aus allen Poren – und die Eingeborenen erwarten mit ausgebreiteten Armen den
      Regen.
  - question: Wie lange dauert der Regen, und wie schnell hört er wieder auf?
    answer: Der Regen prasselt genau eine halbe Stunde lang herab, bevor er genauso
      schnell wieder aufhört.
    context: Exakt die Hälfte eines Stundenglases lang prasselt es herab, als gössen
      alle Geister des Meeres ihre Eimer aus. Wo das warme Nass nicht sofort versickert,
      überflutet es binnen Wimpernschlägen Höhlen und Lichtungen. So schnell es gekommen
      ist, beruhigt sich das Wetter wieder, und ebenso schnell setzen auch die Geräusche
      wieder ein.
  - question: Woher kommt laut der Erzählung die große Artenvielfalt an Blumen im
      Ewigen Wald, und wo findet man besonders viele davon?
    answer: Tsa soll in einer Laune Blumen auf die Erde regnen lassen haben. Die Blütenvielfalt
      ist besonders im Regengebirge groß.
    context: Ein Märchen berichtet, Tsa habe dereinst in einer Laune Blumen auf die
      Erde regnen lassen. Begonnen habe sie über dem Regengebirge. Und so gibt es
      nirgendwo sonst in Aventurien eine solche Vielfalt einzigartiger Blüten in solchen
      Farben.
  G1-018:
  - question: Wie unterscheidet sich die Regenzeit in Südaventurien von der normalen
      Regenaktivität im Ewigen Wald und welche Auswirkungen hat sie auf die Landschaft?
    answer: Die Regenzeit in Südaventurien ist ein Zeitraum von zwei Monaten im Jahr,
      in denen es beinahe ununterbrochen regnet. Im Gegensatz zu der sonstigen, häufigen
      Regenaktivität im Ewigen Wald, führt die Regenzeit dazu, dass Teile des Waldes
      überschwemmt werden und Bäche zu reißenden Flüssen anschwellen.
    context: Der größte Strom Südaventuriens ist das Wasser der Regenzeit, das zweimal
      im Jahr einen Monat lang vom Himmel stürzt. Der Begriff ‘Regenzeit’ ist missverständlich
      – denn es regnet täglich im Ewigen Wald. Nur selten gibt es Trockenperioden,
      in denen einmal drei Wochen kein Regentropfen vom Himmel fällt. Wenn sich Rondra
      und Efferd verbinden, verdunkeln Regenwolken die Sonne, und die aufwallenden
      Nebel legen sich wie eine dichte Decke über das Land. Während der Regenzeit
      aber werden Teile des Waldes überschwemmt, und Fische tummeln sich dort, wo
      normalerweise Ameisen und andere Insekten den Waldboden besiedeln. Dann wird
      der Wald zu einer wahren Schlammgrube. Kleine Bäche werden zu unüberwindlichen,
      reißenden, braunen Ungeheuern.
  - question: Warum kann ein Fremder im Dschungel trotz der großen Wassermenge verdursten?
    answer: Die Wasserqualität des Dschungels ist durch Algen, Moos und andere Faktoren
      stark beeinträchtigt. Obwohl es viel Wasser gibt, kann ein Fremder hier verdursten,
      da das Wasser unbehandelt nicht trinkbar ist.
    context: 'Das Wasser ist allgegenwärtig: Rinnsale, Wildbäche, Wasserfälle und
      Klammflüsse rinnen durch grüne Tunnel und ergießen sich in grünbraun modernde
      Buchten und strahlende Lagunen. Echte Seen sind selten, denn die wuchernde Natur
      erobert jeden Wasserspiegel. Algen verwandeln Wasserflächen in trügerische grüne
      Teppiche. Moospolster wirken wie Schwämme; ständig tröpfelt es von den Blättern
      herab. Und doch kann es dem Ortsfremden geschehen, dass er hier verdursten muss.
      Denn trinken kann man das Wasser des Dschungels nur dann, wenn man es von klein
      auf gewohnt ist oder abkocht. Doch Feuer ist in dieser Welt rar (siehe auch
      Seite 16).'
  - question: Wie beeinflusst die Regenzeit die Entwicklung der Insektenpopulationen
      im Ewigen Wald?
    answer: Die Regenzeit führt dazu, dass Insektenpopulationen durch die Überschwemmung
      und den erhöhten Wasserdruck reduziert werden. Gleichzeitig schaffen sich die
      Insekten aber auch neue Laichgebiete in den stehenden Gewässern, die während
      der Regenzeit entstehen.
    context: Ohne diese Regenzeiten und Gewitterfluten würden die Insektenmassen ins
      Unermessliche wachsen. Bei jeder Regenperiode werden Myriaden Eier und Larven
      zerstört und der Nachwuchs auf ein erträgliches Maß reduziert – nur, um gleichzeitig
      in stehenden Tümpeln wieder neue Laichgebiete zu schaffen.
