  G1-306:
  - question: Welche Bauwerke repräsentieren den monumentalen Baustil der alten Kemi
      besonders gut?
    answer: Die Tempelanlage von Laguana auf einer Insel vor dem Festland sticht mit
      ihren hohen Steinpylonen und der basalten Pyramide als Musterbeispiel des monumentalen,
      echsisch geprägten Baustils der alten Kemi hervor.
    context: Die Wiege der kemschen Kultur liegt auf der Halbinsel von Hôt-Alem, wo
      die ältesten Zeugnisse kemscher Besiedlung gefunden wurden. Insbesondere die
      uralte Tempelanlage von Laguana auf einer Insel vor dem Festland sticht mit
      ihren hohen Steinpylonen und der basalten Pyramide als Musterbeispiel des monumentalen,
      echsisch geprägten Baustils der alten Kemi hervor.
  - question: Welche zwei Gerichte sind besonders beliebt in der kemschen Küche?
    answer: Kemi ist kein reiches Land, doch Dschungel und Gewässer liefern Nahrung
      im Überfluss. Besonders beliebt sind die Sedety, flache Fladen aus Maismehl,
      die mit roten Bohnen, sehr scharfen Schoten, Reis und manchmal mit Fleisch und
      Fisch gefüllt werden. Daneben isst man auch gern so genannten Desrêt, ein auf
      einem Bananenblatt kredenzter, in Kokosmilch zubereiteter Brei aus Reis und
      Fisch, ebenfalls angereichert mit den unvermeidlichen Pfefferschoten.
    context: Kemi ist kein reiches Land, doch Dschungel und Gewässer liefern Nahrung
      im Überfluss. Besonders beliebt sind die Sedety, flache Fladen aus Maismehl,
      die mit roten Bohnen, sehr scharfen Schoten, Reis und manchmal mit Fleisch und
      Fisch gefüllt werden. Daneben isst man auch gern so genannten Desrêt, ein auf
      einem Bananenblatt kredenzter, in Kokosmilch zubereiteter Brei aus Reis und
      Fisch, ebenfalls angereichert mit den unvermeidlichen Pfefferschoten.
  - question: Wie werden die Wände sakraler Bauten der Kemi gestaltet?
    answer: 'Es ist üblich, die Wände mit farbenprächtigen Bildern zu verzieren, die
      in eigentümlich formalisierter Darstellungsweise Szenerien aus dem, so heißt
      es, ‘Land im Westen’ zeigen, wie die Kemi das Paradies des Rabenherrn nennen. '
    context: Es ist üblich, die Wände mit farbenprächtigen Bildern zu verzieren, die
      in eigentümlich formalisierter Darstellungsweise Szenerien aus dem, so heißt
      es, ‘Land im Westen’ zeigen, wie die Kemi das Paradies des Rabenherrn nennen.
      Umrahmt und verziert werden diese Szenerien durch Textzeilen aus den heiligen
      Büchern, in denen sich die Schönheit der kemschen Glyphenschrift offenbart.
  G1-307:
  - question: Welche Gruppe innerhalb der kemschen Gesellschaft ist für religiöse
      Rituale wie Hochzeiten, Geburten und Feldsegnungen verantwortlich?
    answer: Die Geweihten des Raben.
    context: 'Die Geweihten des Raben spielen im Alltag des einfachen Volkes eine
      zentrale Rolle. Sie sind nicht nur für Bestattungen zuständig, sondern führen
      darüber hinaus auch die Rituale der ‘Boronskinder’ durch: Boron-Geweihte segnen
      in Kemi die Felder, schließen den Ehebund, halten Geburtsriten ab und sprechen
      in Kriegszeiten den Waffensegen.'
  - question: Wer war verantwortlich für die Abschaffung der Adelstitel im Königreich
      Kemi?
    answer: Nisut Ela XV. hat die von den Kolonialmächten übernommenen Titel nach
      ihrer Krönung abgeschafft.
    context: Trotz der vordergründigen Verwendung von nordländischen Titulaturen und
      Anreden unter Peri III. kennt man in Kemi keinen eigentlichen Adelsstand. Die
      ‘ Adligen’ hatten nie mehr Befugnisse als eine Provinz-gouverneurin in Diensten
      der Krone. Abgaben zu erheben oder sogar eigene Söldlinge unter Waffen zu halten
      war ihnen streng verboten; und so hat Nisut Ela XV. unmittelbar nach ihrer Krönung
      die von den Kolonialmächten übernommenen Titel kurzerhand abgeschafft.
  - question: Welche zwei Familien gehören zu den mächtigsten in Kemi und welche Gebiete
      kontrollieren sie?
    answer: Die Häuser Mes’kha-rê und Pâestumai sind die mächtigsten Familien in Kemi.
      Das Haus Mes’kha-rê kontrolliert weitläufige Domänen im Norden und Osten des
      Reiches, während das Haus Pâestumai das Kernland kontrolliert.
    context: Von größter Macht sind hierbei die miteinander verfeindeten Häuser Mes’kha-rê,
      das über weitläufige Domänen im Norden und Osten des Reiches verfügt, und Pâestumai,
      welches das Kernland kontrolliert.
  G1-308:
  - question: Was waren die Gründe für die Entstehung der Reformbewegung innerhalb
      der Kemi-Kirche?
    answer: Die Reformbewegung entstand innerhalb der korrupten Kemi-Kirche vor 2000
      Jahren und kritisierte den Verfall des (Alten) Reiches und der (Visar-)Kirche.
      Sie forderte eine Rückkehr zu den Wurzeln des Glaubens.
    context: Doch auch zahlreiche weitere Parallelen der Kulte, insbesondere in Hinsicht
      auf nemekathäische Ur-Ideale, sind unübersehbar. Die Hauptunterschiede zum alanfanischen
      Ritus liegen im Einfluss einer innerhalb der korrupten Kemi-Kirche aufgekommenen
      Reformbewegung begründet, die vor 2000 Jahren den Verfall des (Alten) Reiches
      und der (Visar-)Kirche anprangerte und eine Rückkehr zu den Wurzeln des Glaubens
      forderte.
  - question: Wer gründete den Orden der 'Ritter und Ritterinnen des Raben' und wie
      definierten sich seine Mitglieder?
    answer: Der Orden der ‘Ritter und Ritterinnen des Raben’ wurde vom königlichen
      Kämpfer Laguan gegründet. Die Mitglieder schworen in strenger Askese und Armut,
      das Reich und den Glauben zu schützen.
    context: Diese Sehnsucht wurde schließlich vom königlichen Kämpfer Laguan aufgenommen,
      der einen Orden gründete, dessen Brüder und Schwestern sich in strenger Askese
      und Armut als ‘Ritter und Ritterinnen des Raben’ zum Schutz des Reiches und
      des Glaubens verschworen.
  - question: Welche Gruppe innerhalb der kemschen Boron-Kirche hält eine strenge
      Auslegung der heiligen Schriften und erwartet die 'Letzte Schlacht'? Beschreibe
      ihre Ansichten.
    answer: Der Bund der Chepeshu Sebáyt-netjeri (Schwerter der Reinen Lehre), auch
      bekannt als Nemekaths Corvikanerbund, ist eine Gemeinschaft innerhalb der kemschen
      Boron-Kirche. Sie sehen den Rabenherrn als strengen und strafenden Gott an und
      erwarten die apokalyptische ‘Letzte Schlacht’.
    context: Die strengste Auslegung der heiligen Schriften findet man beim Bund der
      Chepeshu Sebáyt-netjeri (Schwerter der Reinen Lehre), der von Nicht-Kemi auch
      nach dem ‘Codex Corvinus’ Nemekaths Corvikanerbund genannt wird. Diese Gemeinschaft
      ist zwar Teil der kemschen Boron-Kirche, sieht den Rabenherrn jedoch als strengen
      und strafenden Gott an und lebt in der baldigen Erwartung einer apokalyptischen
      ‘Letzten Schlacht’. Der Bund lehnt alles Fremde als böse und verdorben ab und
      ergeht sich in blutigen Selbstgeißelungsritualen, die durchaus Züge nemekathäischer
      Opferzeremonien aufweisen.
  G1-309:
  - question: Wie beschreibt Ká'mes Meren'ká, eine Händlerin aus Kemi, die Stadt Khefu?
    answer: “Von Boron verfluchtes, verdorbenes, sündiges Sumpfloch ... Wenn ich nicht
      an der Pest oder einer durchschnittenen Kehle sterbe, dann mag mich des Raben
      Willen so schnell wie möglich wieder in die Heimat führen!”
    context: 'Was die Kemi über ihre Stadt denken: “Von Boron verfluchtes, verdorbenes,
      sündiges Sumpfloch ... Wenn ich nicht an der Pest oder einer durchschnittenen
      Kehle sterbe, dann mag mich des Raben Willen so schnell wie möglich wieder in
      die Heimat führen!” (Ká’mes Meren’ká, Händlerin) “Khefu, ah! Smaragd des Südens!
      Keine schönere Stadt ist da auf dem Derenrund! Oh, Khefu, Stolz der Vergangenheit,
      Hoffnung der Zukunft!” (Sekem’rê Nebmes, Poet und Schreiber aus Khefu)'
  - question: Wie kommt es, dass große Schiffe trotz der Entfernung zum Meer den Hafen
      von Khefu anlaufen können?
    answer: Der hinter der Stadt zum Meer fließende schlammige Astarôth ist jedoch
      tief genug, dass auch größere Schiffe in den Hafen einlaufen können.
    context: Khefu liegt einige Meilen vom Meer entfernt. Der hinter der Stadt zum
      Meer fließende schlammige Astarôth ist jedoch tief genug, dass auch größere
      Schiffe in den Hafen einlaufen können. Das Stadtbild wird nicht nur von den
      unzähligen kleinen und untereinander vertäuten Schiffchen des ‘schwimmenden
      Marktes’ geprägt, sondern auch von Kriegsschiffen aus dem Horasreich, die auf
      dem Weg zu den Inselkolonien hier Proviant und Wasser aufnehmen.
  - question: Wo in Khefu wohnen die Gesandten fremder Länder, die einflussreichen
      Persönlichkeiten des Kemi-Reiches und wohlhabende Kaufleute?
    answer: Auf der Inselstadt reiht sich Palazzo an Palazzo, denn dort residieren,
      durch eine hohe Mauer vom Rest der Stadt abgeschirmt, die Gesandten fremder
      Länder, die Mächtigen des Kemi-Reiches sowie die reichen Kaufleute und Beamten
      der Stadt.
    context: Der vornehmste Teil der Stadt liegt auf einer Insel in der Mitte des
      Flusses. Auf der Inselstadt reiht sich Palazzo an Palazzo, denn dort residieren,
      durch eine hohe Mauer vom Rest der Stadt abgeschirmt, die Gesandten fremder
      Länder, die Mächtigen des Kemi-Reiches sowie die reichen Kaufleute und Beamten
      der Stadt.
  - question: Warum wurden die Versuche, den Stadtteil am Südufer von Khefu mit einer
      Palisade zu umgeben, erfolglos?
    answer: Zweimal schon hat man versucht, auch diesen Stadtteil mit einer Palisade
      zu umgeben, aber zweimal rissen die Bewohner sie nieder, um mit dem Holz ihre
      Hütten auszubessern.
    context: Das Südufer der Stadt wird von dem alten Garnisonsgebäude beherrscht,
      das einst von den altreichischen Conquistadores errichtet wurde und nun den
      Stadtgardistinnen sowie den Ordensleuten des Hl. Laguan Unterkunft bietet. Darum
      hat sich ein Konglomerat von elenden Hütten gruppiert, in denen vorwiegend ‘zivilisierte’
      Waldmenschen, Arme und allerlei finstere Gestalten hausen. Zweimal schon hat
      man versucht, auch diesen Stadtteil mit einer Palisade zu umgeben, aber zweimal
      rissen die Bewohner sie nieder, um mit dem Holz ihre Hütten auszubessern.
  G1-310:
  - question: Beschreiben Sie die Gesellschaft im Kemi-Reich.
    answer: Die Bewohner des Kemi-Reiches sind voller Aufbruchsstimmung und zerfallen
      in unzählige Gruppierungen mit unterschiedlichsten Ansichten, wie z.B. religiöse
      Fanatiker, Einwanderer aus dem Norden, geheimnisvolle Achaz, bedrohliche Waldmenschen
      und unzählige Geweihte des Boron.
    context: 'Das Kemi-Reich ist ein Land mit großer Vergangenheit und großer Zukunft
      – so sehen es jedenfalls seine Bewohner. Und so findet man eine Gesellschaft
      vor, die, getragen von spürbarer Aufbruchsstimmung, in unzählige Gruppierungen
      mit unterschiedlichsten Ansichten zerfallen ist: religiöse Fanatiker, Einwanderer
      aus dem Norden, geheimnisvolle Achaz, bedrohliche Waldmenschen und unzählige
      Geweihte des Boron.'
  - question: Welche Arten von Begegnungen könnten Spieler im Kemi-Reich erleben?
    answer: Man kann Begegnungen mit horasischen Händlern und alanfanischen Spionen
