      darum, ein Schwätzchen zu halten, einen Witz anzubringen oder sich gegenseitig
      kennen zu lernen. So gilt es als unhöflich, nach abgeschlossenem Handel das
      Geld nachzuzählen, wo man sich doch gerade so nahe gekommen ist.
    context: 'Zwar sind Brabaker auch gewiefte Händler, mit denen es sich ausgezeichnet
      feilschen lässt, doch geht es ihnen weniger um Heller und Kreuzer als vielmehr
      darum, ein Schwätzchen zu halten, einen Witz anzubringen oder sich gegenseitig
