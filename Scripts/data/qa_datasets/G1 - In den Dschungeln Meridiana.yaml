    answer: Um die Sklaven auszulöschen, ließ Zornbrecht 30.000 Sklaven paarweise
      gegeneinander würfeln. Der Verlierer wurde getötet.
    context: Da man hart durchgreifen wollte, Al’Anfa aber auch nicht all seiner Sklaven
      berauben konnte, wurde beschlossen, die Hälfte aller Sklaven – aufständisch
      oder nicht – zu töten. Walkir Zornbrecht war es schließlich beschieden, diesem
      Gemetzel die Krone der Grausamkeit aufzusetzen. Um die Hinzurichtenden zu bestimmen,
      ließ er dreißigtausend Sklaven paarweise gegeneinander würfeln. Ein einziger
      Wurf auf einer Söldnertrommel bestimmte, wer zurück auf die Plantagen musste
