  G1-311:
  - question: Welche Insel ist das Ziel der wenigen Schiffe, die Efferds Tränen erreichen?
    answer: Die größte Insel des Archipels Efferds Tränen.
    context: Etwa 900 Meilen südöstlich von Brabak liegt das kaum bekannte Archipel
      Efferds Tränen, das die wenigen wagemutigen Kauffahrer, Expeditionsschiffe und
      Piraten mit dem Siral, dem vorherrschenden Nordostwind, erreichen. Das Leuchtfeuer
      Ghurenias weist ihnen dabei den Weg durch seichte Gewässer, vorbei an Korallenriffen
      und tückischen Klippen zur größten der Inseln am nordöstlichen Ende.
  - question: Welche Bedeutung hat die natürliche Durchfahrt zwischen den beiden Kalkfelsen
      für Ghurenia?
    answer: Die Durchfahrt spaltet die Insel Ghurenia in zwei Teile und bietet für
      größere Schiffe auch die einzige Möglichkeit, in die Mitte des Archipels vorzudringen.
    context: Weithin zu erkennen sind die beiden jeweils über 300 Schritt hohen Kalkfelsen.
      Wie die Zahnstummel eines Giganten ragen sie aus dem Meer und flankieren eine
      natürliche, schmale Durchfahrt. Diese führt nicht nur zum Hafen und spaltet
      die Insel Ghurenia in zwei Teile, sondern bietet für größere Schiffe auch die
      einzige Möglichkeit, in die Mitte des Archipels vorzudringen.
  - question: Wie ist die Verteilung der Lebensmittel auf Ghurenia? Welche Nahrungsquelle
      steht allen Bevölkerungsschichten zur Verfügung?
    answer: Obst und Gemüse sind nur für die Reichen bestimmt. Die anderen Nahrungsmittel
      stammen aus dem Meer.  Einzig die im Boden wachsenden Früchte der Erdnuss sind
      bei allen Bevölkerungsschichten beliebt.
    context: Schmale Wege führen von der Stadt hinter das Felsengewirr zu wenigen
      Plantagen, auf denen vor allem Shatakwurz für den Großteil der Bevölkerung angepflanzt
      wird. Die geringen Mengen Obst und Gemüse aber sind für die Reichen bestimmt
      – die anderen Nahrungsmittel stammen aus dem Meer. Einzig die im Boden wachsenden
      Früchte der Erdnuss sind bei allen Bevölkerungsschichten beliebt und verbreitet.
  G1-312:
  - question: Welche Völker besiedelten die Inseln des Archipels und in welcher Reihenfolge?
    answer: Die Bujonapi-Hu, ein Stamm der Utulus, waren die ersten Bewohner des Archipels.
      Später kamen die Überlebenden der bosparanischen Oktere Ghurenia hinzu, die
      auf den Klippen strandeten.
    context: Die Bujonapi-Hu, ein Stamm der Utulus, der einst als erster die Inseln
      erreichte, lebt noch immer auf dem Archipel – erst viele Jahrhunderte später
      verschlug es die Überlebenden der bosparanischen Oktere Ghurenia hierher. Diese
      war eine jener gewaltigen Festungsgaleeren der Dunklen Zeiten, die während einer
      Strafexpedition gegen Deserteure im Sturm auf die Klippen lief.
  - question: Warum wurden die beiden Kalkfelsen für die Gründung der Siedlung ausgewählt?
    answer: Die beiden Kalkfelsen boten sich aufgrund ihrer strategisch günstigen
      Position an. Zudem waren sie von zahlreichen Gängen und Räumen durchzogen.
    context: Für die Gründung der nach der Oktere benannten Siedlung boten sich die
      beiden Kalkfelsen nicht nur wegen ihrer strategisch günstigen Position an. Sehr
      schnell stellte sich heraus, dass sie von zahlreichen Gängen und Räumen durchzogen
      sind – aber selbst die Tayas der Bujonapi-Hu geben keinen Aufschluss darüber,
      von welchem Volk die gefundenen Relikte stammen oder wer die Erbauer der Höhlen
      waren.
  - question: Wie etablierte Gorm seine Herrschaft über Ghurenia und welche Auswirkungen
      hatte sie auf die Insel?
    answer: Gorm erhob sich zum Alleinherrscher mit dem Titel Praefos, unterdrückte
      die Einwohner, führte alanfanische Sitten ein und brachte der Insel den Beinamen
      Efferds blutige Tränen ein.
    context: Doch vor mehr als drei Jahrzehnten übernahm der gestrandete Söldnerhauptmann
      Gorm aus Al’Anfa binnen weniger Tage mit Hilfe seiner Truppe die Macht über
      die Inseln. Gorm erhob sich mit dem Titel Praefos zum Alleinherrscher, unterdrückte
      die Einwohner, führte alanfanische Sitten ein und brachte der Insel mit seinen
      Taten den Beinamen Efferds blutige Tränen ein.
