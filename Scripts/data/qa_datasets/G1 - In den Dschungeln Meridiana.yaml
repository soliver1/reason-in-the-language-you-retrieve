      das Original. Dies zeigt sich in dem Kontrast zwischen dem aristokratischen
      Anspruch und der südländischen Bevölkerung sowie in den überzogenen Bauten im
      Vergleich zum nahegelegenen Dschungel.
    context: Hôt-Alem ist ein übertriebenes Spiegelbild der Garether Gesellschaft,
      eine Kolonie, die sich Mühe gibt, den Herren nachzueifern und ‘echter als das
      Original’ zu wirken. Der Kontrast zwischen aristokratischem Anspruch und der
      zusammengewürfelten, eher südländischen Bevölkerung – wie auch zwischen den
      grotesk überzogenen Bauten der Stadt und dem Dschungel in nächster Nähe – bietet
      zahlreiche Ansatzpunkte für Erlebnisse im kolonialen, etwas morbiden Flair.
