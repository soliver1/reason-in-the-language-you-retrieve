  G1-185:
  - question: Warum wird Immuel Florios als „klassischer Wackelkandidat“ bei Abstimmungen
      des Rates bezeichnet?
    answer: Immuel Florios ist ein Wackelkandidat bei Abstimmungen des Rates.
    context: Gefangen zwischen Patriarchentreue und Amtsverpflichtung, getrieben von
      Familienloyalität und dem verzweifelten Wunsch, endlich aus dem Schatten seines
      Vaters Oboto herauszutreten, ist er der klassische Wackelkandidat bei Abstimmungen
      des Rates.
  - question: Wie gibt Immuel Florios seiner Unzufriedenheit Ausdruck?
    answer: Immuel Florios drückt seine Unzufriedenheit an den Novizen aus, deren
      Ausbildung ihm untersteht.
    context: So ist es nicht erstaunlich, dass sich Immuel mithilfe der unglaublichsten
      Ausreden vor den regelmäßigen Ratszusammenkünften zu drücken pflegt und stattdessen
      seine Unzufriedenheit an den bedauernswerten Novizen auslässt, deren Ausbildung
      ihm untersteht.
  - question: Welche Aussage unterstreicht Immuel Florios weitreichende Verstrickungen?
    answer: Selbst Nareb Zornbrecht, der ansonsten wenig intrigante Person ist, versichert
      sich durch Bestechung der Treue von Immuel Florios.
    context: Es gibt kaum ein Mitglied, dem er nicht auf die ein oder andere Weise
      verpflichtet ist. Selbst der ansonsten wenig intrigante Nareb Zornbrecht versichert
      sich hin und wieder durch Bestechung seiner Treue.
  G1-186:
  - question: Welchem Namen trägt die junge Frau, die versucht, sich von dem Schicksal
