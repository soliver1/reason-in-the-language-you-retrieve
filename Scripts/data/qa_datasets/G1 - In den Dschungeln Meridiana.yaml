  G1-251:
  - question: Welchen Vergleich zieht der Autor zwischen den Städten des Südens und
      einem Kuriositätenschausteller?
    answer: Der Autor beschreibt die Städte des Südens als ein 'Sammelsurium eines
      Kuriositätenschaustellers', wobei er auf die Mischung aus Armut und Reichtum,
      Sklaverei und freizügiger Lebensweise der Reichen hinweist.
    context: '"Menschen und Städte wirkten auf mich, bevor ich mich in diesen dampfenden,
      ewig schwitzenden Städten einleben konnte, wie das Sammelsurium eines Kuriositätenschaustellers."'
  - question: Welche soziale Gruppe bildet den Großteil der Gladiatoren und welche
      zwei Extreme ihrer Lebensumstände werden beschrieben?
    answer: Die Gladiatoren im Süden sind meist Sklaven oder verurteilte Verbrecher,
      die um ihr Leben kämpfen. Manche erreichen Ruhm und werden sogar zu Favoriten
      von Damen.
    context: ' "Dazwischen befindet sich ein Mittelstand von Handwerkern und Gewerbetreibenden,
      die sich zu keinerlei ingerimmgefälligen Zünften zusammen schließen. Seltsam
      verhält es sich mit den Gladiatoren, meist Sklaven oder verurteilte Schandtäter,
      die jeden Tag aufs Neue um ihr Leben kämpfen müssen. Sie leben in tiefstem Elend
      oder erringen höchsten Ruhm. Mancher bringt es gar zum Favoriten einer Dame
      – was auch immer die zarten Schönheiten an diesem reißerischen Gemetzel finden
      mögen."'
  - question: Wo befinden sich die Villen der Reichen im Süden und wie sind sie gebaut?
    answer: Die Villen der Reichen befinden sich auf Anhöhen, wo sie den Dunst und
      Gestank der Häfen entgehen können. Sie sind aus weißem Eternenmarmor gebaut
      und verfügen über edle Hölzer im Inneren, Wasserbassins und Gärten.
    context: '"Als letztes Übel sei der schwunghafte Handel mit Rauschkräutern aller
      Art genannt, die auf dubiosen Wegen sogar bis in das Mittelreich gelangen. "'
  - question: Welche Mitglieder gehören zur Goldenen Allianz?
    answer: Die Goldene Allianz besteht aus Brabak, dem Horasreich, Sylla und Ghurenia.
    context: '"Mächtigste Parteien im politischen Spiel des Südens sind ohne Frage
      die Schwarze Allianz um das Imperium Al’Anfas, der neben Mengbilla und Mirham
      auch das verkommene Piratennest Charypso angehört. Um Brabak ist kürzlich die
      so genannte ‘Goldene Allianz’ wieder erstarkt. Unterstützung erhält Brabak dabei
