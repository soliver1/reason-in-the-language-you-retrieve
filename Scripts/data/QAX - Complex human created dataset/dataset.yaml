# G01
- question: Die größte Stadt Aventuriens ist von einer mächtigen Stadtmauer umgeben. Wie hoch und wie breit ist sie?
  answer: Die größte Stadt des Kontinents ist Gareth, die Garether Mauer ist *15 Schritt hoch und 8 Schritt dick*.
- question: In der zweitgrößte Stadt Aventuriens hält insbesondere eine Person die Machtfäden in der Hand. Wie heißt die Tochter dieser Person?
  answer: Die Tochter von Amir Honak, dem Patriarchen von Al'Anfa (der zweitgrößten Stadt Aventuriens) heißt *Amira Honak*.
- question: Wie hängt die Tochter des Patriarchen von Al'Anfa mit einer der berüchtigtsten Meuchlerorganisationen Aventuriens zusammen?
  answer: Die Tochter von Amir Honak, dem Patriarchen von Al'Anfa heißt *Amira Honak*. Sie ist die *offizielle Vorsteherin der Hand Borons*, einer der berüchtigtsten Meuchlerorganisationen Aventuriens.
- question: Obwohl Thorwaler im Norden zuhause sind, gibt es eine große Stadt in Südaventurien in denen eine Thorwalsche Familie mit zu den Entscheidungsträgern gehört. Um welche Stadt und welche Thorwalsche Sippe geht es hier?
  answer: Die thorwalsche Familie *Hammerfaust* ist eine der wichtigen Familien der Stadt *Brabak*, die hier zur mächtigen Audienza (dem Beratungsgremium des Königs) gehören.
- question: Welches Südaventurische Reich wird von einer Borongeweihten regiert? Welchen Titel trägt die dort herrschende Person?
  answer: Das Káhet ni Kemi wird von der dem Gott Boron geweihten Königin Ela XV. regiert. Als Herrscherin trägt sie den Titel *Nisut (Königin)*.
- question: Welche Tempel stehen in der Stadt, die als Erzfeind der Stadt Sylla gilt?
  answer: In Charypso, der Erzfeindin von Sylla gibt es Tempel von *Efferd* und *Phex* (letzterer ist schlecht erhalten).
- question: Wer herrscht nominell über die Stadt, welche auch als "Pestbeule des Südens" bezeichnet wird?
  answer: Rein formal ist Al'Anfa eine Monarchie, in welcher der *Vizekönig von Mirham, Damian von Shoy'Rina* das Oberhaupt ist.
- question: Nach einem Schisma im Jahr 686 teilte sich eine der Kirchen des zwölfgöttlichen Pantheons in zwei verfeindete Ausprägungen. Wer steht der in Südaventurien verbreitetsten Ausprägung dieser Kirche heute als Oberhaupt vor?
  answer: Das Oberhaupt der südaventurischen, bzw. Al'Anfanischen Boronkirche ist der Patriarch von Al'Anfa, *Amir Honak*.
- question: Die schwarze Perle des Südens exportiert neben Edelsteinen insbesondere auch einen besonderen Stoff. Welche Bestrafung erwartet Menschen, die eines der für die Produktion dieses Stoffes genutzten Tiere stehlen?
  answer: Eine von Al'Anfas wichtigsten Exportwaren ist *Seide*. Für Diebe die eine der Seidenspinnen stehlen ist speziell die *Todesstrafe durch Häutung* vorgesehen.
# G05
- question: Um an seine heutige Position zu kommen musste die aktuelle Spektabilität der Rashduler Magierakademie seine Vorgängerin im Duell besiegen. Wie hieß die Vorgängerin und wie starb sie?
  answer: Die Vorgängerin Sultan Hasrabals als Spektabilität der Rashduler Magierakademie hieß *Belizeth Dschelefsunni* und wurde beim Duell mit Hasrabal von einem Feuerdschinn getötet.
- question: Die Spektabilität einer tuamidischen Magierakademie prägt Münzen im Wert von mehreren Dukaten, die im Gegensatz zu vielen anderen Lokalwährungen auch im Umland akzeptiert werden. Wie heißen die Münzen und welchen Gegenwert haben sie in mittelreichischer Währung?
  answer: Sultan Hasrabal, die Spektabilität der Magierakademie von Rashdul prägt eine Münze namens *Piaster*, die einen Wert von 5 Dukaten besitzt.
- question: Der Nachfolger von Belizeth Dschelefsunni ist nicht nur Spektabilität einer Magierakademie sondern auch Herrscher einer Region. Um welche Region geht es hier?
  answer: Sultan Hasrabal ben Yakuban (Spektabilität der Pentagramm-Akademie in Rashdul) herrscht über das Sultanat Gorien.
- question: Es gibt in den Tulamidenlanden eine Stadt die besonders bekannt dafür ist, dass ein Meeresungeheuer den Hafen blockiert. Wer führt den dortigen Tempel des Meeresgottes?
  answer: Die Vorsteherin des neuen Efferdtempels in der Stadt LLanka ist *Fasina Al'Orhima*. Diese ist allerdings meist entrückt, wodurch die Führung des Tempels eigentlich *Efferdane Ragnarsdottir* obliegt.
- question: Die Hauptstadt einer der Fruchtbarsten Regionen Aventuriens ist vor allem durch das Donnersturmrennen bekannt, bei dem angeblich Rondra selbst auf Aventurien gewandelt ist. Wo befindet sich der Peraine-Tempel in dieser Stadt?
  answer: Der Peraine-Tempel in Baburin befindet sich im Haus der eingebrachten Ernte im Stadtviertel Djambakand.
- question: Ein elfischer Blakharazpaktierer herrscht mit eiserner Hand über eine Hafenstadt in den Tulamidenlanden. Wie steht der dortige Hohepriester des Praios zum Vorgehen des Herrschers und wie heißt er?
  answer: Der schwarze Elf Dolguruk herrscht als Sultan über die Stadt Thalusa. Der Hohepriester des dortigen Praiostempels, *Praiodan*, heißt die drakonischen Strafen des Sultans gut.
- question:  Ein elfischer Blakharazpaktierer herrscht mit eiserner Hand über eine Hafenstadt in den Tulamidenlanden. Wie erging es seinem Vorgänger nach der Machtergreifung des Elfen bis heute?
  answer: Bei der Machtergreifung Dolguruks in Thalusa wurde sein Vorgänger, FÜrst Ras Kasan entmachtet und  eingekerkert. im Firun 1024 BG wurde durch eine Gesandtschaft aus Khunchom ein Lösegeld erbracht um ihn freizukaufen. Zum Schein kam er darauf hin bei einem Ansturm hungernder Menschen auf einen Stapel Reissäcke ums Leben, in Wirklichkeit lebt er heute jedoch (von Verfolgungswahn zerfressen) in einer kleiner abgeschiedenen Villa auf der Palastinsel der Stadt Khunchom.
- question: Welches sind die Lieblingstiere der Mutter des aranischen Königs?
  answer: Die Lieblingstiere von Sultana Sybia Al'Nabab von Zorgan sind Falken.
- question: Welche besondere Verbindung besteht zwischen der Ehefrau und der Schwester des Königs von Aranien?
  answer: Der aranische König heißt Arkos Shah, seine Frau Eleonora Shahi und seine (abtrünnige) Schwester Dimiona. Am Ende des 35-Tage-Krieges verfolgten Arkos Shah und seine Frau die flüchtige Dimiona und Arkos köpfte sie. Kurz vor ihrem Tod gelang es Dimiona jedoch durch eine Seelenwanderung den Körper mit Eleonora zu tauschen, sodass Arkos statt ihrer seine eigene Frau tötete. Nun lebt Dimiona unerkannt im Körper von Eleonora, Arkos Ehefrau weiter.
- question: Welches ist das älteste Bauwerk in der ältesten Menschenstadt Aventuriens?
  answer: Die *Sphinx von Fasar* ist das älteste Bauwerk der Stadt Fasar.
# G08
- question: Wann wurde die heute größte Stadt Aventuriens ursprünglich gegründet?
  answer: Die (damalige) Siedlung Gareth entstand im Jahr 876 v.BF und wuchs im Laufe der Jahrhunderte zur heute größten Metropole des Kontinents.
- question: Wie steht der gemeine Bürger der größten Stadt des Kontinents zu Schwarzpelzen?
  answer: Eine typische Sicht gegenüber Orks wäre etwa "wilde, behaarte Barbaren, die vor zwanzig Jahren auch meinen Oheim getötet haben und in den Wäldern und Bergen herumlungern. Wo man sie ergreift, soll man sie züchtigen, töten oder in Ketten für ihre Untaten büßen lassen."
- question: Welcher, viele Rechtmeilen messende verfluchte Ort findet sich schon seit großen Schlacht gegen den Vorgänger von Hela-Horas vor den Toren einer großen Mittelreichischen Stadt?
  answer: Seit der ersten Dämonenschlacht gegen Fran-Horas wuchert  vor den Toren Gareths die *Dämonenbrache*, ein riesiges Areal aus unheimlichen Wäldern und verbrannter Ödnis.
- question: Beim Angriff des ehemaligen Hofmagus Galotta auf die mittelreichische Hauptstadt, ging das bedeutendste Artefakt einer der zwölf Kirchen verloren. Um welches Artefakt handelt es sich und wie wird das Vorhaben bezeichnet um das Artefakt zurückzuholen?
  answer: Beim Sturz der fliegenden Festung auf Gareth, verschwand das *Ewige Licht*, das heiligste Artefakt der Praioskirche. Daraufhin wurde die *Quanionsqueste* ausgerufen, um nach dem ewigen Licht zu suchen und es zurückzubringen.
- question: Welches Ziel verfolgt der Al'Anfanische Gesandte Karinor in der mittelreichischen Hauptstadt in Bezug auf eine im Mittelreich verbotene Art des Handels?
  answer: Kalman Karinor verfolgt das Ziel den Sklavenhandel mit mittelreichischer Ware anzukurbeln, also Mittelreicher als Sklaven außer Landes zu schmuggeln.
- question: Die im Jahreslauf sechste der zwölf Götter, wird häufig in Tempeln mit einer charakteristischen, sechseckigen Form geehrt. Einer der bedeutendsten Tempel jedoch, der sich in der größten mittelreichischen Stadt befindet, unterscheidet sich in seiner Form von der Norm. Wie?
  answer: Der *Pentagontempel der Hesinde* in Gareth besitzt einen *fünfseitigen Grundriss* statt dem eines Hexagons.
- question: Bei der Schlacht die den Untergang der wohl bedeutendsten Stadt ihrer Zeit zur Folge hatte und damit den Beginn der heutigen Zeitrechnung markiert, griffen angeblich vier der Zwölfgötter persönlich ins Kampfgeschehen ein. Welche waren das?
  answer: Die vier Götter welche der Sage nach bei der zweiten Dämonenschlacht gegen Hela-Horas' finstere Horden mit ins Feld zogen waren *Praios, Rondra, Efferd und Ingerimm*.
- question: Wo steht der Haupttempel des Todesgottes im Zwölfgöttlichen Pantheon, nach der im Norden verbreiteten Auslegung des Kultes und wie heißt der Tempel?
  answer: Der Haupttempel des Boronkultes nach Puniner Ritus steht in *Punin* und heißt *Das Gebrochene Rad*.
- question: In der größten Stadt Aventuriens gibt es zwei Magierakademien. Der Vorsteher einer der beiden Akademien steht zugleich als Sprecher auch einer weiteren großen Organisation vor. Wer ist diese Person, welcher Rasse gehört sie an und welcher anderen Organisation steht sie vor?
  answer: Die Spektabilität der Akademie Stab und Schwer zu Gareth, *Saldor Foslarin*, ist zugleich auch Sprecher der *Gilde der Weißmagier*. Ungewöhnlicherweise ist er kein Mensch sondern ein *Zwerg* (oder *Angroscho*, ein anderes Wort für Zwerg).
- question: Wo wohnt der reichste Mann Aventuriens?
  answer: Emmeran Stroerrebrandt, der reichste Mann Aventuriens, wohnt in der Villa Stoerrebrandt, im Viertel Nardesheim der Stadt Gareth (gelegen im Stadtteil Alt-Gareth).
- question: Ein Mitglied der Al'Anfanischen Grandenfamilie Paligan wird auch Die 'Schwarze Witwe' genannt und berät ihren Enkel, welcher Anspruch auf den mittelreichischen Kaiserthron erhebt. Welchem der zwölf Götter scheint dieser besonders nahe zu stehen und wie äußert sich das?
  answer: Selindian Hal, ein Enkel von Alara Paligan steht dem Totengott *Boron* besonders nahe. Dies äußert sich unter anderem dadurch, dass er 1028 bei einem Attentat starb, danach jedoch auf wundersame Weise wiederauferstand. Er zeigt weiterhin auch keinerlei Furcht im Umgang mit dem Tod und kann Kontakt mit Geistern aufnehmen.