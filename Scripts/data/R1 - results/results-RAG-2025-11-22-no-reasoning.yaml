    Verpflichtungen unterworfen, während ein Freibeuter mit offizieller Lizenz, 
    dem Kaperbrief, Schiffe des Feindes überfällt und somit eine besondere Form 
    des Seekriegers darstellt.
  inner_monologue: ''
  system_answer: "Der Hauptunterschied zwischen einem Piraten und einem Freibeuter
    liegt in ihrer legalen Grundlage und ihrem Handeln:\n\n- **Piraten**: Sind Gesetzlose,
    die Schiffe aller Mächte ausrauben, ohne lizenzierte Genehmigung. Sie unterliegen
    keinerlei Verpflichtungen und operieren außerhalb jeglicher rechtlicher Rahmenbedingungen.
    Ihre Aktivitäten sind illegal, und sie riskieren bei Festnahme die Hinrichtung.
    Ein Beispiel dafür ist die Stadt Charypso, die als Zentrum der Piraterie gilt.\n\
    \n- **Freibeuter**: Haben eine offizielle Lizenz namens „Kaperbrief“, mit dem
    sie Schiffe des Feindes überfallen dürfen. Sie handeln innerhalb eines rechtlichen
    Rahmens und stehen in Vertrag mit einer Seemacht. Allerdings können sie ebenfalls
    in die Pflichten des Piratenhandels rutschen, falls sie gegen die Klauseln ihres
    Kaperbriefes verstoßen. \n\nZusätzlich gibt es Fälle, in denen Freibeuter und
    Piraten ähnliche Methoden nutzen, weshalb die Grenzen zwischen beiden oft unscharf
    sind."
