    dadurch, dass es alles umfasst, was mit dem Tabuisierten in Verbindung 
    steht, der ursprüngliche Grund für das Tabu oft vergessen wird und die 
    Betroffenen fast magisch unfähig sind, dagegen zu verstoßen.
  inner_monologue: ''
  system_answer: "Ein Tabu, wie es von den Völkern des Dschungels gepflegt wird, unterscheidet
    sich von einem einfachen Verbot durch drei grundlegende Eigenarten:\n\n1. **Ausdehnung**:
    Ein Tabu gilt nicht nur für das direkt Verbote, sondern erstreckt sich auf alles,
    was mit dem Tabuisierten zusammenhängt.\n2. **Verdrängung des Ursprungs**: Der
    ursprüngliche Grund für das Tabu wird oft verdrängt oder vergessen.\n3. **Magische
    Unfähigkeit**: Die unter dem Tabu Stehenden haben praktisch keine Möglichkeit,
    diesem zu widersprechen oder es zu brechen, da es oft als magisch oder bedrohlich
    wahrgenommen wird.\n\nZudem ist ein Tabu oft mit traditionellen Praktiken, wie
    Ritualen oder Tayas, verbunden. Dies macht es zu etwas viel Tiefergründigem und
    Bedeutungsvollem als ein einfaches Verbot."
