- question: Welche natürlichen und künstlichen Hindernisse erschweren die Flucht
    von der Sklaveninsel vor Al'Anfa?
  correct_answer: Die Sklaveninsel ist durch eine drei Schritte hohe Mauer aus 
    Basaltblöcken geschützt. Zusätzlich erschweren scharfkantige Klippen, das 
    umliegende Meer mit zahlreichen Streifenhaien und die finanzielle Motivation
    der Aufseher jede Flucht.
  inner_monologue: ''
  system_answer: "Die Sklaveninsel vor Al’Anfa wird durch folgende natürliche und
    künstliche Hindernisse erschwert:\n\n**Natürliche Hindernisse:**\n- **Klippen:**
    Die umliegenden Klippen sind scharfkantig und zerreißen bei Versuchen, die Insel
    zu verlassen, Hände und Füße der Flüchtlinge.\n- **Streifenhaie:** Als natürlicher
    Bewohner der Gewässer locken die Haie die Flüchtlinge, sobald sie das Wasser erreichen.\n\
    \n**Künstliche Hindernisse:**\n- **Mauer:** Die Insel ist von einer dreifüßigen
    Mauer aus grob gefügten Basaltblöcken umgeben, die sowohl Angreifer als auch Flüchtlinge
    daran hindert, die Insel zu verlassen.\n- **Eisentor:** Das Eisentor, das die
    Sklavenhäuser und andere Bereiche der Insel abschließt, ist ein zusätzlicher physischer
    Schutzmechanismus.\n- **Aufseher und Wachpersonal:** Bewaffnete Aufseher und Gardisten
    patrouillieren die Insel und greifen flüchtende Sklaven mit Booten und Armbrüsten
    an.\n\nZusätzlich wird erwähnt, dass selbst bei erfolgreicher Flucht aus den Pferchen
    und Sklavenhäusern die klippenbedingten Verletzungen und die Bedrohung durch Streifenhaien
    die meisten Fluchtversuche unmöglich machen."
