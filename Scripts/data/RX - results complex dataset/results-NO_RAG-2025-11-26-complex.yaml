  system_answer: "\n\nDer Haupttempel des Todesgottes **Nandus** (im Zwölfgötter-Pantheon
    zuständig für Heilung und Tod) befindet sich nach der offiziellen DSA-Lore in
    **Gareth**, der Hauptstadt des Königreichs Aventurien. Der Tempel heißt **Großtempel
    des Nandus**. \n\nIm Norden Aventuriens (z. B. in Nivesen oder Thorwal) gibt es
    keine abweichende *Haupttempel*-Lokalisation für Nandus – die nördlichen Kultauslegungen
    betonen zwar regional spezifische Aspekte (z. B. Tod durch Winterkälte), doch
    der zentrale Tempel bleibt Gareth. Die nördlichen Regionen verehren stattdessen
    stärker Firun (Winter) oder Swafnir (Meer), nicht jedoch eine abweichende Todesgottheit.\
    \ \n\n**Antwort:** Haupttempel in **Gareth**, **Großtempel des Nandus**."
